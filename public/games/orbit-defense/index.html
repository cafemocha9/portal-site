<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1233">
<title>軌道防衛線</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --space:#1c2257; --panel:rgba(34,40,98,.88); --panel-hi:rgba(48,56,128,.94);
  --line:rgba(170,180,255,.22); --line-hi:rgba(190,200,255,.46);
  --text:#eeedff; --muted:#aeb2e0; --credit:#ffc56b; --life:#7fd8ff; --bad:#ff5d7a; --focus:#9fe8ff;
  --num:"Chakra Petch","Zen Kaku Gothic New",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --space:#0e1233; --panel:rgba(26,31,78,.86); --panel-hi:rgba(38,44,104,.92); }
}
:root[data-theme="dark"]{ --space:#0e1233; --panel:rgba(26,31,78,.86); --panel-hi:rgba(38,44,104,.92); }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--space)}
body{
  margin:0;height:100%;background:var(--space);color:var(--text);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  font-size:14px;line-height:1.5;overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#app{
  height:100%;max-width:1400px;margin:0 auto;display:flex;flex-direction:column;
  padding:0 max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px));
}

/* HUD */
#hud{display:flex;align-items:center;gap:14px;padding:8px 2px 6px;min-height:48px}
.stat{display:flex;align-items:center;gap:6px;font-family:var(--num);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat svg{width:17px;height:17px;flex:none}
.stat .lbl{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:500;font-size:12px;color:var(--muted)}
#stCredit{color:var(--credit)}
#stLife{color:var(--life)}
#stLife.low{color:var(--bad)}
.ctrls{margin-left:auto;display:flex;gap:6px}
.icon-btn{
  width:36px;height:36px;display:grid;place-items:center;border-radius:10px;
  background:var(--panel);border:1px solid var(--line);cursor:pointer;padding:0;
  font-family:var(--num);font-weight:600;font-size:14px;
}
.icon-btn svg{width:18px;height:18px}
.icon-btn:hover{border-color:var(--line-hi)}

/* Stage */
#stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#toast{
  position:absolute;left:50%;top:10px;transform:translate(-50%,-8px);opacity:0;pointer-events:none;
  padding:6px 14px;border-radius:999px;background:rgba(18,22,60,.9);border:1px solid var(--line-hi);
  font-weight:700;font-size:13px;white-space:nowrap;transition:opacity .25s,transform .25s;z-index:3;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{border-color:rgba(255,93,122,.7);color:#ffd3dc}
#pausePill{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;align-items:center;gap:12px;
  padding:10px 12px 10px 18px;border-radius:14px;background:rgba(18,22,60,.92);border:1px solid var(--line-hi);z-index:3;
}
#pausePill.show{display:flex}

/* Dock */
#dock{display:flex;flex-direction:column;gap:8px;padding:6px 2px 10px}
.dock-top{display:flex;align-items:center;gap:10px;min-height:44px}
#hint{flex:1;min-width:0;font-size:13px;color:var(--muted);line-height:1.45}
#hint b{font-weight:700}
#nextBtn{
  flex:none;display:flex;align-items:center;gap:8px;padding:6px 14px 6px 10px;min-height:44px;border-radius:12px;
  background:var(--panel-hi);border:1px solid var(--line-hi);cursor:pointer;text-align:left;
}
#nextBtn svg{width:22px;height:22px;color:#ff8aa0;flex:none}
#nextBtn .l1{display:block;font-weight:700;font-size:14px;line-height:1.2}
#nextBtn .l2{display:block;font-family:var(--num);font-size:12px;color:var(--credit);line-height:1.2}
#nextBtn:disabled{opacity:.45;cursor:not-allowed}
#build{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tbtn{
  --tc:#fff;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px 6px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);cursor:pointer;min-width:0;position:relative;
}
.tbtn svg{width:26px;height:26px;color:var(--tc)}
.tbtn .nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tbtn .cost{font-family:var(--num);font-weight:600;font-size:13px;color:var(--credit);font-variant-numeric:tabular-nums}
.tbtn .key{position:absolute;top:4px;left:7px;font-family:var(--num);font-size:10px;color:var(--muted);opacity:.7}
.tbtn[aria-pressed="true"]{border-color:var(--tc);background:var(--panel-hi);box-shadow:inset 0 0 0 1px var(--tc),0 0 22px -8px var(--tc)}
.tbtn:disabled{opacity:.38;cursor:not-allowed}

#info{display:none;flex-wrap:wrap;gap:8px 12px;align-items:center}
#info.show{display:flex}
#istats{display:flex;gap:16px;flex:1 1 240px;min-width:0;padding:4px 2px}
.st .k{display:block;font-size:11px;color:var(--muted);line-height:1.2}
.st .v{display:block;font-family:var(--num);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;line-height:1.3;white-space:nowrap}
.st .v i{font-style:normal;font-size:12px;color:#7dffc4;margin-left:3px}
.iact{display:flex;gap:6px;align-items:center;flex:0 1 auto;flex-wrap:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:0 9px;height:40px;font-size:12px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel-hi);color:var(--text);box-shadow:inset 0 -2px 0 var(--focus)}
.act{height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line-hi);background:var(--panel-hi);cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap}
.act .n{font-family:var(--num);font-weight:600;margin-left:4px}
.act.up .n{color:var(--credit)}
.act.sell{background:var(--panel);border-color:var(--line)}
.act.sell .n{color:#7dffc4}
.act:disabled{opacity:.42;cursor:not-allowed}

/* Overlay */
#overlay{position:absolute;inset:0;display:none;place-items:center;padding:18px;z-index:5;
  background:radial-gradient(ellipse at 50% 45%,rgba(14,18,51,.35),rgba(8,10,34,.82))}
#overlay.show{display:grid}
.card{width:100%;max-width:400px;padding:26px 24px 22px;border-radius:20px;background:rgba(22,26,70,.92);border:1px solid var(--line-hi);text-align:center}
.card .emblem{width:92px;height:56px;margin:0 auto 6px;display:block}
.card h1{margin:0;font-weight:900;font-size:clamp(34px,10vw,48px);letter-spacing:.12em;line-height:1.15;text-shadow:0 0 24px rgba(127,216,255,.35)}
.card .sub{margin:2px 0 0;font-family:var(--num);font-style:italic;font-weight:500;letter-spacing:.18em;color:var(--life);font-size:13px}
.card p{margin:14px 0 0;color:var(--muted);line-height:1.7}
.card ul{margin:16px 0 0;padding:0;list-style:none;text-align:left;display:grid;gap:8px}
.card li{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.55}
.card li svg{flex:none;width:18px;height:18px;margin-top:1px}
.card .rec{margin-top:14px;font-size:13px;color:var(--muted)}
.card .rec b{font-family:var(--num);color:var(--text);font-size:16px}
.card .result{display:flex;justify-content:center;gap:28px;margin-top:16px}
.card .result .v{font-family:var(--num);font-weight:700;font-size:28px;display:block;line-height:1.1}
.card .result .k{font-size:12px;color:var(--muted)}
.btns{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.primary{min-height:46px;padding:0 26px;border-radius:12px;border:0;background:#dff6ff;color:#121746;font-weight:900;font-size:15px;cursor:pointer;letter-spacing:.06em}
.secondary{min-height:46px;padding:0 20px;border-radius:12px;border:1px solid var(--line-hi);background:transparent;font-weight:700;cursor:pointer}

@media (max-width:420px){
  .stat .lbl{display:none}
  #hud{gap:10px}
  .stat{font-size:16px}
  .tbtn .key{display:none}
  .seg button{padding:0 7px}
  .act{padding:0 9px}
}
@media (orientation:landscape) and (max-height:540px){
  #app{display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr)}
  #hud{grid-column:1 / -1}
  #dock{overflow:auto;padding-left:8px}
  #build{grid-template-columns:repeat(3,1fr)}
  .dock-top{flex-direction:column;align-items:stretch}
}
@media (prefers-reduced-motion: reduce){ #toast{transition:none} }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="stat" id="stCredit" title="クレジット">
      <svg viewBox="0 0 24 24"><path d="M12 2.5l7.5 9.5-7.5 9.5L4.5 12z" fill="currentColor"/></svg>
      <span id="credits">250</span>
    </div>
    <div class="stat" id="stLife" title="コア耐久">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5.5" fill="currentColor" stroke="none"/><ellipse cx="12" cy="12" rx="10.5" ry="3.6" transform="rotate(-22 12 12)"/></svg>
      <span id="lives">20</span>
    </div>
    <div class="stat" title="ウェーブ">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ff8aa0" stroke-width="2.2" stroke-linecap="round"><path d="M2.5 14c3-7 6 7 9.5 0s6.5 7 9.5 0"/></svg>
      <span class="lbl">ウェーブ</span><span id="wave">0/30</span>
    </div>
    <div class="ctrls">
      <button class="icon-btn" id="pauseBtn" aria-label="一時停止" title="一時停止（Space）"></button>
      <button class="icon-btn" id="speedBtn" aria-label="ゲーム速度" title="速度（F）">1×</button>
      <button class="icon-btn" id="soundBtn" aria-label="サウンド" title="サウンド"></button>
    </div>
  </header>

  <main id="stage">
    <canvas id="cv" aria-label="ゲーム画面"></canvas>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="pausePill"><span>一時停止中</span><button class="act" id="resumeBtn">再開</button></div>
    <div id="overlay"></div>
  </main>

  <footer id="dock">
    <div class="dock-top">
      <div id="hint"></div>
      <button id="nextBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5" stroke-dasharray="4 3"/><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/></svg>
        <span><span class="l1" id="nextL1">ウェーブ 1 開始</span><span class="l2" id="nextL2">準備ができたら</span></span>
      </button>
    </div>
    <div id="build"></div>
    <div id="info">
      <div id="istats"></div>
      <div class="iact">
        <div class="seg" id="seg" role="group" aria-label="照準の優先順位">
          <button data-m="first">先頭</button><button data-m="last">最後尾</button><button data-m="strong">最強</button>
        </div>
        <button class="act up" id="upBtn"></button>
        <button class="act sell" id="sellBtn"></button>
        <button class="icon-btn" id="closeBtn" aria-label="選択を解除">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>
  </footer>
</div>

<script>
(()=>{'use strict';
const TAU=Math.PI*2;
const $=s=>document.querySelector(s);
const stage=$('#stage'), cv=$('#cv'), ctx=cv.getContext('2d');
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};

/* ============ Map (world coords, landscape; portrait is a transposed view) ============ */
const GW=18, GH=11, FINAL=30;
const RAW=[[0,2],[4,2],[4,8],[8,8],[8,3],[12,3],[12,8],[15,8],[15,4],[17,4]];
const P=RAW.map(([x,y])=>({x:x+.5,y:y+.5}));
const SEG=[]; let L=0;
for(let i=0;i<P.length-1;i++){
  const a=P[i],b=P[i+1],len=Math.hypot(b.x-a.x,b.y-a.y);
  SEG.push({a,b,len,start:L,ang:Math.atan2(b.y-a.y,b.x-a.x)}); L+=len;
}
function pointAt(d){
  if(d<=0) return {x:P[0].x,y:P[0].y,ang:SEG[0].ang};
  for(const s of SEG){
    if(d<=s.start+s.len){const t=(d-s.start)/s.len;return {x:s.a.x+(s.b.x-s.a.x)*t,y:s.a.y+(s.b.y-s.a.y)*t,ang:s.ang};}
  }
  const b=P[P.length-1]; return {x:b.x,y:b.y,ang:SEG[SEG.length-1].ang};
}
const blocked=new Set();
for(let i=0;i<RAW.length-1;i++){
  const [x1,y1]=RAW[i],[x2,y2]=RAW[i+1],dx=Math.sign(x2-x1),dy=Math.sign(y2-y1);
  let x=x1,y=y1; blocked.add(x+','+y);
  while(x!==x2||y!==y2){x+=dx;y+=dy;blocked.add(x+','+y);}
}

/* ============ Definitions ============ */
const TW={
  laser:{name:'パルスレーザー',short:'レーザー',cost:70,col:'#6fe3ff',
    desc:'高速連射の単体攻撃。安価で扱いやすいが、装甲艦には通りにくい。',
    lv:[{dmg:9,rate:5,range:2.6},{dmg:17,rate:6,range:2.8},{dmg:30,rate:7.5,range:3.1}],up:[85,170],
    icon:'<circle cx="10" cy="12" r="5"/><path d="M15 12h7"/>'},
  grav:{name:'重力井戸',short:'重力',cost:100,col:'#a88bff',
    desc:'範囲内の敵を減速させ、継続ダメージを与える。他の砲台の命中時間を伸ばす支援役。',
    lv:[{slow:.35,dps:5,range:2.2},{slow:.48,dps:10,range:2.5},{slow:.6,dps:18,range:2.8}],up:[110,210],
    icon:'<circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="6" stroke-dasharray="3 2.4"/><circle cx="12" cy="12" r="9.5" opacity=".5"/>'},
  plasma:{name:'プラズマ砲',short:'プラズマ',cost:120,col:'#ffb547',
    desc:'予測地点を範囲爆撃する。密集した群れと分裂艦に強い。',
    lv:[{dmg:28,rate:.85,range:3.2,splash:1},{dmg:52,rate:.95,range:3.5,splash:1.15},{dmg:95,rate:1.05,range:3.8,splash:1.35}],up:[135,260],
    icon:'<circle cx="9" cy="12" r="6"/><rect x="14" y="9" width="7.5" height="6" rx="1.2"/>'},
  rail:{name:'レールガン',short:'レール',cost:150,col:'#e6e2ff',
    desc:'直線上の敵をすべて貫通し、装甲を無視する長射程砲。連射は遅い。',
    lv:[{dmg:90,rate:.55,range:5},{dmg:175,rate:.62,range:5.6},{dmg:330,rate:.72,range:6.2}],up:[170,330],
    icon:'<rect x="2.5" y="8" width="7" height="8" rx="1.5"/><path d="M9.5 9.5h12M9.5 14.5h12"/>'},
  arc:{name:'アークコイル',short:'アーク',cost:160,col:'#5dffc1',
    desc:'複数の敵へ連鎖する電撃。シールドに2倍のダメージを与える。',
    lv:[{dmg:22,rate:1.1,range:2.8,chain:3},{dmg:38,rate:1.3,range:3,chain:4},{dmg:64,rate:1.5,range:3.3,chain:6}],up:[175,340],
    icon:'<circle cx="12" cy="13" r="3"/><path d="M12 10V4M14.6 14.5l5.2 3M9.4 14.5l-5.2 3"/><circle cx="12" cy="3.5" r="1.3" fill="currentColor"/><circle cx="20.3" cy="18" r="1.3" fill="currentColor"/><circle cx="3.7" cy="18" r="1.3" fill="currentColor"/>'},
};
const ORDER=['laser','grav','plasma','rail','arc'];
const EN={
  scout:{name:'スカウト',hp:30,spd:2.2,rew:4,r:.22,col:'#ff9a6b',leak:1},
  drone:{name:'ドローン',hp:60,spd:1.35,rew:6,r:.28,col:'#ff5d7a',leak:1},
  tank:{name:'装甲艦',hp:170,spd:.85,rew:13,armor:8,r:.36,col:'#ff9446',leak:2},
  shield:{name:'シールド艦',hp:90,shield:80,spd:1.15,rew:11,r:.3,col:'#ff6fc0',leak:1},
  splitter:{name:'分裂艦',hp:100,spd:1.05,rew:7,r:.32,col:'#e8508a',leak:1,split:3},
  mini:{name:'分裂体',hp:28,spd:1.85,rew:2,r:.16,col:'#ffa3c2',leak:1},
  boss:{name:'母艦',hp:2000,shield:400,spd:.5,rew:160,armor:12,r:.62,col:'#ff3b5c',leak:10},
};
const UNIT={scout:.6,drone:1,tank:2.6,shield:1.8,splitter:2.2};
const GAP={scout:.35,drone:.6,tank:1.35,shield:.85,splitter:1.05,boss:4,mini:.3};
const SCRIPT={
  1:[['drone',8]],2:[['drone',12]],3:[['scout',14]],4:[['drone',10],['scout',10]],
  5:[['drone',8],['tank',4]],6:[['drone',8],['shield',6]],7:[['scout',10],['splitter',6]],
};
const hpMul=w=>1+.2*(w-1)+.011*(w-1)*(w-1);

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function waveGroups(w){
  if(SCRIPT[w]) return SCRIPT[w];
  if(w%10===0) return [['shield',Math.round(4+w/4)],['boss',w/10],['scout',Math.round(8+w/2)]];
  const r=rng(w*7919+13);
  const pool=[['drone',3],['scout',2]];
  if(w>=5) pool.push(['tank',1.5+w*.06]);
  if(w>=6) pool.push(['shield',1.5+w*.05]);
  if(w>=7) pool.push(['splitter',1.4+w*.04]);
  const total=pool.reduce((s,p)=>s+p[1],0), ng=3+Math.floor(w/9), budget=12+w*2.3, out=[];
  let prev=null;
  for(let i=0;i<ng;i++){
    let t,k=0;
    do{ t=null; let x=r()*total; for(const p of pool){x-=p[1];if(x<=0){t=p[0];break;}} if(!t)t=pool[0][0]; k++; }while(t===prev&&k<5);
    prev=t; out.push([t,Math.max(2,Math.round(budget/ng/UNIT[t]))]);
  }
  return out;
}
function buildQueue(w){
  const q=[]; let t=0; const f=w>15?.85:1;
  for(const [type,n] of waveGroups(w)){ for(let i=0;i<n;i++){q.push({type,t});t+=GAP[type]*f;} t+=1.6; }
  return q;
}
function waveSummary(w){
  const m=new Map(); for(const [t,n] of waveGroups(w)) m.set(t,(m.get(t)||0)+n);
  return [...m].map(([t,n])=>`${EN[t].name}×${n}`).join('、');
}

/* ============ Utils ============ */
const _ca=new Map();
function hexA(h,a){let c=_ca.get(h);if(!c){c=[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];_ca.set(h,c);}return `rgba(${c[0]},${c[1]},${c[2]},${a})`;}
function lerpAng(a,b,t){const d=((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI;return a+d*t;}
function segDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy||1;let t=((px-x1)*dx+(py-y1)*dy)/l2;t=Math.max(0,Math.min(1,t));return Math.hypot(px-x1-dx*t,py-y1-dy*t);}
function jag(x1,y1,x2,y2){const pts=[[x1,y1]],dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;for(let i=1;i<5;i++){const t=i/5,o=(Math.random()-.5)*.32;pts.push([x1+dx*t+nx*o,y1+dy*t+ny*o]);}pts.push([x2,y2]);return pts;}

/* ============ Audio ============ */
let AC=null, master=null, NB=null, soundOn=store.get('orbital-sound',true);
const lastPlay={};
function initAudio(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=.2; master.connect(AC.destination);
    NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate); const d=NB.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }catch(e){AC=null;}
}
function env(g,t,a,d,v){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);}
function osc(type,f1,f2,dur,vol,t0=0){const t=AC.currentTime+t0,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);env(g,t,.005,dur,vol);o.connect(g).connect(master);o.start(t);o.stop(t+dur+.05);}
function nz(dur,vol,freq,type='lowpass'){const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type=type;f.frequency.setValueAtTime(freq,t);f.frequency.exponentialRampToValueAtTime(Math.max(40,freq*.2),t+dur);env(g,t,.005,dur,vol);s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+dur+.05);}
const SFX={
  laser:()=>osc('square',1500,760,.045,.035),
  rail:()=>{osc('sawtooth',240,55,.38,.11);nz(.3,.14,4200,'bandpass');},
  plasma:()=>osc('triangle',320,110,.2,.09),
  pboom:()=>nz(.35,.2,900),
  arc:()=>{osc('sawtooth',900,1900,.08,.05);nz(.1,.07,6000,'highpass');},
  boom:()=>nz(.22,.12,1500),
  bigboom:()=>{nz(1.1,.4,600);osc('sine',90,28,.9,.3);},
  hit:()=>{osc('sine',170,48,.45,.28);nz(.3,.18,500);},
  build:()=>osc('triangle',520,780,.12,.1),
  up:()=>{osc('triangle',520,1040,.18,.1);osc('sine',780,1560,.2,.06,.07);},
  sell:()=>osc('triangle',700,340,.15,.08),
  wave:()=>{osc('sawtooth',110,220,.6,.07);osc('sine',220,440,.6,.06);},
  clear:()=>{osc('sine',660,660,.12,.08);osc('sine',990,990,.22,.08,.1);},
  err:()=>osc('square',190,140,.12,.05),
};
const THR={laser:.07,arc:.06,boom:.04,plasma:.08,pboom:.06};
function sfx(n){
  if(!AC||!soundOn||AC.state!=='running') return;
  const now=AC.currentTime,th=THR[n]??.03;
  if(lastPlay[n]&&now-lastPlay[n]<th) return;
  lastPlay[n]=now; try{SFX[n]();}catch(e){}
}

/* ============ State ============ */
let S, uid=0, started=false;
function newGame(){
  uid=0;
  return {credits:250,lives:20,wave:0,cleared:0,kills:0,t:0,speed:1,paused:false,over:false,wonShown:false,
    towers:[],enemies:[],shots:[],beams:[],rings:[],parts:[],waves:[],
    grid:Array.from({length:GH},()=>Array(GW).fill(null)),
    build:null,sel:null,pending:null,hover:null,shake:0,coreFlash:0,gateFlash:0};
}
S=newGame();

/* ============ View ============ */
const V={cs:30,ox:0,oy:0,portrait:false,W:0,H:0,dpr:1};
let BG=null; const TWINK=[];
{const r=rng(99);for(let i=0;i<70;i++)TWINK.push({u:r(),v:r(),p:r()*TAU,s:.6+r()*1.8,z:.4+r()*1.2});}
function resize(){
  const r=stage.getBoundingClientRect(); if(r.width<10||r.height<10) return;
  V.dpr=Math.min(2,window.devicePixelRatio||1); V.W=r.width; V.H=r.height;
  cv.width=Math.round(r.width*V.dpr); cv.height=Math.round(r.height*V.dpr);
  V.portrait=r.height>r.width*1.1;
  const cols=V.portrait?GH:GW, rows=V.portrait?GW:GH, pad=6;
  V.cs=Math.max(8,Math.min((r.width-pad*2)/cols,(r.height-pad*2)/rows));
  V.ox=(r.width-cols*V.cs)/2; V.oy=(r.height-rows*V.cs)/2;
  makeBG();
}
function makeBG(){
  const c=document.createElement('canvas'); c.width=cv.width; c.height=cv.height;
  const g=c.getContext('2d'), W=c.width, H=c.height, r=rng(2026);
  const lg=g.createLinearGradient(0,0,W*.3,H); lg.addColorStop(0,'#131847'); lg.addColorStop(1,'#0a0d2c');
  g.fillStyle=lg; g.fillRect(0,0,W,H);
  g.globalCompositeOperation='lighter';
  const neb=[['#8a3ffc',.20],['#2aa3c9',.13],['#3b46d6',.18],['#c0337a',.10],['#5a2fb8',.15]];
  for(let i=0;i<7;i++){
    const [col,a]=neb[i%neb.length], x=r()*W, y=r()*H, rad=(.25+r()*.45)*Math.max(W,H);
    const rg=g.createRadialGradient(x,y,0,x,y,rad); rg.addColorStop(0,hexA(col,a)); rg.addColorStop(.5,hexA(col,a*.35)); rg.addColorStop(1,hexA(col,0));
    g.fillStyle=rg; g.fillRect(0,0,W,H);
  }
  const n=Math.round(W*H/2600);
  for(let i=0;i<n;i++){
    const x=r()*W,y=r()*H,s=(r()<.9?.5+r()*.8:1.2+r()*1.2)*V.dpr, t=r();
    g.fillStyle=t<.7?`rgba(230,235,255,${.25+r()*.6})`:t<.85?`rgba(160,200,255,${.4+r()*.5})`:`rgba(255,220,190,${.4+r()*.5})`;
    g.beginPath(); g.arc(x,y,s,0,TAU); g.fill();
  }
  for(let i=0;i<6;i++){
    const x=r()*W,y=r()*H,s=(6+r()*8)*V.dpr;
    const rg=g.createRadialGradient(x,y,0,x,y,s); rg.addColorStop(0,'rgba(220,235,255,.9)'); rg.addColorStop(1,'rgba(220,235,255,0)');
    g.fillStyle=rg; g.beginPath(); g.arc(x,y,s,0,TAU); g.fill();
    g.fillStyle='rgba(220,235,255,.5)'; g.fillRect(x-s*1.6,y-.5*V.dpr,s*3.2,V.dpr); g.fillRect(x-.5*V.dpr,y-s*1.6,V.dpr,s*3.2);
  }
  g.globalCompositeOperation='source-over';
  BG=c;
}
function toWorld(cx,cy){
  const r=cv.getBoundingClientRect(), u=(cx-r.left-V.ox)/V.cs, v=(cy-r.top-V.oy)/V.cs;
  return V.portrait?{x:v,y:u}:{x:u,y:v};
}
function toScreen(x,y,sx=0,sy=0){return V.portrait?{x:V.ox+y*V.cs+sx,y:V.oy+x*V.cs+sy}:{x:V.ox+x*V.cs+sx,y:V.oy+y*V.cs+sy};}
function setWorld(sx,sy){
  const d=V.dpr,c=V.cs*d;
  if(V.portrait) ctx.setTransform(0,c,c,0,(V.ox+sx)*d,(V.oy+sy)*d);
  else ctx.setTransform(c,0,0,c,(V.ox+sx)*d,(V.oy+sy)*d);
}

/* ============ Game logic ============ */
function spawn(type,wave,dist=0){
  const d=EN[type], m=hpMul(wave.id), p=pointAt(dist);
  const e={type,d,hp:d.hp*m,maxHp:d.hp*m,shield:(d.shield||0)*m,maxShield:(d.shield||0)*m,
    armor:(d.armor||0)*(1+(wave.id-1)*.045),spd:d.spd*(wave.id>20?1.08:1),dist,slow:0,slowUsed:0,lastHit:9,
    wave,id:++uid,dead:false,rew:Math.round(d.rew*(1+(wave.id-1)*.05)),hit:0,sh:0,trail:0,born:S.t,x:p.x,y:p.y,ang:p.ang};
  wave.alive++; S.enemies.push(e);
  if(dist===0) S.gateFlash=1;
  return e;
}
function hurt(e,dmg,o,src){
  if(e.dead) return;
  const sm=(o&&o.shieldMul)||1;
  if(e.shield>0){ const sd=dmg*sm, ab=Math.min(e.shield,sd); e.shield-=ab; dmg-=ab/sm; e.sh=.15; }
  if(dmg>0){ if(e.armor>0&&!(o&&o.pierce)) dmg=Math.max(dmg*.25,dmg-e.armor); e.hp-=dmg; e.hit=.07; }
  e.lastHit=0;
  if(e.hp<=0) kill(e,src);
}
function kill(e,src){
  e.dead=true; e.wave.alive--; S.credits+=e.rew; S.kills++; if(src) src.kills++;
  const boss=e.type==='boss';
  burst(e.x,e.y,e.d.col,boss?70:10+e.d.r*26,boss?2.6:1);
  burst(e.x,e.y,'#ffffff',boss?20:4,boss?1.8:.7);
  S.rings.push({x:e.x,y:e.y,r0:e.d.r*.5,r1:e.d.r*(boss?4:2.4),life:boss?.8:.35,max:boss?.8:.35,col:e.d.col,w:boss?.12:.05});
  sfx(boss?'bigboom':'boom');
  if(boss){ shake(.6); toast('母艦を撃沈'); }
  if(e.d.split) for(let i=0;i<e.d.split;i++) spawn('mini',e.wave,Math.max(.01,e.dist-i*.28));
}
function burst(x,y,col,n,pow=1){
  for(let i=0;i<n;i++){
    if(S.parts.length>750) break;
    const a=Math.random()*TAU, sp=(.6+Math.random()*2.6)*pow, life=.3+Math.random()*.5*Math.sqrt(pow);
    S.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life,max:life,col,s:.025+Math.random()*.05*Math.sqrt(pow)});
  }
}
function shake(a){ S.shake=Math.max(S.shake,a); }

function findTarget(t,range){
  const r2=range*range; let best=null,bv=-Infinity;
  for(const e of S.enemies){
    if(e.dead) continue;
    const dx=e.x-t.x,dy=e.y-t.y; if(dx*dx+dy*dy>r2) continue;
    const v=t.mode==='first'?e.dist:t.mode==='last'?-e.dist:e.hp+e.shield;
    if(v>bv){bv=v;best=e;}
  }
  return best;
}
function updateTower(t,dt){
  const def=TW[t.type], s=def.lv[t.level];
  t.recoil=Math.max(0,t.recoil-dt*7); t.spin+=dt*(1+t.level*.5);
  if(t.type==='grav'){
    const r2=s.range*s.range;
    for(const e of S.enemies){
      if(e.dead) continue;
      const dx=e.x-t.x,dy=e.y-t.y;
      if(dx*dx+dy*dy<=r2){ e.slow=Math.max(e.slow,s.slow*(e.type==='boss'?.5:1)); hurt(e,s.dps*dt,{pierce:true},t); }
    }
    return;
  }
  t.cd-=dt;
  const tg=findTarget(t,s.range);
  if(tg && t.type!=='arc') t.ang=lerpAng(t.ang,Math.atan2(tg.y-t.y,tg.x-t.x),Math.min(1,dt*14));
  if(t.cd>0||!tg) return;
  t.cd=1/s.rate; t.recoil=1;
  const a=Math.atan2(tg.y-t.y,tg.x-t.x), ca=Math.cos(a), sa=Math.sin(a);
  if(t.type==='laser'){
    hurt(tg,s.dmg,null,t);
    S.beams.push({k:'laser',x1:t.x+ca*.42,y1:t.y+sa*.42,x2:tg.x,y2:tg.y,life:.07,max:.07,col:def.col});
    if(S.parts.length<600) burst(tg.x,tg.y,def.col,2,.5);
    sfx('laser');
  }else if(t.type==='rail'){
    const x1=t.x+ca*.5,y1=t.y+sa*.5,x2=t.x+ca*s.range,y2=t.y+sa*s.range;
    for(const e of S.enemies){ if(!e.dead&&segDist(e.x,e.y,x1,y1,x2,y2)<=e.d.r+.14) hurt(e,s.dmg,{pierce:true},t); }
    S.beams.push({k:'rail',x1,y1,x2,y2,life:.35,max:.35,col:def.col});
    for(let i=0;i<8;i++){const f=Math.random();S.parts.push({x:x1+(x2-x1)*f,y:y1+(y2-y1)*f,vx:(Math.random()-.5)*.8,vy:(Math.random()-.5)*.8,life:.4,max:.4,col:'#b9b0ff',s:.03});}
    sfx('rail');
  }else if(t.type==='plasma'){
    const T=Math.hypot(tg.x-t.x,tg.y-t.y)/6.5+.22;
    const pr=pointAt(Math.min(L,tg.dist+tg.spd*(1-tg.slowUsed)*T));
    S.shots.push({x:t.x+ca*.35,y:t.y+sa*.35,sx:t.x+ca*.35,sy:t.y+sa*.35,tx:pr.x,ty:pr.y,t:0,T,dmg:s.dmg,splash:s.splash,src:t});
    sfx('plasma');
  }else if(t.type==='arc'){
    const hit=[tg]; let cur=tg;
    for(let i=1;i<s.chain;i++){
      let nb=null,nd=1.7;
      for(const e of S.enemies){ if(e.dead||hit.includes(e)) continue; const d=Math.hypot(e.x-cur.x,e.y-cur.y); if(d<nd){nd=d;nb=e;} }
      if(!nb) break; hit.push(nb); cur=nb;
    }
    const pts=[]; let px=t.x,py=t.y;
    hit.forEach((e,i)=>{ pts.push(...jag(px,py,e.x,e.y)); px=e.x; py=e.y; });
    hit.forEach((e,i)=>hurt(e,s.dmg*Math.pow(.85,i),{shieldMul:2},t));
    S.beams.push({k:'arc',pts,life:.14,max:.14,col:def.col});
    sfx('arc');
  }
}
function moveEnemy(e,dt){
  e.lastHit+=dt; e.hit=Math.max(0,e.hit-dt); e.sh=Math.max(0,e.sh-dt);
  if(e.maxShield>0&&e.lastHit>2&&e.shield<e.maxShield) e.shield=Math.min(e.maxShield,e.shield+e.maxShield*.25*dt);
  const sp=e.spd*(1-e.slow); e.slowUsed=e.slow; e.slow=0;
  e.dist+=sp*dt;
  if(e.dist>=L){
    e.dead=true; e.wave.alive--; S.lives-=e.d.leak; S.coreFlash=1; shake(e.type==='boss'?.8:.3);
    const c=P[P.length-1]; burst(c.x,c.y,'#ff5d7a',16,1.2); sfx('hit');
    if(S.lives<=0&&!S.over) gameOver();
    return;
  }
  const p=pointAt(e.dist); e.x=p.x; e.y=p.y; e.ang=lerpAng(e.ang,p.ang,Math.min(1,dt*9));
  e.trail-=dt;
  if(e.trail<=0&&S.parts.length<520){
    e.trail=.045;
    const bx=e.x-Math.cos(e.ang)*e.d.r*.9, by=e.y-Math.sin(e.ang)*e.d.r*.9;
    S.parts.push({x:bx,y:by,vx:-Math.cos(e.ang)*.4+(Math.random()-.5)*.2,vy:-Math.sin(e.ang)*.4+(Math.random()-.5)*.2,life:.35,max:.35,col:e.d.col,s:e.d.r*.22});
  }
}
function explode(s){
  for(const e of S.enemies){
    if(e.dead) continue;
    const d=Math.hypot(e.x-s.tx,e.y-s.ty);
    if(d<=s.splash+e.d.r*.5) hurt(e,s.dmg*(1-.35*Math.min(1,d/s.splash)),null,s.src);
  }
  burst(s.tx,s.ty,'#ffb547',14,1.1); burst(s.tx,s.ty,'#fff1c9',5,.6);
  S.rings.push({x:s.tx,y:s.ty,r0:.1,r1:s.splash,life:.32,max:.32,col:'#ffb547',w:.07});
  sfx('pboom');
}
function step(dt){
  S.t+=dt;
  for(const w of S.waves){
    w.clock+=dt;
    while(w.idx<w.q.length&&w.q[w.idx].t<=w.clock){
      const q=w.q[w.idx++]; spawn(q.type,w);
      if(q.type==='boss'){ toast('母艦がワープアウトしました','bad'); sfx('wave'); shake(.3); }
    }
  }
  for(const t of S.towers) updateTower(t,dt);
  for(let i=0;i<S.enemies.length;i++){ const e=S.enemies[i]; if(!e.dead) moveEnemy(e,dt); }
  for(const s of S.shots){
    s.t+=dt; const f=Math.min(1,s.t/s.T); s.x=s.sx+(s.tx-s.sx)*f; s.y=s.sy+(s.ty-s.sy)*f;
    if(S.parts.length<600) S.parts.push({x:s.x,y:s.y,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,life:.25,max:.25,col:'#ffb547',s:.05});
    if(s.t>=s.T){ explode(s); s.done=true; }
  }
  S.shots=S.shots.filter(s=>!s.done);
  for(const b of S.beams) b.life-=dt; S.beams=S.beams.filter(b=>b.life>0);
  for(const r of S.rings) r.life-=dt; S.rings=S.rings.filter(r=>r.life>0);
  const drag=Math.pow(.9,dt*60);
  for(const p of S.parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=drag; p.vy*=drag; p.life-=dt; }
  S.parts=S.parts.filter(p=>p.life>0);
  S.enemies=S.enemies.filter(e=>!e.dead);
  for(let i=S.waves.length-1;i>=0;i--){
    const w=S.waves[i];
    if(w.idx>=w.q.length&&w.alive<=0){
      S.waves.splice(i,1);
      const b=25+w.id*5; S.credits+=b; S.cleared=Math.max(S.cleared,w.id);
      toast(`ウェーブ ${w.id} クリア　+${b}`); sfx('clear');
      if(w.id===FINAL&&!S.wonShown&&!S.over){ S.wonShown=true; saveBest(); setTimeout(showVictory,700); }
    }
  }
  S.coreFlash=Math.max(0,S.coreFlash-dt*2); S.gateFlash=Math.max(0,S.gateFlash-dt*3); S.shake=Math.max(0,S.shake-dt*1.6);
}

/* ============ Actions ============ */
function canBuild(gx,gy){
  return gx>=0&&gy>=0&&gx<GW&&gy<GH&&!blocked.has(gx+','+gy)&&!S.grid[gy][gx];
}
function build(gx,gy){
  const def=TW[S.build];
  if(!canBuild(gx,gy)) return;
  if(S.credits<def.cost){ sfx('err'); flashHint('クレジットが足りません'); return; }
  S.credits-=def.cost;
  const t={type:S.build,gx,gy,x:gx+.5,y:gy+.5,level:0,cd:0,ang:-Math.PI/2,mode:'first',spent:def.cost,kills:0,recoil:0,spin:0};
  S.towers.push(t); S.grid[gy][gx]=t; S.pending=null;
  S.rings.push({x:t.x,y:t.y,r0:.2,r1:.8,life:.4,max:.4,col:def.col,w:.05});
  sfx('build');
  if(S.credits<def.cost) cancelBuild();
  refreshUI(true);
}
function upgrade(t){
  const def=TW[t.type]; if(t.level>=2) return;
  const c=def.up[t.level];
  if(S.credits<c){ sfx('err'); flashHint('クレジットが足りません'); return; }
  S.credits-=c; t.spent+=c; t.level++;
  S.rings.push({x:t.x,y:t.y,r0:.3,r1:1.1,life:.5,max:.5,col:def.col,w:.07}); burst(t.x,t.y,def.col,14,.9);
  sfx('up'); refreshUI(true);
}
function sell(t){
  const v=Math.floor(t.spent*.7);
  S.credits+=v; S.grid[t.gy][t.gx]=null; S.towers=S.towers.filter(x=>x!==t);
  burst(t.x,t.y,TW[t.type].col,12,.8); sfx('sell');
  S.sel=null; refreshUI(true);
}
function selectBuild(type){
  if(!started||S.over) return;
  if(S.build===type){ cancelBuild(); return; }
  if(S.credits<TW[type].cost){ sfx('err'); flashHint(`${TW[type].name}には ${TW[type].cost} クレジットが必要です`); return; }
  S.build=type; S.sel=null; S.pending=null; refreshUI(true);
}
function cancelBuild(){ S.build=null; S.pending=null; refreshUI(true); }
function selectTower(t){ S.sel=t; S.build=null; S.pending=null; refreshUI(true); }
function deselect(){ S.sel=null; refreshUI(true); }
function callWave(){
  if(!started||S.over||S.waves.length>=3) return;
  initAudio();
  const early=S.waves.length>0;
  S.wave++;
  S.waves.push({id:S.wave,q:buildQueue(S.wave),clock:0,idx:0,alive:0});
  if(early){ const b=Math.round(10+S.wave*2); S.credits+=b; toast(`ウェーブ ${S.wave}　早期出撃 +${b}`); }
  else toast(S.wave%10===0?`ウェーブ ${S.wave}　母艦の反応あり`:`ウェーブ ${S.wave}`, S.wave%10===0?'bad':'');
  sfx('wave'); refreshUI(true);
}
function togglePause(force){
  if(!started||S.over) return;
  S.paused=typeof force==='boolean'?force:!S.paused;
  $('#pausePill').classList.toggle('show',S.paused&&!overlayOpen());
  refreshUI(true);
}

/* ============ Input ============ */
cv.addEventListener('pointerdown',ev=>{
  if(!started||S.over||overlayOpen()) return;
  initAudio();
  const w=toWorld(ev.clientX,ev.clientY), gx=Math.floor(w.x), gy=Math.floor(w.y);
  const inGrid=gx>=0&&gy>=0&&gx<GW&&gy<GH, tw=inGrid?S.grid[gy][gx]:null;
  if(S.build){
    if(tw){ selectTower(tw); return; }
    if(!inGrid){ cancelBuild(); return; }
    if(!canBuild(gx,gy)){ S.pending=null; sfx('err'); flashHint('航路とゲートの上には建設できません'); return; }
    if(ev.pointerType==='mouse'||(S.pending&&S.pending.x===gx&&S.pending.y===gy)) build(gx,gy);
    else { S.pending={x:gx,y:gy}; refreshUI(true); }
    return;
  }
  if(tw) selectTower(tw); else if(S.sel) deselect();
});
cv.addEventListener('pointermove',ev=>{
  if(ev.pointerType!=='mouse') return;
  const w=toWorld(ev.clientX,ev.clientY); S.hover={x:Math.floor(w.x),y:Math.floor(w.y)};
});
cv.addEventListener('pointerleave',()=>{S.hover=null;});
addEventListener('keydown',e=>{
  if(!started){ if(e.key==='Enter'&&overlayOpen()) startGame(); return; }
  if(overlayOpen()) return;
  const k=e.key;
  if(k>='1'&&k<='5') selectBuild(ORDER[+k-1]);
  else if(k==='Escape'){ cancelBuild(); deselect(); }
  else if(k===' '){ e.preventDefault(); togglePause(); }
  else if(k==='n'||k==='N') callWave();
  else if((k==='u'||k==='U')&&S.sel) upgrade(S.sel);
  else if(k==='f'||k==='F') cycleSpeed();
});

/* ============ Render ============ */
let RT=0;
function poly(x,y,r,n,rot){ ctx.beginPath(); for(let i=0;i<n;i++){const a=rot+i/n*TAU; i?ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r):ctx.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r);} ctx.closePath(); }
function circle(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,TAU); }
function glow(x,y,r,col,a){ const g=ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,hexA(col,a)); g.addColorStop(1,hexA(col,0)); ctx.fillStyle=g; circle(x,y,r); ctx.fill(); }
function fs(){ ctx.fill(); ctx.stroke(); }
function lanePath(){ ctx.beginPath(); ctx.moveTo(P[0].x,P[0].y); for(let i=1;i<P.length;i++) ctx.lineTo(P[i].x,P[i].y); }

function drawField(){
  ctx.strokeStyle='rgba(150,165,255,.10)'; ctx.lineWidth=.03;
  ctx.beginPath(); ctx.roundRect?ctx.roundRect(0,0,GW,GH,.3):ctx.rect(0,0,GW,GH); ctx.stroke();
  const a=S.build?.34:.11;
  ctx.fillStyle=`rgba(170,185,255,${a})`;
  ctx.beginPath();
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    if(blocked.has(x+','+y)||S.grid[y][x]) continue;
    ctx.rect(x+.5-.05,y+.5-.012,.1,.024); ctx.rect(x+.5-.012,y+.5-.05,.024,.1);
  }
  ctx.fill();
}
function drawLane(){
  ctx.lineJoin='round'; ctx.lineCap='round';
  lanePath(); ctx.strokeStyle='rgba(110,130,255,.12)'; ctx.lineWidth=1.3; ctx.stroke();
  lanePath(); ctx.strokeStyle='rgba(150,165,255,.5)'; ctx.lineWidth=.9; ctx.stroke();
  lanePath(); ctx.strokeStyle='#141843'; ctx.lineWidth=.84; ctx.stroke();
  lanePath(); ctx.setLineDash([.16,.44]); ctx.lineDashOffset=-S.t*1.3; ctx.strokeStyle='rgba(175,190,255,.3)'; ctx.lineWidth=.05; ctx.stroke(); ctx.setLineDash([]);
}
function drawGate(){
  const g=P[0], k=S.t;
  ctx.globalCompositeOperation='lighter';
  glow(g.x,g.y,.9+S.gateFlash*.4,'#ff3b6b',.35+S.gateFlash*.35);
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#1a0b2a'; circle(g.x,g.y,.36); ctx.fill();
  ctx.lineWidth=.05; ctx.strokeStyle='#ff5d7a';
  for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(g.x,g.y,.4,k*1.6+i*TAU/3,k*1.6+i*TAU/3+1.3); ctx.stroke(); }
  ctx.strokeStyle='rgba(255,140,170,.6)'; ctx.lineWidth=.025;
  for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(g.x,g.y,.24,-k*2.4+i*TAU/3,-k*2.4+i*TAU/3+1.1); ctx.stroke(); }
}
function drawCore(){
  const c=P[P.length-1], hurtA=S.coreFlash;
  ctx.globalCompositeOperation='lighter';
  glow(c.x,c.y,1.25,'#58c8ff',.28); if(hurtA>0) glow(c.x,c.y,1.4,'#ff3b5c',.5*hurtA);
  ctx.globalCompositeOperation='source-over';
  const ring=(back)=>{ ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(-.45); ctx.scale(1,.34); ctx.beginPath(); ctx.arc(0,0,.78,back?Math.PI:0,back?TAU:Math.PI); ctx.strokeStyle=back?'rgba(127,216,255,.35)':'rgba(170,230,255,.8)'; ctx.lineWidth=.07; ctx.stroke(); ctx.restore(); };
  ring(true);
  const g=ctx.createRadialGradient(c.x-.15,c.y-.18,.05,c.x,c.y,.5);
  g.addColorStop(0,'#e4f8ff'); g.addColorStop(.45,'#5aa0f5'); g.addColorStop(1,'#1a2470');
  ctx.fillStyle=g; circle(c.x,c.y,.46); ctx.fill();
  if(hurtA>0){ ctx.fillStyle=`rgba(255,70,100,${.55*hurtA})`; circle(c.x,c.y,.46); ctx.fill(); }
  ring(false);
  const oa=S.t*.9; ctx.fillStyle='#dff6ff'; circle(c.x+Math.cos(oa)*.72,c.y+Math.sin(oa)*.72,.05); ctx.fill();
}
function drawGravFields(){
  for(const t of S.towers){
    if(t.type!=='grav') continue;
    const r=TW.grav.lv[t.level].range;
    const g=ctx.createRadialGradient(t.x,t.y,0,t.x,t.y,r);
    g.addColorStop(0,'rgba(168,139,255,.16)'); g.addColorStop(.75,'rgba(168,139,255,.07)'); g.addColorStop(1,'rgba(168,139,255,0)');
    ctx.fillStyle=g; circle(t.x,t.y,r); ctx.fill();
    for(let i=0;i<2;i++){
      const f=((S.t*.45+i*.5)%1), rr=r*(1-f);
      ctx.strokeStyle=`rgba(190,170,255,${.35*f})`; ctx.lineWidth=.03; circle(t.x,t.y,rr); ctx.stroke();
    }
  }
}
function drawTower(t){
  const def=TW[t.type], c=def.col, k=t.recoil*.07, sel=S.sel===t;
  ctx.save(); ctx.translate(t.x,t.y);
  if(sel){ ctx.strokeStyle=hexA(c,.6+.3*Math.sin(RT*5)); ctx.lineWidth=.04; circle(0,0,.5); ctx.stroke(); }
  ctx.fillStyle='#1b1f52'; ctx.strokeStyle=hexA(c,.55); ctx.lineWidth=.035; poly(0,0,.42,8,Math.PI/8); fs();
  ctx.fillStyle='#252a68'; circle(0,0,.27); ctx.fill();
  ctx.lineWidth=.03;
  if(t.type==='grav'){
    ctx.globalCompositeOperation='lighter'; glow(0,0,.34,c,.55+.2*Math.sin(S.t*3)); ctx.globalCompositeOperation='source-over';
    ctx.strokeStyle=c; ctx.setLineDash([.12,.08]);
    ctx.save(); ctx.rotate(t.spin); circle(0,0,.3); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.rotate(-t.spin*1.6); circle(0,0,.18); ctx.stroke(); ctx.restore();
    ctx.setLineDash([]); ctx.fillStyle='#efe9ff'; circle(0,0,.07); ctx.fill();
  }else if(t.type==='arc'){
    ctx.rotate(t.spin*1.4);
    ctx.strokeStyle=c; ctx.lineWidth=.04;
    for(let i=0;i<3;i++){ const a=i*TAU/3; ctx.beginPath(); ctx.moveTo(Math.cos(a)*.12,Math.sin(a)*.12); ctx.lineTo(Math.cos(a)*.32,Math.sin(a)*.32); ctx.stroke(); ctx.fillStyle=c; circle(Math.cos(a)*.34,Math.sin(a)*.34,.055); ctx.fill(); }
    ctx.globalCompositeOperation='lighter'; glow(0,0,.3,c,.45+.35*t.recoil+.1*Math.random()); ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#eafff6'; circle(0,0,.08); ctx.fill();
  }else{
    ctx.rotate(t.ang);
    if(t.type==='laser'){
      ctx.fillStyle=c; ctx.fillRect(.04-k,-.045,.38,.09);
      ctx.fillStyle='#2d3480'; ctx.strokeStyle=c; circle(-k*.5,0,.15); fs();
      ctx.globalCompositeOperation='lighter'; glow(-k*.5,0,.14,c,.6); ctx.globalCompositeOperation='source-over';
    }else if(t.type==='rail'){
      ctx.fillStyle='#e7e5ff'; ctx.fillRect(-.06-k,-.11,.6,.045); ctx.fillRect(-.06-k,.065,.6,.045);
      const charge=Math.max(0,1-t.cd*TW.rail.lv[t.level].rate);
      ctx.globalCompositeOperation='lighter'; ctx.fillStyle=hexA('#9d8bff',.25+.6*charge); ctx.fillRect(-.02-k,-.03,.54,.06); ctx.globalCompositeOperation='source-over';
      ctx.fillStyle='#2d3480'; ctx.strokeStyle=c; ctx.beginPath(); ctx.rect(-.2-k*.4,-.14,.28,.28); fs();
    }else if(t.type==='plasma'){
      ctx.fillStyle='#3b2c58'; ctx.strokeStyle=c; ctx.beginPath(); ctx.rect(-k,-.1,.36,.2); fs();
      ctx.fillStyle='#2d3480'; circle(-k*.4,0,.19); fs();
      ctx.globalCompositeOperation='lighter'; glow(-k*.4,0,.2,c,.5+.25*Math.sin(S.t*6)); ctx.globalCompositeOperation='source-over';
    }
  }
  ctx.restore();
}
function drawEnemy(e){
  const d=e.d, r=d.r, c=d.col, sc=Math.min(1,(S.t-e.born)/.3);
  ctx.save(); ctx.translate(e.x,e.y); ctx.scale(sc,sc);
  ctx.globalCompositeOperation='lighter';
  glow(-Math.cos(e.ang)*r*.8,-Math.sin(e.ang)*r*.8,r*1.1,c,.4);
  if(e.slowUsed>0) glow(0,0,r*1.5,'#a88bff',.25);
  ctx.globalCompositeOperation='source-over';
  ctx.rotate(e.ang);
  ctx.fillStyle=e.hit>0?'#ffe9ee':'#2a0f2e'; ctx.strokeStyle=c; ctx.lineWidth=.04; ctx.lineJoin='round';
  switch(e.type){
    case 'scout': ctx.beginPath(); ctx.moveTo(r*1.15,0); ctx.lineTo(-r*.85,r*.55); ctx.lineTo(-r*.4,0); ctx.lineTo(-r*.85,-r*.55); ctx.closePath(); fs(); break;
    case 'drone': ctx.beginPath(); ctx.moveTo(r,0); ctx.lineTo(-r*.75,r*.85); ctx.lineTo(-r*.35,0); ctx.lineTo(-r*.75,-r*.85); ctx.closePath(); fs(); ctx.fillStyle=c; circle(r*.1,0,r*.16); ctx.fill(); break;
    case 'tank': poly(0,0,r,6,0); fs(); ctx.lineWidth=.025; poly(0,0,r*.55,6,0); ctx.stroke(); ctx.beginPath(); ctx.moveTo(r*.55,-r*.3); ctx.lineTo(r*.95,0); ctx.lineTo(r*.55,r*.3); ctx.stroke(); break;
    case 'shield': circle(0,0,r*.75); fs(); ctx.beginPath(); ctx.moveTo(r*.95,0); ctx.lineTo(r*.4,r*.35); ctx.lineTo(r*.4,-r*.35); ctx.closePath(); ctx.fillStyle=c; ctx.fill(); break;
    case 'splitter': for(let i=0;i<3;i++){ const a=S.t*2.2+i*TAU/3, x=Math.cos(a)*r*.42, y=Math.sin(a)*r*.42; poly(x,y,r*.42,4,0); fs(); } break;
    case 'mini': poly(0,0,r,4,0); fs(); break;
    case 'boss':
      ctx.beginPath(); ctx.moveTo(r*1.15,0); ctx.lineTo(r*.3,r*.55); ctx.lineTo(-r*.25,r*.5); ctx.lineTo(-r*.95,r*.85); ctx.lineTo(-r*.65,0); ctx.lineTo(-r*.95,-r*.85); ctx.lineTo(-r*.25,-r*.5); ctx.lineTo(r*.3,-r*.55); ctx.closePath(); ctx.lineWidth=.05; fs();
      ctx.lineWidth=.03; poly(0,0,r*.4,6,S.t*.8); ctx.stroke();
      ctx.globalCompositeOperation='lighter'; glow(0,0,r*.45,c,.6+.3*Math.sin(S.t*4)); ctx.globalCompositeOperation='source-over';
      break;
  }
  ctx.restore();
  if(e.maxShield>0&&e.shield>0){
    const a=(.22+.45*(e.shield/e.maxShield))*(e.sh>0?1.6:1);
    ctx.fillStyle=`rgba(200,170,255,${.07*a/.5})`; ctx.strokeStyle=`rgba(210,190,255,${Math.min(1,a)})`; ctx.lineWidth=.035;
    circle(e.x,e.y,r*1.3*sc); fs();
  }
}
function drawGhost(){
  let cell=S.pending||(S.build&&S.hover);
  if(S.build&&cell){
    const ok=canBuild(cell.x,cell.y)&&S.credits>=TW[S.build].cost, def=TW[S.build], r=def.lv[0].range;
    if(cell.x<0||cell.y<0||cell.x>=GW||cell.y>=GH) return;
    const cx=cell.x+.5, cy=cell.y+.5;
    ctx.fillStyle=ok?hexA(def.col,.07):'rgba(255,93,122,.08)'; ctx.strokeStyle=ok?hexA(def.col,.7):'rgba(255,93,122,.8)';
    ctx.lineWidth=.035; ctx.setLineDash([.15,.1]); circle(cx,cy,r); fs(); ctx.setLineDash([]);
    ctx.fillStyle=ok?'rgba(125,255,196,.18)':'rgba(255,93,122,.22)'; ctx.fillRect(cell.x+.06,cell.y+.06,.88,.88);
    if(ok){ ctx.globalAlpha=.55; drawTower({type:S.build,x:cx,y:cy,level:0,ang:-Math.PI/2,recoil:0,spin:S.t,cd:0}); ctx.globalAlpha=1; }
  }
  if(S.sel){
    const t=S.sel, def=TW[t.type], r=def.lv[t.level].range;
    ctx.fillStyle=hexA(def.col,.06); ctx.strokeStyle=hexA(def.col,.65); ctx.lineWidth=.035; ctx.setLineDash([.15,.1]);
    circle(t.x,t.y,r); fs(); ctx.setLineDash([]);
  }
}
function drawFX(){
  ctx.globalCompositeOperation='lighter'; ctx.lineCap='round';
  for(const b of S.beams){
    const f=b.life/b.max;
    if(b.k==='laser'){
      ctx.strokeStyle=hexA(b.col,.35*f); ctx.lineWidth=.14; ctx.beginPath(); ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2); ctx.stroke();
      ctx.strokeStyle=hexA('#e8fbff',.95*f); ctx.lineWidth=.045; ctx.stroke();
    }else if(b.k==='rail'){
      ctx.strokeStyle=hexA('#8f7dff',.35*f); ctx.lineWidth=.4*f+.05; ctx.beginPath(); ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2); ctx.stroke();
      ctx.strokeStyle=hexA('#ffffff',f); ctx.lineWidth=.1*f+.02; ctx.stroke();
    }else if(b.k==='arc'){
      const fl=.6+.4*Math.random();
      ctx.beginPath(); b.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
      ctx.strokeStyle=hexA(b.col,.35*f*fl); ctx.lineWidth=.16; ctx.stroke();
      ctx.strokeStyle=hexA('#f0fff9',f*fl); ctx.lineWidth=.04; ctx.stroke();
    }
  }
  for(const s of S.shots){ glow(s.x,s.y,.3,'#ffb547',.7); ctx.fillStyle='#fff4d6'; circle(s.x,s.y,.07); ctx.fill(); }
  for(const r of S.rings){
    const f=1-r.life/r.max, rad=r.r0+(r.r1-r.r0)*(1-Math.pow(1-f,2));
    ctx.strokeStyle=hexA(r.col,.8*(1-f)); ctx.lineWidth=r.w; circle(r.x,r.y,rad); ctx.stroke();
  }
  for(const p of S.parts){
    const f=p.life/p.max; ctx.fillStyle=hexA(p.col,.85*f); ctx.fillRect(p.x-p.s,p.y-p.s,p.s*2,p.s*2);
  }
  ctx.globalCompositeOperation='source-over';
}
function drawScreenLayer(sx,sy){
  for(const e of S.enemies){
    if(e.hp>=e.maxHp&&(e.maxShield===0||e.shield>=e.maxShield)) continue;
    const p=toScreen(e.x,e.y,sx,sy), boss=e.type==='boss';
    const w=Math.max(16,e.d.r*V.cs*(boss?2.4:1.9)), h=boss?4:3, x=p.x-w/2, y=p.y-e.d.r*V.cs-(boss?12:8);
    ctx.fillStyle='rgba(8,10,30,.7)'; ctx.fillRect(x-1,y-1,w+2,h+2);
    ctx.fillStyle=boss?'#ff4d6d':'#ff8aa0'; ctx.fillRect(x,y,w*Math.max(0,e.hp/e.maxHp),h);
    if(e.maxShield>0&&e.shield>0){ ctx.fillStyle='#c9b6ff'; ctx.fillRect(x,y-h-1,w*(e.shield/e.maxShield),h); }
  }
  for(const t of S.towers){
    const p=toScreen(t.x,t.y,sx,sy), c=TW[t.type].col, y=p.y+V.cs*.36;
    for(let i=0;i<=t.level;i++){ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(p.x+(i-t.level/2)*6,y,1.8,0,TAU); ctx.fill(); }
  }
}
function drawTwinkles(){
  ctx.globalCompositeOperation='lighter';
  const drift=reduceMotion?0:RT*3;
  for(const s of TWINK){
    const a=.25+.75*(.5+.5*Math.sin(RT*s.s+s.p));
    const x=((s.u*V.W+drift*s.z)%V.W+V.W)%V.W, y=s.v*V.H;
    ctx.fillStyle=`rgba(225,232,255,${a*.8})`;
    ctx.fillRect(x-.6*s.z,y-.6*s.z,1.2*s.z,1.2*s.z);
    if(s.z>1.3){ ctx.fillStyle=`rgba(225,232,255,${a*.3})`; ctx.fillRect(x-3*s.z,y-.3,6*s.z,.6); ctx.fillRect(x-.3,y-3*s.z,.6,6*s.z); }
  }
  ctx.globalCompositeOperation='source-over';
}
function render(rdt){
  RT+=rdt;
  ctx.setTransform(1,0,0,1,0,0);
  if(BG) ctx.drawImage(BG,0,0); else { ctx.fillStyle='#0e1233'; ctx.fillRect(0,0,cv.width,cv.height); }
  ctx.setTransform(V.dpr,0,0,V.dpr,0,0); drawTwinkles();
  let sx=0,sy=0;
  if(S.shake>0&&!reduceMotion){ const m=S.shake*V.cs*.3; sx=(Math.random()-.5)*m; sy=(Math.random()-.5)*m; }
  setWorld(sx,sy);
  drawField(); drawLane(); drawGravFields(); drawGate(); drawCore();
  for(const t of S.towers) drawTower(t);
  for(const e of S.enemies) drawEnemy(e);
  drawFX();
  drawGhost();
  ctx.setTransform(V.dpr,0,0,V.dpr,0,0); drawScreenLayer(sx,sy);
}

/* ============ Loop ============ */
let last=performance.now(), acc=0; const STEP=1/60;
function frame(now){
  const d=Math.min(.1,(now-last)/1000); last=now;
  if(started&&!S.paused&&!S.over){
    acc+=d*S.speed; let n=0;
    while(acc>=STEP&&n<14){ step(STEP); acc-=STEP; n++; }
    if(n>=14) acc=0;
  }else if(S.over){
    // let the last explosions settle
    const dt=d; for(const p of S.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;} S.parts=S.parts.filter(p=>p.life>0);
    for(const r of S.rings) r.life-=dt; S.rings=S.rings.filter(r=>r.life>0);
  }
  if(hintOverride&&performance.now()>=hintUntil){ hintOverride=null; refreshUI(true); }
  refreshUI(false);
  render(d);
  requestAnimationFrame(frame);
}
new ResizeObserver(resize).observe(stage);
resize();
refreshUI(true);
showStart();
requestAnimationFrame(frame);
})();
</script>
</body>
