<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ひびきピアノ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700;900&family=Zen+Kaku+Gothic+New:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: one screen like an upright piano — gilt nameboard (header), music desk (chord + takes), red key felt, then the keyboard. */
:root{
  --lacquer:#131116; --lacquer-2:#1d1a21; --lacquer-3:#2a2630;
  --gilt:#cfab62; --gilt-dim:#8d7442;
  --ivory:#efe8dc; --mute:#a69fae; --line:rgba(239,232,220,.12);
  --felt:#8a1e2a; --rec:#e5484d; --ok:#5fb98a;
  --disp:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  /* key colours — set from settings */
  --wk:#f7f3ea; --bk:#17151a; --hl:#cfab62; --wk-label:#5a5560; --bk-label:#cfc8d4;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--lacquer);color:var(--ivory);font-family:var(--body);font-size:15px;line-height:1.55;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--gilt);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* nameboard */
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--lacquer-2),var(--lacquer))}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{margin:0;font-family:var(--disp);font-weight:900;font-size:22px;letter-spacing:.12em;color:var(--gilt);white-space:nowrap}
.brand small{font-size:11px;letter-spacing:.18em;color:var(--gilt-dim);text-transform:uppercase;white-space:nowrap}
.tbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{height:40px;padding:0 14px;border-radius:999px;background:var(--lacquer-3);border:1px solid var(--line);display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{border-color:rgba(207,171,98,.5)}
.btn svg{width:18px;height:18px;flex:none}
.btn.rec .dot{width:12px;height:12px;border-radius:50%;background:var(--rec);box-shadow:0 0 0 3px rgba(229,72,77,.2)}
.btn.rec[aria-pressed="true"]{background:var(--rec);border-color:var(--rec);color:#fff}
.btn.rec[aria-pressed="true"] .dot{background:#fff;border-radius:3px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.btn[aria-pressed="true"].pedal{background:var(--gilt);color:var(--lacquer);border-color:var(--gilt)}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px}
.chip{font-family:var(--mono);font-size:12px;color:var(--mute);padding:4px 10px;border:1px dashed var(--line);border-radius:999px;white-space:nowrap}

/* music desk */
.desk{flex:1;min-height:0;overflow:auto;padding-block:14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px;align-content:start}
@media (max-width:720px){.desk{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--lacquer-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.panel h2{margin:0 0 8px;font-size:12px;letter-spacing:.16em;color:var(--gilt-dim);font-weight:700}
.chord{display:flex;align-items:baseline;gap:14px;min-height:64px;flex-wrap:wrap}
.chord b{font-family:var(--disp);font-weight:900;font-size:clamp(34px,6vw,54px);line-height:1;color:var(--ivory);letter-spacing:.02em}
.chord span{color:var(--mute);font-size:14px}
.notes{font-family:var(--mono);font-size:13px;color:var(--gilt);min-height:20px;word-break:break-all}
.hint{color:var(--mute);font-size:13px;margin:6px 0 0}
.takes{display:grid;gap:8px}
.take{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--lacquer);border:1px solid var(--line)}
.take.playing{border-color:var(--gilt)}
.take .play{width:38px;height:38px;border-radius:50%;background:var(--gilt);color:var(--lacquer);display:grid;place-items:center}
.take .play svg{width:16px;height:16px}
.take .meta{min-width:0}
.take .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.take .name input{width:100%;background:var(--lacquer-3);border:1px solid var(--gilt-dim);border-radius:6px;padding:2px 6px}
.take .sub{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.take .tag{display:inline-block;font-size:10px;letter-spacing:.1em;color:var(--lacquer);background:var(--gilt-dim);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}
.take .acts{display:flex;gap:4px}
.ibtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--mute)}
.ibtn:hover{background:var(--lacquer-3);color:var(--ivory)}
.ibtn svg{width:17px;height:17px}
.ibtn.danger{width:auto;padding:0 10px;color:#fff;background:var(--rec);font-size:12px;font-weight:700}
.prog{grid-column:1/-1;height:3px;border-radius:2px;background:var(--lacquer-3);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--gilt)}
.empty{color:var(--mute);font-size:14px;padding:6px 0}

/* key case */
.case{background:linear-gradient(180deg,var(--lacquer-2),#0c0b0e);border-top:1px solid var(--line);padding-block:8px calc(10px + env(safe-area-inset-bottom,0px))}
.mini{height:26px;width:100%;display:block;border-radius:6px;margin-bottom:8px;cursor:grab;touch-action:none}
.mini[hidden]{display:none}
.kwrap{position:relative;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;border-radius:4px 4px 8px 8px}
.kwrap::-webkit-scrollbar{display:none}
.felt{height:7px;background:repeating-linear-gradient(90deg,var(--felt) 0 6px,#7a1825 6px 7px);box-shadow:0 2px 3px rgba(0,0,0,.5) inset}
.strip{position:relative;height:clamp(150px,46vh,380px);touch-action:none;user-select:none;-webkit-user-select:none}
.k{position:absolute;top:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:8px;font-size:11px;line-height:1.2;transition:transform .04s,background-color .06s}
.k.w{height:100%;background:linear-gradient(180deg,color-mix(in srgb,var(--wk) 88%,#000) 0,var(--wk) 6%,var(--wk) 92%,color-mix(in srgb,var(--wk) 80%,#000) 100%);border:1px solid rgba(0,0,0,.35);border-top:0;border-radius:0 0 6px 6px;color:var(--wk-label);z-index:1}
.k.b{height:62%;background:linear-gradient(180deg,var(--bk),color-mix(in srgb,var(--bk) 75%,#fff) 92%,var(--bk));border:1px solid rgba(0,0,0,.6);border-top:0;border-radius:0 0 4px 4px;color:var(--bk-label);z-index:2;box-shadow:0 3px 4px rgba(0,0,0,.45)}
.k.w.on{background:color-mix(in srgb,var(--hl) 62%,var(--wk));transform:translateY(2px)}
.k.b.on{background:color-mix(in srgb,var(--hl) 70%,var(--bk));transform:translateY(2px);box-shadow:0 1px 2px rgba(0,0,0,.45)}
.k .pc{font-family:var(--mono);font-size:10px;opacity:.6;margin-bottom:auto;padding-top:8px}
.k .nm{font-weight:700}
.k .oc{font-size:9px;opacity:.7}
.rotate{font-size:12px;color:var(--mute);margin:6px 0 0;text-align:center}

/* settings */
.ov{position:fixed;inset:0;background:rgba(8,7,10,.62);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media (min-height:640px){.ov{align-items:center}}
.sheet{width:min(100%,560px);max-height:100%;overflow:auto;background:var(--lacquer-2);border:1px solid var(--line);border-radius:18px;padding:18px}
.sheet h2{margin:0 0 12px;font-family:var(--disp);font-size:22px;color:var(--gilt);display:flex;align-items:center;gap:8px}
.sheet h2 .x{margin-left:auto}
.sec{padding-block:12px;border-top:1px solid var(--line);display:grid;gap:10px}
.sec>label,.sec>.lab{font-size:12px;letter-spacing:.14em;color:var(--gilt-dim);font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:36px;min-width:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--lacquer);font-weight:700;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--gilt);color:var(--lacquer);border-color:var(--gilt)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
select{height:36px;border-radius:8px;background:var(--lacquer);border:1px solid var(--line);padding:0 10px}
input[type=range]{width:min(220px,55vw);accent-color:var(--gilt)}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pre{border-radius:10px;border:1px solid var(--line);background:var(--lacquer);padding:8px;display:grid;gap:6px;text-align:left;font-size:12px;font-weight:700}
.pre[aria-pressed="true"]{border-color:var(--gilt);box-shadow:0 0 0 1px var(--gilt)}
.pre .sw{display:flex;height:30px;border-radius:4px;overflow:hidden;border:1px solid rgba(0,0,0,.4)}
.pre .sw i{flex:1;border-right:1px solid rgba(0,0,0,.25);position:relative}
.pre .sw i.bb{position:absolute;top:0;width:28%;height:62%;flex:none;border:0}
.custom{display:flex;gap:12px;flex-wrap:wrap}
.custom label{display:flex;align-items:center;gap:8px;font-size:13px}
.custom input[type=color]{width:42px;height:32px;border:1px solid var(--line);border-radius:6px;background:none;padding:2px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ivory);color:var(--lacquer);padding:8px 16px;border-radius:999px;font-weight:700;font-size:13px;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="pad">
    <div class="brand"><h1>ひびきピアノ</h1><small>Upright · 3 Oct</small></div>
    <div class="tbar">
      <span class="chip" id="pcChip" title="パソコンのキーボードで弾ける範囲（← →で移動）">PC C4–E6</span>
      <button class="btn rec" id="btnRec" aria-pressed="false"><span class="dot"></span><span id="recLabel">録音</span><span class="timer" id="recTime" hidden>0:00.0</span></button>
      <button class="btn pedal" id="btnPedal" aria-pressed="false" title="ダンパーペダル（Spaceキーでも踏めます）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 16h14l-2 4H7z"/><path d="M12 16V5"/></svg>ペダル</button>
      <button class="btn" id="btnSet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>設定</button>
    </div>
  </header>

  <main class="desk pad">
    <section class="panel" aria-live="polite">
      <h2>いま鳴っている音</h2>
      <div class="chord"><b id="chordName">―</b><span id="chordSub">鍵盤を弾いてみてください</span></div>
      <div class="notes" id="noteList"></div>
      <p class="hint" id="howto"></p>
    </section>
    <section class="panel">
      <h2>録音したテイク</h2>
      <div class="takes" id="takes"></div>
    </section>
  </main>

  <div class="case pad">
    <canvas class="mini" id="mini" hidden aria-label="鍵盤の表示範囲。ドラッグで左右に移動"></canvas>
    <div class="kwrap" id="kwrap">
      <div class="felt" id="felt"></div>
      <div class="strip" id="strip"></div>
    </div>
    <p class="rotate" id="rotateHint" hidden>スマホは横向きにすると、鍵盤が広くなって弾きやすくなります</p>
  </div>
</div>

<div class="ov" id="ov" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <h2 id="setTitle">設定<button class="ibtn x" id="btnClose" aria-label="閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h2>
    <div class="sec">
      <div class="lab">鍵盤の数</div>
      <div class="seg" id="segOct"></div>
      <div class="row"><span>いちばん左の音</span><select id="selStart"></select></div>
    </div>
    <div class="sec">
      <div class="lab">鍵盤の色</div>
      <div class="presets" id="presets"></div>
      <div class="custom">
        <label><input type="color" id="cW">白鍵</label>
        <label><input type="color" id="cB">黒鍵</label>
        <label><input type="color" id="cH">押したときの色</label>
      </div>
    </div>
    <div class="sec">
      <div class="lab">表示</div>
      <div class="row"><span>音名</span><div class="seg" id="segLabel"></div></div>
      <div class="row"><span>パソコンのキーを表示</span><div class="seg" id="segPc"></div></div>
    </div>
    <div class="sec">
      <div class="lab">音</div>
      <div class="row"><label for="rgVol">音量</label><input type="range" id="rgVol" min="0" max="1" step="0.01"></div>
      <div class="row"><label for="rgRev">ホールの響き</label><input type="range" id="rgRev" min="0" max="1" step="0.01"></div>
    </div>
  </div>
</div>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const SKEY='hibiki-piano-settings-v1', TKEY='hibiki-piano-takes-v1';

/* ---------------- settings ---------------- */
const PRESETS=[
  {id:'classic',name:'クラシック',wk:'#f7f3ea',bk:'#17151a',hl:'#cfab62'},
  {id:'reverse',name:'リバース',wk:'#1c1a20',bk:'#ece6da',hl:'#cfab62'},
  {id:'sakura',name:'さくら',wk:'#fff1f3',bk:'#b7466a',hl:'#ff8fb1'},
  {id:'mint',name:'ミント',wk:'#eefaf4',bk:'#1f5e4f',hl:'#3fc79a'},
  {id:'night',name:'よぞら',wk:'#dfe6ff',bk:'#1b2557',hl:'#7aa2ff'},
  {id:'sun',name:'ひまわり',wk:'#fff8df',bk:'#5a3a12',hl:'#ffb21e'},
];
const DEF={oct:3,start:3,colors:{wk:'#f7f3ea',bk:'#17151a',hl:'#cfab62'},preset:'classic',label:'doremi',pc:null,vol:.8,rev:.35};
const S=Object.assign({},DEF,store.get(SKEY,{}));S.colors=Object.assign({},DEF.colors,S.colors||{});
const saveS=()=>store.set(SKEY,S);
const coarse=matchMedia('(pointer: coarse)').matches;
if(S.pc===null) S.pc=!coarse;

/* ---------------- notes ---------------- */
const NAMES={cde:['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'],doremi:['ド','ド♯','レ','レ♯','ミ','ファ','ファ♯','ソ','ソ♯','ラ','ラ♯','シ']};
const isBlack=m=>[1,3,6,8,10].includes(m%12);
const octOf=m=>Math.floor(m/12)-1;
const nameOf=(m,sys=S.label==='cde'?'cde':'doremi')=>NAMES[sys][m%12]+octOf(m);
const mf=m=>440*Math.pow(2,(m-69)/12);
function range(){ if(S.oct===88) return {lo:21,hi:108}; const lo=12*(S.start+1); return {lo,hi:lo+12*S.oct}; }

/* ---------------- audio ---------------- */
let AC=null, bus, rev, wetG, dryG, master, wave, noiseBuf;
function ensureAudio(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return true; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
    master=AC.createGain();master.gain.value=S.vol;
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=12;comp.ratio.value=3;comp.attack.value=.004;comp.release.value=.25;
    comp.connect(master);master.connect(AC.destination);
    bus=AC.createGain();bus.gain.value=.55;
    dryG=AC.createGain();wetG=AC.createGain();
    rev=AC.createConvolver();rev.buffer=makeIR(2.6);
    bus.connect(dryG);dryG.connect(comp);bus.connect(rev);rev.connect(wetG);wetG.connect(comp);
    setRev(S.rev);
    // string spectrum: strong fundamental, falling harmonics (hammer strikes ~1/7 along the string, so the 7th is weak)
    const amps=[0,1,.62,.42,.3,.22,.15,.05,.09,.06,.045,.03,.02,.014];
    const real=new Float32Array(amps.length),imag=new Float32Array(amps);
    wave=AC.createPeriodicWave(real,imag,{disableNormalization:false});
    noiseBuf=AC.createBuffer(1,AC.sampleRate*.12,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
    return true;
  }catch(e){AC=null;return false;}
}
function makeIR(sec){const n=Math.floor(AC.sampleRate*sec),b=AC.createBuffer(2,n,AC.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);let lp=0;for(let i=0;i<n;i++){const t=i/n;lp=lp*.6+(Math.random()*2-1)*.4;d[i]=lp*Math.pow(1-t,3.2)*(i<AC.sampleRate*.012?i/(AC.sampleRate*.012):1);}}return b;}
function setRev(v){if(!AC)return;wetG.gain.value=v*.55;dryG.gain.value=1-v*.25;}
const voices=new Set();
function decayOf(m){return clamp(11-(m-21)*.115,1.1,11);} // low strings ring for ~10s, the top for ~1s
function makeVoice(m,vel,when){
  const t=Math.max(when||0,AC.currentTime), f=mf(m), T=decayOf(m);
  const env=AC.createGain(), damp=AC.createGain(), lp=AC.createBiquadFilter();
  env.gain.value=0;lp.type='lowpass';lp.Q.value=.7;
  const o1=AC.createOscillator(),o2=AC.createOscillator(),o2g=AC.createGain();
  o1.setPeriodicWave(wave);o2.setPeriodicWave(wave);o1.frequency.value=f;o2.frequency.value=f;
  const det=m<45?2.2:m<70?1.2:.7;o1.detune.value=-det;o2.detune.value=det;o2g.gain.value=.7;
  o1.connect(lp);o2.connect(o2g);o2g.connect(lp);lp.connect(env);env.connect(damp);damp.connect(bus);
  // loudness: velocity curve + a little bass/treble compensation
  const comp=m<48?1.25:m>84?.85:1, peak=(.08+.42*vel*vel)*comp;
  env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(peak,t+.0035);
  env.gain.setTargetAtTime(peak*.42,t+.0035,.12+T*.01);
  env.gain.setTargetAtTime(0,t+.35,T/5);
  // brightness: harder hits open the filter, then it closes as the string settles
  const c0=Math.min(16000,f*(2.5+13*vel)),c1=Math.min(9000,f*(1.6+2.5*vel));
  lp.frequency.setValueAtTime(c0,t);lp.frequency.setTargetAtTime(c1,t+.01,.35+T*.05);
  // hammer thump
  const ns=AC.createBufferSource(),nf=AC.createBiquadFilter(),ng=AC.createGain();
  ns.buffer=noiseBuf;nf.type='bandpass';nf.frequency.value=Math.min(6000,f*3);nf.Q.value=1.2;ng.gain.value=.12*vel*comp;
  ns.connect(nf);nf.connect(ng);ng.connect(damp);
  const end=t+T*1.15+.3;
  o1.start(t);o2.start(t);ns.start(t);o1.stop(end);o2.stop(end);ns.stop(t+.12);
  const v={m,t,o1,o2,damp,released:false,end};
  o1.onended=()=>{voices.delete(v);try{damp.disconnect();}catch(e){}};
  voices.add(v);
  if(voices.size>56){let old=null;for(const x of voices){if(!x.released){old=x;break;}}if(old)releaseVoice(old,AC.currentTime,.03);}
  return v;
}
function releaseVoice(v,when,tau){

  $('#presets').innerHTML=PRESETS.map(p=>`<button class="pre" data-p="${p.id}" aria-pressed="${S.preset===p.id}"><span class="sw">${[0,1,2,3].map(i=>`<i style="background:${i===1?p.hl:p.wk}"></i>`).join('')}</span>${p.name}</button>`).join('')+`<button class="pre" data-p="custom" aria-pressed="${S.preset==='custom'}"><span class="sw"><i style="background:${S.colors.wk}"></i><i style="background:${S.colors.hl}"></i><i style="background:${S.colors.bk}"></i><i style="background:${S.colors.wk}"></i></span>カスタム</button>`;
  // draw black keys on the swatches
  document.querySelectorAll('.pre').forEach(b=>{const p=PRESETS.find(x=>x.id===b.dataset.p)||{bk:S.colors.bk};const sw=b.querySelector('.sw');sw.style.position='relative';[.25,.5,.75].forEach(f=>{const i=document.createElement('i');i.className='bb';i.style.left=`calc(${f*100}% - 14%)`;i.style.background=p.bk;sw.appendChild(i);});});
  $('#cW').value=S.colors.wk;$('#cB').value=S.colors.bk;$('#cH').value=S.colors.hl;
  $('#segLabel').innerHTML=[['doremi','ドレミ'],['cde','CDE'],['none','なし']].map(([k,l])=>`<button data-l="${k}" aria-pressed="${S.label===k}">${l}</button>`).join('');
  $('#segPc').innerHTML=[[true,'表示'],[false,'かくす']].map(([k,l])=>`<button data-pc="${k}" aria-pressed="${S.pc===k}">${l}</button>`).join('');
  $('#rgVol').value=S.vol;$('#rgRev').value=S.rev;
}
function openSet(){renderSet();$('#ov').hidden=false;$('#btnClose').focus();}
function closeSet(){$('#ov').hidden=true;$('#btnSet').focus();}
$('#btnSet').addEventListener('click',openSet);$('#btnClose').addEventListener('click',closeSet);
$('#ov').addEventListener('pointerdown',e=>{if(e.target===$('#ov'))closeSet();});
$('#segOct').addEventListener('click',e=>{const b=e.target.closest('[data-o]');if(!b)return;releaseAllUser();S.oct=+b.dataset.o;if(S.oct!==88)S.start=clamp(S.start,1,8-S.oct);saveS();buildKeys.done=false;clampPcBase();buildKeys();renderSet();});
$('#selStart').addEventListener('change',e=>{releaseAllUser();S.start=+e.target.value;saveS();buildKeys.done=false;clampPcBase();buildKeys();});
$('#presets').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;const p=PRESETS.find(x=>x.id===b.dataset.p);if(p){S.colors={wk:p.wk,bk:p.bk,hl:p.hl};}S.preset=b.dataset.p;saveS();applyColors();renderSet();});
[['cW','wk'],['cB','bk'],['cH','hl']].forEach(([id,k])=>$('#'+id).addEventListener('input',e=>{S.colors[k]=e.target.value;S.preset='custom';saveS();applyColors();document.querySelectorAll('.pre').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.p==='custom')));}));
$('#segLabel').addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(!b)return;S.label=b.dataset.l;saveS();buildKeys();renderSet();chordDirty=true;});
$('#segPc').addEventListener('click',e=>{const b=e.target.closest('[data-pc]');if(!b)return;S.pc=b.dataset.pc==='true';saveS();buildKeys();renderSet();});
$('#rgVol').addEventListener('input',e=>{S.vol=+e.target.value;saveS();if(AC)master.gain.setTargetAtTime(S.vol,AC.currentTime,.02);});
$('#rgRev').addEventListener('input',e=>{S.rev=+e.target.value;saveS();setRev(S.rev);});
