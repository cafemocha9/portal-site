<style>
/* Layout: a 3D bowling lane seen from behind the player pin. Score card of 10 frames across the top, lives and score at the left, a big jump button at the right thumb, a floating stick wherever the left thumb lands. */
:root{
  --night:#251a45; --panel:#fffdf7; --ink:#2f2547; --mute:#7b7194; --pink:#ff4f8b; --pinkd:#d63470; --sun:#ffd23f; --sund:#e0a800; --sky:#3fa9ff; --ok:#20c997; --bad:#ff4f5e;
  --pop:"Mochiy Pop One","M PLUS Rounded 1c",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-weight:800;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#wrap{position:relative;width:100%;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;inset:0;pointer-events:none}
.hud[hidden]{display:none!important}
.hud .pe{pointer-events:auto}
.card10{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:3px;background:rgba(255,253,247,.94);padding:4px;border-radius:12px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.fr{width:38px;border:2px solid #e3dcef;border-radius:7px;text-align:center;background:#fff}
.fr small{display:block;font-size:10px;color:var(--mute);line-height:1.3;border-bottom:2px solid #e3dcef}
.fr span{display:flex;justify-content:center;gap:1px;height:20px;align-items:center;font-size:14px;font-family:var(--pop);font-weight:400}
.fr .o{color:var(--ok)}.fr .x{color:var(--bad)}.fr.now{border-color:var(--pink);background:#fff0f6}
.stat{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:66px;display:grid;gap:6px}
.lives{display:flex;gap:2px;background:rgba(255,253,247,.94);padding:5px 8px;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.lives svg{width:16px;height:28px}
.lives .lost{opacity:.22}
.sc{background:rgba(255,253,247,.94);padding:4px 12px;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.25);font-family:var(--pop);font-weight:400;font-size:20px}
.sc small{font-family:var(--body);font-weight:800;font-size:11px;color:var(--mute);display:block}
.quit{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:66px;background:rgba(255,253,247,.9);border-radius:12px;padding:8px 12px;font-size:13px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.jump{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:104px;height:104px;border-radius:50%;background:var(--sun);box-shadow:0 7px 0 var(--sund),0 10px 20px rgba(0,0,0,.3);font-family:var(--pop);font-weight:400;font-size:20px;display:grid;place-items:center;line-height:1.1}
.jump:active,.jump.on{transform:translateY(5px);box-shadow:0 2px 0 var(--sund)}
.jump small{display:block;font-family:var(--body);font-size:11px;font-weight:800;opacity:.7}
.keys{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.35);padding:6px 14px;border-radius:999px;font-size:13px;white-space:nowrap}
.stick{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);pointer-events:none;display:none}
.stick i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.85)}
.banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--pop);font-weight:400;font-size:clamp(34px,9vw,64px);color:#fff;text-shadow:0 5px 0 var(--pinkd),0 0 24px rgba(255,79,139,.7);white-space:nowrap;opacity:0;pointer-events:none}
.banner.on{animation:ban 1.3s ease-out forwards}
.banner.bad{text-shadow:0 5px 0 #9b1c2b,0 0 24px rgba(255,79,94,.8)}
.banner.good{text-shadow:0 5px 0 #138a67,0 0 24px rgba(32,201,151,.8)}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.say{position:absolute;left:50%;top:150px;transform:translateX(-50%);background:var(--panel);padding:7px 16px;border-radius:16px;font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,.25);white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.say.on{opacity:1}
.say b{color:var(--pink)}

.pop{position:absolute;font-family:var(--pop);font-weight:400;font-size:22px;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke;white-space:nowrap;transform:translate(-50%,-50%);animation:up 1s ease-out forwards}
@keyframes up{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-60px}}
.ov{position:absolute;inset:0;display:flex;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));background:rgba(37,26,69,.55);backdrop-filter:blur(3px);overflow:auto}
.ov[hidden]{display:none!important}
.card{width:min(100%,540px);margin:auto;background:var(--panel);border-radius:28px;padding:22px 20px;box-shadow:0 8px 0 rgba(0,0,0,.3);text-align:center}
.card h1{margin:0;font-family:var(--pop);font-weight:400;font-size:clamp(34px,9vw,52px);line-height:1.15;color:var(--pink);text-shadow:0 4px 0 #ffd0e0;white-space:nowrap}
.card h1 small{display:block;font-size:.38em;color:var(--mute);text-shadow:none;margin-bottom:4px}
.card h2{margin:4px 0;font-family:var(--pop);font-weight:400;font-size:26px}
.card p{margin:8px 0 14px;color:var(--mute);font-size:14px;line-height:1.65}
.diffs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 14px}
.dc{border-radius:18px;padding:10px 6px;background:#f3eefb;border:3px solid transparent;display:grid;gap:3px}
.dc[aria-pressed="true"]{border-color:var(--pink);background:#fff0f6}
.dc b{font-family:var(--pop);font-weight:400;font-size:17px;white-space:nowrap}
@media (max-width:420px){.dc b{font-size:14px}}
.dc span{font-size:11px;color:var(--mute);line-height:1.4}
.dc i{font-style:normal;font-size:12px;color:var(--sund)}
.howto{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;text-align:left;font-size:13px;color:var(--mute);margin:0 0 16px;line-height:1.5}
.howto b{color:var(--ink);white-space:nowrap}
.big{display:flex;align-items:center;justify-content:center;width:100%;height:58px;border-radius:20px;background:var(--pink);color:#fff;font-family:var(--pop);font-weight:400;font-size:21px;box-shadow:0 6px 0 var(--pinkd)}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 var(--pinkd)}
.big.sub{background:#fff;color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.15);border:2px solid #ece6f6}
.stack{display:grid;gap:12px}
.rs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.rs div{background:#f3eefb;border-radius:14px;padding:8px 4px;font-size:11px;color:var(--mute)}
.rs b{display:block;font-family:var(--pop);font-weight:400;font-size:22px;color:var(--ink)}
.big-score{font-family:var(--pop);font-weight:400;font-size:58px;line-height:1;color:var(--pink)}
.stars{font-size:42px;letter-spacing:6px;color:#e3dcef;margin:4px 0}
.stars b{color:var(--sun);text-shadow:0 3px 0 var(--sund);display:inline-block;animation:sp .45s cubic-bezier(.2,1.8,.4,1) backwards}
@keyframes sp{from{transform:scale(0) rotate(-40deg)}}
@media (max-width:560px){
  .fr{width:30px}.fr small{font-size:9px}.fr span{font-size:11px;height:17px}
  .stat{top:58px}.quit{top:58px}
  .lives svg{width:13px;height:23px}.sc{font-size:17px}
  .jump{width:92px;height:92px;font-size:18px}
  .keys{display:none}
  .say{top:136px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}

/* ポータル版の手直し：横向きのスマホでカードがはみ出しても、指でスクロールできるように
   （body が touch-action:none のため、重ねた画面のスクロールもできなくなっていた） */
.ov{touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ov .card{touch-action:pan-y}
/* 背の低い画面では、タイトルを左、えらぶ所とボタンを右にならべて、スクロールしなくても押せるように */
@media (max-height:520px) and (orientation:landscape){
  .card{padding:12px 18px;border-radius:22px}
  .card h1{font-size:30px}.card p{margin:4px 0 6px;font-size:12px;line-height:1.5}.card h2{font-size:21px}
  #title .card{width:min(100%,760px);display:grid;grid-template-columns:1fr 1.15fr;column-gap:18px;align-items:center;text-align:left}
  #title .card>h1,#title .card>p,#title .card>.howto{grid-column:1}
  #title .card>.diffs,#title .card>#btnPlay{grid-column:2}
  #title .card>.diffs{grid-row:1/span 2;align-self:end}
  #title .card>#btnPlay{grid-row:3;align-self:start}
  #title .howto{font-size:11px}
}

    </div>
  </section>
</div>

<script>

// approach floor, carpet, pit, back wall
{const ap=new THREE.Mesh(new THREE.PlaneGeometry(30,9),std('#d9a868',{roughness:.35}));ap.rotation.x=-Math.PI/2;ap.position.set(0,-.01,-41.5);ap.receiveShadow=true;scene.add(ap);
 const carpetTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#33275f';g.fillRect(0,0,w,h);const cs=['#ff4f8b','#3fa9ff','#ffd23f','#20c997'];for(let i=0;i<46;i++){g.fillStyle=cs[i%4];g.globalAlpha=.7;const x=Math.random()*w,y=Math.random()*h,s=3+Math.random()*7;g.beginPath();for(let k=0;k<10;k++){const a=k*Math.PI/5-Math.PI/2,r=k%2?s*.45:s;g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}g.fill();}});

function buildGuides(plan){clearGuides();for(const b of plan){const pts=[];const pEnd=(PZ1+1-FOUL)/(b.tz-FOUL);const N=60;
  for(let i=0;i<=N;i++){const p=pEnd*i/N;pts.push([xAt(b,p),lerp(FOUL,b.tz,p)]);}
  const pos=[],idx=[];const w=b.r*.95;
  for(let i=0;i<=N;i++){const [x,z]=pts[i],[x2,z2]=pts[Math.min(N,i+1)],[x1,z1]=pts[Math.max(0,i-1)];let tx=x2-x1,tz=z2-z1;const l=Math.hypot(tx,tz)||1;tx/=l;tz/=l;
    pos.push(x-tz*w,.035,z+tx*w,x+tz*w,.035,z-tx*w);if(i<N&&(i%4!==3))idx.push(i*2,i*2+1,i*2+2,i*2+1,i*2+3,i*2+2);}
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.setIndex(idx);

/* ================= BALL PATHS ================= */
function shape(b,p){switch(b.type){
  case 'hook':return b.x0+(b.xt-b.x0)*Math.pow(Math.max(0,p),2.4);
  case 'zig':return lerp(b.x0,b.xt,p)+b.A*Math.sin(Math.PI*3*p);
  default:return lerp(b.x0,b.xt,p);}}
function xAt(b,p){if(p<=1)return shape(b,p);const s=(shape(b,1)-shape(b,.98))/.02;return shape(b,1)+s*(p-1);}
function spec(type,x0,xt,o={}){const r=o.r||.7;const lim=LANE-r*.55;return Object.assign({type,x0:clamp(x0,-(LANE-r),LANE-r),xt:clamp(xt,-lim,lim),r,vzMul:1,delay:0,A:0,col:pick(BALL_COLS)},o,{r});}
function aimX(){return clamp(P.x+P.vx*D.lead,-PX,PX);}
function shiftAim(plan,tx){for(const b of plan){if(b.fixed)continue;const lim=LANE-b.r*.55;b.xt=clamp(b.xt+(tx-plan.tx),-lim,lim);}plan.tx=tx;for(const b of plan)b.tz=P.z;}
function makeThrow(name,tx){const side=rnd()<.5?-1:1,S=[];
  switch(name){
    case 'straight':S.push(spec('line',rr(-2.6,2.6),tx));break;
    case 'hook':S.push(spec('hook',side*2.7,tx));break;
    case 'hookfast':S.push(spec('hook',side*2.7,tx,{vzMul:1.3}));break;
    case 'mini':S.push(spec('line',rr(-2,2),tx,{r:.42,vzMul:1.15}));break;
    case 'double':{const o=tx>0?-1:1;S.push(spec('line',rr(-2,2),tx),spec('line',rr(-2,2),tx+o*rr(1.8,2.2)));break;}
    case 'doublehook':S.push(spec('hook',-2.7,tx-.85),spec('hook',2.7,tx+.85));break;
    case 'giant':S.push(spec('line',rr(-1.5,1.5),tx,{r:1.25,vzMul:.72}));break;
    case 'zig':S.push(spec('zig',rr(-1.5,1.5),tx,{A:side*1.5}));break;
    case 'minis':for(const k of [-1,0,1])S.push(spec('line',tx+k*1.35+rr(-.3,.3),tx+k*1.35,{r:.42,vzMul:1.1,delay:(k+1)*.12}));break;
    case 'triple':for(const k of [-1,0,1])S.push(spec('line',tx+k*2.25,tx+k*2.25));break;
    case 'zigmini':S.push(spec('zig',rr(-1.5,1.5),tx,{A:side*1.4}),spec('line',rr(-2,2),tx,{r:.42,vzMul:1.15,delay:.7}));break;
    case 'chase':S.push(spec('line',rr(-2.4,2.4),tx,{home:1,col:'#ff2e63'}));break;
    case 'chase2':S.push(spec('line',-2.4,tx-.5,{home:1,col:'#ff2e63'}),spec('line',2.4,tx+.5,{home:1,col:'#ff2e63',delay:.35}));break;
    case 'wall':{const r=.7;let g;let k=0;do{g=rr(-2.7,2.7);k++;}while(k<20&&Math.abs(g-P.x)<1.4);
      // fill both sides of a single gap of width D.gap with balls packed edge to edge
      for(const [a,b,dir] of [[-LANE,g-D.gap/2,-1],[g+D.gap/2,LANE,1]]){const len=b-a;if(len<.35)continue;const n=Math.max(1,Math.ceil(len/(2*r)));
        for(let i=0;i<n;i++){const x=dir<0?b-r-i*(len-2*r)/Math.max(1,n-1):a+r+i*(len-2*r)/Math.max(1,n-1);S.push(spec('line',x,x,{fixed:1,col:'#7a5cff'}));}}
      S.forEach(b=>b.gapAt=g);break;}
    case 'boss':S.push(spec('zig',0,tx,{r:1.3,vzMul:.66,A:side*1.2,col:'#ffd23f',boss:true}));break;
  }
  return S;}

const AU={};
function initAudio(){if(AU.c){if(AU.c.state==='suspended')AU.c.resume();return;}try{const c=new (window.AudioContext||window.webkitAudioContext)();AU.c=c;AU.out=c.createGain();AU.out.gain.value=.55;AU.out.connect(c.destination);
  const nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.nb=nb;
  const src=c.createBufferSource();src.buffer=nb;src.loop=true;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=160;const g=c.createGain();g.gain.value=0;src.connect(f);f.connect(g);g.connect(AU.out);src.start();AU.roll=g;}catch(e){AU.c=null;}}
function tone(type,f1,dur,vol,delay=0,f2){const c=AU.c;if(!c)return;const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AU.out);o.start(t);o.stop(t+dur+.05);}
function nz(dur,vol,type,freq,delay=0){const c=AU.c;if(!c)return;const t=c.currentTime+delay,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=AU.nb;f.type=type;f.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(AU.out);s.start(t,Math.random());s.stop(t+dur+.05);}
let crashT=0;
const SFX={
  jump:()=>tone('sine',380,.22,.2,0,900),
  crash:()=>{const n=AU.c.currentTime;if(n-crashT<.08)return;crashT=n;nz(.35,.35,'bandpass',1800);for(let i=0;i<4;i++)tone('triangle',900+Math.random()*900,.08,.08,i*.03+Math.random()*.04);},
  hit:()=>{nz(.4,.45,'bandpass',1400);tone('sine',300,.5,.25,0,90);tone('square',660,.12,.08,.15,330);},

  throw:()=>nz(.25,.2,'lowpass',400),

function beginThrow(){const name=FRAMES[G.frame][G.ti];G.state='windup';G.t=D.wind;G.throwHit=false;G.cur=name;
  G.plan=makeThrow(name,aimX()).map(b=>Object.assign(b,{tz:P.z}));G.plan.tx=aimX();G.aimT=0;
  if(D.guide!=='none')buildGuides(G.plan);

  if(D.guide==='wind')clearGuides();else if(D.guide==='full')buildGuides(G.plan);
  const base=D.spd*(1+G.frame*.045);
  for(const s of G.plan){const b=Object.assign({},s,{z:FOUL,x:xAt(s,0),y:0,vz:base*s.vzMul,mesh:makeBallMesh(s.r,s.col),gutter:false,passed:false,minD:9,alive:true,wait:s.delay});

function finishGame(clear){G.state=clear?'clear':'over';setRoll(0);clearGuides();
  const key=`pinchi-best-${dk}`;const best=store.get(key,0);const nb=G.score>best;if(nb)store.set(key,G.score);
  if(clear){banner('ぜんぶ よけきった！','good');sfx('clear');}else{banner('ストライク… アウト！','bad');sfx('over');}
  setTimeout(()=>{if(G.state!=='clear'&&G.state!=='over')return;
    $('#hud').hidden=true;$('#result').hidden=false;
    const stars=clear?(G.hits===0?3:G.hits<=Math.max(1,Math.floor(D.lives/2))?2:1):0;
    $('#resTitle').textContent=clear?(stars===3?'パーフェクト よけピン！':'クリア！ よけピン名人'):`フレーム${G.frame+1}で ストライクされちゃった`;
    $('#resScore').textContent=G.score;$('#rsSafe').textContent=G.safe;$('#rsStar').textContent=G.got;$('#rsNear').textContent=G.near;
    $('#resStars').innerHTML=[0,1,2].map(i=>i<stars?`<b style="animation-delay:${.3+i*.25}s">★</b>`:'★').join('');
    $('#resNote').textContent=(nb?'ハイスコア こうしん！ ':'')+`${D.name}のハイスコア：${Math.max(best,G.score)}`+(clear?'':'　ちびボールは ジャンプで とびこせるよ！');
  },1700);}
function toTitle(){G.state='title';for(const b of G.balls){scene.remove(b.mesh);if(b.crown)scene.remove(b.crown);}G.balls=[];clearStars();clearGuides();setRoll(0);
  $('#hud').hidden=true;$('#result').hidden=true;$('#title').hidden=false;renderTitle();}

/* ---- stars ---- */
function spawnStars(n){for(let i=0;i<n;i++){let x,z,k=0;do{x=rr(-2.8,2.8);z=rr(-4.3,.5);k++;}while(k<30&&(Math.hypot(x-P.x,z-P.z)<1.6||PIN_SPOTS.some(([a,b])=>Math.hypot(x-a,z-b)<.6)));
  const m=new THREE.Mesh(starGeo,starMat);m.position.set(x,.75,z);m.castShadow=true;scene.add(m);G.stars.push({x,z,m,t:rnd()*6});}}
function clearStars(){for(const s of G.stars)scene.remove(s.m);G.stars=[];}

/* ---- hits ---- */
function hitPlayer(b){if(P.hitT>0||P.inv>0)return;G.throwHit=true;G.hits++;G.lives--;renderLives();
  P.hitT=1.25;const dir=Math.sign(P.x-b.x)||1;P.vx=dir*rr(3,5);P.vz=b.vz*.45;P.vy=7.5;P.spin=dir*14;
  G.shake=.45;sfx('hit');banner('ストライク〜！','bad');pop('いてて！',P.x,2,P.z,'#ffb3c4');
  if(navigator.vibrate)try{navigator.vibrate(120);}catch(e){}}
function knockNpc(n,b){n.down=true;const dx=n.x-b.x;n.vx=dx*3+rr(-1.5,1.5);n.vz=b.vz*rr(.25,.5);n.vy=rr(3,6);n.srx=rr(6,12);n.srz=(dx>=0?-1:1)*rr(3,9);sfx('crash');}

/* ================= UPDATE ================= */
function setRoll(v){if(AU.roll&&AU.c)AU.roll.gain.setTargetAtTime(v,AU.c.currentTime,.08);}
function update(dt){
  // ---- player control ----
  let ix=input.kx+input.sx,iz=input.kz+input.sz,jump=input.jump;
  if(window.__pk.ai&&(G.state==='windup'||G.state==='roll'||G.state==='after'||G.state==='banner')){const a=window.__pk.ai();ix=a.x;iz=a.z;jump=a.jump;}
  const il=Math.hypot(ix,iz);if(il>1){ix/=il;iz/=il;}
  const playing=G.state==='windup'||G.state==='roll'||G.state==='after'||G.state==='banner';
  if(P.hitT>0){
    P.hitT-=dt;P.vy-=22*dt;P.x+=P.vx*dt;P.y+=P.vy*dt;P.z+=P.vz*dt;if(P.y<0){P.y=0;P.vy=Math.abs(P.vy)*.35;P.vx*=.6;P.vz*=.6;}
    P.pin.inner.rotation.z+=P.spin*dt;P.pin.inner.rotation.x+=P.spin*.4*dt;
    if(P.hitT<=0){P.x=clamp(P.x,-PX,PX);P.z=clamp(P.z,PZ0,PZ1);P.y=0;P.vx=P.vz=P.vy=0;P.inv=1.6;P.pin.inner.rotation.set(0,0,0);
      if(G.lives<=0){finishGame(false);}}
  }else{
    const sp=5.4,k=Math.min(1,dt*14);P.vx+=(ix*sp-P.vx)*k;P.vz+=(iz*sp-P.vz)*k;
    if(!playing){P.vx*=.8;P.vz*=.8;}
    P.x=clamp(P.x+P.vx*dt,-PX,PX);P.z=clamp(P.z+P.vz*dt,PZ0,PZ1);
    if(jump&&P.y<=0&&playing){P.vy=6.9;sfx('jump');}
    if(P.y>0||P.vy>0){P.vy-=20*dt;P.y+=P.vy*dt;if(P.y<=0){P.y=0;P.vy=0;}}
    for(const n of npcs){if(n.down||n.drop>0)continue;const dx=P.x-n.x,dz=P.z-n.z,d=Math.hypot(dx,dz);if(d<NPC_D&&d>1e-4){P.x+=dx/d*(NPC_D-d);P.z+=dz/d*(NPC_D-d);}}
    P.x=clamp(P.x,-PX,PX);P.z=clamp(P.z,PZ0,PZ1);
    if(P.inv>0)P.inv-=dt;
    const lean=P.pin.inner.rotation;lean.z=lerp(lean.z,-P.vx*.05,.2);lean.x=lerp(lean.x,P.vz*.05,.2);
  }
  // ---- flow timers ----
  if(G.state==='banner'){G.t-=dt;if(G.t<=0)beginThrow();}
  else if(G.state==='windup'){G.t-=dt;const k=1-G.t/D.wind;king.arm.rotation.x=k<.6?lerp(0,1.9,k/.6):lerp(1.9,-1.3,(k-.6)/.4);king.ball.visible=true;
    if(D.reaim){G.aimT-=dt;if(G.aimT<=0){G.aimT=.12;shiftAim(G.plan,aimX());if(D.guide!=='none')buildGuides(G.plan);}}
    if(G.t<=0){king.ball.visible=false;release();}}
  else if(G.state==='after'){G.t-=dt;king.arm.rotation.x=lerp(king.arm.rotation.x,0,.1);if(G.t<=0)nextThrow();}
  else if(G.state==='roll'){king.arm.rotation.x=lerp(king.arm.rotation.x,0,.08);}
  // ---- balls ----
  let rollVol=0;
  for(const b of G.balls){if(!b.alive)continue;
    if(b.wait>0){b.wait-=dt;if(b.wait<=0)b.mesh.visible=true;continue;}
    // chaser balls steer toward you, but stop steering shortly before arrival so a quick side-step still works
    if(b.home&&(P.z-b.z)/b.vz>D.stop&&P.hitT<=0){const lim=LANE-b.r*.55,want=clamp(P.x,-lim,lim);b.xt+=clamp(want-b.xt,-D.home*dt,D.home*dt);}
    const zPrev=b.z;b.z+=b.vz*dt;const p=(b.z-FOUL)/(b.tz-FOUL);const xPrev=b.x;b.x=xAt(b,p);
    if(!b.gutter&&Math.abs(b.x)>LANE+.05){b.gutter=true;}
    if(b.gutter){b.x=Math.sign(b.x)*(LANE+.35);b.y=lerp(b.y,-.3-b.r*.4,.2);}
    if(b.z>1.4){b.y-=(b.z-1.4)*.25+.02;}
    // collisions
    const dx=P.x-b.x,dz=P.z-b.z,d=Math.hypot(dx,dz);
    if(!b.gutter&&b.y>-.2&&d<b.r+PIN_R&&P.y<b.y+b.r*2*.92)hitPlayer(b);
    if(zPrev<=P.z&&b.z>P.z&&!b.gutter&&P.hitT<=0){const lat=Math.abs(P.x-b.x);
      if(!G.throwHit&&P.inv<=0){if(lat<b.r+PIN_R+.55&&lat>=b.r+PIN_R){G.near++;G.score+=50;pop('ギリギリ！ +50',P.x,2.1,P.z,'#ffe066');sfx('near');}
        else if(lat<b.r+PIN_R&&P.y>0){G.near++;G.score+=80;pop('ジャンプでよけた！ +80',P.x,2.3,P.z,'#ffe066');sfx('near');}renderScore();}}
    for(const n of npcs){if(n.down||b.gutter)continue;if(Math.hypot(n.x-b.x,n.z-b.z)<b.r+.28)knockNpc(n,b);}
    const m=b.mesh;m.position.set(b.x,b.r+b.y,b.z);m.rotation.x+=b.vz*dt/b.r;m.rotation.z-=(b.x-xPrev)/b.r;
    if(b.crown){b.crown.position.set(b.x,b.r*2+b.y+.3,b.z);b.crown.rotation.y+=dt*3;}
    rollVol+=Math.max(0,1-Math.abs(b.z-P.z)/40)*.35*(b.r/.7);
    if(b.z>4.5){b.alive=false;scene.remove(m);if(b.crown)scene.remove(b.crown);}
  }
  setRoll(G.state==='roll'?Math.min(.6,rollVol):0);
  if(G.state==='roll'&&D.guide==='full'&&G.balls.some(b=>b.home&&b.alive)){G.aimT-=dt;if(G.aimT<=0){G.aimT=.15;buildGuides(G.balls.filter(b=>b.alive));}}
  if(G.state==='roll'&&G.balls.every(b=>!b.alive)){G.balls=[];endThrow();}
  // ---- npc pins ----
  for(const n of npcs){
    if(n.drop>0){n.drop-=dt;n.y=Math.max(0,n.drop*3);}
    if(n.down){n.vy-=20*dt;n.x+=n.vx*dt;n.y+=n.vy*dt;n.z+=n.vz*dt;n.rx+=n.srx*dt;n.rz+=n.srz*dt;
      if(n.y<0){n.y=0;n.vy=Math.abs(n.vy)*.3;n.vx*=.7;n.vz*=.7;n.srx*=.6;n.srz*=.6;if(Math.abs(n.vy)<.6){n.vy=0;n.rx=lerp(n.rx,Math.round((n.rx-Math.PI/2)/Math.PI)*Math.PI+Math.PI/2,.2);}}
      if(Math.abs(n.x)>LANE+.6){n.x=Math.sign(n.x)*(LANE+.6);n.vx*=-.4;}if(n.z>1.3)n.y-=dt*4;}
    n.pin.g.position.set(n.x,n.y,n.z);n.pin.inner.rotation.set(n.rx,0,n.rz);
  }
  // ---- stars ----
  for(let i=G.stars.length-1;i>=0;i--){const s=G.stars[i];s.t+=dt;s.m.rotation.y=s.t*2.4;s.m.position.y=.75+Math.sin(s.t*3)*.12;
    if(P.hitT<=0&&Math.hypot(P.x-s.x,P.z-s.z)<.62){G.got++;G.score+=30;renderScore();pop('★ +30',s.x,1.4,s.z,'#ffe066');sfx('star');scene.remove(s.m);G.stars.splice(i,1);}}
  // ---- faces ----
  let danger=false;for(const b of G.balls)if(b.alive&&b.wait<=0&&b.z<P.z&&P.z-b.z<9&&Math.abs(b.x-P.x)<b.r+1.1)danger=true;
  P.pin.face.material=P.hitT>0?FACE.hit:danger?FACE.scared:(G.state==='after'&&!G.throwHit)||G.state==='clear'?FACE.happy:FACE.normal;
  for(const n of npcs){let sc=false;if(!n.down)for(const b of G.balls)if(b.alive&&b.wait<=0&&n.z-b.z>0&&n.z-b.z<7&&Math.abs(b.x-n.x)<b.r+.9)sc=true;n.pin.face.material=n.down?FACE.hit:sc?FACE.scared:FACE.normal;}
  // ---- player mesh ----
  const mk=P.pin.g.userData.marker;if(mk){mk.position.y=2.05+Math.sin(performance.now()/200)*.08;mk.rotation.y+=dt*3;}
  const blink=P.inv>0&&Math.floor(P.inv*10)%2===0;P.pin.g.visible=!blink;P.pin.g.position.set(P.x,P.y,P.z);
  if(sayT>0){sayT-=dt;if(sayT<=0)$('#say').classList.remove('on');}
  if(G.shake>0)G.shake-=dt;
}

/* ================= CAMERA / RENDER ================= */
let VW=1,VH=1;
function resize(){const r=$('#wrap').getBoundingClientRect();VW=Math.max(1,r.width);VH=Math.max(1,r.height);renderer.setSize(VW,VH,false);cam.aspect=VW/VH;cam.fov=cam.aspect<.8?70:58;cam.updateProjectionMatrix();}
new ResizeObserver(resize).observe($('#wrap'));resize();
function placeCam(){const port=cam.aspect<.8;G.camX=lerp(G.camX,P.x*(port?.45:.55),.08);const sh=G.shake>0?G.shake*.25:0;
  cam.position.set(G.camX+(Math.random()-.5)*sh,(port?5.6:4.7)+(Math.random()-.5)*sh,clamp(P.z,PZ0,PZ1)+(port?7.4:6.4));
  cam.lookAt(G.camX*.6,0,clamp(P.z,PZ0,PZ1)-11);}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!window.__pk.manual){update(dt);}
  if(G.state==='title'){const t=now/1000;G.camX=0;cam.position.set(Math.sin(t*.25)*2.5,3.2,5.5);cam.lookAt(0,.8,-8);P.pin.g.position.set(P.x,Math.abs(Math.sin(t*3))*.25,P.z);}
  else placeCam();
  renderer.render(scene,cam);requestAnimationFrame(loop);}

/* ================= INPUT ================= */
const keys={};
const KX={ArrowLeft:-1,KeyA:-1,ArrowRight:1,KeyD:1},KZ={ArrowUp:-1,KeyW:-1,ArrowDown:1,KeyS:1};
function syncKeys(){input.kx=0;input.kz=0;for(const k in keys){if(!keys[k])continue;if(KX[k])input.kx+=KX[k];if(KZ[k])input.kz+=KZ[k];}}
addEventListener('keydown',e=>{if(e.code==='Space'){if(!$('#hud').hidden){input.jump=true;$('#btnJump').classList.add('on');}e.preventDefault();return;}if(KX[e.code]||KZ[e.code]){keys[e.code]=true;syncKeys();e.preventDefault();}});
addEventListener('keyup',e=>{if(e.code==='Space'){input.jump=false;$('#btnJump').classList.remove('on');return;}if(keys[e.code]){keys[e.code]=false;syncKeys();}});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;syncKeys();input.jump=false;});
const stick={id:null,ox:0,oy:0};const stEl=$('#stick'),knob=stEl.querySelector('i');
cv.addEventListener('pointerdown',e=>{if($('#hud').hidden||stick.id!==null)return;initAudio();stick.id=e.pointerId;stick.ox=e.clientX;stick.oy=e.clientY;try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const r=$('#wrap').getBoundingClientRect();stEl.style.left=(e.clientX-r.left)+'px';stEl.style.top=(e.clientY-r.top)+'px';stEl.style.display='block';knob.style.transform='';$('#keys').style.display='none';});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==stick.id)return;let dx=e.clientX-stick.ox,dy=e.clientY-stick.oy;const l=Math.hypot(dx,dy),m=48;if(l>m){dx*=m/l;dy*=m/l;}
  knob.style.transform=`translate(${dx}px,${dy}px)`;const dz=8;input.sx=Math.abs(dx)<dz?0:dx/m;input.sz=Math.abs(dy)<dz?0:dy/m;});
const endStick=e=>{if(e.pointerId!==stick.id)return;stick.id=null;input.sx=input.sz=0;stEl.style.display='none';};
cv.addEventListener('pointerup',endStick);cv.addEventListener('pointercancel',endStick);
const jb=$('#btnJump');
jb.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();input.jump=true;jb.classList.add('on');});
const jEnd=()=>{input.jump=false;jb.classList.remove('on');};jb.addEventListener('pointerup',jEnd);jb.addEventListener('pointerleave',jEnd);jb.addEventListener('pointercancel',jEnd);

/* ================= MENUS ================= */
function renderTitle(){$('#diffs').innerHTML=Object.entries(DIFF).map(([k,d])=>`<button class="dc" data-k="${k}" aria-pressed="${k===dk}"><b>${d.name}</b><span>ライフ ${d.lives}<br>${d.desc}</span><i>ハイスコア ${store.get(`pinchi-best-${k}`,0)}</i></button>`).join('');}
$('#diffs').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;dk=b.dataset.k;D=DIFF[dk];store.set('pinchi-diff',dk);renderTitle();});
$('#btnPlay').addEventListener('click',startGame);
$('#btnAgain').addEventListener('click',startGame);
$('#btnHome').addEventListener('click',toTitle);
$('#btnQuit').addEventListener('click',toTitle);
document.addEventListener('visibilitychange',()=>{if(document.hidden)setRoll(0);});
if(!matchMedia('(pointer:fine)').matches)$('#keys').style.display='none';
renderTitle();requestAnimationFrame(loop);
window.__pk={G,P,npcs,get dk(){return dk;},set dk(v){dk=v;D=DIFF[v];},startGame,update,xAt,ai:null,manual:false,seed(s){let a=s>>>0;rnd=()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}};
})();
</script>
