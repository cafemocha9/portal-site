<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>まめカートGP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=RocknRoll+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
/* layout: the race fills the screen; HUD sits in the four corners, touch pad along the bottom. Single daytime theme by choice. */
:root{
  color-scheme: light;
  --sora:#6ec3f0;    /* sky */
  --ink:#1d2433;     /* text, outlines */
  --paper:#fffaf0;   /* panels */
  --aka:#ff5a47;     /* the loud one: start button, alerts */
  --ki:#ffd23f;      /* items, highlights */
  --shiba:#3f9e5a;   /* grass green, positive */
  --dim:rgba(29,36,51,.62);
  --display:"RocknRoll One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--sora);color:var(--ink);font-family:var(--body);font-weight:500;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#game{position:relative;height:100%;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;font-family:var(--display);color:#fff;
  text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),0 4px 0 rgba(29,36,51,.35)}
#hud[hidden]{display:none}
#tl{position:absolute;left:16px;top:12px;display:grid;gap:2px}
#pos{font-size:56px;line-height:1}
#pos small{font-size:22px;margin-left:2px}
#lap{font-size:17px;letter-spacing:.04em}
#bn{font-size:14px;color:var(--ki)}
#tr{position:absolute;right:16px;top:12px;display:grid;justify-items:end;gap:4px}
#time{font-size:20px;font-variant-numeric:tabular-nums}
#spd{font-size:13px;font-variant-numeric:tabular-nums}
#map{width:112px;height:84px;display:block}
#slot{position:absolute;left:50%;top:12px;margin-left:-34px;width:68px;height:68px;border-radius:16px;background:rgba(29,36,51,.55);
  border:3px solid #fff;display:grid;place-items:center;pointer-events:auto;text-shadow:none}
#slot svg{width:44px;height:44px;display:block}
#slot.has{background:var(--paper);border-color:var(--ki);box-shadow:0 0 0 3px var(--ink)}
#slot b{position:absolute;right:-10px;bottom:-10px;min-width:34px;padding:2px 5px;border-radius:999px;background:var(--aka);color:#fff;border:2px solid var(--ink);font-family:var(--display);font-weight:400;font-size:12px;line-height:1.3}
#msg{position:absolute;left:0;right:0;top:27%;text-align:center;font-size:clamp(44px,13vw,96px);line-height:1.1;opacity:0}
#msg.on{opacity:1}
#msg.small{font-size:clamp(26px,7vw,44px);color:var(--ki)}
#msg.warn{font-size:clamp(26px,7vw,44px);color:var(--aka)}

/* touch pad */
#pad{position:absolute;left:0;right:0;bottom:0;padding:0 16px 18px;display:none;justify-content:space-between;align-items:flex-end;pointer-events:none}
.touch #pad{display:flex}
.pb{pointer-events:auto;border-radius:50%;background:rgba(255,250,240,.82);border:3px solid var(--ink);color:var(--ink);
  font-family:var(--display);display:grid;place-items:center;line-height:1.1;text-shadow:none;touch-action:none;white-space:nowrap;padding:0}
.pb.down{background:var(--ki);transform:scale(.94)}
.steer{display:flex;gap:12px}
.steer .pb{width:78px;height:78px;font-size:30px}
.acts{display:grid;grid-template-columns:auto auto;gap:10px;align-items:end;justify-items:end}
#bItem{width:64px;height:64px;font-size:12px;grid-column:2}
#bBrake{width:56px;height:56px;font-size:10.5px}
#bUp,#bDown{width:64px;height:64px;font-size:24px;display:none}
.plane #bUp,.plane #bDown{display:grid}
.plane #bBrake{display:none}
#bDrift{width:88px;height:88px;font-size:16px;background:rgba(255,90,71,.9);color:#fff}
#bDrift.down{background:var(--ki);color:var(--ink)}
#mute{position:absolute;right:16px;bottom:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,250,240,.82);border:2px solid var(--ink);font-size:12px;font-weight:800;color:var(--ink)}
.touch #mute{bottom:auto;top:162px}

/* panels */
.veil{position:absolute;inset:0;display:grid;place-items:center;padding:16px;overflow:auto}
.veil[hidden]{display:none}
.panel{width:min(100%,440px);background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 var(--ink);padding:16px 16px;display:grid;gap:11px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,10vw,46px);line-height:1.05;letter-spacing:.02em}
h1 span{color:var(--aka)}
.sub{font-size:13px;color:var(--dim)}
h2{font-family:var(--display);font-weight:400;font-size:14px;color:var(--dim);margin-bottom:6px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pick button{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:12px;border:2px solid rgba(29,36,51,.18);font-size:13px;font-weight:800;white-space:nowrap}
.pick button[aria-pressed="true"]{border-color:var(--ink);background:var(--ki)}
#crs button{justify-content:center;padding:9px 8px;font-size:14px}
.bean{width:16px;height:22px;border-radius:50%;border:2px solid var(--ink);flex:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{padding:9px 4px;font-weight:800;font-size:14px}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:disabled{opacity:.3;cursor:default}
#crs button small{font-size:10px;font-weight:800;color:var(--aka);margin-left:3px}
.go{background:var(--aka);color:#fff;font-family:var(--display);font-size:22px;padding:14px;border-radius:14px;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.ghost{font-weight:800;padding:12px;border-radius:14px;border:2px solid var(--ink)}
.help{font-size:12px;line-height:1.65;color:var(--dim)}
.help b{color:var(--ink)}
#vinfo{margin-top:8px;display:grid;gap:6px}
#vinfo .st{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;font-weight:800}
#vinfo .st span{white-space:nowrap}
#vinfo .st i{font-style:normal;letter-spacing:-1px;color:var(--aka)}
#vinfo .st i s{text-decoration:none;color:rgba(29,36,51,.18)}
#vinfo p{font-size:12px;line-height:1.55;color:var(--dim)}
details summary{font-weight:800;font-size:14px;cursor:pointer;padding:4px 0}
details .help{margin-top:6px}
ol.res{list-style:none;padding:0;display:grid;gap:4px;font-variant-numeric:tabular-nums}
ol.res li{display:grid;grid-template-columns:2.2em auto 1fr auto;gap:8px;align-items:center;padding:6px 10px;border-radius:10px;font-weight:800;font-size:15px}
ol.res li.me{background:var(--ki)}
ol.res li i{font-family:var(--display);font-style:normal}
ol.res li span:last-child{font-weight:500}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#best{font-size:13px;color:var(--dim)}
#best b{color:var(--aka)}
</style>
</head>
<body>
<main id="game">
  <canvas id="cv"></canvas>

  <div id="hud" hidden>
    <div id="tl"><div id="pos">6<small>位</small></div><div id="lap">LAP 1/3</div><div id="bn">まめ 0/10</div></div>
    <button id="slot" type="button" aria-label="アイテムを使う"></button>
    <div id="tr"><div id="time">0:00.00</div><div id="spd">0 km/h</div><canvas id="map" width="224" height="168" aria-hidden="true"></canvas></div>
    <div id="msg" role="status"></div>
    <div id="pad">
      <div class="steer"><button class="pb" id="bL" type="button" aria-label="左">◀</button><button class="pb" id="bR" type="button" aria-label="右">▶</button></div>
      <div class="acts"><button class="pb" id="bUp" type="button" aria-label="上昇">▲</button><button class="pb" id="bItem" type="button">アイテム</button><button class="pb" id="bDown" type="button" aria-label="下降">▼</button><button class="pb" id="bBrake" type="button">ブレーキ</button><button class="pb" id="bDrift" type="button">ドリフト</button></div>
    </div>
  </div>
  <button id="mute" type="button" aria-pressed="false" aria-label="音の入り切り">音</button>

  <div class="veil" id="title">
    <div class="panel">
      <div><h1>まめ<span>カート</span>GP</h1><p class="sub" id="sub"></p></div>
      <div><h2>コース</h2><div class="pick" id="crs"></div></div>
      <div><h2>ドライバー</h2><div class="pick" id="pick"></div></div>
      <div><h2>のりもの</h2><div class="seg" id="veh"></div><div id="vinfo"></div></div>
      <div><h2>クラス</h2><div class="seg" id="cls"></div></div>
      <button class="go" id="start" type="button">スタート</button>
      <details id="howto"><summary>あそびかた</summary><p class="help" id="help"></p></details>
    </div>
  </div>

  <div class="veil" id="result" hidden>
    <div class="panel">
      <div><h1 id="resT"></h1><p id="best"></p></div>
      <ol class="res" id="resL"></ol>
      <div class="row"><button class="ghost" id="toTitle" type="button">タイトルへ</button><button class="go" id="again" type="button">もう一度</button></div>
    </div>
  </div>
</main>

function locate(k){

  if(Math.abs(k.lat)>WALL){const sg=Math.sign(k.lat),ex=k.lat-sg*WALL;k.x-=NX[best]*ex;k.z-=NZ[best]*ex;k.lat=sg*WALL;

function vert(k,dt){

  if(k.air){k.avy-=gv*dt;k.ay+=k.avy*dt;k.airT+=dt;
    if(k.ay<=k.gy){k.ay=k.gy;k.air=false;
      if(k.airT>.3){k.hopT=.2;for(let n=0;n<7;n++)emit(k.x,k.gy+.3,k.z,(Math.random()-.5)*7,2+Math.random()*2,(Math.random()-.5)*7,.4,'dust',1.2,k.gy+.1);if(k.player)snd.tone(120,.16,'triangle',.2,55);}
      k.airT=0;k.avy=0;}}

}
function stepKart(k,dt){

function collide(){

const mapC=$('map'),mapG=mapC.getContext('2d'),mapBg=document.createElement('canvas');let mapF;
function buildMap(){

  let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;for(let i=0;i<N;i++){x0=Math.min(x0,PX[i]);x1=Math.max(x1,PX[i]);z0=Math.min(z0,PZ[i]);z1=Math.max(z1,PZ[i]);}
  const pad=14,sc=Math.min((mapC.width-pad*2)/(x1-x0),(mapC.height-pad*2)/(z1-z0)),ox=(mapC.width-(x1-x0)*sc)/2,oz=(mapC.height-(z1-z0)*sc)/2;

  g.lineJoin='round';path();g.strokeStyle='#1d2433';g.lineWidth=11;g.stroke();path();g.strokeStyle='#fffaf0';g.lineWidth=6;g.stroke();

let portrait=false,camY=0;
function resize(){

function chase(dt){
  const p=player;camH+=wrap(p.h+p.drift*.22-camH)*Math.min(1,dt*4.6);
  const dist=portrait?10.5:8.6,hgt=portrait?5.4:4.1,c=Math.cos(camH),s=Math.sin(camH);
  camY+=(p.gy+p.y-camY)*Math.min(1,dt*5);const cx=p.x-c*dist,cz=p.z-s*dist;camera.position.set(cx,Math.max(hgt+camY,hAt(cx,cz)+2),cz);camera.lookAt(p.x+c*7,(portrait?2.6:1.6)+camY,p.z+s*7);

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.04,(now-last)/1000);last=now;clock+=dt;
  if(state==='count'){
    countT-=dt;const n=Math.ceil(countT/1.1);
    if(n!==lastCount&&n>0){lastCount=n;say(String(n),1,'');snd.tone(440,.18,'square',.12);}
    if(countT<=0){state='race';say('GO!',.9,'');snd.tone(880,.5,'square',.13);
      const early=clock-inp.driftAt;if(inp.drift&&early<1.0&&early>.05){player.boostT=1.3;snd.tone(240,.5,'sawtooth',.14,1000);}
      karts.forEach(k=>{if(!k.player&&Math.random()<.35)k.boostT=.8;});}
  }
  if(state==='race'||state==='finish')raceT+=dt;
  if(state!=='title'){
    for(const k of karts)stepKart(k,dt);
    collide();ranks();stepItems(dt,clock);
    for(const k of karts){pose(k,dt);trail(k,dt);}
    if(state==='race'){
      const p=player,dot=Math.cos(p.h)*TX[p.idx]+Math.sin(p.h)*TZ[p.idx];
      wrongT=(dot<-.35&&p.v>4)?wrongT+dt:0;if(wrongT>1&&msgT<=0)say('逆走',.6,'warn');
    }
    if(state==='finish'&&resultT>0){resultT-=dt;if(resultT<=0)showResult();}
    snd.engine(player.v,$('result').hidden);
    chase(dt);hud(dt);
  }else{
    for(const b of boxes)b.g.position.y=b.by+Math.sin(clock*2.2+b.ph)*.2;
    orbit();

  renderer.render(scene,camera);

  if(d&&d.pick>=0&&d.pick<RACERS.length)pick=d.pick;if(d&&d.cls>=0&&d.cls<CLASSES.length)cls=d.cls;if(d&&d.veh>=0&&d.veh<VEH.length)veh=d.veh;if(d&&d.course>=0&&d.course<COURSES.length)course=d.course;
  if(COURSES[course].only!=null)veh=COURSES[course].only;resize();buildCourse(course);menu();MAX=CLASSES[cls].max;buildKarts();grid();requestAnimationFrame(frame);
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>({pick,cls,veh,course}));
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
