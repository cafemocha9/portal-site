<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>すみまる絵巻</title>
<style>
  :root { --paper:#f3ead7; --ink:#1f1c1a; --shu:#c8372d; --wash:#8d8778; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:var(--paper); color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:none; }
  canvas { position:fixed; inset:0; display:block; }
  button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; touch-action:manipulation; }
  .screen { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:18px; overflow-y:auto; z-index:5; background:rgba(243,234,215,.92); }
  .screen.on { display:flex; }
  .panel { width:min(460px,100%); margin:auto; text-align:center; }
  h1 { font-size:clamp(38px,11vw,56px); font-weight:900; letter-spacing:.14em; }
  h1 span { display:inline-block; background:var(--shu); color:var(--paper); font-size:.42em; padding:.25em .3em; margin-left:.3em; vertical-align:middle; border-radius:4px; letter-spacing:0; writing-mode:vertical-rl; }
  .lead { margin:8px 0 18px; color:#5d574c; font-size:14px; line-height:1.8; }
  .stages { display:grid; gap:10px; }
  .st { display:flex; align-items:center; gap:14px; width:100%; padding:12px 14px; text-align:left; background:#fffaf0; border:2px solid var(--ink); border-radius:6px; box-shadow:4px 4px 0 rgba(31,28,26,.85); }
  .st:active { transform:translate(2px,2px); box-shadow:2px 2px 0 rgba(31,28,26,.85); }
  .st .no { width:44px; height:44px; flex:none; display:grid; place-items:center; background:var(--ink); color:var(--paper); font-size:22px; font-weight:900; border-radius:50%; }
  .st b { display:block; font-size:19px; }
  .st small { font-size:12px; color:#5d574c; }
  .st .best { margin-left:auto; font-size:12px; text-align:right; color:#5d574c; white-space:nowrap; }
  .st .best em { font-style:normal; color:var(--shu); font-weight:900; font-size:15px; }
  .how { margin-top:16px; font-size:13px; line-height:1.9; color:#3d3932; text-align:left; background:rgba(31,28,26,.06); padding:12px 14px; border-radius:6px; }
  .how b { color:var(--shu); }
  .big { font-size:34px; font-weight:900; letter-spacing:.1em; }
  .res { margin:12px 0 4px; font-size:16px; line-height:2; }
  .res em { font-style:normal; font-weight:900; color:var(--shu); font-size:20px; }
  .btns { display:grid; gap:8px; margin-top:14px; }
  .btn { padding:13px; font-weight:900; font-size:17px; border:2px solid var(--ink); border-radius:6px; background:#fffaf0; }
  .btn.main { background:var(--shu); color:var(--paper); border-color:var(--shu); }

  #quit, #snd { position:fixed; top:max(8px,env(safe-area-inset-top)); z-index:4; width:40px; height:40px; border-radius:50%; background:rgba(31,28,26,.12); font-size:18px; font-weight:900; display:none; }
  #quit { right:10px; } #snd { right:58px; font-size:13px; }
  .play #quit, .play #snd { display:block; }
  /* タッチ用の操作ボタン */
  #pad { position:fixed; left:0; right:0; bottom:0; height:132px; z-index:3; display:none; pointer-events:none; padding-bottom:env(safe-area-inset-bottom); }
  .play.touch #pad { display:block; }
  .pb { position:absolute; bottom:18px; width:74px; height:74px; border-radius:50%; background:rgba(243,234,215,.82); border:2.5px solid #1f1c1a; box-shadow:0 2px 6px rgba(0,0,0,.35); pointer-events:auto; display:grid; place-items:center; font-weight:900; font-size:15px; }
  .pb.on { background:#b9b09a; transform:scale(.94); }
  .pb svg { width:30px; height:30px; }
  #bI.on, #bJ.on { filter:brightness(1.35); }
  #bL { left:14px; } #bR { left:100px; } #bI { right:104px; bottom:10px; background:#1f1c1a; color:var(--paper); border-color:var(--paper); } #bJ { right:14px; bottom:34px; width:84px; height:84px; background:var(--shu); color:var(--paper); border-color:var(--paper); }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="snd" type="button" aria-label="音の切り替え">音</button>
<button id="quit" type="button" aria-label="やめる">×</button>
<div id="pad">
  <button class="pb" id="bL" type="button" aria-label="ひだり"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
  <button class="pb" id="bR" type="button" aria-label="みぎ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
  <button class="pb" id="bI" type="button">すみ</button>
  <button class="pb" id="bJ" type="button">ジャンプ</button>
</div>

<section class="screen on" id="s-menu"><div class="panel">
  <h1>すみまる<span>絵巻</span></h1>
  <p class="lead">墨のしずく「すみまる」が、絵巻物のなかを かけぬける。<br>道がなければ、墨でえがけばいい。</p>
  <div class="stages" id="stages"></div>
  <div class="how">
    <b>うごく</b>：← →（PCは 矢印キー／A・D）<br>
    <b>ジャンプ</b>：ジャンプボタン（スペース／↑）。長くおすと高くとぶ<br>
    <b>すみ</b>：空中でおすと、足もとに墨の足場をえがく（X／Shift）。<br>　3回まで。地面におりると元にもどる<br>
    敵は上から<b>ふんづける</b>。朱印をあつめて、巻物のおわりをめざそう
  </div>
</div></section>

<section class="screen" id="s-clear"><div class="panel">
  <div class="big" id="c-title"></div>
  <div class="res" id="c-res"></div>
  <div class="btns">
    <button class="btn main" id="b-next" type="button">つぎの巻へ</button>
    <button class="btn" id="b-retry" type="button">もう一度</button>
    <button class="btn" id="b-menu" type="button">巻をえらぶ</button>
  </div>
</div></section>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('sumimaru:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('sumimaru:' + k, JSON.stringify(v)); } catch {} },
};

/* ============================== ステージ ============================== */
const TS = 32, ROWS = 14, VH = ROWS * TS;
/* g:地面 up/dn:段差 gap:谷
   coins:[はじめ,数,高さ] / true（谷は弧をえがく）  en:にじみ  sp:いばら  cr:[位置,高さ] からす
   pl:[位置,高さ,幅] 足場  lan:灯ろう  hint:[位置,文] */
const STAGES = [
  { name: '竹林のみち', sub: 'はじめの巻', theme: 'bamboo', def: [
    ['g', 10, { hint: [3, 'みぎへ すすもう'] }],
    ['g', 8, { coins: [1, 5, 1] }],
    ['up', 1], ['g', 5, { hint: [-3, 'ジャンプで のぼる'] }], ['up', 1], ['g', 5, { coins: [1, 3, 1] }], ['dn', 2],
    ['g', 7, { hint: [3, 'あなに きをつけて'] }], ['gap', 2, { coins: true }],
    ['g', 9, { en: [6], hint: [1, 'てきは ふんづける'] }],
    ['gap', 3, { coins: true }], ['g', 8, { lan: 2, coins: [4, 3, 1] }],
    ['g', 7, { hint: [1, 'くうちゅうで「すみ」！'] }], ['gap', 6, { coins: true }],
    ['g', 9, { en: [6] }], ['up', 2], ['g', 5, { coins: [1, 3, 1] }], ['gap', 3, { coins: true }],
    ['g', 7, { sp: [4], hint: [0, 'いばらは とびこえる'] }], ['dn', 2],
    ['g', 9, { lan: 2, en: [7] }], ['gap', 7, { coins: true }],
    ['g', 7, { pl: [[2, 3, 3]], coins: [2, 3, 4] }], ['gap', 2], ['g', 7, { en: [4] }], ['goal'] ] },
  { name: '山のいただき', sub: 'なかの巻', theme: 'mountain', def: [
    ['g', 8], ['up', 2], ['g', 4, { coins: [1, 2, 1] }], ['up', 2], ['g', 5, { en: [3] }], ['up', 1],
    ['g', 6, { sp: [3], coins: [2, 3, 3] }], ['gap', 3, { coins: true }],
    ['g', 6, { cr: [[3, 3]] }], ['dn', 2], ['g', 5, { lan: 2 }], ['gap', 6, { coins: true }],
    ['g', 7, { en: [3, 5] }], ['dn', 2], ['g', 5, { sp: [2, 3] }], ['gap', 3],
    ['g', 5, { pl: [[1, 3, 3]], coins: [1, 3, 4] }], ['up', 2], ['g', 6, { cr: [[3, 2]] }],
    ['gap', 8, { coins: true }], ['g', 7, { lan: 2, en: [5] }], ['dn', 2],
    ['g', 5, { sp: [3] }], ['gap', 4, { coins: true }], ['g', 5, { en: [3] }], ['up', 2],
    ['g', 5, { coins: [1, 3, 1] }], ['gap', 12, { coins: true, cr: [[6, 4]] }],
    ['g', 7, { lan: 2 }], ['dn', 2], ['g', 4], ['up', 2], ['g', 5, { en: [3] }], ['gap', 3, { coins: true }],
    ['g', 6, { sp: [2, 4] }], ['up', 2], ['g', 6, { cr: [[3, 3]] }], ['goal'] ] },
  { name: 'なみのうえ', sub: 'おわりの巻', theme: 'sea', def: [
    ['g', 8], ['gap', 3, { coins: true }], ['g', 4, { en: [2] }], ['gap', 6, { coins: true }],
    ['g', 4, { coins: [1, 2, 1] }], ['gap', 4, { coins: true, cr: [[2, 4]] }], ['g', 5, { sp: [2] }],
    ['gap', 7, { coins: true }], ['g', 6, { lan: 2 }], ['up', 2], ['g', 3], ['gap', 10, { coins: true }],
    ['g', 4, { en: [2] }], ['gap', 3], ['g', 3, { pl: [[0, 3, 3]], coins: [0, 3, 4] }], ['gap', 6, { coins: true, cr: [[3, 3]] }],
    ['g', 5, { sp: [2, 3] }], ['dn', 2], ['g', 6, { lan: 2, en: [4] }], ['gap', 12, { coins: true, cr: [[4, 4], [9, 3]] }],
    ['g', 4, { coins: [1, 2, 1] }], ['gap', 4, { coins: true }], ['g', 4, { en: [2] }], ['up', 2], ['g', 4, { sp: [2] }],
    ['gap', 8, { coins: true }], ['g', 6, { lan: 2 }], ['gap', 5, { coins: true, cr: [[2, 3]] }], ['g', 3], ['gap', 14, { coins: true }],
    ['g', 5, { en: [3] }], ['gap', 3, { coins: true }], ['g', 6], ['goal'] ] },
];

function buildStage(idx) {
  const st = STAGES[idx], cols = [];  // cols[x] = {h: 地面の高さ(0=なし)}
  const L = { idx, st, grid: [], W: 0, coins: [], enemies: [], lanterns: [], hints: [], goal: null, plats: [] };
  let x = 0, h = 3;
  const cell = [];  // 追加タイル {x,y,v}
  const topRow = (hh) => ROWS - hh;
  for (const [op, n, o = {}] of st.def) {
    if (op === 'up') { h += n; if (h > 8) throw new Error('too high'); continue; }
    if (op === 'dn') { h -= n; continue; }
    if (op === 'goal') { for (let i = 0; i < 9; i++) cols.push(h); L.goal = { x: (x + 5) * TS, y: topRow(h) * TS }; x += 9; continue; }
    const base = topRow(h);
    for (let i = 0; i < n; i++) cols.push(op === 'g' ? h : 0);
    if (o.coins === true) for (let i = 0; i < n; i++) L.coins.push({ x: (x + i + .5) * TS, y: (base - 1.6 - Math.sin(Math.PI * (i + .5) / n) * (n <= 4 ? 1.4 : .8)) * TS, got: false });
    else if (o.coins) for (let i = 0; i < o.coins[1]; i++) L.coins.push({ x: (x + o.coins[0] + i + .5) * TS, y: (base - o.coins[2] + .4) * TS, got: false });
    for (const e of o.en || []) L.enemies.push({ type: 'blot', x: (x + e) * TS + 4, y: base * TS - 22, w: 24, h: 22, vx: -48, alive: true, t: 0 });
    for (const [e, up] of o.cr || []) L.enemies.push({ type: 'crow', x: (x + e) * TS, y: (base - up) * TS, w: 26, h: 18, x0: (x + e) * TS, y0: (base - up) * TS, alive: true, t: Math.random() * 6 });
    for (const s of o.sp || []) cell.push({ x: x + s, y: base - 1, v: 3 });
    for (const [px, up, w] of o.pl || []) for (let i = 0; i < w; i++) cell.push({ x: x + px + i, y: base - up, v: 2 });
    if (o.lan != null) L.lanterns.push({ x: (x + o.lan + .5) * TS, y: base * TS, on: false });
    if (o.hint) L.hints.push({ x: (x + o.hint[0] + .5) * TS, y: base * TS, text: o.hint[1] });
    x += n;
  }
  L.W = cols.length; L.cols = cols;
  for (let r = 0; r < ROWS; r++) { const row = new Uint8Array(L.W); for (let c = 0; c < L.W; c++) row[c] = cols[c] && r >= ROWS - cols[c] ? 1 : 0; L.grid.push(row); }
  for (const c of cell) if (c.y >= 0 && c.y < ROWS && c.x < L.W) L.grid[c.y][c.x] = c.v;
  L.start = { x: 2 * TS, y: (ROWS - cols[2]) * TS - 28 };
  return L;
}

/* ============================== 物理 ============================== */
const RUN = 190, JUMP = 640, GRAV = 1800, INK_MAX = 3, INK_LIFE = 3.5, DT = 1 / 120;
const input = { left: false, right: false, jump: false, ink: false };
let S = null;
function tileAt(tx, ty) { if (tx < 0) return 1; if (!S || tx >= S.L.W || ty < 0 || ty >= ROWS) return 0; return S.L.grid[ty][tx]; }
function newPlayer(at) { return { x: at.x, y: at.y, w: 22, h: 28, vx: 0, vy: 0, dir: 1, ground: false, coyote: 0, buf: 0, inks: INK_MAX, hp: 3, inv: 0, squash: 0 }; }
function startStage(idx) {
  const L = buildStage(idx);
  S = { L, p: newPlayer(L.start), check: L.start, time: 0, misses: 0, got: 0, inkPlats: [], fx: [], prev: { jump: false, ink: false }, clear: false, camX: 0, shake: 0 };
  $('s-menu').classList.remove('on'); $('s-clear').classList.remove('on'); document.body.classList.add('play');
}
function respawn() {
  S.misses++; S.p = newPlayer(S.check); S.inkPlats = []; sfx('miss');
  for (const e of S.L.enemies) if (e.type === 'blot' && !e.alive && e.x > S.check.x) { /* たおした敵はそのまま */ }
}
function hurt() {
  const p = S.p; if (p.inv > 0) return;
  p.hp--; p.inv = 1.3; p.vy = -380; p.vx = -p.dir * 160; S.shake = .25; sfx('hurt');
  if (p.hp <= 0) respawn();
}
function burst(x, y, n, col) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = 40 + Math.random() * 120; S.fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, t: 0, life: .45 + Math.random() * .3, r: 2 + Math.random() * 4, col }); } }

function step(dt) {
  if (!S || S.clear) return;
  const p = S.p, L = S.L;
  S.time += dt;
  const jumpPressed = input.jump && !S.prev.jump, inkPressed = input.ink && !S.prev.ink;
  S.prev.jump = input.jump; S.prev.ink = input.ink;

  /* 横移動 */
  const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  if (dir) p.dir = dir;
  const acc = p.ground ? 2200 : 1500, target = dir * RUN;
  if (p.inv < 1.0) { if (p.vx < target) p.vx = Math.min(target, p.vx + acc * dt); else if (p.vx > target) p.vx = Math.max(target, p.vx - acc * dt); }

  /* ジャンプ（ふみきり後すこしの間と、着地のすこし前の入力もうけつける） */
  p.coyote = p.ground ? .1 : p.coyote - dt;
  p.buf = jumpPressed ? .12 : p.buf - dt;
  if (p.buf > 0 && p.coyote > 0) { p.vy = -JUMP; p.ground = false; p.coyote = 0; p.buf = 0; p.squash = -.25; sfx('jump'); }
  if (!input.jump && p.vy < -260) p.vy = -260;

  /* すみの足場 */
  if (inkPressed && !p.ground && p.inks > 0) {
    p.inks--; S.inkPlats.push({ x: p.x + p.w / 2 - 48, y: p.y + p.h + 3, w: 96, t: INK_LIFE });
    if (p.vy < 0) p.vy *= .4;
    burst(p.x + p.w / 2, p.y + p.h + 4, 8, '#1f1c1a'); sfx('ink');
  }
  for (const k of S.inkPlats) k.t -= dt;
  S.inkPlats = S.inkPlats.filter((k) => k.t > 0);

  p.vy = Math.min(900, p.vy + GRAV * dt);

  /* 横のあたり */
  p.x += p.vx * dt;
  if (p.x < 0) { p.x = 0; p.vx = 0; }
  {
    const r0 = Math.floor(p.y / TS), r1 = Math.floor((p.y + p.h - 1) / TS);
    if (p.vx > 0) { const tx = Math.floor((p.x + p.w) / TS); for (let r = r0; r <= r1; r++) if (tileAt(tx, r) === 1) { p.x = tx * TS - p.w - .01; p.vx = 0; break; } }
    else if (p.vx < 0) { const tx = Math.floor(p.x / TS); for (let r = r0; r <= r1; r++) if (tileAt(tx, r) === 1) { p.x = (tx + 1) * TS + .01; p.vx = 0; break; } }
  }
  /* 縦のあたり */
  const prevBottom = p.y + p.h; p.y += p.vy * dt;
  const wasGround = p.ground; p.ground = false; let real = false;
  const c0 = Math.floor((p.x + 1) / TS), c1 = Math.floor((p.x + p.w - 1) / TS);
  if (p.vy >= 0) {
    const ty = Math.floor((p.y + p.h) / TS);
    for (let c = c0; c <= c1; c++) { const v = tileAt(c, ty); if ((v === 1 || v === 2) && prevBottom <= ty * TS + 1) { p.y = ty * TS - p.h; p.vy = 0; p.ground = true; real = true; break; } }
    if (!p.ground) for (const k of S.inkPlats) if (p.x + p.w > k.x && p.x < k.x + k.w && prevBottom <= k.y + 1 && p.y + p.h >= k.y) { p.y = k.y - p.h; p.vy = 0; p.ground = true; break; }
  } else {
    const ty = Math.floor(p.y / TS);
    for (let c = c0; c <= c1; c++) if (tileAt(c, ty) === 1) { p.y = (ty + 1) * TS; p.vy = 0; break; }
  }
  if (p.ground && !wasGround) p.squash = .3;
  if (real) p.inks = INK_MAX;
  p.squash *= Math.pow(.001, dt);
  if (p.inv > 0) p.inv -= dt;

  /* いばら・落下 */
  for (let c = c0; c <= c1; c++) for (let r = Math.floor((p.y + 8) / TS); r <= Math.floor((p.y + p.h - 1) / TS); r++) if (tileAt(c, r) === 3 && p.y + p.h > r * TS + 12) hurt();
  if (p.y > VH + 60) { respawn(); return; }

  /* 敵 */
  for (const e of L.enemies) {
    if (!e.alive) continue; e.t += dt;
    if (e.type === 'blot') {
      if (Math.abs(e.x - p.x) > 700) continue;
      const nx = e.x + e.vx * dt, front = Math.floor((nx + (e.vx > 0 ? e.w : 0)) / TS), foot = Math.floor((e.y + e.h + 2) / TS), body = Math.floor((e.y + e.h - 2) / TS);
      if (tileAt(front, body) === 1 || tileAt(front, body) === 3 || tileAt(front, foot) !== 1) e.vx = -e.vx; else e.x = nx;
    } else { e.x = e.x0 + Math.sin(e.t * .9) * 70; e.y = e.y0 + Math.sin(e.t * 2.3) * 14; }
    if (p.x < e.x + e.w && p.x + p.w > e.x && p.y < e.y + e.h && p.y + p.h > e.y) {
      if (p.vy > 60 && prevBottom <= e.y + 12) { e.alive = false; p.vy = input.jump ? -JUMP : -420; burst(e.x + e.w / 2, e.y + e.h / 2, 14, e.type === 'crow' ? '#1f1c1a' : '#6e685c'); sfx('stomp'); }
      else hurt();
      if (S.p !== p) return;
    }
  }
  /* 朱印・灯ろう・ゴール */
  const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
  for (const c of L.coins) if (!c.got && Math.abs(c.x - cx) < 20 && Math.abs(c.y - cy) < 24) { c.got = true; S.got++; burst(c.x, c.y, 6, '#c8372d'); sfx('coin'); }
  for (const l of L.lanterns) if (!l.on && cx > l.x - 6 && Math.abs(l.y - (p.y + p.h)) < 80) { l.on = true; S.check = { x: l.x - 11, y: l.y - 28 }; p.hp = 3; burst(l.x, l.y - 44, 12, '#c8372d'); sfx('lantern'); }
  if (cx > L.goal.x - 8 && cx < L.goal.x + 60 && p.y + p.h > L.goal.y - 120) finish();

  for (const f of S.fx) { f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 500 * dt; }
  S.fx = S.fx.filter((f) => f.t < f.life);
  if (S.shake > 0) S.shake -= dt;
}
function finish() {
  S.clear = true; sfx('clear');
  const L = S.L, total = L.coins.length, key = 'best:' + L.idx, prev = store.get(key, null);
  const rec = { time: Math.round(S.time * 10) / 10, coins: S.got, total, misses: S.misses };
