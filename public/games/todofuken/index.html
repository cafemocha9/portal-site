<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>都道府県クイズ</title>
<style>
  :root { --bg:#eef4f1; --card:#fff; --ink:#1f2a37; --sub:#6b7280; --line:#d9e2dd; --main:#1c8a6a; --main-d:#136a51; --ok:#1f9d55; --ng:#e0453a; --gold:#f2b631; --land:#cfdcd5; --hit:#e4572e; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif; -webkit-user-select:none; user-select:none; overflow-x:hidden; }
  button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; touch-action:manipulation; }
  .screen { display:none; min-height:100%; padding:16px 16px 28px; max-width:640px; margin:0 auto; }
  .screen.on { display:block; }
  h1 { text-align:center; font-size:clamp(28px,8vw,38px); font-weight:900; letter-spacing:.05em; padding-top:6px; }
  .lead { text-align:center; color:var(--sub); font-size:14px; margin-top:4px; }
  .sec { font-size:13px; font-weight:800; color:var(--sub); margin:18px 4px 8px; }
  .modes { display:grid; gap:10px; }
  .md { display:flex; align-items:center; gap:12px; width:100%; padding:12px 14px; border-radius:16px; background:var(--card); box-shadow:0 3px 0 var(--line); text-align:left; border:3px solid transparent; }
  .md[aria-pressed="true"] { border-color:var(--main); }
  .md .ic { width:46px; height:46px; border-radius:12px; display:grid; place-items:center; color:#fff; font-weight:900; font-size:20px; flex:none; }
  .md b { display:block; font-size:17px; } .md span { font-size:12px; color:var(--sub); }
  .md .best { margin-left:auto; font-size:12px; font-weight:800; color:var(--sub); white-space:nowrap; text-align:right; }
  .md .best em { font-style:normal; display:block; font-size:15px; color:var(--ink); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chips button { padding:9px 13px; border-radius:99px; background:var(--card); box-shadow:0 2px 0 var(--line); font-weight:800; font-size:14px; }
  .chips button[aria-pressed="true"] { background:var(--main); color:#fff; }
  .wide { width:100%; display:flex; align-items:center; justify-content:center; gap:8px; padding:14px; border-radius:16px; font-weight:900; font-size:17px; margin-top:10px; }
  .wide.main { background:var(--main); color:#fff; box-shadow:0 4px 0 var(--main-d); margin-top:20px; }
  .wide.sub { background:var(--card); box-shadow:0 3px 0 var(--line); }
  .wide:active { transform:translateY(2px); }
  .credit { margin-top:18px; font-size:11px; color:var(--sub); text-align:center; line-height:1.6; }

  .qtop { display:flex; align-items:center; gap:10px; }
  .icon-btn { width:42px; height:42px; border-radius:12px; background:var(--card); box-shadow:0 2px 0 var(--line); display:grid; place-items:center; font-size:20px; font-weight:900; flex:none; }
  .qprog { flex:1; } .qprog .row { display:flex; justify-content:space-between; font-size:13px; font-weight:800; color:var(--sub); } .qprog .row b { color:var(--ink); }
  .bar { height:10px; border-radius:99px; background:#dfe7e3; margin-top:6px; overflow:hidden; } .bar i { display:block; height:100%; border-radius:99px; background:var(--main); }
  .mapbox { margin:14px auto 0; width:min(100%,440px); aspect-ratio:1/1; border-radius:16px; background:#f7fbff; box-shadow:0 4px 0 var(--line); position:relative; overflow:hidden; }
  .mapbox svg.big { position:absolute; inset:0; width:100%; height:100%; }
  .mapbox path { fill:var(--land); stroke:#fff; stroke-width:.6; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
  .mapbox path.t { fill:var(--hit); }
  .mapbox path.o { fill:var(--ok); }
  .mapbox.shape path { display:none; } .mapbox.shape path.t, .mapbox.shape path.o { display:block; stroke:none; }
  .mini { position:absolute; right:8px; bottom:8px; width:30%; aspect-ratio:438/516; background:rgba(255,255,255,.9); border-radius:8px; box-shadow:0 0 0 1.5px var(--line); }
  .mini svg { width:100%; height:100%; } .mini path { stroke:none; fill:#b8c7bf; } .mini rect { fill:rgba(228,87,46,.18); stroke:var(--hit); stroke-width:4; }
  .mapbox.shape .mini { display:none; }
  .ask { text-align:center; font-weight:900; font-size:18px; margin:14px 0 10px; min-height:1.4em; }
  .ask small { display:block; font-size:12px; color:var(--sub); font-weight:700; }
  .choices { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .ch { min-height:60px; padding:8px 10px; border-radius:14px; background:var(--card); box-shadow:0 3px 0 var(--line); font-weight:900; font-size:19px; line-height:1.2; text-align:center; }
  .ch small { display:block; font-size:11px; font-weight:700; color:var(--sub); letter-spacing:.05em; }
  .ch:active { transform:translateY(2px); }
  .ch.ok { background:var(--ok); color:#fff; box-shadow:0 3px 0 #157a40; } .ch.ng { background:var(--ng); color:#fff; box-shadow:0 3px 0 #b23128; }
  .ch.ok small, .ch.ng small { color:rgba(255,255,255,.85); } .ch.dim { opacity:.45; }
  .feedback { min-height:60px; margin-top:12px; display:flex; align-items:center; gap:10px; }
  .feedback .msg { flex:1; font-weight:900; font-size:15px; line-height:1.5; } .feedback .msg small { display:block; font-size:12px; color:var(--sub); font-weight:700; }
  .msg.ok { color:var(--ok); } .msg.ng { color:var(--ng); }
  .next { display:none; padding:12px 18px; border-radius:14px; background:var(--main); color:#fff; font-weight:900; box-shadow:0 3px 0 var(--main-d); white-space:nowrap; } .next.on { display:block; }

  .result { text-align:center; padding-top:10px; }
  .result .big { font-size:clamp(40px,12vw,56px); font-weight:900; } .result .big small { font-size:.4em; color:var(--sub); }
  .stars { display:flex; justify-content:center; gap:6px; margin-top:6px; } .stars svg { width:40px; height:40px; fill:#d5ddd9; } .stars svg.on { fill:var(--gold); }
  .result .msg { font-weight:800; margin-top:8px; }
  .rec { display:inline-block; margin-top:8px; padding:4px 12px; border-radius:99px; background:var(--gold); color:#fff; font-weight:900; font-size:13px; }
  .miss { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; }
  .miss div { background:var(--card); border-radius:12px; padding:8px 10px; box-shadow:0 2px 0 var(--line); font-weight:900; font-size:15px; } .miss small { display:block; font-size:11px; color:var(--sub); font-weight:700; }
</style>
</head>

  ['hyogo','兵庫県','ひょうごけん','神戸市','こうべし','kk'],['nara','奈良県','ならけん','奈良市','ならし','kk'],['wakayama','和歌山県','わかやまけん','和歌山市','わかやまし','kk'],
  ['tottori','鳥取県','とっとりけん','鳥取市','とっとりし','cs'],['shimane','島根県','しまねけん','松江市','まつえし','cs'],['okayama','岡山県','おかやまけん','岡山市','おかやまし','cs'],['hiroshima','広島県','ひろしまけん','広島市','ひろしまし','cs'],['yamaguchi','山口県','やまぐちけん','山口市','やまぐちし','cs'],
  ['tokushima','徳島県','とくしまけん','徳島市','とくしまし','cs'],['kagawa','香川県','かがわけん','高松市','たかまつし','cs'],['ehime','愛媛県','えひめけん','松山市','まつやまし','cs'],['kochi','高知県','こうちけん','高知市','こうちし','cs'],
  ['fukuoka','福岡県','ふくおかけん','福岡市','ふくおかし','ko'],['saga','佐賀県','さがけん','佐賀市','さがし','ko'],['nagasaki','長崎県','ながさきけん','長崎市','ながさきし','ko'],['kumamoto','熊本県','くまもとけん','熊本市','くまもとし','ko'],
  ['oita','大分県','おおいたけん','大分市','おおいたし','ko'],['miyazaki','宮崎県','みやざきけん','宮崎市','みやざきし','ko'],['kagoshima','鹿児島県','かごしまけん','鹿児島市','かごしまし','ko'],['okinawa','沖縄県','おきなわけん','那覇市','なはし','ko'],
];
const REGION = { ht: '北海道・東北', kt: '関東', cb: '中部', kk: '近畿', cs: '中国・四国', ko: '九州・沖縄' };
const ALL = DATA.map(([id, n, y, cap, capY, r]) => ({ id, n, y, cap, capY, r }));
const BY = Object.fromEntries(ALL.map((x) => [x.id, x]));
const MODES = [
  { id: 'place', name: 'ばしょクイズ', desc: '地図で赤くなった所は どこ？', col: '#1c8a6a', mark: '地' },
  { id: 'shape', name: 'かたちクイズ', desc: '形だけを見て あてよう', col: '#7a5af0', mark: '形' },
  { id: 'cap', name: '県庁所在地クイズ', desc: '県庁のある市を えらぼう', col: '#e48a2a', mark: '庁' },
];
const $ = (id) => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem('todofuken:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('todofuken:' + k, JSON.stringify(v)); } catch {} } };
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const opt = { mode: store.get('mode', 'place'), range: store.get('range', 'all'), count: store.get('count', 10) };

/* ---------- 地図 ---------- */
const NS = 'http://www.w3.org/2000/svg', map = $('map'), paths = {}, bbox = {};
for (const x of ALL) { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', MAP[x.id]); p.dataset.id = x.id; map.appendChild(p); paths[x.id] = p;
  const m = document.createElementNS(NS, 'path'); m.setAttribute('d', MAP[x.id]); $('mini').appendChild(m); }
const miniRect = document.createElementNS(NS, 'rect'); $('mini').appendChild(miniRect);
function measure() { if (bbox.done) return; map.setAttribute('viewBox', '0 0 438 516'); for (const x of ALL) bbox[x.id] = paths[x.id].getBBox(); bbox.done = true; }
function union(ids) { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const id of ids) { const b = bbox[id]; x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.width); y1 = Math.max(y1, b.y + b.height); } return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 }; }
function square(b, pad) { const s = Math.max(b.w, b.h) * (1 + pad), cx = b.x + b.w / 2, cy = b.y + b.h / 2; return { x: cx - s / 2, y: cy - s / 2, w: s, h: s }; }
/* ばしょ：その地方が大きく見えるように寄せ、右下の小さい日本地図に見ている場所を出す。かたち：その県だけ */
function showMap(x, mode) {
  measure();
  for (const id in paths) paths[id].setAttribute('class', id === x.id ? 't' : '');
  $('mapbox').classList.toggle('shape', mode === 'shape');
  let v;
  if (mode === 'shape') v = square(union([x.id]), .25);
  else {
    // 北海道・沖縄は広く離れているので、その県のまわりだけを見せる
    const near = ALL.filter((o) => o.r === x.r && !(x.r === 'ht' && (o.id === 'hokkaido') !== (x.id === 'hokkaido')) && !(x.r === 'ko' && (o.id === 'okinawa') !== (x.id === 'okinawa'))).map((o) => o.id);
    v = square(union(near), x.id === 'okinawa' ? 1.2 : .18);
  }
  map.setAttribute('viewBox', `${v.x} ${v.y} ${v.w} ${v.h}`);
  miniRect.setAttribute('x', v.x); miniRect.setAttribute('y', v.y); miniRect.setAttribute('width', v.w); miniRect.setAttribute('height', v.h);
}

/* ---------- 音 ---------- */
let ac = null;
function sfx(kind) {
  try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state !== 'running') ac.resume(); } catch { return; }
  const seq = { ok: [[880, .16], [1318, .28]], ng: [[220, .26], [196, .28]], end: [[523, .3], [659, .3], [784, .3], [1047, .4]] }[kind]; let t = ac.currentTime + .01;
  for (const [f, d] of seq) { const o = ac.createOscillator(), g = ac.createGain(); o.type = kind === 'ng' ? 'triangle' : 'sine'; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.16, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .05); t += .1; }
}

/* ---------- メニュー ---------- */
const STAR = '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.900 3.100 1.200-6.500L2.500 9.400l6.600-.900z"/></svg>';
const stars = (s, t) => { const r = t ? s / t : 0; return r >= .9 ? 3 : r >= .7 ? 2 : r >= .4 ? 1 : 0; };
const starHtml = (n) => [0, 1, 2].map((i) => STAR.replace('<svg', `<svg class="${i < n ? 'on' : ''}"`)).join('');
const poolOf = (range) => (range === 'all' ? ALL : ALL.filter((x) => x.r === range));
function show(id) { document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('on', s.id === id)); window.scrollTo(0, 0); }
function renderMenu() {
  $('m-modes').innerHTML = '';
  for (const m of MODES) { const best = store.get(`best:${m.id}:all`, null), b = document.createElement('button'); b.className = 'md'; b.type = 'button'; b.setAttribute('aria-pressed', String(opt.mode === m.id));
    b.innerHTML = `<span class="ic" style="background:${m.col}">${m.mark}</span><span><b>${m.name}</b><span>${m.desc}</span></span><span class="best">${best ? `全国ベスト<em>${best.score}/${best.total}</em>` : ''}</span>`;
    b.onclick = () => { opt.mode = m.id; store.set('mode', m.id); renderMenu(); }; $('m-modes').appendChild(b); }
  $('m-range').innerHTML = [['all', 'ぜんぶ（47）'], ...Object.entries(REGION).map(([k, v]) => [k, `${v}（${poolOf(k).length}）`])].map(([k, v]) => `<button type="button" data-v="${k}" aria-pressed="${opt.range === k}">${v}</button>`).join('');
  $('m-range').querySelectorAll('button').forEach((b) => (b.onclick = () => { opt.range = b.dataset.v; store.set('range', opt.range); renderMenu(); }));
  $('m-count').querySelectorAll('button').forEach((b) => { b.setAttribute('aria-pressed', String(+b.dataset.v === opt.count)); b.onclick = () => { opt.count = +b.dataset.v; store.set('count', opt.count); renderMenu(); }; });
}

/* ---------- 出題 ---------- */
let Q = null;
/* まちがいの選択肢：同じ地方から2つ、ほかから1つ（県庁所在地は市の名前がかぶらないように） */
function distractors(ans) {
  const pick = [], used = new Set([ans.id]), usedCap = new Set([ans.cap]);
  const add = (list, n) => { for (const x of shuffle(list)) { if (pick.length >= n) break; if (used.has(x.id) || usedCap.has(x.cap)) continue; used.add(x.id); usedCap.add(x.cap); pick.push(x); } };
  add(ALL.filter((x) => x.r === ans.r), 2); add(ALL, 3); return pick;
}
function startQuiz(only) {
  const pool = only || poolOf(opt.range), n = only ? pool.length : opt.count === 0 ? pool.length : Math.min(opt.count, pool.length), m = MODES.find((x) => x.id === opt.mode);
  Q = { mode: opt.mode, range: opt.range, list: shuffle(pool).slice(0, n), i: 0, score: 0, misses: [], locked: false, retry: !!only, full: !only && n === pool.length };
  $('q-mode').textContent = m.name + '・' + (only ? 'まちがえた所' : opt.range === 'all' ? 'ぜんぶ' : REGION[opt.range]); $('q-total').textContent = n;
  show('s-quiz'); ask();
}
function ask() {
  const ans = Q.list[Q.i], cap = Q.mode === 'cap'; Q.locked = false; Q.choices = shuffle([ans, ...distractors(ans)]);
  $('q-no').textContent = Q.i + 1; $('q-score').textContent = Q.score; $('q-bar').style.width = (Q.i / Q.list.length) * 100 + '%';
  showMap(ans, Q.mode);
  $('q-ask').innerHTML = cap ? `${ans.n} の 県庁所在地は？<small>${ans.y}</small>` : Q.mode === 'shape' ? 'この形は どこ？' : '赤い所は どこ？';
  $('q-msg').className = 'msg'; $('q-msg').innerHTML = ''; $('b-next').classList.remove('on');
  const box = $('q-choices'); box.innerHTML = '';
  for (const x of Q.choices) { const b = document.createElement('button'); b.className = 'ch'; b.type = 'button'; b.dataset.id = x.id;
    b.innerHTML = cap ? `<small>${x.capY}</small>${x.cap}` : `<small>${x.y}</small>${x.n}`; b.onclick = () => answer(x, b); box.appendChild(b); }
}
function answer(x, btn) {
  if (Q.locked) return; Q.locked = true;
  const ans = Q.list[Q.i], ok = x.id === ans.id;
  document.querySelectorAll('.ch').forEach((b) => { if (b.dataset.id === ans.id) b.classList.add('ok'); else if (b !== btn) b.classList.add('dim'); });
  // かたちクイズは、答えのあとで地図の中の場所も見せる
  if (Q.mode === 'shape') showMap(ans, 'place');
  paths[ans.id].setAttribute('class', ok ? 'o' : 't');
  const info = `${ans.n}（${REGION[ans.r]}地方）　県庁所在地：${ans.cap}`;
  if (ok) { Q.score++; sfx('ok'); $('q-score').textContent = Q.score; $('q-msg').className = 'msg ok'; $('q-msg').innerHTML = `せいかい！<small>${info}</small>`; Q.timer = setTimeout(next, 1300); }
  else { btn.classList.add('ng'); Q.misses.push(ans); sfx('ng'); $('q-msg').className = 'msg ng'; $('q-msg').innerHTML = `ざんねん… こたえは「${Q.mode === 'cap' ? ans.cap : ans.n}」<small>${info}</small>`; }
  $('b-next').classList.add('on');
}
function next() { clearTimeout(Q.timer); if (!Q.locked) return; Q.i++; if (Q.i >= Q.list.length) finish(); else ask(); }
$('b-next').onclick = next;
$('b-quit').onclick = () => { if (Q) clearTimeout(Q.timer); Q = null; renderMenu(); show('s-menu'); };
function finish() {
  const total = Q.list.length, st = stars(Q.score, total);
  $('r-mode').textContent = $('q-mode').textContent; $('r-score').innerHTML = `${Q.score}<small> / ${total}問 せいかい</small>`; $('r-stars').innerHTML = starHtml(st);
  $('r-msg').textContent = st === 3 ? 'すばらしい！ 都道府県はかせ' : st === 2 ? 'よくできました！' : st === 1 ? 'そのちょうし！' : '地図をよく見て、もう一度！';
  let rec = false;
  if (Q.full) { const key = `best:${Q.mode}:${Q.range}`, prev = store.get(key, null); if (!prev || Q.score > prev.score) { store.set(key, { score: Q.score, total }); rec = Q.score > 0; } }
  $('r-rec').hidden = !rec;
  $('r-misses').innerHTML = Q.misses.length ? `<div class="sec">まちがえた所（${Q.misses.length}）</div><div class="miss">${Q.misses.map((x) => `<div><small>${x.y}</small>${x.n}<small>${REGION[x.r]}・${x.cap}</small></div>`).join('')}</div>` : '';
  $('b-retry-miss').style.display = Q.misses.length ? '' : 'none';
  sfx('end'); show('s-result');
}
$('b-start').onclick = () => startQuiz();
$('b-retry-miss').onclick = () => startQuiz(Q.misses);
$('b-retry').onclick = () => startQuiz();
$('b-menu').onclick = () => { renderMenu(); show('s-menu'); };
renderMenu();
window.__todofuken = { ALL, MAP, opt, startQuiz, distractors, get Q() { return Q; } };
</script>
