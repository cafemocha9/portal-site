<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>チェス作戦道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 1列のノート型。主役はいつも盤面。見出しだけ太いゴシックで元気に、ほかは静かに */
  --paper:#f1f3fb; --card:#ffffff; --ink:#1b2140; --muted:#565d80; --line:#d3d9ee;
  --sq-l:#e8ecf9; --sq-d:#96a2de; --accent:#ff9f1c; --accent-ink:#3a2300;
  --good:#12875a; --good-bg:#dff5ea; --bad:#c92f55; --bad-bg:#fde6ec;
  --pw:#ffffff; --pb:#1b2140;
  --display:"Dela Gothic One","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#11152a; --card:#1b2142; --ink:#eef0fb; --muted:#a6add2; --line:#343d6e;
    --sq-l:#cbd2f3; --sq-d:#6b77c2; --accent:#ffab36; --accent-ink:#2e1c00;
    --good:#5fd6a3; --good-bg:#143a2c; --bad:#ff8fa8; --bad-bg:#44182a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#11152a; --card:#1b2142; --ink:#eef0fb; --muted:#a6add2; --line:#343d6e;
  --sq-l:#cbd2f3; --sq-d:#6b77c2; --accent:#ffab36; --accent-ink:#2e1c00;
  --good:#5fd6a3; --good-bg:#143a2c; --bad:#ff8fa8; --bad-bg:#44182a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-weight:500;font-size:17px;line-height:1.75;line-break:strict;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:20px 16px 56px;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.3;margin:0;text-wrap:balance}
h1{font-size:34px;letter-spacing:.02em}
h2{font-size:20px}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.hero{display:flex;flex-direction:column;gap:12px;padding-top:8px}
.hero h1{font-size:42px}
.hero h1 span{color:var(--accent)}
.checks{display:grid;grid-template-columns:repeat(8,14px);grid-auto-rows:14px}
.checks i{background:var(--sq-d)}
.checks i:nth-child(odd){background:var(--accent)}
.prog{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:14px 16px}
.prog .n{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.prog .n small{font-size:15px;color:var(--muted);font-family:var(--body);font-weight:700}
.prog .rank{font-weight:700;color:var(--muted);flex:1;min-width:8em}
.btn{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 18px;min-height:48px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-ink)}
.btn[hidden]{display:none}

.group{display:flex;flex-direction:column;gap:10px}
.group>p{color:var(--muted);font-size:15px}
.cards{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none}
.card:hover{border-color:var(--ink)}
.card .pic{width:40px;height:40px;background:var(--sq-d);border-radius:8px;padding:3px}
.card b{display:block;font-size:18px;line-height:1.4}
.card small{display:block;color:var(--muted);font-size:14px;line-height:1.5}
.card .st{font-size:18px;letter-spacing:2px;color:var(--accent);white-space:nowrap}
.card .st i{font-style:normal;color:var(--line)}

.back{font-weight:700;text-decoration:none;color:var(--muted);align-self:flex-start;padding:6px 0;min-height:44px;display:inline-flex;align-items:center}
.lead{font-size:18px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec h2{display:flex;align-items:center;gap:10px}
.sec h2::before{content:"";width:14px;height:14px;background:var(--accent);flex:none}
.cap{font-size:15px;color:var(--muted);text-align:center}
.pts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.pts li{background:var(--card);border-left:6px solid var(--sq-d);padding:8px 12px}
.vals{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center}
.vals div{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:6px 2px;font-size:12px;line-height:1.4;font-weight:700}
.vals svg{width:100%;max-width:44px;background:var(--sq-d);border-radius:6px;display:block;margin:0 auto 2px}
.vals strong{display:block;font-family:var(--display);font-weight:400;font-size:19px}

.board{position:relative;display:grid;grid-template-columns:repeat(8,1fr);width:100%;max-width:460px;margin:0 auto;aspect-ratio:1;border:3px solid var(--ink);border-radius:6px;overflow:hidden;touch-action:manipulation}
.sq{position:relative;border:0;padding:0;margin:0;background:var(--sq-l);font:inherit;min-width:0;aspect-ratio:1;-webkit-tap-highlight-color:transparent}
.sq.dk{background:var(--sq-d)}
.board.live .sq{cursor:pointer}
.sq.last{box-shadow:inset 0 0 0 100px rgba(255,159,28,.42)}
.sq.sel{box-shadow:inset 0 0 0 4px var(--accent),inset 0 0 0 100px rgba(255,159,28,.3)}
.sq.mark{box-shadow:inset 0 0 0 4px var(--accent)}
.sq.tg::after{content:"";position:absolute;inset:36%;border-radius:50%;background:rgba(27,33,64,.42)}
.sq.cap::after{content:"";position:absolute;inset:5%;border-radius:50%;border:4px solid rgba(201,47,85,.85)}
.sq:focus-visible{outline-offset:-3px;z-index:2}
.sq span{position:absolute;font-size:10px;line-height:1;font-weight:700;color:#1b2140;opacity:.6;pointer-events:none}
.sq .rk{top:2px;left:3px}
.sq .fl{bottom:2px;right:3px}
.pc{position:absolute;inset:-3%;width:106%;height:106%;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
.pc.w{fill:var(--pw);stroke:var(--pb);color:var(--pb)}
.pc.b{fill:var(--pb);stroke:var(--pw);color:var(--pw)}
.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.arrows line{stroke:#ff7a00;stroke-width:1.9;stroke-linecap:round;opacity:.92}
.arrows path{fill:#ff7a00}
.steps{display:flex;gap:8px;align-items:center;font-weight:700;color:var(--muted);font-size:15px}
.steps i{width:14px;height:14px;border:2px solid var(--ink);background:var(--card)}
.steps i.on{background:var(--ink)}
.steps i.ok{background:var(--accent);border-color:var(--accent-ink)}
.prompt{font-size:19px;font-weight:700;line-height:1.6}
.fb{min-height:3.5em;padding:10px 14px;border-radius:10px;background:var(--card);border:1.5px solid var(--line)}
.fb.good{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
.fb.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row .primary{margin-left:auto}
@media (prefers-reduced-motion:no-preference){
  .pc.pop{animation:pop .35s ease-out}
  .board.shake{animation:shake .3s}
  @keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
}
@media (max-width:380px){.hero h1{font-size:36px}h1{font-size:30px}.vals{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

const NAME={p:'ポーン',n:'ナイト',b:'ビショップ',r:'ルーク',q:'クイーン',k:'キング'};
const F='abcdefgh';
const sq=s=>(8-+s[1])*8+F.indexOf(s[0]);
const nm=i=>F[i%8]+(8-(i>>3));
const isW=p=>!!p&&p===p.toUpperCase();
function parse(fen){const[pl,t,c]=fen.split(' ');const b=[];for(const ch of pl){if(ch==='/')continue;if(ch>='1'&&ch<='8'){for(let k=0;k<+ch;k++)b.push('')}else b.push(ch)}return{b,turn:t,castle:c||'-'}}
function pseudo(P,i,atk){
  const p=P.b[i],w=isW(p),t=p.toLowerCase(),r=i>>3,f=i%8,o=[];
  const add=(rr,ff)=>{if(rr<0||rr>7||ff<0||ff>7)return false;const j=rr*8+ff,q=P.b[j];if(!q){o.push(j);return true}if(isW(q)!==w)o.push(j);return false};
  const slide=ds=>{for(const[dr,df]of ds){let rr=r+dr,ff=f+df;while(add(rr,ff)){rr+=dr;ff+=df}}};
  const D=[[1,1],[1,-1],[-1,1],[-1,-1]],O=[[1,0],[-1,0],[0,1],[0,-1]];
  if(t==='p'){
    const d=w?-1:1;
    for(const df of[-1,1]){const rr=r+d,ff=f+df;if(rr<0||rr>7||ff<0||ff>7)continue;const q=P.b[rr*8+ff];if(atk||(q&&isW(q)!==w))o.push(rr*8+ff)}
    if(!atk&&r+d>=0&&r+d<=7&&!P.b[(r+d)*8+f]){o.push((r+d)*8+f);if(r===(w?6:1)&&!P.b[(r+2*d)*8+f])o.push((r+2*d)*8+f)}
  }else if(t==='n'){for(const[a,b]of[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]])add(r+a,f+b)}
  else if(t==='k'){for(const[a,b]of D.concat(O))add(r+a,f+b)}
  else if(t==='b')slide(D);else if(t==='r')slide(O);else slide(D.concat(O));
  return o;
}
function attacked(P,j,byW){for(let i=0;i<64;i++){const p=P.b[i];if(p&&isW(p)===byW&&pseudo(P,i,true).includes(j))return true}return false}
function inCheck(P,w){const k=P.b.indexOf(w?'K':'k');return k>=0&&attacked(P,k,!w)}
function apply(P,a,z){
  const b=P.b.slice(),p=b[a];b[z]=p;b[a]='';
  if(p.toLowerCase()==='k'&&Math.abs(z-a)===2){if(z>a){b[z-1]=b[z+1];b[z+1]=''}else{b[z+1]=b[z-2];b[z-2]=''}}
  if(p==='P'&&z<8)b[z]='Q';if(p==='p'&&z>55)b[z]='q';
  return{b,turn:P.turn==='w'?'b':'w',castle:P.castle};
}
function legal(P,i){
  const p=P.b[i],w=isW(p);
  const o=pseudo(P,i,false).filter(j=>!inCheck(apply(P,i,j),w));
  if(p.toLowerCase()==='k'){
    const h=w?60:4;
    if(i===h&&!inCheck(P,w)){
      const e=j=>!P.b[j],s=j=>!attacked(P,j,!w);
      if(P.castle.includes(w?'K':'k')&&e(h+1)&&e(h+2)&&P.b[h+3]===(w?'R':'r')&&s(h+1)&&s(h+2))o.push(h+2);
      if(P.castle.includes(w?'Q':'q')&&e(h-1)&&e(h-2)&&e(h-3)&&P.b[h-4]===(w?'R':'r')&&s(h-1)&&s(h-2))o.push(h-2);
    }
  }
  return o;
}

if(typeof document!=='undefined'){
const app=document.getElementById('app');
const KEY='chess-dojo-v1';
let solved=new Set();
try{solved=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...solved]))}catch(e){}};
const TOTAL=LESSONS.reduce((n,l)=>n+l.pz.length,0);
const byId=id=>LESSONS.find(l=>l.id===id);
const ORDER=GROUPS.flatMap(g=>g.ids);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pieceSvg=(t,c,x)=>`<svg class="pc ${c}${x||''}" viewBox="0 0 40 40" aria-hidden="true"><use href="#pc-${t}"/></svg>`;
let S=null;

function draw(el,P,o){
  const fl=o.orient==='b';let h='';
  for(let d=0;d<64;d++){
    const i=fl?63-d:d,r=i>>3,f=i%8,p=P.b[i],cls=['sq',(r+f)%2?'dk':'lt'];
    if(o.sel===i)cls.push('sel');
    if(o.tg&&o.tg.includes(i))cls.push(p?'cap':'tg');
    if(o.last&&o.last.includes(i))cls.push('last');
    if(o.marks&&o.marks.includes(i))cls.push('mark');
    const lab=nm(i)+(p?' '+(isW(p)?'白':'黒')+'の'+NAME[p.toLowerCase()]:'');
    h+=`<button type="button" class="${cls.join(' ')}" data-i="${i}" aria-label="${lab}"${o.onTap?'':' tabindex="-1"'}>`;
    if(d%8===0)h+=`<span class="rk">${8-r}</span>`;
    if(d>=56)h+=`<span class="fl">${F[f]}</span>`;
    if(p)h+=pieceSvg(p.toLowerCase(),isW(p)?'w':'b',o.pop===i?' pop':'');
    h+='</button>';
  }
  if(o.arrows&&o.arrows.length){
    const c=i=>[((fl?7-i%8:i%8))*10+5,((fl?7-(i>>3):i>>3))*10+5];
    h+='<svg class="arrows" viewBox="0 0 80 80" aria-hidden="true">';
    for(const[a,z]of o.arrows){
      const[x1,y1]=c(a),[x2,y2]=c(z),L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L;
      const ex=x2-ux*4.2,ey=y2-uy*4.2,tx=x2-ux*1.4,ty=y2-uy*1.4;
      h+=`<line x1="${x1+ux*3}" y1="${y1+uy*3}" x2="${ex}" y2="${ey}"/><path d="M${tx} ${ty}L${ex-uy*2.6} ${ey+ux*2.6}L${ex+uy*2.6} ${ey-ux*2.6}Z"/>`;
    }
    h+='</svg>';
  }
  el.innerHTML=h;
  el.classList.toggle('live',!!o.onTap);
  el.onclick=o.onTap?e=>{const b=e.target.closest('.sq');if(b)o.onTap(+b.dataset.i)}:null;
}
const pairs=a=>(a||[]).map(u=>[sq(u.slice(0,2)),sq(u.slice(2))]);

function showHome(){
  S=null;
  const n=solved.size;
  const rank=n>=TOTAL?'クイーン級（ぜんぶクリア！）':n>=14?'ルーク級':n>=9?'ナイト級':n>=4?'ポーン級':'みならい';
  const nextL=ORDER.map(byId).find(l=>l.pz.some((_,k)=>!solved.has(l.id+'-'+k)))||byId(ORDER[0]);
  let h=`<header class="hero"><div class="checks" aria-hidden="true">${'<i></i>'.repeat(8)}</div>
  <h1>チェス<span>作戦</span>道場</h1>
  <p class="lead">強い人が使っている作戦とわざを、問題をときながらおぼえよう。</p>
  <div class="prog"><div class="n">★ ${n}<small> / ${TOTAL}</small></div><div class="rank">いまのランク：${rank}</div>
  <a class="btn primary" href="#l-${nextL.id}">${n?'つづきから':'はじめる'}</a></div></header>`;
  let no=0;
  for(const g of GROUPS){
    h+=`<section class="group"><h2>${g.t}</h2><p>${g.d}</p><ul class="cards">`;
    for(const id of g.ids){
      const l=byId(id);no++;
      const st=l.pz.map((_,k)=>solved.has(id+'-'+k)?'★':'<i>★</i>').join('');
      const got=l.pz.filter((_,k)=>solved.has(id+'-'+k)).length;
      h+=`<li><a class="card" href="#l-${id}"><span class="pic">${pieceSvg(l.pic,'w').replace('class="pc w"','class="pc w" style="position:static;width:100%;height:100%"')}</span>
      <span><b>${no}. ${l.title}</b><small>${l.sub}</small></span>
      <span class="st" aria-label="${l.pz.length}問中${got}問クリア">${st}</span></a></li>`;
    }
    h+='</ul></section>';
  }
  app.innerHTML=h;
}

function showLesson(l,k0){
  let h=`<a class="back" href="#home">← レッスン一覧</a>
  <header class="sec"><h1>${l.title}</h1><p class="lead">${l.intro}</p></header>
  <section class="sec"><h2>おぼえよう</h2>`;
  if(l.vals)h+=`<div class="vals">${[['p','ポーン','1点'],['n','ナイト','3点'],['b','ビショップ','3点'],['r','ルーク','5点'],['q','クイーン','9点'],['k','キング','∞']].map(v=>`<div><svg viewBox="0 0 40 40" class="pcv" aria-hidden="true" style="fill:#fff;stroke:#1b2140;color:#1b2140;stroke-width:1.7;stroke-linejoin:round"><use href="#pc-${v[0]}"/></svg>${v[1]}<strong>${v[2]}</strong></div>`).join('')}</div><p class="cap">キングは取られたら負け。だから点数はつけられないよ。</p>`;
  if(l.ex)h+=`<div class="board" id="exb" role="img" aria-label="${esc(l.ex.cap)}"></div><p class="cap">${l.ex.cap}</p>`;
  h+=`<ul class="pts">${l.pts.map(p=>`<li>${p}</li>`).join('')}</ul></section>
  <section class="sec" id="try"><h2>やってみよう</h2>
  <div class="steps" id="steps"></div><p class="prompt" id="prompt"></p>
  <div class="board" id="pzb"></div><p class="fb" id="fb" aria-live="polite"></p>
  <div class="row"><button type="button" class="btn" id="hint">ヒント</button><button type="button" class="btn" id="retry">やり直す</button><button type="button" class="btn primary" id="next" hidden></button></div></section>`;
  app.innerHTML=h;
  if(l.ex)draw(document.getElementById('exb'),parse(l.ex.fen),{orient:l.ex.orient,arrows:pairs(l.ex.arrows),marks:(l.ex.marks||[]).map(sq)});
  let k=k0;
  if(k==null){k=l.pz.findIndex((_,j)=>!solved.has(l.id+'-'+j));if(k<0)k=0}
  startPuzzle(l,Math.min(k,l.pz.length-1));
  document.getElementById('hint').onclick=()=>{
    if(S.done)return;S.hint++;
    if(S.hint>1)S.marks=[sq(S.z.sol[0].slice(0,2))];
    fb('',(S.hint>1?'わくのついたこまを動かすよ。':'ヒント：')+S.z.hint);paint();
  };
  document.getElementById('retry').onclick=()=>startPuzzle(S.l,S.k);
  document.getElementById('next').onclick=()=>{
    if(S.k<S.l.pz.length-1){startPuzzle(S.l,S.k+1);document.getElementById('try').scrollIntoView({block:'start'})}
    else{const n=ORDER[ORDER.indexOf(S.l.id)+1];location.hash=n?'l-'+n:'home'}
  };
}
function startPuzzle(l,k){
  const z=l.pz[k];
  S={l,k,z,P:parse(z.fen),sel:null,tg:[],done:false,hint:0,last:null,arr:[],pop:null,marks:[],shake:false};
  document.getElementById('prompt').textContent=z.prompt;
  fb('','こまをタップして、動かすマスをえらぼう。');
  paint();
}
function fb(kind,text){const el=document.getElementById('fb');el.className='fb'+(kind?' '+kind:'');el.textContent=text}
function paint(){
  const el=document.getElementById('pzb');
  draw(el,S.P,{orient:S.z.orient,sel:S.sel,tg:S.tg,last:S.last,arrows:S.arr,pop:S.pop,marks:S.marks,onTap:S.done?null:tap});
  el.classList.remove('shake');
  if(S.shake){void el.offsetWidth;el.classList.add('shake');S.shake=false}
  S.pop=null;
  document.getElementById('steps').innerHTML=S.l.pz.map((_,j)=>`<i class="${solved.has(S.l.id+'-'+j)?'ok':''}${j===S.k?' on':''}"></i>`).join('')+`<span>問題 ${S.k+1} / ${S.l.pz.length}</span>`;
  const nx=document.getElementById('next');
  nx.hidden=!S.done;
  if(S.done){const last=S.k===S.l.pz.length-1,n=ORDER[ORDER.indexOf(S.l.id)+1];nx.textContent=!last?'次の問題へ':n?'次のレッスンへ':'レッスン一覧へ'}
  document.getElementById('hint').hidden=S.done;
}
function tap(i){
  if(S.done)return;
  const p=S.P.b[i],mine=p&&(isW(p)===(S.P.turn==='w'));
  if(S.sel!=null&&S.tg.includes(i)){
    const u=nm(S.sel)+nm(i),z=S.z;
    if(z.sol.includes(u)){
      S.P=apply(S.P,S.sel,i);S.last=[S.sel,i];S.pop=i;S.done=true;S.arr=pairs(z.after);S.marks=[];
      solved.add(S.l.id+'-'+S.k);save();
      fb('good','★ せいかい！ '+((z.winBy&&z.winBy[u])||z.win));
    }else{
      const m=(z.missBy&&z.missBy[u])||(z.missFrom&&z.missFrom[nm(S.sel)])||z.miss;
      S.shake=true;fb('bad',m);
    }
    S.sel=null;S.tg=[];paint();return;
  }
  if(mine&&S.sel!==i){S.sel=i;S.tg=legal(S.P,i)}else{S.sel=null;S.tg=[]}
  paint();
}
function route(keep){
  const m=location.hash.match(/^#l-([a-z]+)$/),l=m&&byId(m[1]);
  if(l)showLesson(l,keep&&keep.id===l.id?keep.k:null);else showHome();
  if(!keep)window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>route());
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>S?{id:S.l.id,k:S.k}:{});
const start=d=>route(d&&d.id?d:{});
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
}
