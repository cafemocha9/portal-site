<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1f3a">
<title>てっぺんピッケル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Shippori+Mincho:wght@600&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b1f3a; --paper:#fbf6ea; --mute:#6b6f86; --accent:#ff7a3d; --accentd:#d65a22; --moss:#5fae48; --ice:#8fd8f0; --danger:#e2554f;
  --disp:"Dela Gothic One","Zen Kaku Gothic New",system-ui,sans-serif;
  --serif:"Shippori Mincho","Hiragino Mincho ProN",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#fbf6ea; } }
:root[data-theme="dark"]{ --paper:#fbf6ea; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:#1b1f3a;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:#1b1f3a;color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-size:15px;line-height:1.6;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#wrap{position:relative;width:100%;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.hud{position:absolute;inset:0;pointer-events:none;display:none}
.hud.on{display:block}
.hud>*{pointer-events:auto}
.hgt{position:absolute;left:max(14px,env(safe-area-inset-left,0px));top:12px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);line-height:1.05;pointer-events:none}
.hgt b{font-family:var(--disp);font-weight:400;font-size:40px;letter-spacing:.01em}
.hgt b small{font-size:18px;margin-left:3px}
.hgt span{display:block;font-size:12px;font-weight:700;opacity:.85;margin-top:4px}
.stats{position:absolute;right:max(70px,calc(env(safe-area-inset-right,0px) + 70px));top:16px;display:flex;gap:8px;pointer-events:none}
.chip{padding:4px 12px;border-radius:999px;background:rgba(27,31,58,.55);color:#fff;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;backdrop-filter:blur(4px)}
.ibtn{position:absolute;width:46px;height:46px;border-radius:50%;background:rgba(251,246,234,.92);display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.ibtn svg{width:22px;height:22px}
#btnPause{right:max(14px,env(safe-area-inset-right,0px));top:12px}
#btnCp{right:max(14px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:auto;height:44px;border-radius:22px;padding:0 16px 0 12px;display:flex;gap:6px;align-items:center;font-weight:900;font-size:13px}
#btnCp svg{width:20px;height:20px}
.track{position:absolute;right:max(26px,calc(env(safe-area-inset-right,0px) + 26px));top:78px;bottom:90px;width:8px;border-radius:4px;background:rgba(255,255,255,.22);pointer-events:none}
.track i{position:absolute;left:50%;width:6px;height:2px;margin-left:-3px;background:rgba(255,255,255,.7)}
.track .best{width:16px;margin-left:-8px;height:3px;background:#ffd36b}
.track .me{width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--accent);border:2px solid #fff}
#narr{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(88vw,620px);text-align:center;color:#fff;font-family:var(--serif);font-size:clamp(16px,2.6vw,21px);line-height:1.7;
  text-shadow:0 2px 8px rgba(0,0,0,.55);opacity:0;transition:opacity .8s;pointer-events:none}
#narr.on{opacity:1}
#hint{position:absolute;left:50%;top:78px;transform:translateX(-50%);max-width:min(90vw,560px);width:max-content;text-align:center;padding:6px 16px;border-radius:16px;background:rgba(251,246,234,.92);font-weight:700;font-size:13px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none}
#hint.on{opacity:1}

/* overlays */
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
.ov.on{display:flex}
.dim{background:rgba(15,17,36,.55);backdrop-filter:blur(3px)}
.panel{width:min(100%,520px);background:var(--paper);border-radius:24px;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 10px 0 rgba(0,0,0,.25)}
.panel h2{margin:0 0 4px;font-family:var(--disp);font-weight:400;font-size:26px}
.panel p.sub{margin:0 0 14px;color:var(--mute);font-size:13px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:16px;background:var(--accent);color:#fff;font-weight:900;font-size:16px;box-shadow:0 4px 0 var(--accentd)}
.btn.sub{background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(27,31,58,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--accentd)}
.stack{display:grid;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px;border-bottom:1px dashed rgba(27,31,58,.15);font-weight:700}
.tg{min-width:74px;height:36px;border-radius:18px;background:#fff;box-shadow:0 2px 0 rgba(27,31,58,.18);font-weight:900}
.tg[aria-pressed="true"]{background:var(--moss);color:#fff}
input[type=range]{width:150px;accent-color:var(--accent)}

/* title */
#title{flex-direction:column;justify-content:flex-start;gap:10px;padding-top:max(5vh,calc(env(safe-area-inset-top,0px) + 16px))}
.logo{text-align:center;color:#fff}
.logo h1{margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(40px,10vw,72px);line-height:1.1;letter-spacing:.02em;text-shadow:0 5px 0 rgba(0,0,0,.35)}
.logo h1 em{font-style:normal;color:#ffd36b}
.logo p{margin:6px 0 0;font-family:var(--serif);font-size:15px;opacity:.92}
.diffs{display:grid;gap:10px;width:min(100%,560px)}
.dcard{background:var(--paper);border-radius:20px;padding:11px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;box-shadow:0 5px 0 rgba(0,0,0,.25);border:3px solid transparent}
.dcard h3{margin:0;font-family:var(--disp);font-weight:400;font-size:20px;display:flex;align-items:center;gap:8px}
.dcard h3 .lv{display:inline-flex;gap:3px}
.dcard h3 .lv i{width:8px;height:14px;border-radius:2px;background:rgba(27,31,58,.15)}
.dcard h3 .lv i.f{background:var(--accent)}
.dcard p{margin:0;grid-column:1;font-size:12.5px;color:var(--mute);line-height:1.5}
.dcard .meta{grid-column:1;font-size:12px;font-weight:700}
.dcard .acts{grid-row:1 / span 3;grid-column:2;display:grid;gap:6px}
.dcard .acts button{height:38px;padding:0 16px;border-radius:12px;background:var(--accent);color:#fff;font-weight:900;font-size:14px;box-shadow:0 3px 0 var(--accentd);white-space:nowrap}
.dcard .acts button.sub{background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(27,31,58,.18)}
.how{width:min(100%,560px);color:#fff;font-size:12.5px;text-align:center;opacity:.9;line-height:1.7}
.how kbd{font-family:inherit;background:rgba(255,255,255,.18);padding:0 6px;border-radius:6px}
.tlinks{display:flex;gap:8px}
.tlinks button{color:#fff;font-weight:700;font-size:13px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.15)}
.result{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 16px}
.result div{background:#fff;border-radius:14px;padding:10px 6px;text-align:center}
.result b{display:block;font-family:var(--disp);font-weight:400;font-size:20px}
.result span{font-size:11px;color:var(--mute);font-weight:700}
.new{display:inline-block;margin-left:6px;padding:0 8px;border-radius:999px;background:#ffd36b;font-size:12px;font-weight:900}
@media (max-width:600px){#hint{top:96px}.hgt b{font-size:34px}.stats{top:14px}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div class="hud" id="hud">
    <div class="hgt"><b id="hM">0<small>m</small></b><span id="hBest">さいこう 0m</span></div>
    <div class="stats"><div class="chip" id="hTime">0:00</div><div class="chip" id="hFall">落下 0</div></div>
    <button class="ibtn" id="btnPause" aria-label="ポーズ"><svg viewBox="0 0 24 24" fill="#1b1f3a"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
    <button class="ibtn" id="btnCp"><svg viewBox="0 0 24 24" fill="none" stroke="#1b1f3a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4"/><path d="M6 4h11l-2.5 4L17 12H6" fill="#ff7a3d"/></svg>チェックポイント</button>
    <div class="track" id="track"></div>
    <div id="narr"></div>
    <div id="hint"></div>
  </div>

  <section class="ov on" id="title">
    <div class="logo"><h1>てっぺん<em>ピッケル</em></h1><p>カエルと、バケツと、一本のピッケル。</p></div>
    <div class="diffs" id="diffs"></div>
    <div class="how" id="how"></div>
    <div class="tlinks"><button id="btnSetT">せってい</button></div>
  </section>

  <section class="ov dim" id="pause"><div class="panel">
    <h2>ひとやすみ</h2><p class="sub" id="pauseSub"></p>
    <div class="stack">
      <button class="btn" id="btnResume">つづける</button>
      <button class="btn sub" id="btnPCp">チェックポイントへもどる</button>
      <button class="btn sub" id="btnSetP">せってい</button>
      <button class="btn sub" id="btnRestart">さいしょからやり直す</button>
      <button class="btn sub" id="btnTitle">タイトルへ（進みぐあいは保存されます）</button>
    </div>
  </div></section>

  <section class="ov dim" id="settings"><div class="panel">
    <h2>せってい</h2><p class="sub">変更はすぐに反映され、保存されます</p>
    <div class="row">効果音<button class="tg" id="tgSnd"></button></div>
    <div class="row">ナレーション<button class="tg" id="tgNarr"></button></div>
    <div class="row">ピッケルのとどく範囲を表示<button class="tg" id="tgGuide"></button></div>
    <div class="row"><span>タッチ操作の感度<br><small style="color:var(--mute);font-weight:500">ドラッグ量に対するピッケルの動き</small></span><input type="range" id="rgSens" min="0.6" max="2.2" step="0.1"></div>
    <div style="margin-top:16px"><button class="btn" id="btnSetClose">とじる</button></div>
  </div></section>

  <section class="ov dim" id="goal"><div class="panel" style="text-align:center">
    <h2>てっぺんに着いた！</h2><p class="sub" id="goalSub"></p>
    <div class="result"><div><b id="gTime">0:00</b><span>タイム</span></div><div><b id="gFall">0</b><span>落下回数</span></div><div><b id="gMax">0m</b><span>いちばん大きな落下</span></div></div>
    <p style="font-family:var(--serif);font-size:16px;margin:0 0 16px" id="goalLine"></p>
    <div class="stack"><button class="btn" id="btnGoalTitle">タイトルへ</button></div>
  </div></section>
</div>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const TAU=Math.PI*2, clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, hyp=Math.hypot;
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const KEY='teppen-pickel-v2';
const SAVE=Object.assign({set:{snd:true,narr:true,guide:null,sens:1.2},best:{},prog:{},hiH:{}},store.get(KEY,{}));
const persist=()=>store.set(KEY,SAVE);

/* ================= DIFFICULTY ================= */
const DIFF={
  easy:{name:'かんたん',lv:1,g:1150,L:178,slip:.45,cps:[1,2,3,4,5,6,7],guide:true,
    desc:'ピッケルが長く、重力はひかえめ。チェックポイントがすべての区間にあり、落ちてもすぐ戻れます。'},
  normal:{name:'ふつう',lv:2,g:1400,L:158,slip:1,cps:[2,4,6],guide:false,
    desc:'標準の物理。チェックポイントは3か所だけ。落ちると少し戻されます。'},
  hard:{name:'むずかしい',lv:3,g:1520,L:152,slip:1.2,cps:[],guide:false,
    desc:'チェックポイントなし。ピッケルは短く、すべりやすい。落ちたら落ちた場所からやり直し。'},
};
let D=DIFF.normal, diffKey='normal';

/* ================= WORLD ================= */
// design coords: x right, h up. Stored as screen coords (y = -h).
const POLYS=[];
const MAT={
  grass:{fill:'#7b6a55',top:'#6fbf57',edge:'#4a3d30',fr:.07,mu:1.8,dig:30,snd:'grass'},
  rock:{fill:'#8a8f9c',top:'#c9ccd4',edge:'#4a4e5c',fr:.06,mu:2.2,dig:30,snd:'rock'},
  wood:{fill:'#9a6a3e',top:'#c89a62',edge:'#5a3a1e',fr:.06,mu:1.5,dig:28,snd:'wood'},
  ice:{fill:'#bfe8f5',top:'#ffffff',edge:'#5fa8c8',fr:.0015,mu:.1,dig:2,snd:'ice'},
  metal:{fill:'#8e9aa8',top:'#e6ecf2',edge:'#4c5866',fr:.04,mu:.45,dig:8,snd:'metal'},
};
function poly(pts,mat){POLYS.push({pts:pts.map(([x,h])=>[x,-h]),mat});}
function rect(x0,h0,x1,h1,mat){poly([[x0,h0],[x1,h0],[x1,h1],[x0,h1]],mat);}
function blob(cx,ch,r,mat,n=10,seed=1){let s=seed*9301+49297;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};const pts=[];for(let i=0;i<n;i++){const a=i/n*TAU,rr=r*(.84+.3*rnd());pts.push([cx+Math.cos(a)*rr,ch+Math.sin(a)*rr]);}poly(pts,mat);}
function log(x1,h1,x2,h2,th,mat){const dx=x2-x1,dh=h2-h1,l=hyp(dx,dh),nx=-dh/l*th/2,nh=dx/l*th/2;poly([[x1-nx,h1-nh],[x2-nx,h2-nh],[x2+nx,h2+nh],[x1+nx,h1+nh]],mat);}
// boundaries
rect(-900,-300,-620,4300,'rock'); rect(820,-300,1100,4300,'rock'); rect(-620,-300,820,0,'grass');
// 1: meadow
poly([[-200,0],[-176,62],[-48,62],[-20,0]],'rock');
rect(140,0,300,140,'rock'); rect(300,0,570,250,'rock');
// 2: pillar + log
rect(570,0,820,380,'rock');
rect(380,470,520,500,'wood'); rect(540,590,680,620,'wood');
rect(-620,690,520,750,'rock');
rect(-135,750,-55,792,'rock'); rect(-325,750,-262,780,'rock');
// 3: chimney
rect(-460,830,-400,1240,'rock'); rect(-400,830,-388,1240,'ice');
rect(-620,860,-555,880,'rock'); rect(-525,970,-460,990,'wood'); rect(-620,1080,-555,1100,'rock'); rect(-525,1190,-460,1210,'wood');
rect(-460,1240,-120,1290,'rock');
// 4: ice ramp
poly([[-120,1240],[-120,1290],[260,1470],[260,1410]],'ice');
rect(-80,1305,-20,1345,'rock'); rect(40,1360,100,1400,'rock'); rect(150,1412,210,1452,'rock');
rect(250,1400,560,1480,'grass');
// 5: stepping stones + overhang
rect(620,1555,720,1590,'rock'); rect(470,1665,570,1700,'wood'); rect(620,1775,720,1810,'rock'); rect(470,1885,570,1920,'wood'); rect(620,1995,720,2030,'rock');
rect(240,2040,540,2080,'grass');
// 6: pegs
[[180,2220],[50,2350],[-80,2480],[50,2610],[180,2740]].forEach(([x,h])=>rect(x-56,h-11,x+56,h+11,'wood'));
// 7: final stairs
rect(250,2840,420,2876,'rock'); rect(450,2990,620,3020,'rock'); rect(280,3140,430,3170,'wood');
rect(60,3260,210,3290,'metal'); rect(-180,3360,-20,3398,'wood');
rect(-620,3440,-230,3500,'grass');
const GOAL={x:-470,y:-3500};
const CPS=[{x:-420,h:0},{x:700,h:380},{x:60,h:750},{x:-300,h:1290},{x:400,h:1480},{x:400,h:2080},{x:180,h:2751},{x:540,h:3020}];
const TIPS=[[0,'ピッケルを岩に引っかけて、テコのように体を持ち上げよう'],[300,'上の角にピッケルをかけて、ぐっと引き寄せる'],[770,'左の縦穴は、左右の出っぱりを交互にたどってのぼろう'],[1300,'氷の上では、ピッケルもすべる。小さな岩をたよりに'],[1500,'ジグザグの足場を一段ずつ。かけて、引いて、乗る'],[2100,'木のくいは小さい。しっかりねらって、かける'],[2860,'てっぺんは、もうすぐそこ']];
const TOP_H=3500, PX_M=20;

// segments & spatial hash
const SEGS=[], CELL=96, GRID=new Map();
function inPoly(x,y,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const [xi,yi]=pts[i],[xj,yj]=pts[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}
POLYS.forEach((p,pi)=>{
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;p.pts.forEach(([x,y])=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);});p.bb=[x0,y0,x1,y1];
  for(let i=0;i<p.pts.length;i++){const [ax,ay]=p.pts[i],[bx,by]=p.pts[(i+1)%p.pts.length];const l=hyp(bx-ax,by-ay)||1;let nx=(by-ay)/l,ny=-(bx-ax)/l;const mx=(ax+bx)/2,my=(ay+by)/2;if(inPoly(mx+nx*.8,my+ny*.8,p.pts)){nx=-nx;ny=-ny;}
    const s={ax,ay,bx,by,nx,ny,mat:p.mat,stamp:0};SEGS.push(s);
    const cx0=Math.floor(Math.min(ax,bx)/CELL),cx1=Math.floor(Math.max(ax,bx)/CELL),cy0=Math.floor(Math.min(ay,by)/CELL),cy1=Math.floor(Math.max(ay,by)/CELL);
    for(let cy=cy0;cy<=cy1;cy++)for(let cx=cx0;cx<=cx1;cx++){const k=cx+','+cy;if(!GRID.has(k))GRID.set(k,[]);GRID.get(k).push(s);}}
});
let STAMP=0;const QBUF=[];
function query(x,y,r){STAMP++;QBUF.length=0;const cx0=Math.floor((x-r)/CELL),cx1=Math.floor((x+r)/CELL),cy0=Math.floor((y-r)/CELL),cy1=Math.floor((y+r)/CELL);
  for(let cy=cy0;cy<=cy1;cy++)for(let cx=cx0;cx<=cx1;cx++){const a=GRID.get(cx+','+cy);if(!a)continue;for(const s of a){if(s.stamp!==STAMP){s.stamp=STAMP;QBUF.push(s);}}}return QBUF;}
function closest(px,py,s){const dx=s.bx-s.ax,dy=s.by-s.ay,l2=dx*dx+dy*dy||1;const t=clamp(((px-s.ax)*dx+(py-s.ay)*dy)/l2,0,1);return [s.ax+dx*t,s.ay+dy*t];}
function solidAt(x,y){for(const p of POLYS){const b=p.bb;if(x<b[0]||x>b[2]||y<b[1]||y>b[3])continue;if(inPoly(x,y,p.pts))return true;}return false;}

/* ================= PHYSICS ================= */
let ARMV=.2, ARMA=1, HOLDD=.25, OSPD_T=.12, holdN=0;
const HOLDMIN=24; // the pick must be planted ~50ms before a swing can throw you
const STICK=7; let CMAX=2.2, VARM=750/480;
const HZ=480, DT=1/HZ, R=25, HR=7, HEAD_V=3200, DAMP=.99975, VMAX=1300/HZ;
const B={x:0,y:0,px:0,py:0}, H={x:0,y:0}, O={x:40,y:30};
const _bp={x:0,y:0};
let OSPD=0;const OP={x:0,y:0};
let headContact=null, prevContact=null, grounded=false, groundMat=null, effort=0, landImpact=0, headImpact=0;
function bodyCollide(){
  for(let it=0;it<3;it++){
    const segs=query(B.x,B.y,R+2);let any=false;
    for(const s of segs){

    acc+=dt;let n=0;
    while(acc>=DT&&n<24){physStep();acc-=DT;n++;
      if(headImpact){const v=clamp(headImpact/2200,0,1);hitSound(impactMat,v);const col=impactMat==='grass'?'#8a6a4a':impactMat==='ice'?'#ffffff':impactMat==='wood'?'#c89a62':'#d8dbe2';burst(impactX,impactY,col,Math.round(4+v*8),120+v*160,'dust',impactN);if(impactMat==='rock'||impactMat==='metal')burst(impactX,impactY,'#ffd36b',Math.round(3+v*6),260+v*200,'spark',impactN);shake=Math.max(shake,v*4);headImpact=0;}
      if(landImpact){const v=clamp((landImpact-420)/1400,0,1);if(v>.05){sfx('thud',.3+v*.7);G.squash=Math.max(G.squash,.15+v*.5);burst(B.x,B.y+R,'#e8e0d0',Math.round(4+v*10),80+v*160,'dust',[0,-1]);shake=Math.max(shake,v*7);}landImpact=0;}
    }
    if(n>=24)acc=0;
    gameTick(dt);
  } else if(G.state==='title'){ // idle demo: gentle sway of the pickaxe
    O.x=60+Math.cos(simT*.8)*40;O.y=-10+Math.sin(simT*1.1)*30;acc+=dt;let n=0;while(acc>=DT&&n<24){physStep();acc-=DT;n++;}headImpact=landImpact=0;
  }
  // animation state
  const vx=(B.x-B.px)*HZ, vy=(B.y-B.py)*HZ;
  const tl=clamp((H.x-B.x)/D.L*.32+vx*.00018,-.45,.45);G.leanV+=( (tl-G.lean)*60-G.leanV*9)*dt;G.lean+=G.leanV*dt;
  G.squash=Math.max(0,G.squash-dt*2.2);
  G.blink-=dt;if(G.blink<0)G.blink=2.5+Math.random()*3;
  G.faceT-=dt;if(G.faceT<=0){G.face=effort>.55&&headContact?'effort':'idle';}
  trail.push([H.x,H.y]);while(trail.length>7)trail.shift();
  const hs=trail.length>1?hyp(trail[trail.length-1][0]-trail[0][0],trail[trail.length-1][1]-trail[0][1]):0;if(hs<40)trail.length=Math.max(0,trail.length-2);
  shake=Math.max(0,shake-dt*25);
  updParts(dt);
  // camera
  const tx=B.x,ty=B.y-VH*ANCHOR/Z;
  if(camSnap){cam.x=tx;cam.y=ty;camSnap=false;}else{const k=1-Math.exp(-dt*9);cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;}
  // wind
  if(AU.wind){const sp=hyp(vx,vy);AU.wind.gain.value=SAVE.set.snd&&G.state==='play'?clamp((sp-500)/2500,0,.35):0;AU.windF.frequency.value=300+sp*.3;}
  // hud
  if(G.state==='play'){const h=Math.max(0,hNow());$('#hM').innerHTML=`${(h/PX_M).toFixed(1)}<small>m</small>`;$('#hBest').textContent=`さいこう ${(G.best/PX_M).toFixed(1)}m　/　てっぺん ${TOP_H/PX_M}m`;$('#hTime').textContent=fmtT(G.time);$('#hFall').textContent=`落下 ${G.falls}`;
    const me=$('#trMe');if(me)me.style.bottom=clamp(h/TOP_H*100,0,100)+'%';const tb=$('#trBest');if(tb)tb.style.bottom=clamp(G.best/TOP_H*100,0,100)+'%';}
  if(narrT>0){narrT-=dt;if(narrT<=0)$('#narr').classList.remove('on');}
  if(hintT>0){hintT-=dt;if(hintT<=0)$('#hint').classList.remove('on');}
}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render(simT);requestAnimationFrame(frame);}
placeAt(CPS[0].x,0);renderTitle();requestAnimationFrame(frame);
window.__gc={setArm:(v,a,c,vm,hd,ot)=>{ARMV=v;ARMA=a;if(c)CMAX=c;if(vm)VARM=vm/480;if(hd!=null)HOLDD=hd;if(ot)OSPD_T=ot;},query,SEGS,GRID,headHit,get hc(){return headContact;},get grounded(){return grounded;},B,H,O,G,step:(n)=>{for(let i=0;i<n;i++)update(1/60);},start:startGame,get D(){return D;},physStep,solidAt,placeAt,hNow};
})();
