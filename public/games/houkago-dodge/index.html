<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#152c32"><title>放課後ドッジ！</title>
<style>
:root{color-scheme:light;--ink:#183137;--paper:#faf8ee;--red:#d94936;--blue:#2778a5;--yellow:#ffda66;--court:#e7ba82}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;background:var(--ink);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
button,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;touch-action:manipulation}
[hidden]{display:none!important}

/* ---- 上の細いスコア帯：左右にチーム、まん中に時計 ---- */
#hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:6px max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));background:var(--paper);border-bottom:3px solid var(--ink)}
.team{min-width:0;display:grid;gap:3px}
.team.blue{justify-items:end}
.tname{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;white-space:nowrap}
.tname i{font-style:normal;color:#fff;border-radius:3px;padding:1px 5px;font-size:11px}
.red .tname i{background:var(--red)} .blue .tname i{background:var(--blue)}
.red{color:var(--red)} .blue{color:var(--blue)}
.hearts{display:flex;gap:4px}
.member-hp{display:flex;align-items:center;gap:2px;border:1.5px solid transparent;border-radius:4px;padding:1px 4px;font-size:13px;line-height:1.2;white-space:nowrap}
.member-hp b{font-size:10px}.member-hp i{font-style:normal;opacity:.2}
.member-hp.current{border-color:currentColor;background:#fff}
.member-hp.out{opacity:.3}
.power{width:min(150px,100%);height:5px;background:#e4e3d6;border-radius:2px;overflow:hidden}
.power span{display:block;height:100%;width:0;background:currentColor;transition:width .08s}
.team small{display:none}
@media (max-width:520px){.member-hp b{display:none}.sysbtns{gap:3px}.match div:not(.sysbtns){font-size:9px}.member-hp{font-size:10px;padding:0 1px;gap:1px}.hearts{gap:1px}.tname{font-size:11px}.match strong{font-size:24px}.sysbtns button{font-size:9px;padding:2px 5px}#hud{gap:4px;padding-left:6px;padding-right:6px}}
@media (max-height:480px){#hud{padding-top:3px;padding-bottom:3px}.match{display:grid;grid-template-columns:auto auto;column-gap:8px;align-items:center}.match #round{grid-column:1}.match strong{grid-column:2;grid-row:1/3;font-size:28px}.match div:not(.sysbtns){grid-column:1}.sysbtns{grid-column:1/3}.power{height:4px}}
.match{text-align:center;line-height:1}
.match #round{display:block;font-size:10px;font-weight:900;letter-spacing:1px}
.match strong{display:block;font-family:ui-monospace,monospace;font-size:30px;line-height:1.05}
.match div{font-size:11px;font-weight:900;letter-spacing:1px;white-space:nowrap}
.match div span:first-child{color:var(--red)} .match div span:last-child{color:var(--blue)} .match div b{color:#889;font-size:9px}
.sysbtns{display:flex;gap:6px;justify-content:center;margin-top:3px}
.sysbtns button{font-size:11px;font-weight:800;border:1.5px solid #c7cfca;border-radius:99px;padding:3px 9px;background:#fff}
.sysbtns button:disabled{opacity:.35}

/* ---- コートと操作 ---- */
#stage{flex:1;min-height:0;position:relative;background:var(--court);overflow:hidden}
#court{position:absolute;display:block;image-rendering:pixelated;touch-action:none}
#announcement{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:6px 16px;border-radius:4px;font-weight:900;font-size:16px;white-space:nowrap;pointer-events:none;z-index:3}
#announcement:empty{display:none}

/* 操作レイヤー：コートの上に重ねる。スティックは指をおいた所が中心になる */
#pad{position:absolute;inset:0;z-index:4;display:none}
body.touch.playing #pad{display:block}
.zone{position:absolute;top:0;bottom:0;touch-action:none}
.stick{position:absolute;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;background:rgba(24,49,55,.16);border:3px solid rgba(24,49,55,.35);pointer-events:none;transition:opacity .15s}
.stick b{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.88);border:3px solid rgba(24,49,55,.6);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.stick.idle{opacity:.55}
.zone.red .stick b{border-color:var(--red)} .zone.blue .stick b{border-color:var(--blue)}
.act{position:absolute;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;border:3px solid rgba(255,255,255,.9);box-shadow:0 3px 0 rgba(0,0,0,.25);touch-action:none;line-height:1.15;text-align:center}
.act.throw{width:96px;height:96px;font-size:16px}
.act.jump{width:68px;height:68px;font-size:13px;background:rgba(24,49,55,.72)}
.act.on{transform:scale(.92);filter:brightness(1.25)}
.red .act.throw{background:rgba(217,73,54,.88)} .blue .act.throw{background:rgba(39,120,165,.88)}
.act small{display:block;font-size:10px;opacity:.9}
.act.charging{box-shadow:0 0 0 6px rgba(255,218,102,.85)}

/* ---- はじめ・おやすみ・結果のカード（画面全体の上に出す） ---- */
#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(23,50,50,.45);overflow-y:auto}
#overlay.hidden{display:none}
.start-card{width:min(440px,100%);margin:auto;padding:16px 18px;background:#fffced;border:3px solid var(--ink);border-radius:8px;text-align:center;box-shadow:6px 6px 0 rgba(23,50,50,.7)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:1px}
.start-card h2{font-size:24px;font-weight:900;margin:6px 0}
.start-card p{font-size:13px;line-height:1.7;margin:4px 0 10px}
.mode-choices{display:flex;gap:8px;margin:10px 0}
.mode-choices button{flex:1;border:2px solid #bac6bb;border-radius:6px;font-size:14px;font-weight:800;padding:9px 6px;white-space:nowrap}
.mode-choices button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.settings{display:flex;gap:12px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.settings label{font-size:13px;font-weight:bold}
.settings select{display:block;margin-top:4px;background:#fff;padding:6px 10px;border:1px solid #c6c9bb;border-radius:4px;font-size:14px}
.start{width:100%;border:2px solid var(--ink);border-radius:6px;background:var(--yellow);padding:12px;font-size:18px;font-weight:900;box-shadow:0 4px 0 var(--ink)}
.start-card>small{display:block;margin-top:10px;font-size:12px;color:#637472;line-height:1.6}
.menu-button{border-bottom:1px solid #9daaa0;font-size:13px;margin-top:12px;padding:4px 2px}
.howto{margin-top:12px;padding-top:10px;border-top:1px dashed #cdd4cb;font-size:12px;line-height:1.8;color:#455;text-align:left}
.howto b{color:var(--ink)}
kbd{display:inline-block;min-width:20px;padding:0 4px;border:1px solid #bbc4bd;border-bottom-width:2px;border-radius:3px;background:#fff;font:700 11px ui-monospace,monospace;text-align:center}
body.touch .keys{display:none} body:not(.touch) .touchhelp{display:none}
#rotate{display:none;font-size:12px;font-weight:800;color:#a16418;margin-top:8px}
body.touch.portrait #rotate{display:block}
@media (max-height:480px){.start-card{width:min(620px,100%);padding:10px 14px}.eyebrow,#overlayText{display:none}.start-card h2{font-size:19px;margin:0 0 4px}
 .mode-choices{margin:6px 0}.mode-choices button{padding:7px 6px}.settings{margin-bottom:8px}.settings select{display:inline-block;margin:0 0 0 6px;padding:4px 8px}
 .start{padding:9px;font-size:16px}.start-card>small{margin-top:6px}.howto{margin-top:6px;padding-top:6px;font-size:11px;line-height:1.6}}
</style></head>
<body>
<header id="hud">
  <div class="team red"><span class="tname"><i>1P</i>あか</span><div class="hearts" id="hp0"></div><div class="power"><span id="power0"></span></div><small id="status0"></small></div>
  <div class="match"><span id="round">ROUND 01</span><strong id="timer">60</strong><div><span id="wins0">○ ○</span><b> VS </b><span id="wins1">○ ○</span></div>
    <div class="sysbtns"><button id="pause" disabled>おやすみ</button><button id="sound" aria-pressed="false">音 OFF</button></div></div>
  <div class="team blue"><span class="tname">あお<i id="bluePlayer">CPU</i></span><div class="hearts" id="hp1"></div><div class="power"><span id="power1"></span></div><small id="status1"></small></div>
</header>

<main id="stage">
  <canvas id="court" width="960" height="480" aria-label="赤と青、それぞれ内野3人・外野3人のコート"></canvas>
  <div id="announcement" aria-live="polite"></div>
  <div id="pad">
    <div class="zone red" id="z0" data-team="0"><div class="stick idle"><b></b></div><button class="act jump" data-code="KeyG" type="button">ジャンプ</button><button class="act throw" data-code="KeyF" type="button">なげる<small>とる</small></button></div>
    <div class="zone blue" id="z1" data-team="1"><div class="stick idle"><b></b></div><button class="act jump" data-code="KeyL" type="button">ジャンプ</button><button class="act throw" data-code="KeyK" type="button">なげる<small>とる</small></button></div>
  </div>
</main>

<div id="overlay"><div class="start-card">
  <span class="eyebrow" id="eyebrow">内野3人 ＋ 外野3人のチーム戦</span>
  <h2 id="overlayTitle">さあ、ドッジしよう！</h2>
  <p id="overlayText"></p>
  <div class="mode-choices" id="modeChoices" role="group" aria-label="あそぶ人数"><button id="soloMode" aria-pressed="true">ひとりで あそぶ</button><button id="duoMode" aria-pressed="false">ふたりで あそぶ</button></div>
  <div class="settings" id="settings">
    <label class="red">1P あか<select id="assist0"><option value="easy">やさしい</option><option value="normal">ふつう</option></select></label>
    <label class="blue" id="humanBlueSetting" hidden>2P あお<select id="assist1"><option value="easy">やさしい</option><option value="normal">ふつう</option></select></label>
    <label class="blue" id="cpuSetting">コンピューター<select id="cpuLevel"><option value="easy">やさしい</option><option value="normal">ふつう</option></select></label>
  </div>
  <button class="start" id="start">ひとりで スタート</button>
  <small id="startHint"></small>
  <p id="rotate">スマホを よこにすると、大きく あそべるよ</p>
  <button id="menu" class="menu-button" hidden>タイトルへもどる</button>
  <div class="howto" id="howto">
    <div class="touchhelp"><b>左の指</b>：画面をなぞって いどう ／ <b>右の指</b>：なげる・とる、ジャンプ<br>なげるを ながおし → 必殺シュート！<br><span id="duoHelp" hidden>ふたりのときは、1Pが左はし、2Pが右はしを つかうよ</span></div>
    <div class="keys"><b class="red">1P</b> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> いどう <kbd>F</kbd> なげる/とる <kbd>G</kbd> ジャンプ<br><b class="blue">2P</b> <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> いどう <kbd>K</kbd> なげる/とる <kbd>L</kbd> ジャンプ　<kbd>ESC</kbd> おやすみ</div>
  </div>
</div></div>
<div hidden><span id="modeTag"></span><span id="blueBadge"></span><span id="blueSideHint"></span><div id="manualBlue"></div><p id="cpuHelp"></p></div>
<script>
'use strict';
(() => {
const $=id=>document.getElementById(id),canvas=$('court'),ctx=canvas.getContext('2d');
const W=960,H=480,keys=new Set(),colors=['#da4835','#287fac'],actions=['KeyF','KeyK'],jumps=['KeyG','KeyL'];
const blueKeys=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyK','KeyL'];
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const bounds={left:140,right:820,top:192,bottom:405};
let mode='start',playMode='solo',cpuLevel='easy',previous=0,accumulator=0,time=90,round=1,wins=[0,0];
let players=[],outfield=[],selected=[null,null],pressedBy=[null,null],ball,particles=[],texts=[],clock=0,notice=0,audio,sound=false;
let outfieldShots=[0,0],lastWinner=-1;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const alive=team=>players.filter(p=>p.team===team&&p.hp>0);
const teamHp=team=>alive(team).reduce((n,p)=>n+p.hp,0);
const human=team=>team===0||playMode==='duo';
const distance=(p,x=ball.x,y=ball.y+18)=>Math.hypot(p.x-x,p.y-y);
const nearest=(list,x=ball.x,y=ball.y+18)=>list.reduce((best,p)=>!best||distance(p,x,y)<distance(best,x,y)?p:best,null);
function beep(freq=440,duration=.1,type='square',volume=.035){if(!sound)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration);}catch{}}
function say(s){$('announcement').textContent=s;notice=1.8;}
function pop(s,x,y,color='#183137'){texts.push({s,x,y,life:1.1,color});}
function burst(x,y,color,n=12){for(let i=0;i<(reduce?4:n);i++){const a=Math.random()*Math.PI*2;particles.push({x,y,vx:Math.cos(a)*(40+Math.random()*120),vy:Math.sin(a)*(40+Math.random()*120),life:.5+Math.random()*.3,color});}}
function character(team,slot,out=false){
 const homeX=out?(slot===0?(team?90:870):(team?305:655)):(team?960-[265,370,240][slot]:[265,370,240][slot]);
 const homeY=out?[305,175,450][slot]:[240,305,375][slot];
 return {id:team*6+(out?3:0)+slot,team,slot,out,x:homeX,y:homeY,homeX,homeY,hp:3,catch:0,cool:0,jump:0,jumpCool:0,stun:0,immune:0,charge:0,charging:false,walking:false,facing:team?-1:1,easy:$('assist'+team).value==='easy',ai:{hold:0,wait:.8+Math.random()*.6,chargeTarget:0,shot:null,react:0,defense:'none',phase:Math.random()*6}};
}
function resetRound(){
 players=[0,1].flatMap(t=>[0,1,2].map(s=>character(t,s)));
 outfield=[0,1].flatMap(t=>[0,1,2].map(s=>character(t,s,true)));
 ball={x:265,y:222,owner:null,team:0,shot:false,power:false,vx:0,vy:0,life:0,trail:[],looseTime:0,relay:null,entered:false};
 time=90;particles=[];texts=[];outfieldShots=[0,0];pressedBy=[null,null];keys.clear();take(players[0]);selectPlayers();updateHud();
}
function selectPlayers(){for(let t=0;t<2;t++){
 const members=alive(t);
 selected[t]=ball.owner&&!ball.owner.out&&ball.owner.team===t?ball.owner:nearest(members);
}}
function stopInputs(){keys.clear();pressedBy=[null,null];for(const p of [...players,...outfield]){p.charging=false;p.charge=0;}}
function newMatch(){cpuLevel=$('cpuLevel').value;wins=[0,0];round=1;resetRound();mode='play';$('overlay').classList.add('hidden');$('pause').disabled=false;$('pause').textContent='おやすみ';say('内野3人＋外野3人！ スタート');beep(600,.16);}
function updateHud(){for(let t=0;t<2;t++){
 const p=selected[t],members=players.filter(p=>p.team===t);
 $('hp'+t).innerHTML=members.map(p=>'<span class="member-hp '+(p===selected[t]?'current ':'')+(p.hp===0?'out':'')+'"><b>'+ (p.slot+1)+'</b><span>'+ '♥'.repeat(p.hp)+'<i>'+'♥'.repeat(3-p.hp)+'</i></span></span>').join('');
 $('hp'+t).setAttribute('aria-label',(t?'あお':'あか')+' 内野'+alive(t).length+'人、体力'+teamHp(t));
 $('power'+t).style.width=(p?Math.min(100,p.charge/.8*100):0)+'%';
 const owner=ball.owner;
 $('status'+t).textContent=owner?.out&&owner.team===t?'外野が自動で投げるよ':p?.charging?(p.charge>=.8?'必殺！ はなして投げよう':'ためているよ…'):human(t)?'操作：'+(p?p.slot+1:'−')+'番 ／ 内野'+alive(t).length+'人・外野3人':'CPU ／ 内野'+alive(t).length+'人・外野3人';
 }
 $('timer').textContent=String(Math.ceil(time)).padStart(2,'0');$('round').textContent='ROUND '+String(round).padStart(2,'0');
 for(let t=0;t<2;t++)$('wins'+t).textContent='● '.repeat(wins[t])+'○ '.repeat(Math.max(0,2-wins[t]));
}
function catchPose(p){if(!p||p.hp<=0||p.stun>0||p.cool>0)return;p.catch=p.easy&&human(p.team)?.6:.28;p.cool=.8;beep(250,.05,'triangle');}
function jump(p){if(!p||p.hp<=0||p.jumpCool>0||p.stun>0)return;p.jump=.7;p.jumpCool=.95;beep(420,.09,'triangle');}
function press(code){if(playMode==='solo'&&blueKeys.includes(code))return;if(keys.has(code))return;keys.add(code);if(mode!=='play')return;selectPlayers();
 const t=actions.indexOf(code);if(t>=0){const p=selected[t];if(!p||p.stun>0)return;pressedBy[t]=p;if(ball.owner===p){p.charging=true;p.charge=0;}else catchPose(p);}
 const j=jumps.indexOf(code);if(j>=0)jump(selected[j]);
}
function release(code){keys.delete(code);const t=actions.indexOf(code);if(t<0)return;const p=pressedBy[t];pressedBy[t]=null;if(!p)return;if(p.charging&&mode==='play'&&ball.owner===p)throwBall(p);p.charging=false;p.charge=0;}
function throwBall(p){
 const target=nearest(alive(1-p.team),p.x,p.y);if(!target)return;
 const special=p.charge>=.8,speed=special?580:p.jump>0?465:350;
 const dx=target.x-p.x,dy=target.y-p.y,len=Math.hypot(dx,dy)||1;p.facing=dx>=0?1:-1;
 ball={x:p.x+dx/len*23,y:p.y-18+dy/len*23,vx:dx/len*speed,vy:dy/len*speed,owner:null,shot:true,team:p.team,power:special,life:0,trail:[],looseTime:0,relay:null,entered:!p.out};
 if(p.out)outfieldShots[p.team]++;
 p.charging=false;p.charge=0;p.catch=0;p.ai.hold=0;
 beep(special?140:310,special?.25:.1,'sawtooth');if(special){say('必殺！ ほうかごシュート！');burst(p.x,p.y-20,'#ffe168',18);}else if(p.out)pop('外野シュート！',p.x,p.y-55,colors[p.team]);
}
function take(p){if(!p||(!p.out&&p.hp<=0))return;ball.owner=p;ball.shot=false;ball.relay=null;ball.trail=[];ball.vx=ball.vy=0;ball.looseTime=0;ball.x=p.x+p.facing*19;ball.y=p.y-21;p.catch=0;p.charging=false;p.charge=0;p.ai.hold=0;p.ai.wait=(p.out?1.1:.7)+Math.random()*.5;if(!p.out)outfieldShots[p.team]=0;selectPlayers();}
function relayTo(p,label){if(!p)return;ball.owner=null;ball.shot=false;ball.trail=[];ball.relay={p,elapsed:0,label};ball.looseTime=0;ball.vx=ball.vy=0;}
function escapedBall(){
 const t=ball.x<bounds.left?1:ball.x>bounds.right?0:ball.x<480?1:0;
 const slot=ball.x<bounds.left||ball.x>bounds.right?0:ball.y<bounds.top?1:2;
 relayTo(outfield.find(p=>p.team===t&&p.slot===slot),'外野がキャッチ！');
}
function finish(){
 const red=teamHp(0),blue=teamHp(1);lastWinner=red===blue?-1:red>blue?0:1;
 if(lastWinner>=0)wins[lastWinner]++;mode='result';stopInputs();updateHud();const done=wins.some(n=>n>=2);
 $('eyebrow').textContent=lastWinner<0?'いい勝負！':done?'きょうのチャンピオン！':'ナイスゲーム！';
 $('overlayTitle').textContent=lastWinner<0?'ひきわけ！':(lastWinner?'あお':'あか')+'チームの勝ち！';
 $('overlayText').textContent=done?'もう一度あそんで、リベンジしよう！':lastWinner<0?'このラウンドをもう一度あそぼう。':'残った内野の体力：あか '+red+' ／ あお '+blue;
 $('settings').hidden=!done;$('modeChoices').hidden=true;$('menu').hidden=false;$('start').textContent=done?'もういちど あそぶ':'つぎのラウンドへ';$('startHint').textContent='あか '+wins[0]+' − '+wins[1]+' あお';$('overlay').classList.remove('hidden');$('pause').disabled=true;beep(760,.3,'triangle');
}
function pause(){if(mode==='play'){mode='paused';stopInputs();$('eyebrow').textContent='ちょっとひとやすみ';$('overlayTitle').textContent='おやすみ中';$('overlayText').textContent='準備ができたら、つづけよう。';$('modeChoices').hidden=true;$('menu').hidden=false;$('settings').hidden=true;$('start').textContent='つづける';$('startHint').textContent='ESC キーでもつづけられるよ';$('overlay').classList.remove('hidden');$('pause').textContent='つづける';}else if(mode==='paused'){mode='play';$('overlay').classList.add('hidden');$('pause').textContent='おやすみ';}}

      else{thX=zw-B-m;thY=h-B-m-6;jpX=thX-J-12;jpY=h-J-m-B*.55;}
      hx=right?zw-R-m-6:R+m+6;hy=h-R-m-6;
      s.minX=right?zw*.45:0;s.maxX=right?zw:zw*(duo?.55:.6);
    }
    place(th,thX,thY);place(jp,jpX,jpY);s.home=[hx,hy];if(s.id===null)place(s.el,hx,hy);
  });
  lay={portrait,top,h,useSide};
}
function setDir(t,dx,dy){
  const s=sticks[t],len=Math.hypot(dx,dy),want=new Set();
  if(len>14){const nx=dx/len,ny=dy/len;if(nx<-.38)want.add(DIRS[t][0]);if(nx>.38)want.add(DIRS[t][1]);if(ny<-.38)want.add(DIRS[t][2]);if(ny>.38)want.add(DIRS[t][3]);}
  for(const c of s.held)if(!want.has(c)){release(c);s.held.delete(c);}
  for(const c of want)if(!s.held.has(c)){keys.delete(c);press(c);s.held.add(c);}
  const k=Math.min(1,len/46);s.knob.style.transform=len?`translate(${dx/len*k*40}px,${dy/len*k*40}px)`:'';
}
function stickOff(t){const s=sticks[t];setDir(t,0,0);s.id=null;s.el.classList.add('idle');place(s.el,...s.home);}
zones.forEach((z,t)=>{
  z.addEventListener('pointerdown',e=>{if(e.target.closest('.act'))return;const s=sticks[t],r=z.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    if(s.id!==null||x<s.minX||x>s.maxX)return;e.preventDefault();try{z.setPointerCapture(e.pointerId);}catch{}
    s.id=e.pointerId;s.ox=x;s.oy=y;place(s.el,x,y);s.el.classList.remove('idle');});
  z.addEventListener('pointermove',e=>{const s=sticks[t];if(e.pointerId!==s.id)return;const r=z.getBoundingClientRect();let dx=e.clientX-r.left-s.ox,dy=e.clientY-r.top-s.oy;
    // 指が遠くへ行ったら、スティックの中心もついてくる
    const len=Math.hypot(dx,dy);if(len>60){s.ox+=dx/len*(len-60);s.oy+=dy/len*(len-60);place(s.el,s.ox,s.oy);dx=e.clientX-r.left-s.ox;dy=e.clientY-r.top-s.oy;}
    setDir(t,dx,dy);});
  for(const ev of ['pointerup','pointercancel','lostpointercapture'])z.addEventListener(ev,e=>{if(e.pointerId===sticks[t].id)stickOff(t);});
});
document.querySelectorAll('.act').forEach(b=>{b.addEventListener('pointerdown',()=>b.classList.add('on'));for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>b.classList.remove('on'));b.addEventListener('contextmenu',e=>e.preventDefault());});
function setTouch(){if(!document.body.classList.contains('touch')){document.body.classList.add('touch');layout();}}
if(matchMedia('(pointer: coarse)').matches)document.body.classList.add('touch');
addEventListener('touchstart',setTouch,{passive:true});
addEventListener('resize',layout);if(window.ResizeObserver)new ResizeObserver(layout).observe(stage);
let lastMode='',lastPlay='';
(function watch(){
  if(mode!==lastMode){document.body.classList.toggle('playing',mode==='play');if(mode!=='play'){stickOff(0);stickOff(1);}lastMode=mode;}
  if(playMode!==lastPlay){lastPlay=playMode;$('duoHelp').hidden=playMode!=='duo';layout();}
  for(let t=0;t<2;t++)zones[t].querySelector('.throw').classList.toggle('charging',!!(selected[t]&&selected[t].charging));
  requestAnimationFrame(watch);
})();
layout();
window.__dodge={get mode(){return mode},get playMode(){return playMode},get selected(){return selected},get ball(){return ball},keys,layout};

titleScreen();requestAnimationFrame(frame);
})();
