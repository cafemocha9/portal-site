<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>はずむリズム</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1d1b2f; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "M PLUS Rounded 1c", "Noto Sans JP", system-ui, sans-serif;
    color: #fff; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
  }
  canvas { position: fixed; inset: 0; display: block; }
  svg { width: 1em; height: 1em; flex: none; }

  .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 20px; z-index: 5; overflow-y: auto; }
  .screen.on { display: flex; }
  .panel { width: min(560px, 100%); margin: auto; text-align: center; }

  .logo { font-size: clamp(40px, 10vw, 64px); font-weight: 900; letter-spacing: .04em; line-height: 1.1;
    background: linear-gradient(180deg, #fff6c9, #ffc35c); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #b4581f); animation: bob 0.6s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0) } to { transform: translateY(-6px) } }
  .sub { margin: 10px 0 26px; color: #d9d3ff; font-size: 15px; letter-spacing: .1em; }

  .cards { display: grid; gap: 14px; }
  .card { display: flex; align-items: center; gap: 16px; width: 100%; padding: 16px 18px; border: 0; border-radius: 22px; cursor: pointer;
    color: #24203a; text-align: left; font: inherit; box-shadow: 0 6px 0 rgba(0,0,0,.25); transition: transform .08s; }
  .card:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .card .ic { width: 60px; height: 60px; border-radius: 18px; background: rgba(255,255,255,.55); display: grid; place-items: center; font-size: 34px; }
  .card .tt { font-size: 21px; font-weight: 900; }
  .card .ds { font-size: 13px; opacity: .75; margin-top: 2px; }
  .card .best { margin-left: auto; font-size: 12px; font-weight: 900; padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.6); white-space: nowrap; }
  .c1 { background: linear-gradient(135deg, #ffd36b, #ff9f5a); }
  .c2 { background: linear-gradient(135deg, #a5f0c5, #5fc9b3); }
  .c3 { background: linear-gradient(135deg, #ffd0e0, #f59bbb); }
  .c4 { background: linear-gradient(135deg, #c9c2ff, #8fa8ff); }

  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 54px; padding: 0 24px; border: 0; border-radius: 999px; font: inherit;
    font-size: 18px; font-weight: 900; cursor: pointer; color: #2b2140; background: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .btn.main { background: #ffc94d; }
  .btn.ghost { background: rgba(255,255,255,.14); color: #fff; box-shadow: none; }
  .btn svg { font-size: 22px; }

  .gtitle { font-size: clamp(30px, 8vw, 44px); font-weight: 900; }
  .howto { margin: 18px auto 0; max-width: 440px; padding: 18px 20px; border-radius: 20px; background: rgba(0,0,0,.28); line-height: 1.9; font-size: 16px; text-align: left; }
  .howto b { color: #ffd66b; }
  .note { margin-top: 12px; font-size: 13px; color: #cfc8f5; }

  .rank { font-size: clamp(38px, 10vw, 60px); font-weight: 900; margin: 6px 0 4px; }
  .rank.r3 { color: #ffd24d; text-shadow: 0 0 24px rgba(255,210,77,.6); }
  .rank.r2 { color: #9ff0ff; }
  .rank.r1 { color: #ffb0c8; }
  .comment { font-size: 16px; color: #ece8ff; min-height: 1.6em; }
  .meter { height: 14px; border-radius: 99px; background: rgba(255,255,255,.15); margin: 18px auto 10px; max-width: 360px; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #ffb347, #ffe06b); transition: width 1s cubic-bezier(.2,.8,.2,1); }
  .stats { display: flex; justify-content: center; gap: 18px; font-size: 15px; color: #e3ddff; }
  .stats b { font-size: 20px; color: #fff; }

  .setting { margin: 18px auto 0; max-width: 420px; text-align: left; background: rgba(0,0,0,.28); border-radius: 20px; padding: 18px 20px; }
  .setting label { display: flex; justify-content: space-between; font-weight: 900; margin-bottom: 8px; }
  .setting input[type=range] { width: 100%; accent-color: #ffc94d; height: 28px; }
  .setting + .setting { margin-top: 12px; }
  .setting p { font-size: 13px; color: #cfc8f5; margin-top: 6px; line-height: 1.6; }

  #quit { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; z-index: 6; width: 48px; height: 48px; border-radius: 50%; border: 0;
    background: rgba(0,0,0,.3); color: #fff; font-size: 26px; display: none; place-items: center; cursor: pointer; }
  #quit.on { display: grid; }
  #tapzone { position: fixed; inset: 0; z-index: 4; display: none; }
  #tapzone.on { display: block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="tapzone"></div>
<button id="quit" aria-label="やめる"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>

<!-- タイトル -->
<section class="screen on" id="s-menu">
  <div class="panel">
    <div class="logo">はずむリズム</div>
    <p class="sub">きいて、まって、タップ！</p>
    <div class="cards" id="cards"></div>
    <div class="row">
      <button class="btn ghost" id="b-settings"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5H3"></path><path d="M12 19H3"></path><path d="M14 3v4"></path><path d="M16 17v4"></path><path d="M21 12h-9"></path><path d="M21 19h-5"></path><path d="M21 5h-7"></path><path d="M8 10v4"></path><path d="M8 12H3"></path></svg> 音とタイミング</button>
    </div>
  </div>
</section>

<!-- あそびかた -->
<section class="screen" id="s-intro">
  <div class="panel">
    <div class="gtitle" id="i-title"></div>
    <div class="howto" id="i-howto"></div>
    <p class="note" id="i-note">画面のどこをタップしてもOK（キーボードならスペースキー）</p>
    <div class="row">
      <button class="btn" id="b-practice"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"></path><path d="M22 10v6"></path><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path></svg> れんしゅう</button>
      <button class="btn main" id="b-play"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"></path></svg> ほんばん</button>
      <button class="btn" id="b-endless"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16c5 0 7-8 12-8a4 4 0 0 1 0 8c-5 0-7-8-12-8a4 4 0 1 0 0 8"></path></svg> むげん</button>
    </div>
    <p class="note">ほんばん：きまった長さで、さいごに評価　／　むげん：3回ミスするまで ずっとつづく</p>
    <div class="row"><button class="btn ghost" id="b-back1"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg> もどる</button></div>
  </div>
</section>

<!-- けっか -->
<section class="screen" id="s-result">
  <div class="panel">
    <div class="gtitle" id="r-title" style="font-size:22px;opacity:.85"></div>
    <div class="rank" id="r-rank"></div>
    <div class="comment" id="r-comment"></div>
    <div class="meter"><i id="r-meter"></i></div>
    <div class="stats" id="r-stats"></div>
    <div class="row">
      <button class="btn main" id="b-retry"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg> もういちど</button>
      <button class="btn" id="b-menu"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="14" rx="1"></rect><rect width="7" height="7" x="3" y="14" rx="1"></rect></svg> ほかのゲーム</button>
    </div>
  </div>
</section>

<!-- せってい -->
<section class="screen" id="s-settings">
  <div class="panel">
    <div class="gtitle">音とタイミング</div>
    <div class="setting">
      <label><span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"></path><path d="M16 9a5 5 0 0 1 0 6"></path><path d="M19.364 18.364a9 9 0 0 0 0-12.728"></path></svg> 音の大きさ</span><span id="v-vol"></span></label>
      <input type="range" id="in-vol" min="0" max="100" step="5">
    </div>
    <div class="setting">
      <label><span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="10" x2="14" y1="2" y2="2"></line><line x1="12" x2="15" y1="14" y2="11"></line><circle cx="12" cy="14" r="8"></circle></svg> タイミングのずれ</span><span id="v-off"></span></label>
      <input type="range" id="in-off" min="-200" max="200" step="5">
      <p>イヤホン（とくにBluetooth）だと音が少しおくれて聞こえます。「はかる」で自動で合わせられます。</p>
      <div class="row" style="margin-top:12px"><button class="btn" id="b-calib"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="10" x2="14" y1="2" y2="2"></line><line x1="12" x2="15" y1="14" y2="11"></line><circle cx="12" cy="14" r="8"></circle></svg> はかる</button></div>
    </div>
    <div class="row"><button class="btn ghost" id="b-back2"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg> もどる</button></div>
  </div>
</section>

<script>
'use strict';
/* =========================================================================
   はずむリズム — 音はすべてWeb Audioでその場で合成（音声ファイルなし）
   タイミング判定は「実際に耳に届いている音の時刻」を基準にする
   ========================================================================= */

const $ = (s) => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem('hazumu:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('hazumu:' + k, JSON.stringify(v)); } catch {} },
};
const settings = { vol: store.get('vol', 80), offset: store.get('offset', 0) };

/* ---------------------------------- 音 ---------------------------------- */
let ac = null, master, musicBus, sfxBus, revSend, noiseBuf;
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

function initAudio() {
  if (ac) { if (ac.state !== 'running') ac.resume(); return; }
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
  const AC = window.AudioContext || window.webkitAudioContext;
  ac = new AC({ latencyHint: 'interactive' });

  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
  master = ac.createGain(); master.gain.value = settings.vol / 100;
  master.connect(comp); comp.connect(ac.destination);

  musicBus = ac.createGain(); musicBus.gain.value = 0.62; musicBus.connect(master);
  sfxBus = ac.createGain(); sfxBus.gain.value = 1.0; sfxBus.connect(master);

  // 小さな部屋の響き（ノイズから作ったインパルス応答）
  const len = Math.floor(ac.sampleRate * 1.6);
  const ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
  }
  const conv = ac.createConvolver(); conv.buffer = ir;
  revSend = ac.createGain(); revSend.gain.value = 0.22;
  revSend.connect(conv); conv.connect(master);

  noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  ac.resume();
}

function env(param, t, a, d, peak, floor = 0.0001) {
  param.cancelScheduledValues(t);
  param.setValueAtTime(floor, t);
  param.exponentialRampToValueAtTime(peak, t + a);
  param.exponentialRampToValueAtTime(floor, t + a + d);
}
function noise(t, dur) { const s = ac.createBufferSource(); s.buffer = noiseBuf; s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05); return s; }
function osc(type, f, t, dur) { const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.start(t); o.stop(t + dur + 0.05); return o; }
function gainNode(dest) { const g = ac.createGain(); g.gain.value = 0; g.connect(dest); return g; }
function filt(type, f, q = 1) { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; }

const I = {
  kick(t, v = 1, dest = musicBus) {
    const o = osc('sine', 150, t, 0.5); o.frequency.exponentialRampToValueAtTime(44, t + 0.13);
    const g = gainNode(dest); env(g.gain, t, 0.002, 0.42, 0.95 * v); o.connect(g);
    const c = osc('triangle', 900, t, 0.02); const cg = gainNode(dest); env(cg.gain, t, 0.001, 0.015, 0.25 * v); c.connect(cg);
  },
  snare(t, v = 1, dest = musicBus) {
    const n = noise(t, 0.25); const bp = filt('bandpass', 1900, 0.8); const g = gainNode(dest); env(g.gain, t, 0.002, 0.18, 0.5 * v);
    n.connect(bp); bp.connect(g);
    const o = osc('triangle', 210, t, 0.12); o.frequency.exponentialRampToValueAtTime(150, t + 0.08);
    const og = gainNode(dest); env(og.gain, t, 0.002, 0.09, 0.45 * v); o.connect(og);
    const s = gainNode(revSend); env(s.gain, t, 0.002, 0.12, 0.25 * v); bp.connect(s);
  },
  hat(t, v = 1, open = false, dest = musicBus) {
    const n = noise(t, open ? 0.3 : 0.06); const hp = filt('highpass', 7500, 0.7); const g = gainNode(dest);
    env(g.gain, t, 0.001, open ? 0.22 : 0.035, 0.22 * v); n.connect(hp); hp.connect(g);
  },
  shaker(t, v = 1) {
    const n = noise(t, 0.08); const bp = filt('bandpass', 5200, 1.4); const g = gainNode(musicBus);
    env(g.gain, t, 0.012, 0.05, 0.14 * v); n.connect(bp); bp.connect(g);
  },
  rim(t, v = 1) {
    const o = osc('square', 1700, t, 0.03); const bp = filt('bandpass', 1700, 6); const g = gainNode(musicBus);
    env(g.gain, t, 0.001, 0.03, 0.35 * v); o.connect(bp); bp.connect(g);
  },
  clap(t, v = 1) {
    const n = noise(t, 0.3); const bp = filt('bandpass', 1300, 1.1); const g = gainNode(musicBus);
    g.gain.setValueAtTime(0.0001, t);
    [0, 0.011, 0.022].forEach((d) => { g.gain.setValueAtTime(0.45 * v, t + d); g.gain.exponentialRampToValueAtTime(0.05, t + d + 0.009); });
    g.gain.setValueAtTime(0.4 * v, t + 0.033); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    n.connect(bp); bp.connect(g); const s = gainNode(revSend); s.gain.value = 0.3 * v; bp.connect(s);
  },
  bass(t, m, dur, v = 1) {
    const f = mtof(m); const o = osc('sawtooth', f, t, dur); const o2 = osc('square', f / 2, t, dur);
    const lp = filt('lowpass', 900, 3); lp.frequency.setValueAtTime(1100, t); lp.frequency.exponentialRampToValueAtTime(260, t + Math.min(dur, 0.3));
    const g = gainNode(musicBus); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.32 * v, t + 0.01);
    g.gain.setValueAtTime(0.3 * v, t + dur * 0.8); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const g2 = ac.createGain(); g2.gain.value = 0.4; o.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g);
  },
  subBass(t, m, dur, v = 1) {
    const o = osc('sine', mtof(m), t, dur); const g = gainNode(musicBus);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5 * v, t + 0.02);
    g.gain.setValueAtTime(0.45 * v, t + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g);
  },
  pad(t, notes, dur, v = 1, bright = 1400) {
    const lp = filt('lowpass', bright, 0.5); const g = gainNode(musicBus);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07 * v, t + 0.25);
    g.gain.setValueAtTime(0.07 * v, t + dur - 0.2); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.25);
    lp.connect(g); const s = ac.createGain(); s.gain.value = 0.9; lp.connect(s); s.connect(revSend);
    notes.forEach((m) => [-7, 7].forEach((cent) => { const o = osc('sawtooth', mtof(m), t, dur + 0.3); o.detune.value = cent; o.connect(lp); }));
  },
  epiano(t, notes, dur, v = 1) {
    notes.forEach((m) => {
      const f = mtof(m); const o = osc('sine', f, t, dur); const o2 = osc('sine', f * 2.001, t, dur * 0.5);
      const g = gainNode(musicBus); env(g.gain, t, 0.004, dur, 0.1 * v); o.connect(g);
      const g2 = gainNode(musicBus); env(g2.gain, t, 0.002, dur * 0.25, 0.035 * v); o2.connect(g2);
      const s = gainNode(revSend); env(s.gain, t, 0.004, dur, 0.06 * v); o.connect(s);
    });
  },
  marimba(t, m, v = 1) {
    const f = mtof(m); const o = osc('sine', f, t, 0.5); const o2 = osc('sine', f * 3.98, t, 0.1);
    const g = gainNode(musicBus); env(g.gain, t, 0.002, 0.42, 0.22 * v); o.connect(g);
    const g2 = gainNode(musicBus); env(g2.gain, t, 0.001, 0.05, 0.07 * v); o2.connect(g2);
    const s = gainNode(revSend); env(s.gain, t, 0.002, 0.4, 0.12 * v); o.connect(s);
  },
  bell(t, m, v = 1, dest = sfxBus) {
    const f = mtof(m);
    [[1, 0.25, 0.9], [2.76, 0.08, 0.35], [5.4, 0.04, 0.15]].forEach(([r, a, d]) => {
      const o = osc('sine', f * r, t, d); const g = gainNode(dest); env(g.gain, t, 0.002, d, a * v); o.connect(g);
      const s = gainNode(revSend); env(s.gain, t, 0.002, d, a * 0.5 * v); o.connect(s);
    });
  },
  pluck(t, m, dur, v = 1) { // 琴っぽい音
    const f = mtof(m); const o = osc('triangle', f, t, dur); o.frequency.setValueAtTime(f * 1.012, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.06);
    const o2 = osc('sawtooth', f, t, 0.15); const lp = filt('lowpass', 3200, 1); lp.frequency.exponentialRampToValueAtTime(700, t + 0.15);

/* ------------------------------ 時刻の対応 ------------------------------ */
// 実際にスピーカーから出ている音の時刻（AudioContextの時計）
function heardTime(perfNow = performance.now()) {
  if (ac.getOutputTimestamp) {
    const ts = ac.getOutputTimestamp();
    if (ts.contextTime > 0 && ts.performanceTime > 0) return ts.contextTime + (perfNow - ts.performanceTime) / 1000;
  }
  return ac.currentTime - (ac.outputLatency || ac.baseLatency || 0) - (performance.now() - perfNow) / 1000;
}

/* ------------------------------ 譜面の部品 ------------------------------ */
class Chart {
  constructor(bpm) { this.bpm = bpm; this.events = []; this.targets = []; this.cues = []; this.labels = []; this.rests = []; this.endBeat = 0; }
  at(beat, play) { this.events.push({ beat, play }); }
  cue(beat, kind, play, label) { this.cues.push({ beat, kind }); if (play) this.at(beat, play); if (label) this.labels.push({ beat, text: label }); }
  target(beat, kind = 'n', extra = {}) { this.targets.push(Object.assign({ beat, kind, res: null, hitAt: null }, extra)); }
  done() { this.events.sort((a, b) => a.beat - b.beat); this.targets.sort((a, b) => a.beat - b.beat); this.cues.sort((a, b) => a.beat - b.beat); return this; }
}

const GAMES = [];
// むげんモードの並び：進むほど難しい組から選ぶ（every 個ごとに1段階あがる）
function endlessSeq(n, tiers, every, avoidRepeat = []) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const tier = tiers[Math.min(tiers.length - 1, Math.floor(i / every))];
    let pick, guard = 0;
    do { pick = tier[Math.floor(Math.random() * tier.length)]; } while (avoidRepeat.includes(pick) && out[i - 1] === pick && ++guard < 20);
    out.push(pick);
  }
  return out;
}

  else { g.fillStyle = '#6b7c8f'; [-14, 14].forEach((dx) => g.fillRect(x + dx - 7, ey - 1, 14, 3)); }

    g.strokeStyle = '#c4d4e3'; g.lineWidth = 3; g.beginPath(); g.moveTo(x, base - 120 - pop); g.lineTo(x, base - 134 - pop); g.stroke();

  }

  draw(g, beat, S, now) {
    g.fillStyle = '#1d1b2f'; g.fillRect(-2000, -2000, 5000, 5000);
    const k = beat >= 0 ? Math.pow(1 - frac(beat), 3) : 0;
    g.save(); g.shadowColor = '#ffc94d'; g.shadowBlur = 50 * k; g.fillStyle = `rgba(255,201,77,${0.25 + 0.75 * k})`; g.beginPath(); g.arc(500, 330, 90 + 30 * k, 0, 7); g.fill(); g.restore();
    const pa = pressAmt(S, now); if (pa > 0) { g.strokeStyle = `rgba(255,255,255,${pa})`; g.lineWidth = 8; g.beginPath(); g.arc(500, 330, 150, 0, 7); g.stroke(); }
    g.fillStyle = '#fff'; g.textAlign = 'center'; g.font = '900 36px sans-serif';
    g.fillText(beat < 4 ? 'よーく きいて…' : '「コン」に あわせて タップ！', 500, 540);
    g.font = '700 22px sans-serif'; g.fillStyle = '#cfc8f5'; g.fillText(`${S.calibTaps.length} / 12`, 500, 590);
  },
  onWhiff() {}, onMiss() {}, onHit() {},
};

/* ============================ 進行と判定 ============================ */
const PERFECT = 0.050, GOOD = 0.105, NEAR = 0.16;
let S = null, curGame = null, curMode = 'normal';

function frac(x) { return x - Math.floor(x); }
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function pressAmt(S, now) { if (S.lastTap === null) return 0; const d = now - S.lastTap; if (d < 0) return 1; if (d < 0.045) return d / 0.045; return Math.max(0, 1 - (d - 0.045) / 0.18); }

function startSong(game, mode = 'normal') {
  initAudio();
  musicBus.gain.cancelScheduledValues(ac.currentTime); musicBus.gain.setValueAtTime(0.62, ac.currentTime);
  const chart = game.build(mode);
  const spb = 60 / chart.bpm;
  curMode = mode;
  S = {
    game, mode, practice: mode === 'practice', endless: mode === 'endless', lives: 3, hits: 0, combo: 0, maxCombo: 0, dead: false, chart, spb, events: chart.events, ei: 0, targets: chart.targets, cues: chart.cues, labels: chart.labels,
    endBeat: chart.endBeat, t0: ac.currentTime + 0.6, lastTap: null, fx: [], calibTaps: [], running: true, finished: false,
    moodUntil: 0, moodKind: null, penalty: 0,
    mood(now) { return now < this.moodUntil ? this.moodKind : null; },
  };
  showScreen(null); $('#quit').classList.add('on'); $('#tapzone').classList.add('on');
  schedule();
}
function beatTime(b) { return S.t0 + b * S.spb; }

function schedule() {
  if (!S || !S.running) return;
  const horizon = ac.currentTime + 0.16;
  while (S.ei < S.events.length) {
    const e = S.events[S.ei], t = beatTime(e.beat);
    if (t > horizon) break;
    if (t >= ac.currentTime - 0.02) { try { e.play(Math.max(t, ac.currentTime)); } catch (err) { console.error(err); } }
    S.ei++;
  }
}
setInterval(schedule, 20);

function tap(evTime) {
  if (!S || !S.running) return;
  const heard = heardTime(evTime);
  const now = heard;
  S.lastTap = now;
  const tt = heard - settings.offset / 1000;
  const playAt = ac.currentTime;

  if (S.game.calib) {
    const b = (heard - S.t0) / S.spb; const nb = Math.round(b);
    if (nb >= 4 && Math.abs(b - nb) * S.spb < 0.3) S.calibTaps.push((b - nb) * S.spb);
    I.stick(playAt, 0.6);
    return;
  }

  let best = null, bd = 1;
  for (const tg of S.targets) {
    if (tg.res !== null) continue;
    const d = tt - beatTime(tg.beat);
    if (d < -NEAR) break;
    if (Math.abs(d) < Math.abs(bd)) { bd = d; best = tg; }
  }
  if (best && Math.abs(bd) <= NEAR) {
    const a = Math.abs(bd), q = a <= PERFECT ? 'perfect' : a <= GOOD ? 'good' : 'miss';
    best.res = q; best.hitAt = now; best.hitBeat = (now - S.t0) / S.spb; best.diff = bd;
    let at = playAt;
    if (q !== 'miss') { const sched = beatTime(best.beat); if (sched > at && sched - at < 0.15) at = sched; }
    S.game.onHit(best, q, at);
    addFx(q, bd, now);
    if (q === 'miss') loseLife(now); else { S.hits++; S.combo++; S.maxCombo = Math.max(S.maxCombo, S.combo); }
    if (q === 'perfect') setMood('happy', now, 0.5); else if (q === 'miss') setMood('oops', now, 0.6);
  } else {
    S.game.onWhiff(playAt, S);
    const b = (tt - S.t0) / S.spb;
    if (S.chart.rests.some(([a, z]) => b >= a && b <= z)) { S.penalty++; addFx('miss', 0, now); S.fx[S.fx.length - 1].text = 'おやすみ中！'; setMood('oops', now, 0.6); loseLife(now); }
  }
}
function loseLife(now) {
  S.combo = 0;
  if (!S.endless || S.dead) return;
  S.lives--; S.lifeLostAt = now;
  if (S.lives <= 0) {
    // ここで終わり：先の音を消し、少し間をおいて結果へ
    S.dead = true; S.events.length = S.ei;
    musicBus.gain.setTargetAtTime(0, ac.currentTime + 0.1, 0.25);
    const b = (now - S.t0) / S.spb; S.endBeat = b + 0.5;
    for (const tg of S.targets) if (tg.res === null) tg.res = 'skip';
    const t = ac.currentTime + 0.05; [64, 60, 57, 52].forEach((m, i) => I.bell(t + i * 0.16, m, 0.45));
  }
}
function setMood(kind, now, dur) { S.moodKind = kind; S.moodUntil = now + dur; }
function addFx(q, diff, now) {
  const text = q === 'perfect' ? 'ぴったり！' : q === 'good' ? (diff < 0 ? 'いいね（はやめ）' : 'いいね（おそめ）') : q === 'near' ? 'おしい' : 'ミス';
  S.fx.push({ q, text: q === 'miss' && Math.abs(diff) <= NEAR && diff !== 0 ? 'おしい！' : text, at: now });
  if (S.fx.length > 6) S.fx.shift();
}

function checkMisses(now) {
  const tt = now - settings.offset / 1000;
  for (const tg of S.targets) {
    if (tg.res !== null) continue;
    if (tt - beatTime(tg.beat) > NEAR) {
      if (S.game.calib) { tg.res = 'skip'; continue; }
      tg.res = 'miss'; tg.missed = true; S.game.onMiss(ac.currentTime); addFx('miss', 0, now); setMood('oops', now, 0.5); loseLife(now);
      if (!S) return;
    } else break;
  }
}

function finish() {
  S.running = false; S.finished = true;
  $('#quit').classList.remove('on'); $('#tapzone').classList.remove('on');
  if (S.game.calib) {
    const a = S.calibTaps.slice().sort((x, y) => x - y);
    if (a.length >= 6) { const med = a[Math.floor(a.length / 2)]; settings.offset = Math.round(Math.max(-200, Math.min(200, med * 1000)) / 5) * 5; store.set('offset', settings.offset); }
    S = null; openSettings(a.length >= 6 ? 'ok' : 'few'); return;
  }
  if (S.endless) {
    const key = 'endless:' + S.game.id, prev = store.get(key, 0), rec = S.hits > prev;
    if (rec) store.set(key, S.hits);
    const p = S.targets.filter((t) => t.res === 'perfect').length;
    showEndless(S.game, S.hits, S.maxCombo, p, rec ? S.hits : prev, rec && S.hits > 0);
    jingle(S.hits >= 80 ? 3 : S.hits >= 30 ? 2 : 1);
    S = null; return;
  }
  const n = S.targets.length;
  const p = S.targets.filter((t) => t.res === 'perfect').length, gd = S.targets.filter((t) => t.res === 'good').length, m = n - p - gd;
  const score = n ? Math.max(0, Math.round(((p * 100 + gd * 65 - S.penalty * 50) / (n * 100)) * 100)) : 0;
  if (S.practice) { const game = S.game; S = null; openIntro(game, score >= 60 ? 'れんしゅう OK！ ほんばんに ちょうせんしよう' : 'もういちど れんしゅうしてみる？'); return; }
  const rank = score >= 85 ? 3 : score >= 60 ? 2 : 1;
  const prev = store.get('best:' + S.game.id, null);
  if (!prev || score > prev.score) store.set('best:' + S.game.id, { score, rank });
  showResult(S.game, rank, score, p, gd, m + S.penalty);
  jingle(rank);
  S = null;
}
function jingle(rank) {
  const t = ac.currentTime + 0.25;
  const seq = rank === 3 ? [72, 76, 79, 84, 88] : rank === 2 ? [72, 76, 79, 84] : [72, 69, 65];
  seq.forEach((m, i) => I.bell(t + i * (rank === 1 ? 0.22 : 0.12), m, 0.5));
  if (rank === 3) I.pad(t + 0.5, [60, 64, 67, 72, 76], 1.6, 1.4, 2400);
}

function quit() {
  if (!S) return;
  S.running = false; const game = S.game; S = null;
  $('#quit').classList.remove('on'); $('#tapzone').classList.remove('on');
  if (ac) { musicBus.gain.setTargetAtTime(0, ac.currentTime, 0.05); setTimeout(() => musicBus.gain.setTargetAtTime(0.62, ac.currentTime, 0.01), 400); }
  if (game.calib) openSettings(); else openIntro(game);
}

/* ================================ 描画 ================================ */
const cv = $('#cv'), g2 = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() { DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px'; }
addEventListener('resize', resize); resize();

function frame() {
  requestAnimationFrame(frame);
  const g = g2;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 横長の画面は全体を、縦長の画面は中央の 720 幅を大きく映す（左右の背景だけが切れる）
  const vw = W < H ? 720 : 1000;
  const s = Math.min(W / vw, H / 700), ox = W / 2 - 500 * s, oy = (H - 700 * s) / 2;
  if (!S) { idle(g); return; }
  const now = heardTime();
  const beat = (now - S.t0) / S.spb;
  checkMisses(now);
  g.save(); g.translate(ox, oy); g.scale(s, s);
  S.game.draw(g, beat, S, now);
  if (S.practice) drawPractice(g, beat);
  if (S.endless) drawEndlessHud(g, now);
  drawFx(g, now);
  g.restore();
  if (beat < 0) { g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(0, 0, W, H); }
  if (S.practice) { g.fillStyle = 'rgba(0,0,0,.35)'; rr(g, 12, 12, 132, 40, 20); g.fill(); g.fillStyle = '#ffe36b'; g.font = '900 18px sans-serif'; g.textAlign = 'center'; g.fillText('れんしゅう', 78, 39); }
  if (beat > S.endBeat + 1.5 && !S.finished) finish();
}
function drawHeart(g, x, y, r, fill) {
  g.beginPath(); g.moveTo(x, y + r * 0.9);
  g.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.7, y - r * 1.4, x, y - r * 0.45);
  g.bezierCurveTo(x + r * 0.7, y - r * 1.4, x + r * 1.6, y - r * 0.2, x, y + r * 0.9);
  g.fillStyle = fill; g.fill();
}
function drawEndlessHud(g, now) {
  for (let i = 0; i < 3; i++) {
    const lost = i >= S.lives, shake = lost && i === S.lives && now - (S.lifeLostAt || 0) < 0.4 ? Math.sin((now - S.lifeLostAt) * 60) * 4 : 0;
    g.save(); g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 6;
    drawHeart(g, 200 + i * 44 + shake, 46, 16, lost ? 'rgba(255,255,255,.22)' : '#ff5c7a'); g.restore();
  }
  g.textAlign = 'right'; g.font = '900 40px sans-serif'; g.lineWidth = 8; g.strokeStyle = 'rgba(0,0,0,.4)'; g.fillStyle = '#fff';
  g.strokeText(`${S.hits}回`, 800, 62); g.fillText(`${S.hits}回`, 800, 62);
  if (S.combo >= 5) { g.font = '900 20px sans-serif'; g.fillStyle = '#ffe36b'; g.strokeText(`${S.combo} コンボ`, 800, 90); g.fillText(`${S.combo} コンボ`, 800, 90); }
}
function drawPractice(g, beat) {
  // 合図の言葉とタップのガイド（れんしゅうのときだけ）
  g.textAlign = 'center';
  for (const l of S.labels) {
    const d = beat - l.beat; if (d < -0.02 || d > 0.7) continue;
    const a = 1 - d / 0.7; g.save(); g.globalAlpha = a; g.font = `900 ${l.hit ? 54 : 40}px sans-serif`;
    g.lineWidth = 8; g.strokeStyle = 'rgba(0,0,0,.45)'; g.fillStyle = l.hit ? '#ffe36b' : '#fff';
    const y = l.hit ? 300 : 260 - d * 30; g.strokeText(l.text, 500, y); g.fillText(l.text, 500, y); g.restore();
  }
  for (const tg of S.targets) {
    if (tg.res !== null) continue; const d = tg.beat - beat; if (d < 0 || d > 1.5) continue;
    g.save(); g.strokeStyle = `rgba(255,227,107,${1 - d / 1.5})`; g.lineWidth = 6; g.beginPath(); g.arc(500, 320, 40 + d * 120, 0, 7); g.stroke(); g.restore();
  }
}
function drawFx(g, now) {
  g.textAlign = 'center';
  for (const f of S.fx) {
    const d = now - f.at; if (d < 0 || d > 0.7) continue;
    const a = 1 - d / 0.7, y = (S.game.fxY || 120) - d * 40, sc = d < 0.08 ? 0.7 + d / 0.08 * 0.3 : 1;
    g.save(); g.globalAlpha = a; g.translate(500, y); g.scale(sc, sc);
    g.font = `900 ${f.q === 'perfect' ? 46 : 36}px sans-serif`; g.lineWidth = 8; g.strokeStyle = 'rgba(0,0,0,.4)';
    g.fillStyle = f.q === 'perfect' ? '#ffe36b' : f.q === 'good' ? '#bff7ff' : '#d0c8e0';
    g.strokeText(f.text, 0, 0); g.fillText(f.text, 0, 0); g.restore();
  }
}
let idleT = 0;
function idle(g) {
  idleT += 1 / 60;
  const grd = g.createLinearGradient(0, 0, 0, H); grd.addColorStop(0, '#2b2556'); grd.addColorStop(1, '#14122a');
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 18; i++) {
    const x = ((i * 173) % 1000) / 1000 * W, y = H - ((idleT * (20 + i * 3) + i * 90) % (H + 100)) + 50;
    g.globalAlpha = 0.1 + (i % 4) * 0.03; drawNote(g, x, y, 1, ['#ffd36b', '#a5f0c5', '#ffd0e0', '#9ff0ff'][i % 4]); g.globalAlpha = 1;
  }
}
requestAnimationFrame(frame);

/* ================================ 入力 ================================ */
$('#tapzone').addEventListener('pointerdown', (e) => { e.preventDefault(); tap(e.timeStamp || performance.now()); });
addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (S && (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyJ' || e.code === 'KeyF')) { e.preventDefault(); tap(e.timeStamp || performance.now()); }
  if (S && e.code === 'Escape') quit();
});
$('#quit').addEventListener('click', quit);
document.addEventListener('visibilitychange', () => { if (document.hidden && S) quit(); });

/* ================================ 画面 ================================ */
function showScreen(id) { document.querySelectorAll('.screen').forEach((el) => el.classList.toggle('on', el.id === id)); }
const RANKS = { 3: 'ハイパーすごい！', 2: 'いいかんじ！', 1: 'もういっかい！' };
function renderCards() {
  const box = $('#cards'); box.innerHTML = '';
  GAMES.forEach((gm) => {
    const best = store.get('best:' + gm.id, null), eb = store.get('endless:' + gm.id, 0);
    const b = document.createElement('button'); b.className = 'card ' + gm.cls;
    b.innerHTML = `<span class="ic">${gm.icon}</span><span><div class="tt">${gm.title}</div><div class="ds">${gm.desc}</div></span>${best || eb ? `<span class="best">${best ? RANKS[best.rank].replace('！', '') : ''}${best && eb ? '<br>' : ''}${eb ? 'むげん ' + eb : ''}</span>` : ''}`;
    b.addEventListener('click', () => { initAudio(); I.bell(ac.currentTime + 0.01, 84, 0.3); openIntro(gm); });
    box.appendChild(b);
  });
}
function openIntro(gm, note) {
  curGame = gm; $('#i-title').textContent = gm.title; $('#i-howto').innerHTML = gm.howto;
  $('#i-note').textContent = note || '画面のどこをタップしてもOK（キーボードならスペースキー）';
  showScreen('s-intro');
}
function showEndless(gm, hits, maxCombo, p, best, record) {
  $('#r-title').textContent = gm.title + '（むげん）';
  const r = $('#r-rank'); r.textContent = `${hits}回 つづいた！`; r.className = 'rank ' + (hits >= 80 ? 'r3' : hits >= 30 ? 'r2' : 'r1');
  $('#r-comment').textContent = record ? 'しんきろく！' : `ベスト ${best}回`;
  $('#r-stats').innerHTML = `<span>ぴったり <b>${p}</b></span><span>さいだいコンボ <b>${maxCombo}</b></span>`;
  $('.meter').style.display = 'none'; showScreen('s-result');
}
function showResult(gm, rank, score, p, gd, m) {
  $('.meter').style.display = '';
  $('#r-title').textContent = gm.title;
  const r = $('#r-rank'); r.textContent = RANKS[rank]; r.className = 'rank r' + rank;
  $('#r-comment').textContent = gm.comments[3 - rank];
  $('#r-stats').innerHTML = `<span>ぴったり <b>${p}</b></span><span>いいね <b>${gd}</b></span><span>ミス <b>${m}</b></span>`;
  const mt = $('#r-meter'); mt.style.width = '0'; showScreen('s-result'); requestAnimationFrame(() => requestAnimationFrame(() => { mt.style.width = score + '%'; }));
}
function openSettings(msg) {
  $('#in-vol').value = settings.vol; $('#v-vol').textContent = settings.vol;
  $('#in-off').value = settings.offset; $('#v-off').textContent = (settings.offset > 0 ? '+' : '') + settings.offset + ' ms';
  if (msg === 'ok') $('#v-off').textContent += '（はかりました）';
  if (msg === 'few') $('#v-off').textContent += '（タップが少なかったので変更なし）';
  showScreen('s-settings');
}
$('#b-practice').addEventListener('click', () => startSong(curGame, 'practice'));
$('#b-play').addEventListener('click', () => startSong(curGame, 'normal'));
$('#b-endless').addEventListener('click', () => startSong(curGame, 'endless'));
$('#b-back1').addEventListener('click', () => { renderCards(); showScreen('s-menu'); });
$('#b-retry').addEventListener('click', () => startSong(curGame, curMode === 'practice' ? 'normal' : curMode));
$('#b-menu').addEventListener('click', () => { renderCards(); showScreen('s-menu'); });
$('#b-settings').addEventListener('click', () => openSettings());
$('#b-back2').addEventListener('click', () => { renderCards(); showScreen('s-menu'); });
$('#b-calib').addEventListener('click', () => startSong(CALIB, 'calib'));
$('#in-vol').addEventListener('input', (e) => { settings.vol = +e.target.value; $('#v-vol').textContent = settings.vol; store.set('vol', settings.vol); if (ac) master.gain.setTargetAtTime(settings.vol / 100, ac.currentTime, 0.02); });
$('#in-vol').addEventListener('change', () => { initAudio(); I.bell(ac.currentTime + 0.01, 84, 0.4); });
$('#in-off').addEventListener('input', (e) => { settings.offset = +e.target.value; $('#v-off').textContent = (settings.offset > 0 ? '+' : '') + settings.offset + ' ms'; store.set('offset', settings.offset); });
renderCards();

// テスト用の窓口
window.__hazumu = { GAMES, get S() { return S; }, startSong, tap, heardTime: (p) => heardTime(p), get ac() { return ac; } };
</script>
</body>
