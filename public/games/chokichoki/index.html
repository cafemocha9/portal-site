<style>
/* Layout: a pastel salon seen through the mirror — the customer fills the canvas; clock and "how close" meter on top, the sample card top-right, big chunky tool buttons at the thumbs. */
:root{

#introCv{width:min(100%,320px);height:auto;aspect-ratio:3/2}

@media (max-width:560px){
  .meter{min-width:0;width:132px}.clock{width:56px;height:56px}.clock svg{width:48px;height:48px}.clock b{font-size:19px}
  .stage{position:absolute;top:66px;left:0;white-space:nowrap}
  .sample{width:92px}.sample canvas{width:80px;height:80px}
  .tools{gap:7px}.tool{width:60px;height:66px;border-radius:18px;font-size:11px}.tool svg{width:32px;height:32px}.tool.done{width:74px}.tool .n{margin:-48px 0 0 44px}.bubble{font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,hyp=Math.hypot;
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ================= SETTINGS ================= */
const DIFF={
  easy:{name:'かんたん',time:70,pass:60,tol:36,guide:'always',hints:0,desc:'切る場所に 点線が出る'},
  normal:{name:'ふつう',time:55,pass:70,tol:28,guide:'hint',hints:3,desc:'ヒントで 3回だけ 点線'},
  hard:{name:'むずかしい',time:45,pass:78,tol:22,guide:'none',hints:0,desc:'点線なし・メーターもかくれる'},
};
let dk=store.get('choki-diff','easy');if(!DIFF[dk])dk='easy';
const R=88, HC={x:300,y:300}; // head radius and centre in design space (600 x 720)
const W0=600,H0=720;

/* ================= CUSTOMERS ================= */
const CUSTOMERS=[
  {id:'kenta',name:'ケンタくん',kind:'boy',style:'さっぱりショート',hair:'#7a4a2a',hair2:'#956038',skin:'#ffd9b8',
   ask:'前がみが目にささって 見えないよ〜！ スポーツができる さっぱりショートにして！',
   back:(x,y)=>y<6?hyp(x,y)<R+20:hyp(x,y)<R+7, front:(x,y)=>y<-40},
  {id:'miku',name:'ミクちゃん',kind:'girl',style:'ぱっつんボブ',hair:'#3b2a35',hair2:'#5a4050',skin:'#ffe0c8',
   ask:'あしたは ピアノの発表会なの。前がみまっすぐの ボブにしてね！',
   back:(x,y)=>y<74&&Math.abs(x)<R+34, front:(x,y)=>y<-34},
  {id:'gao',name:'ライオンのガオくん',kind:'lion',style:'ほし形たてがみ',hair:'#e8962e',hair2:'#f2b043',skin:'#ffd78a',
   ask:'ボサボサのたてがみを、かっこいい 星の形にしてほしいガオ！',
   back:(x,y)=>inStar(x,y), front:null, radial:true, cape:'#ffc96b'},
  {id:'yui',name:'ユイちゃん',kind:'girl',style:'ななめカット',hair:'#8a3b2f',hair2:'#a8513f',skin:'#ffe3cc',
   ask:'クラスで いちばん おしゃれな ななめカットにしたいな！ 前がみも ななめにしてね！',
   back:(x,y)=>y<28+x*.36&&Math.abs(x)<R+30, front:(x,y)=>y<-42+(x+R)*.13},
  {id:'moko',name:'ひつじのモコちゃん',kind:'sheep',style:'ハート形もこもこ',hair:'#f4efe4',hair2:'#e3d9c6',skin:'#ffe9dc',
   ask:'もこもこが のびすぎて 前が見えないメェ〜。大すきな ハートの形にしてほしいメェ！',
   back:(x,y)=>inHeart(x,y), front:null, radial:true, cape:'#c9b8ff'},
];
function inHeart(x,y){const X=x/165,Y=-(y-10)/165,a=X*X+Y*Y-1;return a*a*a-X*X*Y*Y*Y<0;}
function inStar(x,y){const a=Math.atan2(y,x)+Math.PI/2,r=hyp(x,y);const k=((a%(TAU/5))+TAU/5)%(TAU/5)/(TAU/5);const t=Math.abs(k-.5)*2; // 1 at points, 0 between
  const rIn=R+30,rOut=R+108;return r<lerp(rIn,rOut,Math.pow(t,1.6));}

/* ================= HAIR MODEL =================
   Each strand is a fixed polyline grown from a root on the scalp; cutting only shortens how much of it is drawn. */
const SEG=5;
let strands=[],C=null,stageIdx=0;
function grow(rx,ry,dx,dy,g,flow,n){const pts=new Float32Array((n+1)*2);let x=rx,y=ry;pts[0]=x;pts[1]=y;let l=hyp(dx,dy);dx/=l;dy/=l;
  for(let k=1;k<=n;k++){dx+=flow;dy+=g;l=hyp(dx,dy);dx/=l;dy/=l;x+=dx*SEG;y+=dy*SEG;pts[k*2]=x;pts[k*2+1]=y;}return pts;}
function targetLen(s,inside){if(!inside)return 0;const n=s.pts.length/2-1;for(let k=1;k<=n;k++){if(!inside(s.pts[k*2],s.pts[k*2+1]))return Math.max(4,(k-1)*SEG+SEG*.5);}return n*SEG;}
function makeHair(cu,seed){
  const r=rng(seed),out=[];
  if(cu.radial){
    for(let i=0;i<170;i++){const a=i/170*TAU+r()*.02;const rx=Math.cos(a)*R*.96,ry=Math.sin(a)*R*.96;const sh=cu.kind==='sheep';const len=sh?178+r()*24:118+r()*26;const pts=grow(rx,ry,Math.cos(a)+(r()-.5)*.25,Math.sin(a)+(r()-.5)*.25,0,sh?(r()-.5)*.05:0,Math.ceil((sh?205:150)/SEG));out.push({layer:0,pts,L:len,col:i%3?cu.hair:cu.hair2,w:cu.kind==='sheep'?11:9});}
  }else{
    const girl=cu.kind==='girl';
    for(let i=0;i<150;i++){const a=lerp(-Math.PI-.42,.42,i/149)+(r()-.5)*.02;const rx=Math.cos(a)*R*.97,ry=Math.sin(a)*R*.97;const sx=Math.cos(a)>=0?1:-1;
      const len=(girl?230:205)+r()*35;const up=Math.max(0,-Math.sin(a));const pts=grow(rx,ry,Math.cos(a)+sx*up*1.1,Math.sin(a)*(1-up*.75),.15,-sx*.01,Math.ceil(270/SEG));out.push({layer:0,pts,L:len,col:i%4?cu.hair:cu.hair2,w:8});}
    for(let i=0;i<54;i++){const a=lerp(-Math.PI+.55,-.55,i/53)+(r()-.5)*.03;const rx=Math.cos(a)*R*.8,ry=Math.sin(a)*R*.8;
      const len=112+r()*22;const pts=grow(rx,ry,Math.cos(a)*.3,1,.01,0,Math.ceil(150/SEG));out.push({layer:1,pts,L:len,col:i%3?cu.hair:cu.hair2,w:7});}
  }
  for(const s of out){s.Lmax=(s.pts.length/2-1)*SEG;s.L=Math.min(s.L,s.Lmax);s.Lt=targetLen(s,s.layer===0?cu.back:cu.front);s.L0=s.L;}
  return out;
}
// Gentle scoring: a small error (DZ) counts as perfect, and matching FULL of the hair already counts as 100%,
// because a few strands cross or leave gaps and cannot be hit exactly even by a clean trace.
const DZ=6,FULL=.9;
function strandScore(s,tol){const e=s.L-s.Lt,a=Math.abs(e)-DZ;if(a<=0)return 1;return e>0?Math.max(0,1-a/tol):Math.max(0,1-a/(tol*.7));} // cutting too short hurts a little more
function score(list=strands){const tol=DIFF[dk].tol;let t=0;for(const s of list)t+=strandScore(s,tol);return Math.min(100,t/list.length/FULL*100);}
function pointAt(s,L){const k=Math.min(Math.floor(L/SEG),s.pts.length/2-2),f=(L-k*SEG)/SEG;return [lerp(s.pts[k*2],s.pts[k*2+2],f),lerp(s.pts[k*2+1],s.pts[k*2+3],f)];}

/* ================= CUTTING ================= */
const falling=[];
function segInt(ax,ay,bx,by,cx,cy,dx,dy){const rx=bx-ax,ry=by-ay,sx=dx-cx,sy=dy-cy,den=rx*sy-ry*sx;if(Math.abs(den)<1e-9)return -1;const t=((cx-ax)*sy-(cy-ay)*sx)/den,u=((cx-ax)*ry-(cy-ay)*rx)/den;return t>=0&&t<=1&&u>=0&&u<=1?u:-1;}
function cutAt(s,newL){newL=Math.max(4,newL);if(newL>=s.L-.5)return false;
  // the cut-off piece falls to the floor
  const k0=Math.floor(newL/SEG),k1=Math.ceil(s.L/SEG),pts=[];const p0=pointAt(s,newL);pts.push(p0[0],p0[1]);for(let k=k0+1;k<k1;k++)pts.push(s.pts[k*2],s.pts[k*2+1]);const p1=pointAt(s,s.L);pts.push(p1[0],p1[1]);
  if(falling.length<500)falling.push({pts,col:s.col,w:s.w*.9,x:0,y:0,vx:(Math.random()-.5)*60,vy:-20-Math.random()*40,rot:0,vr:(Math.random()-.5)*3,cx:p0[0],cy:p0[1],life:3});
  const tooShort=newL<s.Lt-DIFF[dk].tol*.8;s.L=newL;return tooShort?2:1;}
function scissorCut(ax,ay,bx,by,layer=-1){let n=0,bad=0;

  $('#tUndo').disabled=GS.undoLeft<=0||!GS.undo.length;
  if(ptr.cut&&!ptr.bad){const p=score();if(p>GS.pct+3){GS.combo++;popText(e.clientX,e.clientY-30,pick(['いいね！','ナイス！','じょうず！','チョキッ！']),'#ff7aa8');}}};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointerleave',()=>{hover.on=false;});
const hover={x:0,y:0,on:false},trail=[];

/* ================= LOOP ================= */
let last=performance.now(),scoreT=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  drawSalon(now/1000);
  if(C){
    // customer
    FACE.blink-=dt;if(FACE.blink<-3-Math.random()*2)FACE.blink=.12;
    if(FACE.moodT>0){FACE.moodT-=dt;if(FACE.moodT<=0)FACE.mood='idle';}
    const showGuide=GS.state==='play'&&(DIFF[dk].guide==='always'||GS.hintT>0);
    g.save();g.translate(OX+HC.x*SC,OY+HC.y*SC);g.scale(SC,SC);
    const sway=GS.state==='play'?Math.sin(now/900)*1.2:0;g.rotate(sway*.004);
    DIM=ptr.on&&ptr.layer>=0&&GS.state==='play'?1-ptr.layer:-1;
    drawCustomer(g,C,strands,{mood:FACE.mood==='idle'&&GS.state==='play'&&GS.pct>=DIFF[dk].pass?'happy':FACE.mood,blink:FACE.blink>0?1:0,look:Math.sin(now/1400)});
    g.globalAlpha=1;DIM=-1;
    if(showGuide)drawGuide(g);
    // falling cut hair
    for(let i=falling.length-1;i>=0;i--){const f=falling[i];f.vy+=420*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=f.vr*dt;f.vx*=.99;
      const floor=600-HC.y;if(f.cy+f.y>floor){f.y=floor-f.cy;f.vy=0;f.vx*=.8;f.vr*=.8;f.life-=dt;}
      if(f.life<=0){falling.splice(i,1);continue;}
      g.save();g.globalAlpha=Math.min(1,f.life);g.translate(f.cx+f.x,f.cy+f.y);g.rotate(f.rot);g.strokeStyle=f.col;g.lineWidth=f.w;g.lineCap='round';g.beginPath();for(let k=0;k<f.pts.length;k+=2){const px=f.pts[k]-f.cx,py=f.pts[k+1]-f.cy;k?g.lineTo(px,py):g.moveTo(px,py);}g.stroke();g.restore();}
    g.restore();
  }
  if(GS.state==='play'){
    GS.t+=dt;const left=GS.limit-GS.t;
    if(Math.ceil(left)!==Math.ceil(left+dt)&&left<=5&&left>0)sfx('tick');
    if(GS.hintT>0)GS.hintT-=dt;
    $('#tLeft').textContent=Math.max(0,Math.ceil(left));$('#clock').classList.toggle('hurry',left<=10);
    $('#clockArc').setAttribute('stroke-dashoffset',String(150.8*clamp(GS.t/GS.limit,0,1)));$('#clockArc').setAttribute('stroke',left<=10?'#ff6b6b':'#ffd447');
    scoreT-=dt;if(scoreT<=0){scoreT=.15;const p=score();GS.pct=p;const hide=DIFF[dk].guide==='none';$('#pct').textContent=hide?'？？%':Math.round(p)+'%';$('#bar').style.width=(hide?0:p)+'%';
      for(const m of [50,70,90])if(p>=m&&!GS.said['m'+m]){GS.said['m'+m]=1;if(m>30){say(m===90?'わぁ、そっくり！':m===70?'いいかんじ！':'だんだん かっこよくなってきた！',1.6);mood('happy',1.2);sfx('good');}}}
    if(left<=0){say('おしまい！',1.2);finish();}
  }
  // cursor tool
  if(GS.state==='play'&&hover.on){g.save();g.translate(hover.x,hover.y);
    if(GS.tool==='clip'){g.strokeStyle='rgba(59,47,74,.6)';g.setLineDash([5,5]);g.lineWidth=2;g.beginPath();g.arc(0,0,24*SC,0,TAU);g.stroke();g.setLineDash([]);if(ptr.on){g.translate(Math.random()*2-1,Math.random()*2-1);}g.fillStyle='#7ad0ff';roundRect(g,-12,-6,24,34,8);g.fill();g.fillStyle='#d9d9e6';g.fillRect(-12,-14,24,9);}
    else{const open=ptr.on?Math.abs(Math.sin(now/60))*.5:.45;g.strokeStyle='#3b2f4a';g.lineWidth=4;g.lineCap='round';for(const s of [-1,1]){g.save();g.rotate(s*open);g.beginPath();g.moveTo(0,0);g.lineTo(0,-34);g.stroke();g.fillStyle='#ff7aa8';g.beginPath();g.arc(s*4,12,8,0,TAU);g.fill();g.stroke();g.restore();}}
    g.restore();}
  if(GS.state==='play'&&ptr.on&&ptr.layer>=0){const t=ptr.layer?'まえがみ だけ':'うしろの髪 だけ';g.font='800 14px "M PLUS Rounded 1c",sans-serif';g.textAlign='center';const w=g.measureText(t).width+20,x=hover.x,y=hover.y+48;g.fillStyle=ptr.layer?'#ff7aa8':'#7a6f8a';roundRect(g,x-w/2,y-13,w,26,13);g.fill();g.fillStyle='#fff';g.fillText(t,x,y+5);}
  // scissor trail
  for(let i=0;i<trail.length;i++)trail[i][2]-=dt*3;while(trail.length&&trail[0][2]<=0)trail.shift();
  if(trail.length>1){g.lineCap='round';for(let i=1;i<trail.length;i++){g.strokeStyle=`rgba(255,255,255,${trail[i][2]*.8})`;g.lineWidth=6*trail[i][2];g.beginPath();g.moveTo(trail[i-1][0],trail[i-1][1]);g.lineTo(trail[i][0],trail[i][1]);g.stroke();}}
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.life-=dt;if(s.life<=0){sparks.splice(i,1);continue;}s.x+=s.vx*dt;s.y+=s.vy*dt;g.fillStyle=`rgba(255,212,71,${s.life*2})`;g.beginPath();g.arc(s.x,s.y,4,0,TAU);g.fill();}
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.life-=dt;if(t.life<=0){texts.splice(i,1);continue;}t.y-=40*dt;g.globalAlpha=Math.min(1,t.life*2);g.font='400 26px "Mochiy Pop One",sans-serif';g.textAlign='center';g.lineWidth=6;g.strokeStyle='#fff';g.strokeText(t.txt,t.x,t.y);g.fillStyle=t.col;g.fillText(t.txt,t.x,t.y);g.globalAlpha=1;}
  for(let i=conf.length-1;i>=0;i--){const c=conf[i];c.life-=dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.r+=c.vr*dt;if(c.life<=0||c.y>VH+20){conf.splice(i,1);continue;}g.save();g.translate(c.x,c.y);g.rotate(c.r);g.fillStyle=c.c;g.fillRect(-6,-3,12,6);g.restore();}
  if(bubbleT>0){bubbleT-=dt;if(bubbleT<=0)$('#bubble').classList.remove('on');}
  g.setTransform(DPR,0,0,DPR,0,0);
  requestAnimationFrame(frame);
}
// draw in CSS pixels; the transform above is re-applied each frame
const _fr=frame;function frameWrap(now){g.setTransform(DPR,0,0,DPR,0,0);_fr(now);}
/* ================= MENUS ================= */
function renderTitle(){$('#diffs').innerHTML=Object.entries(DIFF).map(([k,d])=>{const rec=store.get(`choki-best-${k}`,{});const st=`★ ${CUSTOMERS.reduce((a,_,i)=>a+(rec[i]||0),0)} / ${CUSTOMERS.length*3}`;return `<button class="dc" data-k="${k}" aria-pressed="${k===dk}"><b>${d.name}</b><span>${d.time}びょう・${d.pass}%でクリア<br>${d.desc}</span><i>${st}</i></button>`;}).join('');}
$('#diffs').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;dk=b.dataset.k;store.set('choki-diff',dk);renderTitle();sfx('undo');});
$('#btnPlay').addEventListener('click',()=>{initAudio();setupStage(0);showIntro();});
$('#btnGo').addEventListener('click',startPlay);
$('#btnNext').addEventListener('click',()=>{const k=$('#btnNext').dataset.ok;conf.length=0;if(k==='next'){setupStage(stageIdx+1);showIntro();}else if(k==='retry'){setupStage(stageIdx);showIntro();}else toTitle();});
$('#btnRetry').addEventListener('click',()=>{conf.length=0;setupStage(stageIdx);showIntro();});
$('#btnHome').addEventListener('click',toTitle);
function toTitle(){GS.state='title';conf.length=0;$('#result').hidden=true;$('#intro').hidden=true;$('#hud').hidden=true;$('#title').hidden=false;renderTitle();}
document.addEventListener('visibilitychange',()=>{if(document.hidden)setBuzz(false);});
renderTitle();setupStage(0);requestAnimationFrame(frameWrap);
window.__hc={get strands(){return strands;},score,setupStage,startPlay,finish,scissorCut,clipCut,GS,get C(){return C;},toLocal,get dk(){return dk;},set dk(v){dk=v;}};
})();
</script>
