<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>白い部屋からの脱出</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: full-bleed 3D room; thin controls on top, message and belongings docked at the bottom */
  --paper:#c9cacd;
  --panel:rgba(255,255,255,.9);
  --ink:#2a2c31;
  --ink-soft:#5f6268;
  --line:#b9babd;
  --brass:#3d4046;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-num:"Cormorant Garamond","Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);overflow:hidden;position:fixed;inset:0;
  -webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

#hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}
#top{display:flex;gap:8px;padding:12px 16px;align-items:center}
#top .sp{flex:1}
.pill{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:9px 16px;font-size:13px;letter-spacing:.08em;min-height:40px;
  box-shadow:0 2px 10px rgba(40,40,50,.08);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pill:active{transform:translateY(1px)}
#bottom{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
#msg{margin:0;min-height:52px;background:var(--panel);border:1px solid var(--line);border-radius:4px;
  padding:12px 14px;font-size:14px;line-height:1.7;letter-spacing:.03em;
  box-shadow:0 2px 10px rgba(40,40,50,.08);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:opacity .25s}
#msg:empty{opacity:0}
#inv{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;pointer-events:auto}
.slot{aspect-ratio:1/1;max-height:68px;background:var(--panel);border:1px solid var(--line);border-radius:4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;
  font-size:10px;letter-spacing:.04em;color:var(--ink-soft);line-height:1.2;text-align:center;
  box-shadow:0 2px 10px rgba(40,40,50,.06)}
.slot svg{width:26px;height:26px;stroke:var(--ink);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.slot.has{color:var(--ink)}
.slot.sel{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass) inset,0 2px 10px rgba(40,40,50,.1)}
.slot.sel svg{stroke:var(--brass)}

.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background:rgba(244,244,245,.8);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:5}
.card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:22px;align-items:flex-start}
#title .head{display:flex;gap:18px;align-items:flex-start}
#title h1{margin:0;font-family:var(--f-display);font-weight:500;font-size:clamp(44px,13vw,60px);
  writing-mode:vertical-rl;letter-spacing:.22em;line-height:1.15}
#title .en{font-family:var(--f-num);font-weight:500;font-size:13px;letter-spacing:.42em;color:var(--ink-soft);
  writing-mode:vertical-rl;padding-top:6px}
#title .rule{width:1px;align-self:stretch;background:var(--ink);opacity:.25}
.lead{margin:0;font-size:14px;line-height:2;letter-spacing:.05em;max-width:30em}
.how{margin:0;padding:0;list-style:none;font-size:12.5px;line-height:1.9;color:var(--ink-soft);letter-spacing:.04em}
.how b{color:var(--ink);font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:2px;padding:13px 26px;
  font-size:14px;letter-spacing:.2em;min-height:46px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:active{transform:translateY(1px)}

#memo .paper{background:#fff;border:1px solid var(--line);padding:34px 28px 26px;max-width:320px;width:100%;
  box-shadow:0 14px 40px rgba(40,40,50,.14);display:flex;flex-direction:column;gap:22px;
  background-image:repeating-linear-gradient(#fff 0 31px,#eeece8 31px 32px)}
#memo p{margin:0;font-family:var(--f-display);font-size:19px;line-height:32px;letter-spacing:.1em}
#memo small{font-size:11px;color:var(--ink-soft);letter-spacing:.1em;line-height:32px}

#end h2{margin:0;font-family:var(--f-display);font-weight:500;font-size:40px;letter-spacing:.3em}
#end dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 22px;font-size:13px;letter-spacing:.08em}
#end dt{color:var(--ink-soft)}
#end dd{margin:0;font-family:var(--f-num);font-size:22px;font-variant-numeric:tabular-nums;line-height:1}
#fade{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity 1.4s ease;z-index:4}
#err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:14px;line-height:1.9}
@media (min-width:700px){
  #bottom{max-width:520px;margin:0 auto;width:100%}
  .card{max-width:420px}
}
@media (prefers-reduced-motion:reduce){#fade,#msg{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="top">
    <button id="back" class="pill" hidden>← 戻る</button>
    <span class="sp"></span>
    <button id="hintBtn" class="pill">ヒント</button>
    <button id="sndBtn" class="pill" aria-pressed="true">音 ON</button>
  </div>
  <div id="bottom">
    <p id="msg" aria-live="polite"></p>
    <div id="inv" aria-label="持ち物"></div>
  </div>
</div>

<div id="fade"></div>

<div id="title" class="ov">
  <div class="card">
    <div class="head">
      <h1>白い部屋</h1>
      <span class="rule"></span>
      <span class="en">THE WHITE ROOM</span>
    </div>
    <p class="lead">目を覚ますと、何もかもが白い部屋にいた。<br>扉には電子錠。手がかりは、この部屋のどこかにある。</p>
    <ul class="how">
      <li><b>ドラッグ</b>　部屋を見回す</li>
      <li><b>タップ</b>　近づく・調べる・拾う</li>
      <li><b>持ち物をタップ</b>　選んでから対象に使う</li>
    </ul>
    <div class="row">
      <button id="startBtn" class="btn">はじめる</button>
      <button id="contBtn" class="btn ghost" hidden>つづきから</button>
    </div>
  </div>
</div>

<div id="memo" class="ov" hidden>
  <div class="paper">
    <p>暗闇だけが、<br>白に輪郭を与える。</p>
    <small>引き出しにあった紙片</small>
    <button id="memoClose" class="btn ghost">閉じる</button>
  </div>
</div>

<div id="end" class="ov" hidden>
  <div class="card">
    <h2>脱出成功</h2>
    <p class="lead">扉の向こうも、やはり白かった。<br>けれど今度は、風が吹いている。</p>
    <dl>
      <dt>かかった時間</dt><dd id="endTime">0:00</dd>
      <dt>使ったヒント</dt><dd id="endHints">0</dd>
    </dl>
    <button id="againBtn" class="btn">もう一度あそぶ</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
if(!window.THREE){
  var e=document.createElement('div');e.id='err';
  e.textContent='3D表示の部品を読み込めませんでした。通信状態を確認して、ページを開き直してください。';
  document.body.appendChild(e);return;
}
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var SAVE_KEY='white-room-v1';
var CODE='8534', DIAL='435', BOOK_GOAL=[2,5,1,4,3];

function fresh(){return {v:1,started:false,drawer:[0,0,0],drawerOpen:false,gotDriver:false,gotMemo:false,
  ventOpen:false,gotLever:false,leverSet:false,dark:false,seenDark:false,books:[3,1,5,2,4],shelfOpen:false,
  gotKey:false,cabOpen:false,gotPlate:false,plateSet:false,unlocked:false,cleared:false,
  inv:[],sel:null,time:0,hints:0,hintStage:-1,hintLevel:0,code:''};}
function valid(d){return d&&d.v===1&&Array.isArray(d.drawer)&&d.drawer.length===3&&Array.isArray(d.books)&&d.books.length===5&&Array.isArray(d.inv);}
var S=fresh();
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function loadLocal(){try{var d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');return valid(d)?d:null;}catch(e){return null;}}

/* ---------- renderer, scene, camera ---------- */
var canvas=$('c');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.LinearToneMapping;
renderer.toneMappingExposure=1;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
var scene=new THREE.Scene();
var cDay=new THREE.Color(0xc4c5c8), cNight=new THREE.Color(0x05060a), bg=new THREE.Color(0xc4c5c8);
scene.background=bg;
scene.fog=new THREE.Fog(0xc4c5c8,10,40);
var camera=new THREE.PerspectiveCamera(70,1,0.05,40);
camera.rotation.order='YXZ';
var cam={x:0,y:1.5,z:0,yaw:0,pitch:0};

/* ---------- lights ---------- */
var hemiDay=new THREE.Color(0xffffff), hemiNight=new THREE.Color(0x8fa3c8);
var hemi=new THREE.HemisphereLight(0xffffff,0x8e9094,0.7);scene.add(hemi);
var amb=new THREE.AmbientLight(0xffffff,0.25);scene.add(amb);
var spot=new THREE.SpotLight(0xffffff,0.5,0,1.2,1,1);
spot.position.set(0.25,2.92,0.2);spot.target.position.set(0,0,0);
spot.castShadow=true;spot.shadow.mapSize.set(1024,1024);spot.shadow.bias=-0.0006;
spot.shadow.camera.near=0.4;spot.shadow.camera.far=9;spot.shadow.radius=3;
scene.add(spot);scene.add(spot.target);
var fill=new THREE.PointLight(0xffffff,0.28,8,1.4);fill.position.set(2.5,1.7,-1.2);scene.add(fill);
var L=1;

/* ---------- materials ---------- */
function std(c,r,o){var m=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:r,metalness:0},o||{}));return m;}
var mWall=std(0xb2b3b6,.95), mTrim=std(0xffffff,.55), mPanel=std(0xe4e4e5,.85), mCeil=std(0xf2f2f2,1);
var mFurn=std(0xfafafa,.45), mFurn2=std(0x9c9da1,.7), mStone=std(0x7f8084,.9), mMat=std(0x66676b,.95);
var mRelief=std(0xffffff,.6,{flatShading:true});
var mBrass=std(0x4a4c51,.4,{metalness:.3});
var mSteel=std(0xb9bcc2,.35,{metalness:.4});
var mDark=std(0x2c2e33,.9), mSoil=std(0x505154,1), mLeaf=std(0x8b8f8d,.8), mBranch=std(0x6f7073,.9);
var mWin=std(0xffffff,.9,{emissive:0xffffff,emissiveIntensity:.9});
var mBulb=std(0xffffff,.5,{emissive:0xffffff,emissiveIntensity:1});
var mShade=std(0xfdfdfc,.6,{side:THREE.DoubleSide});
var mGlow=new THREE.MeshBasicMaterial({color:0xf2f8ff,transparent:true,opacity:0,fog:false,toneMapped:false,depthWrite:false});
var mVoid=new THREE.MeshBasicMaterial({color:0xffffff,fog:false,toneMapped:false});
var mHit=new THREE.MeshBasicMaterial({visible:false});
var BOOK_COL=[0xffffff,0xe4e4e5,0xcbcccf,0xa9aaae,0x85868a,0x64666a,0xf3f3f3];
var mBooks=BOOK_COL.map(function(c){return std(c,.8);});

/* ---------- helpers ---------- */
var targets=[];
function reg(m,id,zone){m.userData.id=id;m.userData.zone=zone||null;targets.push(m);return m;}
function box(w,h,d,mat,x,y,z,parent,noCast){
  var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);
  m.castShadow=!noCast;m.receiveShadow=true;(parent||scene).add(m);return m;}
function cyl(rt,rb,h,mat,x,y,z,parent,seg,noCast){
  var m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||24),mat);m.position.set(x,y,z);
  m.castShadow=!noCast;m.receiveShadow=true;(parent||scene).add(m);return m;}
function plane(w,h,mat,x,y,z,parent){
  var m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);m.position.set(x,y,z);m.receiveShadow=true;(parent||scene).add(m);return m;}
function hitBox(w,h,d,x,y,z,parent,id,zone){
  var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mHit);m.position.set(x,y,z);(parent||scene).add(m);return reg(m,id,zone);}
function grp(x,y,z,parent){var g=new THREE.Group();g.position.set(x,y,z);(parent||scene).add(g);return g;}
function mkTex(w,h,draw){
  var c=document.createElement('canvas');c.width=w;c.height=h;var g=c.getContext('2d');draw(g,w,h);
  var t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;
  t.redraw=function(){draw(g,w,h);t.needsUpdate=true;};return t;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
var NUMF='"Cormorant Garamond","Times New Roman",serif';

/* ---------- animation ---------- */
var anims=[];
function tw(o,k,to,dur,done){
  for(var i=anims.length-1;i>=0;i--){if(anims[i].o===o&&anims[i].k===k)anims.splice(i,1);}
  if(!dur||RM){o[k]=to;if(done)done();return;}
  anims.push({o:o,k:k,a:o[k],b:to,t:0,d:dur/1000,done:done});
}
function stepAnims(dt){
  for(var i=anims.length-1;i>=0;i--){
    var a=anims[i];a.t+=dt;var u=Math.min(1,a.t/a.d);
    var e=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
    a.o[a.k]=a.a+(a.b-a.a)*e;
    if(u>=1){anims.splice(i,1);if(a.done)a.done();}
  }
}

/* ---------- sound ---------- */
var ac=null,muted=false;
function initAudio(){if(ac)return;try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;}}
function tone(f,d,type,vol,when){
  if(!ac||muted)return;
  try{var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+(when||0);
    o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol||.07,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.03);}catch(e){}
}
var sfx={
  tick:function(){tone(1500,.05,'triangle',.05);},
  tap:function(){tone(520,.07,'sine',.05);},
  take:function(){tone(660,.1,'sine',.07);tone(990,.16,'sine',.06,.08);},
  clunk:function(){tone(140,.16,'triangle',.14);tone(90,.2,'sine',.1,.03);},
  sw:function(){tone(210,.06,'square',.05);tone(120,.1,'triangle',.1,.03);},
  open:function(){tone(523,.2,'sine',.07);tone(659,.2,'sine',.07,.1);tone(784,.35,'sine',.07,.2);},
  err:function(){tone(170,.18,'sawtooth',.05);tone(150,.22,'sawtooth',.05,.14);},
  win:function(){[523,659,784,1047].forEach(function(f,i){tone(f,.7,'sine',.06,i*.14);});}
};

/* =====================================================================
   ROOM
   ===================================================================== */
// floor: white-washed planks
var floorTex=mkTex(512,512,function(g,w,h){
  var r=rng(7);g.fillStyle='#f0efeb';g.fillRect(0,0,w,h);
  var rows=6,ph=h/rows;
  for(var i=0;i<rows;i++){
    g.fillStyle='rgba('+(r()<.5?'255,255,255':'120,118,110')+','+(r()*.06).toFixed(3)+')';g.fillRect(0,i*ph,w,ph);
    g.fillStyle='rgba(30,30,34,.42)';g.fillRect(0,i*ph,w,2);
    var jx=r()*w;g.fillRect(jx,i*ph,1.5,ph);g.fillRect((jx+w*.55)%w,i*ph,1.5,ph);
    for(var k=0;k<26;k++){g.fillStyle='rgba(90,86,78,'+(r()*.05).toFixed(3)+')';g.fillRect(r()*w,i*ph+r()*ph,40+r()*160,1);}
  }
});
floorTex.wrapS=floorTex.wrapT=THREE.RepeatWrapping;floorTex.repeat.set(4,4);
var floor=new THREE.Mesh(new THREE.PlaneGeometry(6,6),std(0x8a8b8e,.6,{map:floorTex}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
var ceil=new THREE.Mesh(new THREE.PlaneGeometry(6,6),mCeil);ceil.rotation.x=Math.PI/2;ceil.position.y=3;scene.add(ceil);

function wall(rotY,x,z,skip){
  var g=grp(x,0,z);g.rotation.y=rotY;
  var segs=skip?[[-3,skip[0]],[skip[1],3]]:[[-3,3]];
  segs.forEach(function(s){
    var w=s[1]-s[0],c=(s[0]+s[1])/2;
    box(w,3,.1,mWall,c,1.5,-.05,g,true);
    box(w,.13,.022,mTrim,c,.065,.011,g,true);
    box(w,.02,.03,mTrim,c,.14,.012,g,true);
    box(w,.04,.03,mTrim,c,1.02,.015,g,true);
  });
  if(skip)box(skip[1]-skip[0],.9,.1,mWall,(skip[0]+skip[1])/2,2.55,-.05,g,true);
  box(6,.07,.06,mTrim,0,2.965,.03,g,true);
  box(6,.03,.03,mTrim,0,2.915,.015,g,true);
  for(var i=0;i<8;i++){
    var cx=-3+.375+i*.75;
    if(skip&&cx+.31>skip[0]-.1&&cx-.31<skip[1]+.1)continue;
    box(.62,.68,.012,mPanel,cx,.57,.006,g,true);
    box(.5,.56,.012,mWall,cx,.57,.009,g,true);
  }
  return g;
}
var wN=wall(0,0,-3,[.45,1.35]);
var wS=wall(Math.PI,0,3);
var wW=wall(Math.PI/2,-3,0);
var wE=wall(-Math.PI/2,3,0);

// rug
var rugTex=mkTex(256,256,function(g,w,h){
  g.fillStyle='#77787c';g.fillRect(0,0,w,h);g.translate(w/2,h/2);
  for(var i=0;i<9;i++){g.strokeStyle='rgba(255,255,255,'+(i%2?.9:.35)+')';g.lineWidth=i%3?1.5:4;g.beginPath();g.arc(0,0,22+i*12,0,7);g.stroke();}
});
var rug=new THREE.Mesh(new THREE.CircleGeometry(1.35,64),std(0xffffff,1,{map:rugTex}));
rug.rotation.x=-Math.PI/2;rug.position.y=.004;rug.receiveShadow=true;scene.add(rug);

// pendant lamp
(function(){
  cyl(.11,.11,.02,mTrim,0,2.99,0,scene,32,true);
  cyl(.004,.004,.5,mStone,0,2.74,0,scene,6,true);
  var pts=[];for(var i=0;i<=10;i++){var a=i/10*Math.PI/2;pts.push(new THREE.Vector2(.03+Math.sin(a)*.24,2.5-(1-Math.cos(a))*.2));}
  var sh=new THREE.Mesh(new THREE.LatheGeometry(pts,40),mShade);scene.add(sh);
  cyl(.03,.03,.05,mBrass,0,2.5,0,scene,16,true);
  var b=new THREE.Mesh(new THREE.SphereGeometry(.055,20,14),mBulb);b.position.set(0,2.41,0);scene.add(b);
  hitBox(.6,.5,.6,0,2.5,0,scene,'pendant',null);
})();

/* ---------- north wall: door, keypad, switch ---------- */
var doorG, kp={}, sw={};
(function(){
  // casing
  box(.08,2.14,.14,mTrim,.41,1.07,-2.99,scene,true);box(.08,2.14,.14,mTrim,1.39,1.07,-2.99,scene,true);
  box(1.06,.09,.14,mTrim,.9,2.145,-2.99,scene,true);box(1.12,.03,.17,mTrim,.9,2.2,-2.99,scene,true);
  box(.9,.02,.1,mStone,.9,.01,-3.02,scene,true);
  doorG=grp(.45,0,-3.035);
  reg(box(.895,2.08,.045,mFurn,.4475,1.05,0,doorG),'door','door');

var V3=THREE.Vector3;
var ZONES={
  door:{c:new V3(.95,1.15,-3),n:new V3(0,0,1),w:2.1,h:2.4},
  keypad:{c:new V3(1.75,1.3,-2.97),n:new V3(0,0,1),w:.4,h:.56},
  'switch':{c:new V3(.12,1.2,-2.97),n:new V3(0,0,1),w:.5,h:.5},
  desk:{c:new V3(-1.4,.7,-2.2),n:new V3(0,.55,1),w:.95,h:.8},
  frames:{c:new V3(-2.97,1.45,0),n:new V3(1,0,0),w:3.0,h:1.2},
  clock:{c:new V3(0,1.98,2.95),n:new V3(0,0,-1),w:.75,h:.75},
  cabinet:{c:new V3(0,.52,2.56),n:new V3(0,.3,-1),w:1.65,h:1.1},
  vent:{c:new V3(2.0,.3,2.9),n:new V3(0,.45,-1),w:.9,h:.75},
  shelf:{c:new V3(2.7,1.3,1.5),n:new V3(-1,0,0),w:1.15,h:1.6}
};
var view='room', camBusy=false, baseYaw=0, basePitch=0;
function zonePose(z){
  var Z=ZONES[z],vf=camera.fov*Math.PI/180,hf=2*Math.atan(Math.tan(vf/2)*camera.aspect);
  var d=Math.max(Z.w/2/Math.tan(hf/2),Z.h/2/Math.tan(vf/2))*1.14;
  var n=Z.n.clone().normalize(),p=Z.c.clone().addScaledVector(n,d);
  p.x=clamp(p.x,-2.6,2.6);p.z=clamp(p.z,-2.6,2.6);p.y=clamp(p.y,.45,2.6);
  var dir=Z.c.clone().sub(p).normalize();
  return {x:p.x,y:p.y,z:p.z,yaw:Math.atan2(dir.x,-dir.z),pitch:Math.asin(dir.y)};
}
function flyTo(p,dur){
  camBusy=true;
  var dy=p.yaw-cam.yaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));
  var ty=cam.yaw+dy;
  tw(cam,'x',p.x,dur);tw(cam,'y',p.y,dur);tw(cam,'z',p.z,dur);tw(cam,'pitch',p.pitch,dur);
  tw(cam,'yaw',ty,dur,function(){camBusy=false;baseYaw=ty;basePitch=p.pitch;});
}
function go(z){
  if(view===z)return;
  view=z;bookSel=-1;poseBooks(false);
  $('back').hidden=(z==='room');
  if(z==='room')flyTo({x:0,y:1.5,z:0,yaw:cam.yaw,pitch:0},650);
  else flyTo(zonePose(z),750);
}
function resize(){
  var w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;
  var vf=2*Math.atan(Math.tan(26*Math.PI/180)/camera.aspect)*180/Math.PI;
  camera.fov=clamp(vf,58,86);camera.updateProjectionMatrix();
  if(view!=='room'&&!camBusy){var p=zonePose(view);cam.x=p.x;cam.y=p.y;cam.z=p.z;cam.yaw=p.yaw;cam.pitch=p.pitch;baseYaw=p.yaw;basePitch=p.pitch;}
}
window.addEventListener('resize',resize);

/* ---------- pointer input ---------- */
var ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),ptr=null;
function shown(o){while(o){if(!o.visible)return false;o=o.parent;}return true;}
function pick(x,y){
  var r=canvas.getBoundingClientRect();
  ndc.set((x-r.left)/r.width*2-1,-((y-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  var hits=ray.intersectObjects(targets,false);
  for(var i=0;i<hits.length;i++){if(shown(hits[i].object))return hits[i].object;}
  return null;
}
canvas.addEventListener('pointerdown',function(e){
  if(!S.started||S.cleared)return;
  ptr={id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,moved:false,t:performance.now()};
  try{canvas.setPointerCapture(e.pointerId);}catch(err){}
});
canvas.addEventListener('pointermove',function(e){
  if(!ptr||e.pointerId!==ptr.id)return;
  var dx=e.clientX-ptr.x,dy=e.clientY-ptr.y;ptr.x=e.clientX;ptr.y=e.clientY;
  if(!ptr.moved&&Math.hypot(e.clientX-ptr.sx,e.clientY-ptr.sy)>7)ptr.moved=true;
  if(!ptr.moved||camBusy)return;
  var k=camera.fov*Math.PI/180/window.innerHeight*1.1;
  cam.yaw-=dx*k;cam.pitch+=dy*k;
  if(view==='room')cam.pitch=clamp(cam.pitch,-1.15,1.25);
  else{cam.yaw=clamp(cam.yaw,baseYaw-.6,baseYaw+.6);cam.pitch=clamp(cam.pitch,basePitch-.45,basePitch+.45);}
});
function up(e){
  if(!ptr||e.pointerId!==ptr.id)return;
  var p=ptr;ptr=null;
  if(e.type==='pointercancel'||p.moved||camBusy||busy)return;
  if(performance.now()-p.t>600)return;
  var m=pick(e.clientX,e.clientY);if(m)tapObject(m);
}
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
window.addEventListener('keydown',function(e){
  if(!S.started||S.cleared)return;
  if(e.key==='Escape'&&view!=='room'&&!camBusy){go('room');}
  if(camBusy)return;
  if(e.key==='ArrowLeft')cam.yaw-=.12;if(e.key==='ArrowRight')cam.yaw+=.12;
  if(view==='room'){if(e.key==='ArrowUp')cam.pitch=clamp(cam.pitch+.08,-1.15,1.25);if(e.key==='ArrowDown')cam.pitch=clamp(cam.pitch-.08,-1.15,1.25);}
  else cam.yaw=clamp(cam.yaw,baseYaw-.6,baseYaw+.6);
});

function begin(){
  initAudio();if(ac&&ac.state==='suspended'){try{ac.resume();}catch(e){}}
  S.started=true;$('title').hidden=true;$('hud').style.visibility='visible';
  view='room';$('back').hidden=true;cam.x=0;cam.y=1.5;cam.z=0;cam.pitch=0;
  flyTo({x:0,y:1.5,z:0,yaw:.18,pitch:0},900);
  if(!S.time)say('白い部屋だ。ドラッグで見回し、気になる場所に触れてみよう。');
  save();
}
$('startBtn').addEventListener('click',function(){S=fresh();bookSel=-1;busy=false;syncAll();begin();});
$('contBtn').addEventListener('click',function(){begin();});
$('againBtn').addEventListener('click',function(){
  S=fresh();bookSel=-1;busy=false;L=1;syncAll();$('end').hidden=true;$('fade').style.opacity=0;begin();
});

/* ---------- loop ---------- */
var last=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;
  stepAnims(dt);
  if(!S.started&&!camBusy)cam.yaw+=dt*.07;
  if(S.started&&!S.cleared&&$('memo').hidden)S.time+=dt;
  var Lt=S.dark?0:1;L+=(Lt-L)*Math.min(1,dt*5);if(Math.abs(Lt-L)<.002)L=Lt;
  var d=1-L;
  hemi.intensity=.13+.57*L;amb.intensity=.25*L;hemi.color.copy(hemiNight).lerp(hemiDay,L);
  spot.intensity=.5*L;fill.intensity=.2*L;
  mWin.emissiveIntensity=.9*L+.02;mBulb.emissiveIntensity=L;
  bg.copy(cDay).lerp(cNight,d);scene.fog.color.copy(bg);
  mGlow.opacity=d*d*(.88+.12*Math.sin(now*.003));
  secHand.rotation.z=-52*Math.PI/30+(Math.sin(now*.02)>.6?-.02:0);
  camera.position.set(cam.x,cam.y,cam.z);camera.rotation.y=-cam.yaw;camera.rotation.x=cam.pitch;
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

function start(data){
  var fromHot=valid(data)&&data.started;
  var d=fromHot?data:loadLocal();
  if(d){var f=fresh();for(var k in f){if(d[k]===undefined)d[k]=f[k];}S=d;}
  resize();syncAll();
  $('hud').style.visibility='hidden';
  if(S.cleared){S=fresh();syncAll();}
  if(fromHot&&S.started){$('title').hidden=true;$('hud').style.visibility='visible';cam.yaw=.18;baseYaw=.18;}
  else{
    var cont=S.started;S.started=false;
    $('contBtn').hidden=!cont;
    if(cont)$('startBtn').textContent='はじめから';
  }
  if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){try{window.claude.hot.snapshot(function(){return S;});}catch(e){}}
  var go2=function(){dial.forEach(function(x){x.tex.redraw();});kp.tex.redraw();requestAnimationFrame(frame);};
  var done=false,once=function(){if(done)return;done=true;go2();};
  try{document.fonts.load('600 40px "Cormorant Garamond"').then(once,once);}catch(e){once();}
  setTimeout(once,1200);
}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>
