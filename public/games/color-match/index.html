<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>いろ あて</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Hiragino Maru Gothic ProN", system-ui, sans-serif;
    background: #f0f9ff; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 28px; padding: 80px 16px 24px;
  }
  #q { font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 900; color: #334155; }
  #grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; width: min(90vw, 460px); }
  .c { aspect-ratio: 1; border: 0; border-radius: 28px; box-shadow: 0 6px 0 rgba(0,0,0,.15); cursor: pointer; transition: transform .1s; }
  .c:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-10px) } 75% { transform: translateX(10px) } }
  #msg { height: 56px; display: flex; align-items: center; justify-content: center; }
  #msg svg { width: 56px; height: 56px; animation: pop .3s ease-out; }
  @keyframes pop { from { transform: scale(.4) } to { transform: scale(1) } }
  #score { position: fixed; top: 16px; right: 16px; display: flex; align-items: center; gap: 6px; background: #fff; padding: 8px 18px; border-radius: 999px; font-size: 1.5rem; font-weight: 900; color: #0284c7; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
  #score svg { width: 26px; height: 26px; color: #f59e0b; }
</style>
</head>
<body>
  <div id="score"><span id="star"></span><span id="num">0</span></div>
  <div id="q"></div>
  <div id="grid"></div>
  <div id="msg"></div>
<script>
  // サンプルのHTMLゲーム：言われた色をタップする
  const COLORS = [
    { name: 'あか', hex: '#ef4444' }, { name: 'あお', hex: '#3b82f6' },
    { name: 'きいろ', hex: '#facc15' }, { name: 'みどり', hex: '#22c55e' },
    { name: 'ピンク', hex: '#f472b6' }, { name: 'むらさき', hex: '#a855f7' },
    { name: 'オレンジ', hex: '#fb923c' }, { name: 'ちゃいろ', hex: '#92400e' },
  ];
  // Lucideアイコン（SVGを直接埋め込み。外部読み込みなしで動きます）
  const svg = (inner, color) =>
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="${color || 'currentColor'}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
  const ICONS = {
    star: svg('<path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/>'),
    partyPopper: svg('<path d="M5.8 11.3 2 22l10.7-3.79"/><path d="M4 3h.01"/><path d="M22 8h.01"/><path d="M15 2h.01"/><path d="M22 20h.01"/><path d="m22 2-2.24.75a2.9 2.9 0 0 0-1.96 3.12c.1.86-.57 1.63-1.45 1.63h-.38c-.86 0-1.6.6-1.76 1.44L14 10"/><path d="m22 13-.82-.33c-.86-.34-1.82.2-1.98 1.11c-.11.7-.72 1.22-1.43 1.22H17"/><path d="m11 2 .33.82c.34.86-.2 1.82-1.11 1.98C9.52 4.9 9 5.52 9 6.23V7"/><path d="M11 13c1.93 1.93 2.83 4.17 2 5-.83.83-3.07-.07-5-2-1.93-1.93-2.83-4.17-2-5 .83-.83 3.07.07 5 2Z"/>', '#16a34a'),
    circleHelp: svg('<circle cx="12" cy="12" r="10"/><path d="M9 9.5a3 2.5 0 016 0c0 2-2 2-3 3.5"/><path d="M12 17h.01"/>', '#94a3b8'),
  };

  let score = 0, answer;
  const $ = (id) => document.getElementById(id);
  $('star').innerHTML = ICONS.star;

  function speak(text) {
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP'; u.rate = 0.9;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch (e) {}
  }

  function round() {
    const choices = [...COLORS].sort(() => Math.random() - 0.5).slice(0, 4);
    answer = choices[Math.floor(Math.random() * 4)];
    $('q').textContent = `「${answer.name}」は どれ？`;
    $('msg').innerHTML = '';
    $('grid').innerHTML = '';
    choices.forEach((c) => {
      const b = document.createElement('button');
      b.className = 'c'; b.style.background = c.hex; b.ariaLabel = c.name;
      b.onclick = () => pick(c, b);
      $('grid').appendChild(b);
    });
    speak(`${answer.name}は どれ？`);
  }

  function pick(c, el) {
    if (c === answer) {
      score++; $('num').textContent = score;
      $('msg').innerHTML = ICONS.partyPopper; speak('せいかい！');
      setTimeout(round, 1000);
    } else {
      el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
      $('msg').innerHTML = ICONS.circleHelp;
    }
  }

  round();
</script>
</body>
</html>
