<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>焙煎所経営シミュレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 設計: 生豆の灰緑の紙面に、コーヒーチェリーの赤を一点。進行は「焙煎度の色」で表す。1カラムの帳簿＋下部ドック */
:root{
  --bg:#E9EDE5; --surface:#F7F9F4; --sunk:#DDE3D8; --ink:#18231F; --muted:#586660; --line:#C9D1C6;
  --accent:#BF3327; --accent-ink:#FFF7F5; --sage:#5F8369; --roast:#6A4125;
  --good:#23744F; --warn:#9A6410; --bad:#B3261E; --info:#3B6278;
  --display:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  --r0:#8FA387; --r1:#C9B46A; --r2:#B8823F; --r3:#8A5528; --r4:#5A3418; --r5:#2E1A0E;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111715; --surface:#1A2320; --sunk:#0C110F; --ink:#E6ECE4; --muted:#98A69D; --line:#2D3934;
    --accent:#F0705F; --accent-ink:#200907; --sage:#8FB79B; --roast:#C9925F;
    --good:#62C99B; --warn:#E3B152; --bad:#F38B80; --info:#86B7D1; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#1A2320; --sunk:#0C110F; --ink:#E6ECE4; --muted:#98A69D; --line:#2D3934;
  --accent:#F0705F; --accent-ink:#200907; --sage:#8FB79B; --roast:#C9925F;
  --good:#62C99B; --warn:#E3B152; --bad:#F38B80; --info:#86B7D1; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:760px;margin:0 auto;padding:0 16px 190px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.02em}
h3{font-size:14px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:12.5px}

/* ヘッダー */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:15px;letter-spacing:.06em}
.brand b{color:var(--accent);font-weight:400}
.when{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px;margin-top:8px}
.stat{min-width:0}
.stat .k{font-size:11px;color:var(--muted);letter-spacing:.05em}
.stat .v{font-family:var(--mono);font-size:18px;font-weight:500;line-height:1.2}
.meter{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:3px}
.meter i{display:block;height:100%;background:var(--sage);border-radius:3px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.meter.rep i{background:var(--roast)}
.beans{display:flex;gap:3px;margin-top:9px;align-items:center}
.bean{flex:1;max-width:22px;height:11px;border-radius:50%;background:var(--sunk);position:relative;transition:background .6s}
.bean::after{content:"";position:absolute;left:50%;top:15%;bottom:15%;width:1px;background:rgba(0,0,0,.28);transform:rotate(14deg)}
.bean.now{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--accent);animation:pulse 1.6s ease-in-out infinite}
.bean.fy{margin-right:6px}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--bg),0 0 0 5px var(--accent)}}

/* 汎用 */
main{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.grid3{gap:6px}.grid3 .tile{padding:8px 7px}.grid3 .tile .v{font-size:14.5px}}
.tile{background:var(--sunk);border-radius:8px;padding:9px 10px;min-width:0}
.tile .k{font-size:11px;color:var(--muted)} .tile .v{font-family:var(--mono);font-size:17px;font-weight:500}
.tile .d{font-size:11.5px;font-family:var(--mono)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.news{border-left:4px solid var(--info);background:var(--surface);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;animation:slidein .5s both}
.news.good{border-color:var(--good)} .news.bad{border-color:var(--bad)} .news.warn{border-color:var(--warn)}
.news.good .pill{color:var(--good)} .news.bad .pill{color:var(--bad)} .news.warn .pill{color:var(--warn)} .news .pill{color:var(--info)}
.news h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@keyframes slidein{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-weight:500;color:var(--muted);font-size:11.5px}
td{font-family:var(--mono);font-variant-numeric:tabular-nums} td:first-child{font-family:var(--body)}
tr.total td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.scroll{overflow-x:auto}

/* 操作 */
.ctl{display:flex;flex-direction:column;gap:4px}
.ctl-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ctl-h label{font-size:13px;font-weight:500}
.ctl-h output{font-family:var(--mono);font-weight:500;font-size:15px}
.ctl-r{display:flex;align-items:center;gap:8px}
.stp{width:36px;height:36px;flex:none;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:18px;line-height:1}
.stp:active{background:var(--sunk)}
input[type=range]{flex:1;min-width:0;height:36px;accent-color:var(--accent);margin:0}
.hint{font-size:12px;color:var(--muted)}
.live{font-size:13px;background:var(--sunk);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:4px}
.live .row{font-size:13px} .live b{font-family:var(--mono);font-weight:500}
.btn{border:1px solid var(--ink);background:transparent;border-radius:8px;padding:9px 14px;font-weight:700;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.on{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:default}
.btn.wide{width:100%}
.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.gauge{height:14px;background:var(--sunk);border-radius:7px;overflow:hidden;position:relative}
.gauge i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--r0),var(--r1) 30%,var(--r2) 55%,var(--r3) 80%,var(--r4));border-radius:7px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.sw{display:flex;align-items:center;gap:8px;font-size:13px}
.sw input{width:20px;height:20px;accent-color:var(--accent)}

/* 焙煎所の絵 */
.scene{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.scene svg{display:block;width:100%;height:auto}
.spin{animation:spin var(--spd,4s) linear infinite}
.spin.rev{animation-direction:reverse;animation-duration:calc(var(--spd,4s)*1.6)}
@keyframes spin{to{transform:rotate(360deg)}}
.flame{animation:flick .35s ease-in-out infinite alternate;transform-origin:center bottom;transform-box:fill-box}
.flame.f2{animation-duration:.27s} .flame.f3{animation-duration:.42s}
@keyframes flick{from{transform:scaleY(.7)}to{transform:scaleY(1.15)}}
.puff{animation:puff 3.2s ease-out infinite;opacity:0}
.puff.p2{animation-delay:1.05s} .puff.p3{animation-delay:2.1s}
@keyframes puff{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:.55}100%{transform:translate(14px,-30px) scale(1.9);opacity:0}}
.drop{animation:drop 1.4s linear infinite}
.drop.d2{animation-delay:.45s} .drop.d3{animation-delay:.9s}
@keyframes drop{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(34px,22px);opacity:0}}
.walker{animation:walk 9s linear infinite}
.walker.w2{animation-delay:-4.5s}
@keyframes walk{0%{transform:translateX(0);opacity:0}8%{opacity:1}45%{transform:translateX(-52px);opacity:1}55%{transform:translateX(-52px);opacity:1}92%{opacity:1}100%{transform:translateX(0);opacity:0}}

/* ドック */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:7px}
.fore{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap;align-items:baseline}
.fore b{font-family:var(--mono);font-weight:500;color:var(--ink);font-size:13px}
.fore b.neg{color:var(--bad)} .fore b.pos{color:var(--good)}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.tab{border:0;background:transparent;padding:8px 0 6px;font-size:13px;font-weight:500;color:var(--muted);border-top:3px solid transparent;border-radius:0}
.tab.on{color:var(--ink);border-top-color:var(--accent);font-weight:700}

/* オーバーレイ */
.ov{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.sheet{background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;width:100%;max-width:760px;max-height:92%;overflow-y:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.sheet>*{flex-shrink:0}
@keyframes rise{from{transform:translateY(40px);opacity:.2}to{transform:none;opacity:1}}
.roasting{align-items:center}
.roasting .box{width:min(92%,420px);display:flex;flex-direction:column;gap:10px;text-align:center}
.curve{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.6s cubic-bezier(.4,0,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.crack{opacity:0;animation:show .3s 1.15s forwards}
@keyframes show{to{opacity:1}}
.wipe{transform-origin:left center;transform-box:fill-box;animation:wipe 1.6s linear forwards}
@keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big3 .tile .v{font-size:19px}
@media (max-width:380px){.big3 .tile .v{font-size:16px}}
.bar{display:grid;grid-template-columns:52px 1fr 64px;gap:8px;align-items:center;font-size:12.5px}
.bar .t{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:6px;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar .n{text-align:right;font-family:var(--mono)}
.adv{display:flex;flex-direction:column;gap:7px}
.adv li{list-style:none;border-left:3px solid var(--line);padding-left:10px;font-size:13.5px}
.adv li.bad{border-color:var(--bad)} .adv li.good{border-color:var(--good)} .adv li.warn{border-color:var(--warn)}
ul{margin:0;padding:0}

/* 開始・終了 */
.hero-t{font-family:var(--display);font-size:clamp(30px,9vw,46px);line-height:1.15;letter-spacing:.02em}
.hero-t em{font-style:normal;color:var(--accent)}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv .btn{padding:12px 6px;display:flex;flex-direction:column;gap:2px;align-items:center}
.lv .btn span{font-size:11.5px;font-weight:400;color:var(--muted)}
.stamp{font-family:var(--display);font-size:96px;line-height:1;color:var(--accent);border:6px solid var(--accent);border-radius:16px;width:140px;height:140px;display:grid;place-items:center;transform:rotate(-8deg);animation:stamp .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.4);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.rain i{position:absolute;top:-20px;width:10px;height:14px;border-radius:50%;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
dl{margin:0;display:flex;flex-direction:column;gap:10px}
dt{font-weight:700;font-size:14px} dd{margin:2px 0 0;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top" id="top"></header>
  <main id="view"></main>
</div>
<div class="dock" id="dock" hidden></div>
<div id="ovroot"></div>
<script>
/* ===== ENGINE (DOM非依存) ===== */
const GR = [
  {k:'blend', name:'ハウスブレンド', tag:'プレミアム・82点', diff:2,  base:82, ref:800,  kR:1.6,  kE:2.0, shR:0.55, shE:0.45, wh:0.75, min:500,  max:1400, col:'#B8823F'},
  {k:'so',    name:'シングルオリジン', tag:'単一農園・86点', diff:5,  base:86, ref:1150, kR:1.25, kE:1.5, shR:0.33, shE:0.40, wh:0.25, min:700,  max:2000, col:'#8A5528'},
  {k:'micro', name:'マイクロロット', tag:'希少品・90点',   diff:14, base:90, ref:1900, kR:0.95, kE:1.1, shR:0.12, shE:0.15, wh:0,    min:1100, max:3600, col:'#C2362B'}
];
const INV = [
  {k:'r5',   name:'5kg焙煎機',     cost:3800000, life:60, desc:'焙煎能力 +1,000kg/月。ガス代も下がる'},
  {k:'r15',  name:'15kg焙煎機',    cost:9800000, life:60, desc:'焙煎能力 +3,000kg/月。卸の拡大向け'},
  {k:'ec',   name:'ECサイト構築',   cost:600000,  life:36, desc:'全国へ通販。月額3万円＋販売手数料'},
  {k:'reno', name:'店舗改装',       cost:1500000, life:60, desc:'試飲カウンター新設。店頭の商圏 +30%'}
];
const DIFF = {
  easy:  {name:'ゼミ入門', cash:4500000, vol:0.7, ev:0.35, limit:15000000},
  normal:{name:'標準',     cash:3000000, vol:1.0, ev:0.45, limit:10000000},
  hard:  {name:'上級',     cash:2200000, vol:1.4, ev:0.60, limit:8000000}
};
const MONTHS = 24;
const SEASON = [0.95,0.95,0.90,0.85,0.85,0.95,1.05,1.15,1.35,1.05,1.10,1.00]; // 4月始まり
const FIX = {rent:220000, util:50000, owner:250000, wage:280000, ecfee:30000, other:30000};

function rnd(s){ s.seed=(s.seed+0x6D2B79F5)|0; let t=Math.imul(s.seed^(s.seed>>>15),1|s.seed); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }
function gauss(s){ return Math.sqrt(-2*Math.log(rnd(s)+1e-12))*Math.cos(2*Math.PI*rnd(s)); }
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function eff(s,key){ return s.effects.reduce((a,e)=>e.key===key?a*e.mult:a,1); }
function calMonth(m){ return ((m-1+3)%12)+1; }           // ゲーム月→暦月
function monthLabel(m){ return (Math.ceil(m/12))+'年目 '+calMonth(m)+'月'; }

function newGame(diff, seed){
  const D=DIFF[diff];
  const s={diff, seed:seed|0, m:1, cash:D.cash, loan:0, eloan:0, ar:0, A:12, R:45, skill:1, staff:0, accounts:1,
    mkt:6.5, fx:150, mktHist:[], green:{}, carry:{}, equip:{r1:true,r5:false,r15:false,ec:false,reno:false},
    assets:[{name:'1kg焙煎機', cost:1200000, life:60, left:60}], fyProfit:0, effects:[], pending:0, news:[], hist:[],
    over:null, flags:{}, tot:{lost:0,waste:0,interest:0,tax:0}};
  for(const g of GR){ s.green[g.k]={kg:0,cost:0}; s.carry[g.k]={kg:0,cost:0}; }
  for(let i=0;i<6;i++){ stepMarket(s); }
  s.news=[{t:'開業おめでとうございます', b:'1kg焙煎機と小さな店舗からのスタートです。友人のカフェ1軒が最初の卸先になってくれました。', tone:'good'}];
  return s;
}
function stepMarket(s){
  const v=DIFF[s.diff].vol;
  s.mkt=clamp(s.mkt+0.12*(6.5-s.mkt)+0.30*v*gauss(s),3.5,12);
  s.fx =clamp(s.fx +0.10*(150-s.fx)+2.5*v*gauss(s),115,190);
  s.mktHist.push({mkt:s.mkt,fx:s.fx}); if(s.mktHist.length>30) s.mktHist.shift();
}
function discount(q){ return q>=600?0.90:(q>=240?0.95:1); }
function greenPrice(s,g,q){ return (s.mkt+g.diff)*s.fx*1.25*discount(q||0); }
function lossRate(s){ return 0.16-0.003*s.skill; }
function gasCost(s){ return (s.equip.r15?32:(s.equip.r5?38:45))*eff(s,'util'); }
function capacity(s){
  const roast=((s.equip.r1?250:0)+(s.equip.r5?1000:0)+(s.equip.r15?3000:0))*eff(s,'cap');
  const labor=160+260*s.staff;
  return {roast:Math.round(roast), labor, eff:Math.round(Math.min(roast,labor))};
}
function fixedAssets(s){ return s.assets.reduce((a,x)=>a+x.cost*x.left/x.life,0); }
function inventory(s){ let v=0; for(const g of GR){ v+=s.green[g.k].kg*s.green[g.k].cost+s.carry[g.k].kg*s.carry[g.k].cost; } return v; }
function equity(s){ return s.cash+s.ar+inventory(s)+fixedAssets(s)-s.loan-s.eloan; }
function elasticity(g,p,ch){ return (ch==='ec'?g.kE:g.kR)*p/g.ref; }

function demand(s,dec,noisy){
  const sea=SEASON[(s.m-1)%12], dm=eff(s,'demand'), v=DIFF[s.diff].vol;
  const aR=Math.pow(s.A/100,0.7)*(0.45+s.R/100), aE=Math.pow(s.A/100,1.4)*(0.35+s.R/100);
  const qb=1+0.02*s.skill, common=noisy?1+0.05*v*gauss(s):1;
  const n=()=>noisy?Math.max(0.5,common*(1+0.07*v*gauss(s))):1;
  const out={retail:{},ec:{},wh:{}};
  for(const g of GR){
    const p=dec.price[g.k];
    out.retail[g.k]=300*(s.equip.reno?1.3:1)*eff(s,'retail')*aR*g.shR*sea*dm*Math.exp(-g.kR*(p/g.ref-1))*qb*n();
    out.ec[g.k]=s.equip.ec?420*aE*g.shE*sea*dm*Math.exp(-g.kE*(p/g.ref-1))*qb*n():0;
    out.wh[g.k]=s.accounts*12*(1+(sea-1)*0.5)*g.wh*(noisy?Math.max(0.6,1+0.04*v*gauss(s)):1);
  }
  return out;
}
function whIndex(dec){ let i=0; for(const g of GR){ i+=g.wh*(dec.price[g.k]*dec.whRate)/(g.ref*0.6); } return i; }
function whLeads(s,dec){ return 1.6*(1-Math.exp(-(dec.sales||0)/120000))*(0.4+s.R/100)*Math.pow(whIndex(dec),-2.5)*eff(s,'whLead')+0.15*s.R/100; }
function whChurn(s,dec,stock){ return clamp(0.04+0.25*Math.max(0,whIndex(dec)-1)+0.3*(stock||0)-0.0003*(s.R-50),0.01,0.6); }

function defaultDec(){ return {buy:{blend:0,so:0,micro:0}, roast:{blend:0,so:0,micro:0}, price:{blend:800,so:1150,micro:1900}, whRate:0.6, ad:30000, sales:0, train:0, hire:0, borrow:0, repay:0, invest:{}}; }
function autoFit(s,dec){
  const d=demand(s,dec,false), loss=lossRate(s);

  const t=JSON.parse(JSON.stringify(s)); for(const it of INV){ if(dec.invest[it.k]) t.equip[it.k]=true; } t.staff=Math.max(0,t.staff+(dec.hire||0));
  const cap=capacity(t).eff; let want={},tot=0;

function runMonth(s,dec,dry){

    const sold=sw+sr+se, dtot=dm.wh[g.k]+dm.retail[g.k]+dm.ec[g.k], fromOld=Math.min(sold,c.kg), discard=c.kg-fromOld, fromFresh=sold-fromOld;
    cogs+=fromOld*c.cost+fromFresh*f.cost; waste+=discard*c.cost;

    sales.wh+=sw*wp; sales.retail+=sr*p; sales.ec+=se*p; kg.wh+=sw; kg.retail+=sr; kg.ec+=se;

function genEvents(s,rec){

function renderTop(){

  let beans=''; for(let i=1;i<=MONTHS;i++){ const done=i<S.m; beans+=`<i class="bean${i===S.m&&!S.over?' now':''}${i===12?' fy':''}" ${done?`style="background:${roastColor((i-1)/(MONTHS-1))}"`:''}></i>`; }

  $('top').innerHTML=`<div class="top-row"><span class="brand">焙煎所<b>経営</b>シミュレーター</span><span class="when">${mLeft}・${DIFF[S.diff].name}</span></div>

const LIVE={
  dock(){ return `<span>今月の予想</span><span>売上 <b>${man(P.sales.total)}</b></span><span>営業利益 <b class="${cls(P.op)}">${man(P.op,1)}</b></span><span>月末現金 <b class="${P.emergency>0?'neg':''}">${P.emergency>0?'不足':man(P.cash)}</b></span>`; },
  cap(){ const plan=GR.reduce((a,g)=>a+DEC.roast[g.k],0); const w=P.cap>0?clamp(P.roastedKg/P.cap,0,1):0;
    const bn=P.capRoast<=P.capLabor?'焙煎機':'人手';
    let msg=''; if(plan>P.roastedKg+0.5) msg=`<p class="neg small">計画 ${kgf(plan)} のうち ${kgf(P.roastedKg)} しか焙煎できません（能力または生豆の不足）。</p>`;
    else if(w>0.92) msg=`<p class="small" style="color:var(--warn)">稼働率が92%を超えると品質が落ちます。</p>`;
    return `<div class="row"><span>焙煎計画 <b class="num">${kgf(P.roastedKg)}</b> / 能力 <b class="num">${kgf(P.cap)}</b></span><span class="pill" style="color:${w>0.92?'var(--warn)':'var(--muted)'}">稼働率 ${pc(w)}</span></div>
    <div class="gauge"><i style="width:${w*100}%"></i></div><p class="hint">焙煎機 ${kgf(P.capRoast)}・人手 ${kgf(P.capLabor)}。制約になっているのは${bn}です。</p>${msg}`; },
  prod(k){ const g=GR.find(x=>x.k===k), r=P.g[k], q=DEC.buy[k], up=greenPrice(S,g,q), d=discount(q);
    const bal=r.lost>0.5?`<b class="neg">欠品 ${kgf(r.lost)}</b>`:`<b>翌月へ ${kgf(r.carry)}</b>`;
    return `<div class="row"><span>予測需要</span><b>${kgf(r.demand)}</b></div><div class="row"><span>販売見込み</span><b>${kgf(r.sold)}</b></div><div class="row"><span>過不足</span>${bal}</div>
    ${r.discard>0.5?`<div class="row"><span>前月分の廃棄</span><b class="neg">${kgf(r.discard)}</b></div>`:''}
    <div class="row"><span>仕入単価${d<1?`（数量割引 −${Math.round((1-d)*100)}%）`:''}</span><b>${yen(up)}/kg</b></div><div class="row"><span>仕入額</span><b>${man(q*up)}円</b></div>`; },
  price(k){ const g=GR.find(x=>x.k===k), p=DEC.price[k], r=P.g[k], unit=unitCost(g)/10;
    const mR=p-unit-45-p*0.032, e=elasticity(g,p,'retail');
    return `<div class="row"><span>需要の価格弾力性（店頭）</span><b>${e.toFixed(2)}</b></div>
    <p class="hint">${e>1.05?'弾力的：値下げすると売上高が増えます。':(e<0.95?'非弾力的：値上げしても売上高は増えます。':'ほぼ1：売上高が最大になる価格帯です。')}</p>
    <div class="row"><span>予測需要 店頭 / EC / 卸</span><b>${Math.round(r.dR)} / ${Math.round(r.dE)} / ${Math.round(r.dW)} kg</b></div>
    <div class="row"><span>店頭の限界利益</span><b class="${cls(mR)}">${yen(mR)}/100g（${pc(mR/p)}）</b></div>`; },
  wh(){ const leads=whLeads(S,DEC), ch=whChurn(S,DEC,0), i=whIndex(DEC);
    return `<div class="row"><span>卸価格 ブレンド / シングル</span><b>${yen(DEC.price.blend*DEC.whRate*10)} / ${yen(DEC.price.so*DEC.whRate*10)} /kg</b></div>
    <div class="row"><span>相場比</span><b>${pc(i)}</b></div><div class="row"><span>新規獲得の見込み</span><b>月 ${leads.toFixed(1)} 軒</b></div><div class="row"><span>解約率の見込み</span><b class="${ch>0.08?'neg':''}">月 ${(ch*100).toFixed(1)}%</b></div>
    <p class="hint">現在の卸先 ${S.accounts} 軒。1軒あたり月およそ12kg。代金の回収は翌月です。</p>`; },
  mkt(){ return `<div class="row"><span>来月の認知度（予想）</span><b>${S.A.toFixed(0)} → ${P.A.toFixed(0)}</b></div><p class="hint">認知度は毎月15%ずつ忘れられます。広告の効果は逓減します（月25万円で上げ幅の約63%に到達）。</p>`; },
  inv(){ const add=INV.filter(it=>DEC.invest[it.k]&&!S.equip[it.k]).reduce((a,it)=>a+it.cost,0);

  skill(){ return `<div class="row"><span>焙煎技術（10段階）</span><b>${S.skill.toFixed(1)} → ${P.skill.toFixed(1)}</b></div><p class="hint">技術が上がると品質と評判が上がり、歩留まりが改善します（現在の焙煎ロス ${(lossRate(S)*100).toFixed(1)}%）。</p>`; },
  fin(){ const rows=[['月初の現金',P.cash0,0],['借入',P.borrow,1],['返済',-P.repay,1],['設備投資',-P.capex,1],['生豆の仕入',-P.purchase,1],['焙煎のガス代',-P.gasTotal,1],['店頭・ECの売上',P.sales.retail+P.sales.ec,1],['売掛金の回収（先月の卸）',P.collected,1],['包装・手数料',-(P.pack+P.fees),1],['固定費・販促・その他',-(P.fixedSum+P.ad+P.salesExp+P.train+P.storage+P.oneoff),1],['支払利息',-P.interest,1],['法人税',-P.tax,1]];
    return `<table>${rows.filter(r=>!r[2]||Math.abs(r[1])>0.5).map(r=>`<tr><td>${r[0]}</td><td class="${r[2]?cls(r[1]):''}">${r[2]?man(r[1],1):man(r[1])}</td></tr>`).join('')}
    <tr class="total"><td>月末の現金（予想）</td><td class="${P.emergency>0?'neg':''}">${P.emergency>0?'不足 → 緊急融資 '+man(P.emergency):man(P.cash)}</td></tr></table>
    <p class="hint">今月の卸売上 ${man(P.sales.wh)}円 は売掛金になり、入金は来月です。利益と現金がずれる理由のひとつです。</p>`; },
  ana(){ const v=P.varRatio, F=P.fixedAll, bep=v<1?F/(1-v):Infinity, s=P.sales.total, ms=s>0?(s-bep)/s:0, w=bep>0&&isFinite(bep)?clamp(s/(bep*1.6),0,1):0;
    return `<div class="grid3"><div class="tile"><div class="k">限界利益率</div><div class="v">${pc(1-v)}</div></div><div class="tile"><div class="k">固定費（月）</div><div class="v">${man(F)}</div></div><div class="tile"><div class="k">損益分岐点売上高</div><div class="v">${isFinite(bep)?man(bep):'—'}</div></div></div>
    <div style="position:relative;padding-top:16px"><div class="gauge"><i style="width:${w*100}%"></i></div><div style="position:absolute;left:62.5%;top:0;bottom:0;border-left:2px solid var(--ink)"></div><div class="small" style="position:absolute;left:62.5%;top:-3px;transform:translateX(-50%);white-space:nowrap">損益分岐点</div></div>

  contrib(){ return `<div class="scroll"><table><tr><th>100gあたり限界利益</th><th>店頭</th><th>EC</th><th>卸</th></tr>${GR.map(g=>{ const p=DEC.price[g.k],u=unitCost(g)/10; const a=p-u-45-p*0.032,b=p-u-45-p*0.10-65,c=p*DEC.whRate-u-12; return `<tr><td>${g.name}</td><td class="${cls(a)}">${yen(a)}</td><td class="${cls(b)}">${S.equip.ec?yen(b):'—'}</td><td class="${cls(c)}">${g.wh?yen(c):'—'}</td></tr>`; }).join('')}</table></div>
    <p class="hint">焙煎能力が足りないときは、能力1kgあたりの限界利益が高い商品・チャネルを優先すると利益が最大になります。</p>`; },
  ratios(){ const eq=equity(S), ta=eq+S.loan+S.eloan; let gk=0; for(const g of GR){ gk+=S.green[g.k].kg; }

};
function unitCost(g){ const st=S.green[g.k], q=DEC.buy[g.k]; const c=(st.kg+q)>0?(st.kg*st.cost+q*greenPrice(S,g,q))/(st.kg+q):greenPrice(S,g,0); return c/(1-lossRate(S))+gasCost(S); }
function refreshLive(){ if(!S||S.over) return; project(); document.querySelectorAll('[data-live]').forEach(el=>{ const [n,a]=el.dataset.live.split(':'); if(LIVE[n]) el.innerHTML=LIVE[n](a); }); }

function advise(r){ const a=[];
  if(r.emergency>0) a.push(['bad',`現金が不足し、緊急融資 ${man(r.emergency)}円（年利15%）を受けました。仕入や投資の時期と、売掛金の回収の遅れを見直しましょう。`]);
  if(r.lostRatio>0.08) a.push(['bad',`欠品で ${kgf(r.lostKg)}（約${man(r.lostYen)}円）の販売機会を逃し、評判も下がりました。${r.util>0.9?'能力が上限です。設備・人員の増強か、値上げで需要を絞る手があります。':'焙煎量か生豆の仕入が足りていません。'}`]);
  const disc=GR.reduce((x,g)=>x+r.g[g.k].discard,0); if(disc>3) a.push(['warn',`前月の売れ残り ${kgf(disc)} を廃棄しました（${man(r.waste)}円の損失）。`]);
  if(r.op<0) { const bep=r.varRatio<1?r.fixedAll/(1-r.varRatio):0; a.push(['bad',`営業赤字です。損益分岐点売上高は約${man(bep)}円、実際の売上は${man(r.sales.total)}円でした。`]); }
  if(r.util<0.5&&r.cap>300) a.push(['warn',`稼働率が${pc(r.util)}にとどまりました。能力が余っています。需要を増やす施策か、卸の拡大を検討しましょう。`]);
  if(r.util>0.92) a.push(['warn','稼働率が92%を超え、焙煎品質が落ちました。']);
  if(r.sales.wh>r.cash*0.8&&r.sales.wh>500000) a.push(['warn',`売掛金が${man(r.sales.wh)}円あります。卸の比率が高いほど、現金は利益より遅れて増えます。`]);
  if(r.lostAcc>=2) a.push(['warn',`卸先が${r.lostAcc}軒離れました。欠品や高い掛け率が原因です。`]);
  if(r.A<r.A0-1&&r.ad<50000) a.push(['info','広告を絞ったため認知度が下がっています。']);
  if(r.tax>0) a.push(['info',`決算で法人税 ${man(r.tax)}円 を納めました。`]);
  if(r.op>0&&!a.some(x=>x[0]==='bad')) a.push(['good',`営業利益率は${pc(r.op/r.sales.total)}。${r.util>0.8?'能力の上限が近づいています。次の投資を考える時期です。':'この調子で需要を伸ばしましょう。'}`]);
  return a.slice(0,4); }

function animate(root){
  requestAnimationFrame(()=>requestAnimationFrame(()=>root.querySelectorAll('[data-w]').forEach(el=>el.style.width=el.dataset.w+'%')));
  root.querySelectorAll('[data-count]').forEach(el=>{ const to=+el.dataset.count, sg=el.dataset.sg; if(reduced()){ el.textContent=man(to,sg); return; }
    const t0=performance.now(), dur=900; const step=t=>{ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=man(to*e,sg); if(k<1) requestAnimationFrame(step); else el.textContent=man(to,sg); }; requestAnimationFrame(step); });
}

document.addEventListener('input',e=>{ const t=e.target;
  if(t.id==='auto'){ AUTO=t.checked; if(AUTO){ autoFit(S,DEC); render(); } return; }
  if(!t.dataset||!t.dataset.path) return; const p=t.dataset.path; setP(DEC,p,+t.value); $(t.id+'_o').textContent=FMT[t.dataset.fmt](+t.value);
  if(p.startsWith('buy.')||p.startsWith('roast.')){ if(AUTO){ AUTO=false; const c=$('auto'); if(c) c.checked=false; } } else if(AUTO){ autoFit(S,DEC); }
  refreshLive(); });
document.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.step){ const i=$(b.dataset.for); const v=clamp(+i.value+(+b.dataset.step)*(+i.step),+i.min,+i.max); i.value=v; i.dispatchEvent(new Event('input',{bubbles:true})); return; }
  if(b.dataset.toggle){ const p=b.dataset.toggle; setP(DEC,p,!getP(DEC,p)); if(AUTO) autoFit(S,DEC); render(); return; }
  if(b.dataset.tab){ TAB=b.dataset.tab; render(); window.scrollTo(0,0); return; }
  const a=b.dataset.act; if(!a) return;
  if(a==='start') start(b.dataset.diff);
  else if(a==='continue'){ const sv=loadSave(); if(sv){ S=sv.S; DEC=sv.DEC; AUTO=sv.AUTO; render(); } }
  else if(a==='run'){ b.disabled=true; runTurn(); }
  else if(a==='next') nextMonth();
  else if(a==='restart'){ S=null; DEC=null; render(); window.scrollTo(0,0); }
});
function boot(d){ if(d&&d.S){ S=d.S; DEC=d.DEC; AUTO=d.AUTO; TAB=d.TAB||'dash'; } render(); }
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot) hot.snapshot(()=>({S,DEC,AUTO,TAB}));
if(hot&&hot.ready) hot.ready(boot); else boot((hot&&hot.data)||{});
</script>
</body>
</html>
