<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141a3d">
<title>ラッシュカート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a2150; --ink2:#252e6e; --paper:#fffaf0; --muted:#bcc2ea; --sun:#ffd23a; --flame:#ff6b2c; --good:#6dffb0; --bad:#ff5a6e;
  --line:rgba(255,255,255,.16); --panel:rgba(22,28,72,.9);
  --disp:"Dela Gothic One","Zen Maru Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#141a3d; --ink2:#1f2760; --panel:rgba(18,23,60,.9); } }
:root[data-theme="dark"]{ --ink:#141a3d; --ink2:#1f2760; --panel:rgba(18,23,60,.9); }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--ink)}
body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--paper);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-size:14px;line-height:1.5;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
#wrap{position:relative;width:100%;height:100%;overflow:hidden}
#gl,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
.vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(8,10,30,.45));}
#flash{position:absolute;inset:0;pointer-events:none;background:#c9a6ff;opacity:0;transition:opacity .5s}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;display:none;
  padding:max(10px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px))}
#hud.on{display:block}
.tl{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:10px;display:flex;align-items:flex-start;gap:12px}
.pos{font-family:var(--disp);font-size:64px;line-height:.9;color:var(--paper);
  text-shadow:0 4px 0 #0c1030,0 0 18px rgba(0,0,0,.35);-webkit-text-stroke:2px #0c1030;paint-order:stroke fill}
.pos small{font-size:24px;margin-left:2px}
.pos.p1{color:var(--sun)}
.laps{margin-top:6px;display:flex;flex-direction:column;gap:2px;text-shadow:0 2px 0 #0c1030}
.laps .lap{font-family:var(--disp);font-size:20px;letter-spacing:.02em}
.laps .time{font-family:var(--disp);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.tr{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:10px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.itembox{width:74px;height:74px;border-radius:50%;background:rgba(14,18,50,.78);border:3px solid rgba(255,255,255,.85);
  box-shadow:0 0 0 3px #0c1030,inset 0 0 18px rgba(120,160,255,.35);display:grid;place-items:center;position:relative}
.itembox svg{width:50px;height:50px}
.itembox.roll svg{animation:bump .08s linear infinite alternate}
@keyframes bump{to{transform:scale(.9)}}
.itemname{font-size:12px;font-weight:900;text-shadow:0 2px 0 #0c1030;min-height:18px}
#mini{width:118px;height:118px;border-radius:14px;background:rgba(14,18,50,.55);border:1px solid var(--line)}
#pauseBtn{pointer-events:auto;position:absolute;right:calc(max(12px,env(safe-area-inset-right,0px)) + 88px);top:12px;width:40px;height:40px;border-radius:12px;
  background:rgba(14,18,50,.65);border:1px solid var(--line);display:grid;place-items:center;padding:0}
#pauseBtn svg{width:18px;height:18px}
.speedo{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);text-align:center;text-shadow:0 2px 0 #0c1030}
.speedo b{font-family:var(--disp);font-size:30px;font-weight:400;font-variant-numeric:tabular-nums}
.speedo span{font-size:12px;color:var(--muted);margin-left:4px}
.touch-on .speedo{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.drift-bar{width:120px;height:6px;border-radius:3px;background:rgba(0,0,0,.4);margin:4px auto 0;overflow:hidden;opacity:0;transition:opacity .15s}
.drift-bar.on{opacity:1}
.drift-bar i{display:block;height:100%;width:0;background:#4fb4ff;border-radius:3px}
#count{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--disp);font-size:min(30vw,170px);line-height:1;
  color:var(--paper);-webkit-text-stroke:5px #0c1030;paint-order:stroke fill;text-shadow:0 8px 0 #0c1030;display:none}
#count.go{color:var(--sun)}
#count.pop{animation:pop .9s ease-out}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(1.5);opacity:0}15%{transform:translate(-50%,-50%) scale(1);opacity:1}80%{opacity:1}100%{opacity:.2;transform:translate(-50%,-50%) scale(.9)}}
#gauge{position:absolute;left:50%;top:calc(14% + 30px);transform:translateX(-50%);width:min(78vw,300px);display:none;text-align:center}
#gauge .bar{position:relative;height:14px;border-radius:7px;background:rgba(10,12,40,.75);border:2px solid rgba(255,255,255,.8);overflow:hidden}
#gauge .z1{position:absolute;top:0;bottom:0;left:66.67%;right:0;background:rgba(255,210,58,.45)}
#gauge .z2{position:absolute;top:0;bottom:0;left:76.67%;width:16.67%;background:var(--sun)}
#gauge .mk{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 8px #fff}
#gauge .st{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--flame);display:none}
#gauge p{margin:6px 0 0;font-size:12px;font-weight:700;text-shadow:0 2px 0 #0c1030}
#msg{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);font-family:var(--disp);font-size:clamp(22px,6vw,40px);white-space:nowrap;
  -webkit-text-stroke:4px #0c1030;paint-order:stroke fill;text-shadow:0 5px 0 #0c1030;opacity:0;transition:opacity .2s}
#msg.on{opacity:1;animation:msgin .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes msgin{from{transform:translate(-50%,-50%) scale(.6)}}
#msg.good{color:var(--sun)} #msg.bad{color:var(--bad)} #msg.mt1{color:#6cc4ff} #msg.mt2{color:#ffa23a} #msg.mt3{color:#d08bff}
#wrong{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);padding:8px 18px;border-radius:12px;background:rgba(255,90,110,.9);
  font-weight:900;font-size:18px;display:none;border:3px solid #0c1030}

/* ---------- Touch ---------- */
#touch{position:absolute;inset:0;pointer-events:none;display:none}
#touch.on{display:block}
#pad{pointer-events:auto;position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(44vw,190px);height:112px;
  border-radius:56px;background:rgba(14,18,50,.42);border:2px solid rgba(255,255,255,.35);touch-action:none}
#pad .ar{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;opacity:.6}
#pad .ar.l{left:14px} #pad .ar.r{right:14px}
#knob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 4px 0 rgba(12,16,48,.6);transition:transform .06s}
.tb{pointer-events:auto;position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.75);background:rgba(14,18,50,.5);
  display:grid;place-items:center;font-weight:900;touch-action:none;box-shadow:0 4px 0 rgba(12,16,48,.6);padding:0}
.tb.on{background:rgba(255,210,58,.55);transform:translateY(2px);box-shadow:0 2px 0 rgba(12,16,48,.6)}
#bAcc{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:96px;height:96px;font-size:15px}
#bDrift{right:calc(max(16px,env(safe-area-inset-right,0px)) + 108px);bottom:calc(18px + env(safe-area-inset-bottom,0px));width:72px;height:72px;font-size:13px}
#bItem{right:calc(max(16px,env(safe-area-inset-right,0px)) + 14px);bottom:calc(132px + env(safe-area-inset-bottom,0px));width:68px;height:68px;font-size:13px}
#bBrake{right:calc(max(16px,env(safe-area-inset-right,0px)) + 116px);bottom:calc(104px + env(safe-area-inset-bottom,0px));width:52px;height:52px;font-size:11px}

/* ---------- Menus ---------- */
.screen{position:absolute;inset:0;display:none;z-index:5}
.screen.on{display:flex}
.skew{transform:skewX(-9deg)} .skew>*{display:inline-block;transform:skewX(9deg)}
.btn{min-height:52px;padding:0 30px;border:0;border-radius:10px;background:var(--sun);color:#1a1640;font-family:var(--disp);font-size:18px;letter-spacing:.04em;
  box-shadow:0 5px 0 #b8860b,0 10px 24px rgba(0,0,0,.35)}
.btn:active{transform:skewX(-9deg) translateY(3px);box-shadow:0 2px 0 #b8860b}
.btn.sub{background:var(--ink2);color:var(--paper);box-shadow:0 5px 0 #0c1030;font-size:15px;border:1px solid var(--line)}
.btn.sub:active{box-shadow:0 2px 0 #0c1030}
.back{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;height:40px;padding:0 14px;border-radius:10px;background:rgba(14,18,50,.7);border:1px solid var(--line);font-weight:700;z-index:2}
.sound{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;width:40px;height:40px;border-radius:10px;background:rgba(14,18,50,.7);border:1px solid var(--line);display:grid;place-items:center;padding:0;z-index:2}
.sound svg{width:20px;height:20px}

#scrTitle{flex-direction:column;align-items:center;justify-content:space-between;padding:8vh 20px calc(7vh + env(safe-area-inset-bottom,0px));pointer-events:none}
#scrTitle>*{pointer-events:auto}
.logo{text-align:center}
.logo h1{margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(46px,13vw,104px);line-height:1;color:var(--sun);
  -webkit-text-stroke:6px #0c1030;paint-order:stroke fill;text-shadow:0 8px 0 #0c1030;transform:skewX(-9deg) rotate(-3deg)}
.logo .stripe{display:inline-block;margin-top:14px;padding:6px 18px;background:var(--flame);color:#fff;font-family:var(--disp);font-size:clamp(12px,3vw,16px);letter-spacing:.3em;transform:skewX(-9deg) rotate(-3deg);box-shadow:0 4px 0 #0c1030}
.title-foot{display:flex;flex-direction:column;align-items:center;gap:14px}
.keys{font-size:12px;color:var(--muted);text-align:center;line-height:1.8;background:rgba(14,18,50,.6);padding:8px 14px;border-radius:12px}
.keys kbd{font-family:inherit;font-weight:900;color:var(--paper);background:rgba(255,255,255,.12);border-radius:5px;padding:0 6px;margin:0 2px}

.sheet{position:absolute;left:0;right:0;bottom:0;max-height:62%;display:flex;flex-direction:column;gap:12px;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(20,26,66,.0),rgba(20,26,66,.92) 28px);overflow:auto}
.sheet h2{margin:0;font-family:var(--disp);font-weight:400;font-size:22px;letter-spacing:.04em}
.sheet h2 small{font-family:"Zen Maru Gothic";font-size:12px;color:var(--muted);margin-left:8px;font-weight:700}
@media (min-aspect-ratio:1/1) and (min-width:760px){
  .sheet{left:auto;top:0;width:430px;max-height:none;background:linear-gradient(90deg,rgba(20,26,66,0),rgba(20,26,66,.94) 36px);padding-left:44px;padding-top:70px}
}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cc{position:relative;padding:10px 6px 8px;border-radius:12px;background:var(--ink2);border:2px solid transparent;text-align:center}
.cc svg{width:46px;height:46px;display:block;margin:0 auto 2px}
.cc b{display:block;font-size:14px;font-weight:900}
.cc span{display:block;font-size:11px;color:var(--muted)}
.cc[aria-pressed="true"]{border-color:var(--sun);background:#2f3a86;box-shadow:0 0 0 2px #0c1030 inset}
.detail{background:rgba(12,16,48,.55);border-radius:14px;padding:12px 14px}
.detail .hd{display:flex;align-items:baseline;gap:10px}
.detail .hd b{font-family:var(--disp);font-weight:400;font-size:22px}
.detail .hd span{font-size:12px;font-weight:900;padding:1px 9px;border-radius:6px;background:var(--flame)}
.detail p{margin:4px 0 8px;font-size:13px;color:var(--muted)}
.bars{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;align-items:center;font-size:12px;font-weight:700}
.segs{display:flex;gap:3px}
.segs i{flex:1;height:9px;border-radius:2px;background:rgba(255,255,255,.12);transform:skewX(-20deg)}
.segs i.f{background:var(--sun)}
.sheet .btn{align-self:stretch;position:sticky;bottom:0;flex:none;box-shadow:0 5px 0 #b8860b,0 -16px 18px 8px rgba(20,26,66,.96)}
.cc svg{width:40px;height:40px}
@media (max-height:760px){.detail p{display:none}.cc{padding:7px 4px 6px}}

.courses{display:grid;gap:8px}
.co{display:flex;gap:12px;align-items:center;padding:8px;border-radius:14px;background:var(--ink2);border:2px solid transparent;text-align:left}
.co[aria-pressed="true"]{border-color:var(--sun);background:#2f3a86}
.co canvas{width:74px;height:74px;border-radius:10px;flex:none}
.co b{display:block;font-family:var(--disp);font-weight:400;font-size:16px}
.co .stars{color:var(--sun);font-size:12px;letter-spacing:2px}
.co p{margin:2px 0 0;font-size:12px;color:var(--muted);line-height:1.45}
.co .best{font-size:11px;color:var(--good);font-weight:700}
.diffs{display:flex;gap:6px}
.diffs button{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--ink2);font-weight:900;font-size:13px}
.diffs button[aria-pressed="true"]{background:var(--paper);color:#1a1640}

.center{align-items:center;justify-content:center;padding:20px;background:rgba(10,12,34,.55)}
.panel{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 20px 20px;text-align:center}
.panel h2{margin:0 0 12px;font-family:var(--disp);font-weight:400;font-size:30px;color:var(--sun);-webkit-text-stroke:3px #0c1030;paint-order:stroke fill}
.res{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:5px;text-align:left}
.res li{display:grid;grid-template-columns:34px 18px 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.05)}
.res li.me{background:rgba(255,210,58,.18);outline:2px solid var(--sun)}
.res .r{font-family:var(--disp);font-size:18px}
.res .dot{width:14px;height:14px;border-radius:50%;border:2px solid #0c1030}
.res .n{font-weight:900}
.res .t{font-family:var(--disp);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.panel .row{display:flex;flex-direction:column;gap:10px}
.newbest{margin:-6px 0 12px;color:var(--good);font-weight:900}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>
  <div class="vign"></div>
  <div id="flash"></div>

  <div id="hud">
    <div class="tl">
      <div class="pos" id="hPos">6<small>位</small></div>
      <div class="laps"><span class="lap" id="hLap">ラップ 1/3</span><span class="time" id="hTime">0:00.00</span></div>
    </div>
    <button id="pauseBtn" aria-label="一時停止"><svg viewBox="0 0 24 24" fill="#fff"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    <div class="tr">
      <div class="itembox" id="hItem"></div>
      <div class="itemname" id="hItemName"></div>
      <canvas id="mini" width="236" height="236"></canvas>
    </div>
    <div class="speedo"><b id="hSpd">0</b><span>km/h</span><div class="drift-bar" id="hDrift"><i></i></div></div>
    <div id="count"></div>
    <div id="gauge"><div class="bar"><div class="z1"></div><div class="z2"></div><div class="st" id="gSt"></div><div class="mk" id="gMk"></div></div><p>「1」が出たら、黄色の帯でアクセル</p></div>
    <div id="msg"></div>
    <div id="wrong">逆走中</div>
  </div>

  <div id="touch">
    <div id="pad">
      <svg class="ar l" viewBox="0 0 24 24" fill="#fff"><path d="M15 5l-8 7 8 7z"/></svg>
      <svg class="ar r" viewBox="0 0 24 24" fill="#fff"><path d="M9 5l8 7-8 7z"/></svg>
      <div id="knob"></div>
    </div>
    <button class="tb" id="bAcc">アクセル</button>
    <button class="tb" id="bDrift">ドリフト</button>
    <button class="tb" id="bItem">アイテム</button>
    <button class="tb" id="bBrake">ブレーキ</button>
  </div>

  <section class="screen on" id="scrTitle">
    <div class="logo"><h1>ラッシュカート</h1><div class="stripe">RUSH KART GRAND PRIX</div></div>
    <div class="title-foot">
      <button class="btn skew" id="tStart"><span>スタート</span></button>
      <div class="keys" id="keys">
        <kbd>↑</kbd>アクセル <kbd>↓</kbd>ブレーキ <kbd>←→</kbd>ハンドル<br>
        <kbd>Space</kbd>ドリフト <kbd>X</kbd>アイテム <kbd>Esc</kbd>ポーズ
      </div>
    </div>
  </section>

  <section class="screen" id="scrChar">
    <button class="back" data-go="title">戻る</button>
    <div class="sheet" id="charSheet">
      <h2>キャラクター<small>6人から選ぶ</small></h2>
      <div class="chars" id="chars"></div>
      <div class="detail" id="cDetail"></div>
      <button class="btn skew" id="cOk"><span>このキャラで決定</span></button>
    </div>
  </section>

  <section class="screen" id="scrCourse">
    <button class="back" data-go="char">戻る</button>
    <div class="sheet" id="courseSheet">
      <h2>コース<small>3周レース</small></h2>
      <div class="courses" id="courses"></div>
      <div class="diffs" id="diffs"></div>
      <button class="btn skew" id="rStart"><span>レース開始</span></button>
    </div>
  </section>

  <section class="screen center" id="scrPause">
    <div class="panel"><h2>ポーズ</h2>
      <div class="row">
        <button class="btn skew" id="pResume"><span>再開</span></button>
        <button class="btn sub skew" id="pRestart"><span>リスタート</span></button>
        <button class="btn sub skew" id="pQuit"><span>メニューに戻る</span></button>
      </div>
    </div>
  </section>

  <section class="screen center" id="scrResult">
    <div class="panel"><h2 id="resTitle">リザルト</h2>
      <div class="newbest" id="resBest"></div>
      <ol class="res" id="resList"></ol>
      <div class="row">
        <button class="btn skew" id="resAgain"><span>もう一度走る</span></button>
        <button class="btn sub skew" id="resCourse"><span>コースを選ぶ</span></button>
        <button class="btn sub skew" id="resChar"><span>キャラを選ぶ</span></button>
      </div>
    </div>
  </section>

  <button class="sound" id="soundBtn" aria-label="サウンド"></button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const TAU=Math.PI*2, clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ================= Data ================= */
const LAPS=3, HW=9, KERB=1.4, WALL=14, STEP=1/60;

function initAudio(){

  try{
    const c=new (window.AudioContext||window.webkitAudioContext)(); AU.ctx=c;
    AU.master=c.createGain(); AU.master.gain.value=AU.on?.55:0;
    const comp=c.createDynamicsCompressor(); AU.master.connect(comp); comp.connect(c.destination);
    const nb=c.createBuffer(1,c.sampleRate,c.sampleRate), d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; AU.nb=nb;
    const o1=c.createOscillator(); o1.type='sawtooth'; const o2=c.createOscillator(); o2.type='square';
    const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=500; f.Q.value=3;
    const g=c.createGain(); g.gain.value=0; const g2=c.createGain(); g2.gain.value=.35;
    o1.connect(f); o2.connect(g2); g2.connect(f); f.connect(g); g.connect(AU.master); o1.start(); o2.start();
    AU.eng={o1,o2,f,g};
    const ns=c.createBufferSource(); ns.buffer=nb; ns.loop=true; const nf=c.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=2200; nf.Q.value=3;
    const ng=c.createGain(); ng.gain.value=0; ns.connect(nf); nf.connect(ng); ng.connect(AU.master); ns.start();
    AU.drift={ng,nf};
  }catch(e){ AU.ctx=null; }
}

function nzb(dur,vol,freq,type='lowpass',f2){const c=AU.ctx,t=c.currentTime,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=AU.nb;f.type=type;f.frequency.setValueAtTime(freq,t);f.frequency.exponentialRampToValueAtTime(Math.max(40,f2||freq*.25),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(AU.master);s.start(t);s.stop(t+dur+.05);}

class PSys{

/* ================= Physics ================= */
function giveBoost(r,t,p){ r.boostPow=r.boostT>0?Math.max(r.boostPow,p):p; r.boostT=Math.max(r.boostT,t); if(r.isPlayer) sfx('boost'); }
function nearPlayer(r){return G&&r.pos.distanceToSquared(G.player.pos)<60*60;}
function hit(x,kind){
  if(x.invT>0||x.finished&&!x.isPlayer&&false) return false;
  if(x.shieldT>0){ x.shieldT=0; burst(x.pos,0x5fdcff,26,6,true); if(nearPlayer(x)) sfx('sbreak'); return false; }
  if(kind==='spin'){ x.spinT=x.spinDur; x.speed*=.35; }
  else { x.stunT=2; x.speed*=.6; }
  x.drifting=false; x.driftLv=0; x.boostT=0;
  if(x.isPlayer){ G.shake=Math.max(G.shake,.6); sfx('hit'); } else if(nearPlayer(x)) sfx('bump');
  return true;
}
function respawn(r){
  const fi=Math.floor(r.idxF); trackPoint(fi,clamp(r.lat,-4,4),r.pos); r.yaw=TR.S[fi%TR.N].yaw; r.speed=0; r.stuckT=0; r.drifting=false; r.invT=1.5; r.spinT=0; trackQuery(r);
}
function physics(r,inp,dt){
  r.boostT=Math.max(0,r.boostT-dt);r.spinT=Math.max(0,r.spinT-dt);r.stunT=Math.max(0,r.stunT-dt);r.shieldT=Math.max(0,r.shieldT-dt);
  r.stallT=Math.max(0,r.stallT-dt);r.hop=Math.max(0,r.hop-dt);r.invT=Math.max(0,r.invT-dt);r.wallCD-=dt;r.padCD-=dt;
  const ctrl=r.spinT<=0&&r.stallT<=0;
  const ts=ctrl?inp.steer:0; r.steer+=(ts-r.steer)*Math.min(1,dt*(Math.abs(ts)>Math.abs(r.steer)?8:12));
  let maxS=r.maxSpeed*r.aiMul;
  r.offroad=Math.abs(r.lat)>HW+KERB;
  if(r.stunT>0) maxS*=.45;
  if(r.offroad&&r.boostT<=0) maxS*=.5;
  const boosting=r.boostT>0;
  if(boosting) maxS*=r.boostPow;
  if(r.stallT>0){ r.speed=0; }
  else if(ctrl){
    if(boosting) r.speed=Math.min(maxS,r.speed+60*dt);
    else if(inp.accel){ if(r.speed<maxS) r.speed=Math.min(maxS,r.speed+r.accel*r.aiMul*(1-.55*Math.max(0,r.speed)/maxS)*dt); }
    else if(inp.brake){ r.speed-=(r.speed>0?32:12)*dt; if(r.speed<-11) r.speed=-11; }
    else r.speed-=Math.sign(r.speed)*Math.min(Math.abs(r.speed),(3+Math.abs(r.speed)*.35)*dt);
    if(r.speed>maxS) r.speed=Math.max(maxS,r.speed-(r.offroad?42:14)*dt);
  }else r.speed*=Math.pow(.12,dt);
  // drift / mini-turbo
  if(ctrl&&inp.drift&&!r.drifting&&Math.abs(r.steer)>.3&&r.speed>14){ r.drifting=true; r.driftDir=Math.sign(r.steer); r.driftT=0; r.driftLv=0; r.hop=.22; }
  if(r.drifting){
    if(!inp.drift||!ctrl||r.speed<9){
      if(ctrl&&r.driftLv>0){ const B=[null,[.5,1.18],[.9,1.22],[1.35,1.27]][r.driftLv]; giveBoost(r,B[0],B[1]); if(r.isPlayer) showMsg(['','ミニターボ','スーパーターボ','ウルトラターボ'][r.driftLv],'mt'+r.driftLv,.7); }
      r.drifting=false; r.driftLv=0;
    }else{
      r.driftT+=dt*r.driftRate*(.7+.6*Math.max(0,r.steer*r.driftDir))*(r.offroad?.3:1);
      const lv=r.driftT>2.4?3:r.driftT>1.5?2:r.driftT>.7?1:0;
      if(lv>r.driftLv){ r.driftLv=lv; if(r.isPlayer) sfx('lv'+lv); }
    }
  }
  const spd=Math.abs(r.speed), sf=clamp(spd/12,0,1)*(1-clamp((spd-30)/60,0,.22));
  let turn=r.drifting?r.driftDir*r.turn*(.64+.5*(r.steer*r.driftDir)):r.steer*r.turn;
  turn*=sf*(r.speed<0?-1:1); if(r.stunT>0) turn*=.7;
  r.yaw-=turn*dt;
  r.pos.x+=Math.sin(r.yaw)*r.speed*dt; r.pos.z+=Math.cos(r.yaw)*r.speed*dt;
  trackQuery(r);
  const lim=WALL-.85;
  if(Math.abs(r.lat)>lim){
    const s=TR.S[r.idx],sg=Math.sign(r.lat),over=Math.abs(r.lat)-lim;
    r.pos.x-=s.r.x*over*sg; r.pos.z-=s.r.z*over*sg; r.lat=lim*sg;
    const da=angDiff(s.yaw,r.yaw), back=Math.abs(da)>Math.PI/2, into=Math.abs(Math.sin(da));
    if(into>.12){ r.speed*=1-into*.45; r.yaw+=angDiff(r.yaw,back?s.yaw+Math.PI:s.yaw)*.3; if(r.isPlayer&&r.wallCD<=0){ sfx('bump'); G.shake=Math.max(G.shake,.25); r.wallCD=.35; } }
  }
  r.pos.y=r.trackY;
  // stuck / wrong way
  if(ctrl&&inp.accel&&Math.abs(r.speed)<2.5) r.stuckT+=dt; else r.stuckT=Math.max(0,r.stuckT-dt*2);
  if(r.stuckT>2.6) respawn(r);
  const fwd=Math.cos(angDiff(TR.S[r.idx].yaw,r.yaw));
  if(fwd<-.3&&r.speed>4) r.wrongT+=dt; else r.wrongT=Math.max(0,r.wrongT-dt*3);
  if(!r.isPlayer&&r.wrongT>3){ respawn(r); r.wrongT=0; }
  // pads
  for(const p of G.pads){ let d=r.idx-p.i0; if(d<0)d+=TR.N; if(d<=p.len&&r.lat>p.l0&&r.lat<p.l1){ r.boostPow=r.boostT>0?Math.max(r.boostPow,1.36):1.36; r.boostT=Math.max(r.boostT,1.0); if(r.isPlayer&&r.padCD<=0){ sfx('pad'); r.padCD=1; } } }
}
function collideKarts(){
  const R=G.racers;
  for(let i=0;i<R.length;i++)for(let j=i+1;j<R.length;j++){
    const a=R[i],b=R[j],dx=b.pos.x-a.pos.x,dz=b.pos.z-a.pos.z,d2=dx*dx+dz*dz,md=1.95;
    if(d2<md*md&&d2>1e-6&&Math.abs(a.pos.y-b.pos.y)<2){
      const d=Math.sqrt(d2),nx=dx/d,nz=dz/d,ov=md-d;
      const wa=a.weight+(a.boostT>0?3:0),wb=b.weight+(b.boostT>0?3:0),ta=wb/(wa+wb),tb=wa/(wa+wb);
      a.pos.x-=nx*ov*ta*1.2;a.pos.z-=nz*ov*ta*1.2;b.pos.x+=nx*ov*tb*1.2;b.pos.z+=nz*ov*tb*1.2;
      a.speed*=1-.04*ta;b.speed*=1-.04*tb;
      if((a.isPlayer||b.isPlayer)&&(a.wallCD<=0&&b.wallCD<=0)){ sfx('bump'); a.wallCD=b.wallCD=.3; G.shake=Math.max(G.shake,.15); }
    }
  }
}

/* ================= AI ================= */
const _t=new THREE.Vector3();
function aiInput(r){
  const N=TR.N, look=7+r.speed*.42, fi=r.idxF+look/TR.SP;
  r.laneT-=STEP; if(r.laneT<=0){ r.laneT=2+Math.random()*3; r.laneTarget=(Math.random()*2-1)*5; }
  r.lane=lerp(r.lane,r.laneTarget,STEP*.8);
  let lane=r.lane;
  if(!r.item&&r.rollT<=0){ for(const b of G.boxes){ if(!b.active)continue; let d=b.fi-r.idxF; d=((d%N)+N)%N*TR.SP; if(d>6&&d<45){ lane=lerp(lane,b.lat,.75); break; } } }
  for(const h of G.hazards){ let d=h.fi-r.idxF; d=((d%N)+N)%N*TR.SP; if(d<32&&Math.abs(h.lat-lane)<2.8) lane+=(h.lat>lane?-1:1)*3.8; }
  lane=clamp(lane,-7,7);
  trackPoint(fi,lane,_t);
  const desired=Math.atan2(_t.x-r.pos.x,_t.z-r.pos.z), d=angDiff(r.yaw,desired);
  const steer=clamp(-d*2.6,-1,1);
  if(Math.abs(steer)>.55) r.cornerT+=STEP; else { if(r.cornerT>1&&Math.random()<G.diff.dash) giveBoost(r,.5,1.18); r.cornerT=0; }
  return {steer,accel:!(Math.abs(d)>.9&&r.speed>18),brake:Math.abs(d)>1.3&&r.speed>12,drift:false,item:false};
}
function aiItems(r,dt){
  if(!r.item) return;
  r.itemUseT-=dt; if(r.itemUseT>0) return;
  switch(r.item){
    case 'nitro': if(Math.abs(r.steer)<.35) useItem(r); break;
    case 'missile': if(r.rank>0||r.itemUseT<-6) useItem(r); break;
    case 'oil': if(G.racers.some(x=>x!==r&&r.prog>x.prog&&(r.prog-x.prog)*TR.SP<28)||r.itemUseT<-8) useItem(r); break;
    default: useItem(r);
  }
}

/* ================= Items ================= */
function startRoll(r){ r.rollT=1.1; r.pending=pickItem(r.rank); }
function useItem(r){
  const it=r.item; if(!it) return; r.item=null;
  if(it==='nitro'){ giveBoost(r,1.4,1.32); }
  else if(it==='shield'){ r.shieldT=10; if(nearPlayer(r)) sfx('shield'); }
  else if(it==='missile'){
    const target=r.rank>0?G.order[r.rank-1]:null;

function simStep(dt){
  G.t+=dt;
  const P=G.player;
  if(G.state==='intro'){ if(G.t>1.7){ G.state='count'; G.countT=0; G.lastBeep=-1; $('#gauge').style.display='block'; } return; }
  if(G.state==='count'){
    G.countT+=dt;
    const inp=playerInput();
    if(inp.accel&&!G.accHeld) G.accStart=G.countT;
    if(!inp.accel) G.accStart=null;
    G.accHeld=inp.accel;
    const n=Math.floor(G.countT);
    if(n!==G.lastBeep&&n<3){ G.lastBeep=n; showCount(String(3-n),false); sfx('beep'); }
    if(G.countT>=3){
      G.state='race'; G.raceT=0; showCount('GO!',true); sfx('go'); $('#gauge').style.display='none';
      if(G.accHeld&&G.accStart!==null){
        const t=G.accStart;
        if(t<2) { P.stallT=1.0; showMsg('エンスト…','bad',1.2); sfx('stall'); for(let i=0;i<20;i++) PN.add(P.pos.x,P.pos.y+.6,P.pos.z,(Math.random()-.5)*3,1+Math.random()*2,(Math.random()-.5)*3,1.2,1.4,col(0x444450),2.5); }
        else if(t>=2.3&&t<=2.8){ giveBoost(P,1.7,1.32); showMsg('スタートダッシュ!','good',1.2); }
        else { giveBoost(P,.8,1.2); showMsg('スタートダッシュ','good',1); }
      }
      for(const r of G.racers){ if(r.isPlayer) continue; const x=Math.random(); if(x<G.diff.dash) giveBoost(r,1.2,1.28); else if(x>.93) r.stallT=.6; }
    }
    return;
  }
  G.raceT+=dt;
  // inputs & physics
  for(const r of G.racers){
    const gap=(P.prog-r.prog)*TR.SP;
    if(!r.isPlayer){ r.aiMul=G.diff.ai*r.aiSkill*(P.finished?1:(gap>0?1+Math.min(.12,gap/350*.12):1-Math.min(.07,-gap/400*.07))); }
    else r.aiMul=P.finished?G.diff.ai:1;
    let inp;
    if(r.isPlayer&&!r.finished){ inp=playerInput(); if(inp.item&&!r.itemPrev&&r.item&&r.rollT<=0) useItem(r); r.itemPrev=inp.item; }
    else { inp=aiInput(r); aiItems(r,dt); }
    if(r.rollT>0){ r.rollT-=dt; if(r.rollT<=0){ r.item=r.pending; r.pending=null; r.itemUseT=.6+Math.random()*2.4; if(r.isPlayer) sfx('get'); } }
    physics(r,inp,dt);
  }
  collideKarts();
  updateBoxes(dt);
  updateMissiles(dt);
  // ranking
  G.order=G.racers.slice().sort((a,b)=>{ if(a.finished&&b.finished) return a.finishTime-b.finishTime; if(a.finished) return -1; if(b.finished) return 1; return b.prog-a.prog; });
  G.order.forEach((r,i)=>r.rank=i);
  // laps
  for(const r of G.racers){
    const lap=clamp(Math.floor(r.prog/TR.N)+1,1,LAPS);
    if(!r.finished&&r.prog>=LAPS*TR.N){ r.finished=true; r.finishTime=G.raceT;
      if(r.isPlayer){ G.state='finished'; G.resultT=3.8; showMsg('ゴール!','good',2.5); sfx('finish'); saveBest(); } }
    if(r.isPlayer&&lap>r.lastLap&&!r.finished){ r.lastLap=lap; if(lap===LAPS){ showMsg('ファイナルラップ!','good',1.6); sfx('final'); } else { showMsg(`ラップ ${lap}`,'',1.2); sfx('lap'); } }
  }
  if(G.state==='finished'&&G.resultT>0){ G.resultT-=dt; if(G.resultT<=0) showResults(); }
}

}

  if(mode==='race'&&P&&!G.paused){

    if(G.state==='intro'||G.state==='count') f=G.accHeld?150+Math.sin(G.t*28)*18:62;
    if(P.drifting){ dv=.05; AU.drift.nf.frequency.setTargetAtTime(1700+P.driftLv*450,t,.1); }
  }
  AU.eng.o1.frequency.setTargetAtTime(f,t,.05); AU.eng.o2.frequency.setTargetAtTime(f*.5,t,.05);
  AU.eng.f.frequency.setTargetAtTime(280+f*6,t,.05); AU.eng.g.gain.setTargetAtTime(vol,t,.08); AU.drift.ng.gain.setTargetAtTime(dv,t,.05);
}

/* ================= Showroom (menu 3D) ================= */
const show={scene:new THREE.Scene(),cam:new THREE.PerspectiveCamera(36,1,.1,200),kart:null,ang:0};
{
  const s=show.scene; s.background=new THREE.Color(0x141a3d); s.fog=new THREE.Fog(0x141a3d,14,40);
  s.add(new THREE.HemisphereLight(0xc8d0ff,0x2a1f3a,.9));
  const key=new THREE.DirectionalLight(0xffffff,1.1); key.position.set(4,8,5); key.castShadow=true; key.shadow.mapSize.set(1024,1024);
  const kc=key.shadow.camera; kc.left=-4;kc.right=4;kc.top=4;kc.bottom=-4; s.add(key);
  const rim1=new THREE.PointLight(0xffd23a,1.4,20); rim1.position.set(-5,2.5,-3); s.add(rim1);
  const rim2=new THREE.PointLight(0x4f8cff,1.4,20); rim2.position.set(5,2,-4); s.add(rim2);
  const floor=new THREE.Mesh(new THREE.CircleGeometry(40,64),new THREE.MeshStandardMaterial({map:radialTex('#3a4596','#141a3d'),roughness:.9}));
  floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; s.add(floor);
  const tt=new THREE.Mesh(new THREE.CylinderGeometry(2.8,3,.28,64),new THREE.MeshStandardMaterial({color:0x252e6e,roughness:.8,metalness:.1}));
  tt.position.y=.14; tt.receiveShadow=true; s.add(tt);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(2.9,.05,8,80),new THREE.MeshBasicMaterial({color:0xffd23a})); ring.rotation.x=Math.PI/2; ring.position.y=.29; s.add(ring);
  const stripes=new THREE.Group(); s.add(stripes);
  for(let i=0;i<5;i++){ const m=new THREE.Mesh(new THREE.PlaneGeometry(40,.5),new THREE.MeshBasicMaterial({color:i%2?0xff6b2c:0xffd23a,transparent:true,opacity:.14})); m.position.set(0,3+i*1.1,-12); m.rotation.z=-.15; stripes.add(m); }
}
function setShowKart(i){
  if(show.kart){ show.scene.remove(show.kart.root); show.kart.root.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();}); }
  show.kart=makeKart(CHARS[i]); show.kart.root.position.y=.28; show.scene.add(show.kart.root); show.kart.root.traverse(o=>{if(o.isMesh)o.castShadow=true;});
}
function layoutShowCam(){
  const cam=show.cam; cam.aspect=VW/VH;
  let ox=0,oy=0; const cur=$('.screen.on');
  const sheet=cur?cur.querySelector('.sheet'):null;
  if(sheet){ const r=sheet.getBoundingClientRect(); if(r.width<VW*.9) ox=r.width/2; else oy=r.height*.4; }
  if(ox||oy) cam.setViewOffset(VW,VH,ox,oy,VW,VH); else cam.clearViewOffset();
  cam.updateProjectionMatrix();
}
function updateShowroom(dt){
  show.ang+=dt*.5; const d=VW<VH?13.5:9.2;
  show.cam.position.set(Math.sin(show.ang)*d,2.6,Math.cos(show.ang)*d); show.cam.lookAt(0,.8,0);
  if(show.kart){ show.kart.wheels.forEach(w=>w.rotation.x+=dt*2); show.kart.steer.forEach(p=>p.rotation.y=Math.sin(show.ang*2)*.3); }
}

/* ================= Menus ================= */
function showScreen(id){
  $$('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
  $('#soundBtn').style.display=id&&id!=='scrPause'&&id!=='scrResult'?'grid':'none';
  if(id) requestAnimationFrame(layoutShowCam);
}
function headSVG(ch){
  const acc={fin:'<rect x="30" y="4" width="4" height="12" rx="2" fill="C2"/>',rabbit:'<ellipse cx="24" cy="6" rx="4" ry="11" fill="C2" transform="rotate(-12 24 6)"/><ellipse cx="40" cy="6" rx="4" ry="11" fill="C2" transform="rotate(12 40 6)"/>',
    antenna:'<line x1="40" y1="16" x2="44" y2="2" stroke="#0c1030" stroke-width="2.5"/><circle cx="44" cy="3" r="3.5" fill="C2" stroke="#0c1030" stroke-width="1.5"/>',
    horns:'<path d="M14 22 L5 8 L20 16Z M50 22 L59 8 L44 16Z" fill="#f2e6c8" stroke="#0c1030" stroke-width="2" stroke-linejoin="round"/>',
    cat:'<path d="M16 20 L18 5 L28 14Z M48 20 L46 5 L36 14Z" fill="C2" stroke="#0c1030" stroke-width="2" stroke-linejoin="round"/>',
    halo:'<ellipse cx="32" cy="7" rx="14" ry="4" fill="none" stroke="C2" stroke-width="3.5"/>'}[ch.acc].replace(/C2/g,ch.color2);
  return `<svg viewBox="0 0 64 64">${acc}<circle cx="32" cy="36" r="22" fill="${ch.color}" stroke="#0c1030" stroke-width="3"/><path d="M14 36a18 12 0 0136 0v4a18 8 0 01-36 0z" fill="#0f1322"/><path d="M20 34c3-4 8-5 12-5" stroke="#fff" stroke-opacity=".7" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`;
}
function renderChars(){
  $('#chars').innerHTML=CHARS.map((c,i)=>`<button class="cc" data-i="${i}" aria-pressed="${i===SEL.char}">${headSVG(c)}<b>${c.name}</b><span>${c.type}</span></button>`).join('');
  const c=CHARS[SEL.char];
  $('#cDetail').innerHTML=`<div class="hd"><b style="color:${c.color}">${c.name}</b><span>${c.type}</span></div><p>${c.desc}</p><div class="bars">${STAT_LABELS.map(([k,l])=>`<span>${l}</span><div class="segs">${[1,2,3,4,5].map(n=>`<i class="${n<=c.st[k]?'f':''}"></i>`).join('')}</div>`).join('')}</div>`;
}
$('#chars').addEventListener('click',e=>{const b=e.target.closest('.cc');if(!b)return;SEL.char=+b.dataset.i;store.set('rk-char',SEL.char);renderChars();setShowKart(SEL.char);sfx('select');});
function coursePreview(cv,course){
  const g=cv.getContext('2d'),W=cv.width;
  const pts=course.pts.map(([x,y,z])=>new THREE.Vector3(x,y,z)), cu=new THREE.CatmullRomCurve3(pts,true,'centripetal'), P=cu.getSpacedPoints(160);
  let a=1e9,b=-1e9,c=1e9,d=-1e9; P.forEach(p=>{a=Math.min(a,p.x);b=Math.max(b,p.x);c=Math.min(c,p.z);d=Math.max(d,p.z);});
  const sc=(W-24)/Math.max(b-a,d-c),cx=(a+b)/2,cz=(c+d)/2;
  const bg={coast:['#ff9d6a','#2b3d8f'],city:['#3b1a6b','#06041a'],frost:['#d9ebfb','#5d9be6']}[course.id];
  const gr=g.createLinearGradient(0,W,0,0); gr.addColorStop(0,bg[0]); gr.addColorStop(1,bg[1]); g.fillStyle=gr; g.fillRect(0,0,W,W);
  g.beginPath(); P.forEach((p,i)=>{const x=W/2-(p.x-cx)*sc,y=W/2-(p.z-cz)*sc;i?g.lineTo(x,y):g.moveTo(x,y);}); g.closePath();
  g.lineJoin='round'; g.strokeStyle='#0c1030'; g.lineWidth=11; g.stroke(); g.strokeStyle='#fff'; g.lineWidth=5; g.stroke();
}
function renderCourses(){
  $('#courses').innerHTML=COURSES.map((c,i)=>{const best=store.get('rk-best-'+c.id,0);return `<button class="co" data-i="${i}" aria-pressed="${i===SEL.course}"><canvas width="148" height="148"></canvas><div><b>${c.name}</b><div class="stars">${'★'.repeat(c.diff)}${'☆'.repeat(3-c.diff)}</div><p>${c.desc}</p>${best?`<div class="best">ベスト ${fmtT(best)}</div>`:''}</div></button>`;}).join('');
  $$('#courses canvas').forEach((cv,i)=>coursePreview(cv,COURSES[i]));
  $('#diffs').innerHTML=DIFFS.map((d,i)=>`<button data-i="${i}" aria-pressed="${i===SEL.diff}">${d.name}</button>`).join('');
}
$('#courses').addEventListener('click',e=>{const b=e.target.closest('.co');if(!b)return;SEL.course=+b.dataset.i;store.set('rk-course',SEL.course);$$('#courses .co').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));sfx('select');});
$('#diffs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;SEL.diff=+b.dataset.i;store.set('rk-diff',SEL.diff);$$('#diffs button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));sfx('select');});
$('#tStart').addEventListener('click',()=>{initAudio();sfx('select');renderChars();showScreen('scrChar');});
$('#cOk').addEventListener('click',()=>{sfx('select');renderCourses();showScreen('scrCourse');});
$('#rStart').addEventListener('click',()=>{sfx('go');startRace();});
$$('.back').forEach(b=>b.addEventListener('click',()=>{sfx('select');const t=b.dataset.go;if(t==='title')showScreen('scrTitle');else{renderChars();showScreen('scrChar');}}));
$('#soundBtn').addEventListener('click',()=>setSound(!AU.on));
$('#pauseBtn').addEventListener('click',()=>togglePause());
function togglePause(force){
  if(mode!=='race'||!G) return;
  if(G.state==='finished'&&G.resultT<=0) return;
  G.paused=typeof force==='boolean'?force:!G.paused;
  showScreen(G.paused?'scrPause':null);
  if(!G.paused){ $('#soundBtn').style.display='none'; }
}
function toMenu(screen){
  mode='menu'; G&&(G.paused=false); $('#hud').classList.remove('on'); $('#touch').classList.remove('on');
  disposeScene(raceScene); raceScene=null; G=null; fx.clearRect(0,0,fxc.width,fxc.height);
  if(screen==='course') renderCourses(); else renderChars();
  showScreen(screen==='course'?'scrCourse':'scrChar');
}
$('#pResume').addEventListener('click',()=>togglePause(false));
$('#pRestart').addEventListener('click',()=>startRace());
$('#pQuit').addEventListener('click',()=>toMenu('char'));
$('#resAgain').addEventListener('click',()=>startRace());
$('#resCourse').addEventListener('click',()=>toMenu('course'));
$('#resChar').addEventListener('click',()=>toMenu('char'));
function showResults(){
  const P=G.player;
  $('#resTitle').textContent=P.rank===0?'優勝!':`${P.rank+1}位でゴール`;
  $('#resBest').textContent=G.newBest?`自己ベスト更新　${fmtT(P.finishTime)}`:'';
  $('#resList').innerHTML=G.order.map((r,i)=>`<li class="${r.isPlayer?'me':''}"><span class="r">${i+1}</span><span class="dot" style="background:${r.ch.color}"></span><span class="n">${r.ch.name}${r.isPlayer?'（あなた）':''}</span><span class="t">${r.finished?fmtT(r.finishTime):'走行中'}</span></li>`).join('');
  showScreen('scrResult');
}

/* ================= Resize & loop ================= */
function updatePScale(){ const s=renderer.domElement.height/(2*Math.tan(camera.fov*Math.PI/360)); PA.mat.uniforms.scale.value=s; PN.mat.uniforms.scale.value=s; }
function resize(){
  const r=$('#wrap').getBoundingClientRect(); VW=Math.max(1,r.width); VH=Math.max(1,r.height);
  renderer.setSize(VW,VH,false); camera.aspect=VW/VH; camera.updateProjectionMatrix();
  const pr=renderer.getPixelRatio(); fxc.width=Math.round(VW*pr); fxc.height=Math.round(VH*pr);
  updatePScale(); layoutShowCam();
}
new ResizeObserver(resize).observe($('#wrap'));
resize();
let last=performance.now(), acc=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(mode==='menu'){ updateShowroom(dt); renderer.render(show.scene,show.cam); }
  else if(G&&raceScene){
    if(!G.paused){ acc+=dt; let n=0; while(acc>=STEP&&n<5){ simStep(STEP); acc-=STEP; n++; } if(n>=5) acc=0;
      syncKarts(dt); updateWorldFX(dt); PA.update(dt); PN.update(dt); }
    updateCamera(G.paused?0:dt);
    renderer.render(raceScene,camera);
    updateHUD();
  }
  drawFX(dt);
  updateEngine();
  requestAnimationFrame(frame);
}
drawSoundBtn();
setShowKart(SEL.char);
showScreen('scrTitle');
requestAnimationFrame(frame);
window.__rk={get G(){return G;},startRace,SEL};
})();
