<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ラッキーまもりがみ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
/* Layout: a side-on 3D street; the unlucky friend walks left to right. Happiness meter top-left, a progress track to the goal across the top, speech bubbles float over the friend's head. Menus are cream cards; the look editor leaves the 3D preview visible beside (desktop) or above (phone) the panel. */
:root{
  --panel:#fffdf7; --ink:#33284d; --mute:#7c7396; --pink:#ff5c8a; --pinkd:#d93a6a; --sun:#ffcf3f; --sund:#e0a800; --mint:#2ec4a0; --mintd:#1f9b7e; --bad:#ff5a5f; --line:#ece6f6;
  --pop:"Mochiy Pop One","M PLUS Rounded 1c",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#bfe6ff;color:var(--ink);font-family:var(--body);font-weight:800;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
button,input{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
#wrap{position:relative;width:100%;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.hud{position:absolute;inset:0;pointer-events:none}
.hud[hidden]{display:none!important}
.pe{pointer-events:auto}
.meter{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:10px;background:rgba(255,253,247,.95);border-radius:16px;padding:6px 12px 9px;box-shadow:0 4px 0 rgba(51,40,77,.18);width:196px}
.meter small{font-size:11px;color:var(--mute);display:flex;justify-content:space-between;align-items:baseline}
.meter small b{font-family:var(--pop);font-weight:400;font-size:20px;color:var(--pink)}
.bar{position:relative;height:14px;border-radius:7px;background:#f0eaf7;margin-top:2px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:linear-gradient(90deg,#ffb3c8,var(--pink));transition:width .3s}
.bar u{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--ink)}
.track{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:min(36vw,360px);background:rgba(255,253,247,.95);border-radius:16px;padding:6px 14px 10px;box-shadow:0 4px 0 rgba(51,40,77,.18);text-align:center}
.track small{font-size:11px;color:var(--mute);white-space:nowrap}
.track .ln{position:relative;height:8px;border-radius:4px;background:#f0eaf7;margin:6px 10px 0}
.track .ln i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--mint)}
.track .me{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.track .flag{position:absolute;right:-12px;top:-14px;font-size:20px}
.quit{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;background:rgba(255,253,247,.95);border-radius:12px;padding:8px 12px;font-size:13px;box-shadow:0 3px 0 rgba(51,40,77,.18)}
.hint{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(51,40,77,.78);color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;white-space:nowrap}
.bubble{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:var(--panel);padding:7px 14px;border-radius:16px;font-size:15px;box-shadow:0 4px 0 rgba(51,40,77,.2);white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw}
.bubble.on{opacity:1}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--panel);border-bottom:0}
.bubble b{color:var(--pink)}
.banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;font-family:var(--pop);font-weight:400;font-size:clamp(30px,7vw,54px);color:#fff;text-shadow:0 5px 0 var(--pinkd),0 0 22px rgba(255,92,138,.6);white-space:nowrap;opacity:0;pointer-events:none}
.banner small{display:block;font-family:var(--body);font-weight:800;font-size:clamp(14px,3.4vw,18px);text-shadow:0 2px 0 rgba(51,40,77,.6);margin-top:8px;white-space:normal}
.banner.on{animation:ban 2.4s ease-out forwards}
.banner.good{text-shadow:0 5px 0 var(--mintd),0 0 22px rgba(46,196,160,.6)}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}20%{transform:translate(-50%,-50%) scale(1)}82%{opacity:1}100%{opacity:0}}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ring{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 16px #ffe37a;animation:rg .45s ease-out forwards}
@keyframes rg{from{transform:scale(.3);opacity:1}to{transform:scale(1.3);opacity:0}}
.pop{position:absolute;transform:translate(-50%,-50%);font-family:var(--pop);font-weight:400;font-size:20px;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke;white-space:nowrap;animation:up 1s ease-out forwards}
@keyframes up{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-56px}}
.ov{position:absolute;inset:0;display:flex;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));background:rgba(191,230,255,.45);backdrop-filter:blur(3px);overflow:auto}
.ov[hidden]{display:none!important}
.card{width:min(100%,560px);margin:auto;background:var(--panel);border-radius:28px;padding:22px 20px;box-shadow:0 8px 0 rgba(51,40,77,.18);text-align:center}
.card h1{margin:0;font-family:var(--pop);font-weight:400;font-size:clamp(32px,8.5vw,50px);line-height:1.15;color:var(--pink);text-shadow:0 4px 0 #ffd3e0;white-space:nowrap}
.card h1 small{display:block;font-size:.34em;color:var(--mute);text-shadow:none;margin-bottom:6px;white-space:normal}
.card h2{margin:2px 0 6px;font-family:var(--pop);font-weight:400;font-size:24px}
.card p{margin:6px 0 12px;color:var(--mute);font-size:14px;line-height:1.6}
.who{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0 12px;font-size:15px}
.who b{color:var(--pink)}
.sm{padding:8px 14px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:13px;box-shadow:0 3px 0 rgba(51,40,77,.1)}
.lbl{font-size:12px;color:var(--mute);text-align:left;margin:10px 2px 6px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt[data-d="oni"] b{color:#d6283f}
.opt{border-radius:16px;padding:9px 6px;background:#f4effb;border:3px solid transparent;display:grid;gap:3px}
.opt[aria-pressed="true"]{border-color:var(--pink);background:#fff0f5}
.opt b{font-family:var(--pop);font-weight:400;font-size:15px;white-space:nowrap}
.opt span{font-size:11px;color:var(--mute);line-height:1.35}
.opt i{font-style:normal;font-size:13px;color:var(--sund);letter-spacing:1px}
.big{display:flex;align-items:center;justify-content:center;width:100%;height:56px;margin-top:14px;border-radius:20px;background:var(--pink);color:#fff;font-family:var(--pop);font-weight:400;font-size:21px;box-shadow:0 6px 0 var(--pinkd)}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 var(--pinkd)}
.big.sub{background:#fff;color:var(--ink);box-shadow:0 6px 0 rgba(51,40,77,.12);border:2px solid var(--line);margin-top:10px}
/* look editor */
#maker{background:none;backdrop-filter:none;padding:0}
#maker .panel{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:14px;bottom:14px;width:min(430px,52vw);background:var(--panel);border-radius:26px;box-shadow:0 8px 0 rgba(51,40,77,.18);display:flex;flex-direction:column;overflow:hidden}
#maker .scroll{flex:1;overflow:auto;padding:16px 16px 8px;touch-action:pan-y}
#maker h2{margin:0;font-family:var(--pop);font-weight:400;font-size:22px;text-align:center}
#maker .foot{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:10px 16px 16px;border-top:2px solid var(--line)}
#maker .foot .big{margin:0;height:50px;font-size:18px}
.row{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 12px;border-radius:999px;background:#f4effb;border:3px solid transparent;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--pink);background:#fff0f5}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--pink)}
.name{width:100%;height:44px;border-radius:14px;border:2px solid var(--line);padding:0 14px;font-size:16px;background:#fff;user-select:text;-webkit-user-select:text}
.res-n{font-family:var(--pop);font-weight:400;font-size:60px;line-height:1;color:var(--pink)}
.res-n small{font-size:26px}
.stars{font-size:42px;letter-spacing:6px;color:#e6dff0;margin:4px 0}
.stars b{color:var(--sun);text-shadow:0 3px 0 var(--sund);display:inline-block;animation:sp .45s cubic-bezier(.2,1.8,.4,1) backwards}
@keyframes sp{from{transform:scale(0) rotate(-40deg)}}
.rs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.rs div{background:#f4effb;border-radius:14px;padding:8px 4px;font-size:11px;color:var(--mute)}
.rs b{display:block;font-family:var(--pop);font-weight:400;font-size:21px;color:var(--ink)}
@media (max-width:640px){
  .meter{width:150px;padding:5px 10px 8px}.meter small b{font-size:17px}
  .track{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 32px)}
  .hint{bottom:calc(74px + env(safe-area-inset-bottom,0px));font-size:12px}
  #maker .panel{left:10px;right:10px;top:auto;bottom:10px;width:auto;height:56%}
  .bubble{font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>

<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="fx"></div>
  <div class="hud" id="hud" hidden>
    <div class="meter"><small>ハッピーど <span id="combo" style="color:#e0a800"></span> <b id="hapN">50</b></small><div class="bar"><i id="hapBar"></i><u id="hapGoal"></u></div></div>
    <div class="track"><small id="trackLbl">ゴール：えき</small><div class="ln"><i id="trackFill"></i><span class="me" id="trackMe"></span><span class="flag">🏁</span></div></div>
    <button class="quit pe" id="btnQuit">やめる</button>
    <div class="hint" id="hint">「！」が出たら タップして たすけよう！</div>
    <div class="banner" id="banner"></div>
  </div>
  <div class="bubble" id="bubble"></div>

  <section class="ov" id="title">
    <div class="card">
      <h1><small>ツイてない あの子を こっそり たすける かみさまに なろう</small>ラッキーまもりがみ</h1>
      <div class="who"><span>まもる子：<b id="whoName"></b></span><button class="sm" id="btnLook">見た目を かえる</button></div>
      <div class="lbl">むずかしさ</div>
      <div class="grid4" id="diffs"></div>
      <div class="lbl">ステージ</div>
      <div class="grid3" id="stages"></div>
      <button class="big" id="btnPlay">スタート！</button>
    </div>
  </section>

  <section class="ov" id="maker" hidden>
    <div class="panel">
      <div class="scroll">
        <h2>まもる子を つくろう</h2>
        <div class="lbl">なまえ</div>
        <input class="name" id="lkName" maxlength="8" autocomplete="off">
        <div id="lkOpts"></div>
      </div>
      <div class="foot"><button class="big sub" id="btnRandom">おまかせ</button><button class="big" id="btnLookOK">これで けってい</button></div>
    </div>
  </section>

  <section class="ov" id="result" hidden>
    <div class="card">
      <h2 id="resTitle"></h2>
      <div class="res-n"><span id="resN">0</span><small>%</small></div>
      <div class="stars" id="resStars"></div>
      <div class="rs"><div><b id="rsSave">0</b>たすけた</div><div><b id="rsLuck">0</b>ラッキー</div><div><b id="rsOops">0</b>ハプニング</div></div>
      <p id="resNote"></p>
      <button class="big" id="btnNext"></button>
      <button class="big sub" id="btnRetry">もういちど</button>
      <button class="big sub" id="btnHome">タイトルへ</button>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,TAU=Math.PI*2,ease=t=>t*t*(3-2*t);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
let rnd=Math.random;const rr=(a,b)=>a+(b-a)*rnd(),pick=a=>a[Math.floor(rnd()*a.length)];

/* ================= SETTINGS ================= */
// warn: seconds between the hazard waking up and it hitting; R: tap radius in px; wrong: happiness lost for a tap on nothing; trap: number of skull coins; mark: when the "!" shows
const DIFF={
  easy:{name:'かんたん',speed:2.4,warn:2.8,gap:[8,10.5],dbl:0,pass:55,lucky:7,trap:1,wrong:0,R:64,mark:'always',arrow:true,desc:'「！」と 矢じるしが出る'},
  normal:{name:'ふつう',speed:2.9,warn:1.6,gap:[6,8],dbl:.25,pass:65,lucky:6,trap:2,wrong:2,R:54,mark:'always',arrow:false,desc:'「！」だけ・おてつき あり'},
  hard:{name:'むずかしい',speed:3.2,warn:1.6,gap:[4.8,6.5],dbl:.35,pass:75,lucky:5,trap:3,wrong:3,R:46,mark:'late',arrow:false,desc:'「！」が おそい・2つ同時も'},
  oni:{name:'鬼',speed:3.5,warn:1.45,gap:[4,5.5],dbl:.45,pass:80,lucky:5,trap:4,wrong:4,R:40,mark:'none',arrow:false,desc:'「！」なし・自分の目で 見ぬけ'},
};
const STAGES=[
  {name:'あさの まちなか',goal:'えき',short:'えき',intro:'でんしゃに まにあうように えきまで つれていこう',sky:'#bfe6ff',fog:'#dff3ff',kind:'town',types:['pot','banana','manhole','puddle','bird','sign','bike'],L:100},
  {name:'ひろい こうえん',goal:'ピクニック',short:'ピクニック',intro:'ともだちが まつ ピクニックへ つれていこう',sky:'#c4f1ff',fog:'#e4f8ff',kind:'park',types:['banana','bird','ball','dog','cloud','bees','bike'],L:110},
  {name:'ゆうやけ しょうてんがい',goal:'たんじょうびパーティー',short:'パーティー',intro:'じぶんの たんじょうびパーティーに まにあわせよう',sky:'#ffb68c',fog:'#ffcfae',kind:'eve',types:['pot','banana','manhole','puddle','bird','ball','dog','cloud','sign','bees','bike'],L:120},
];
let dk=store.get('lm-diff','easy');if(!DIFF[dk])dk='easy';let D=DIFF[dk];
let stageIdx=0;

/* ---- the look the player designs ---- */
const LOOK_OPTS={
  body:{label:'からだ',type:'chip',vals:[['thin','ほっそり'],['mid','ふつう'],['round','ぽっちゃり']]},
  face:{label:'かお',type:'chip',vals:[['nico','にこにこ'],['nemu','ねむそう'],['kiri','きりっ']]},
  hair:{label:'かみがた',type:'chip',vals:[['bouzu','ぼうず'],['spiky','ツンツン'],['bob','おかっぱ'],['pony','ポニーテール'],['long','ロング'],['afro','アフロ']]},
  acc:{label:'アクセサリー',type:'chip',vals:[['none','なし'],['glasses','メガネ'],['cap','ぼうし'],['ribbon','リボン']]},
  skin:{label:'はだの色',type:'sw',vals:['#ffe2c8','#f6c79f','#d99c6c','#8f5c3c']},
  hairC:{label:'かみの色',type:'sw',vals:['#2c221d','#7a4a2a','#e5b24c','#ea6670','#6b7bff','#f1f1f1']},
  shirt:{label:'ふくの色',type:'sw',vals:['#ff7a59','#3fa9ff','#2ec4a0','#ffcf3f','#b388ff','#ff5c8a']},
  pants:{label:'ズボンの色',type:'sw',vals:['#38406b','#6b4a2f','#2f2f3a','#4caf8a','#e9e4dc']},
};
const DEFAULT_LOOK={name:'ポンタ',body:'mid',face:'nico',hair:'spiky',acc:'cap',skin:'#ffe2c8',hairC:'#7a4a2a',shirt:'#ff7a59',pants:'#38406b'};
let look=Object.assign({},DEFAULT_LOOK,store.get('lm-look',{}));
const nm=()=>look.name||'ポンタ';

/* ================= THREE SETUP ================= */
const cv=$('#cv');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(48,1,.1,300);
const hemi=new THREE.HemisphereLight('#ffffff','#8a7aa8',.75);scene.add(hemi);
const sun=new THREE.DirectionalLight('#ffffff',.85);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-16,right:16,top:12,bottom:-12,near:1,far:60});sun.shadow.bias=-.0006;scene.add(sun,sun.target);
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;}
const std=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.75},o));
function mesh(geo,mat,x=0,y=0,z=0,parent){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;(parent||scene).add(m);return m;}
const box=(w,h,d,c,x,y,z,p)=>mesh(new THREE.BoxGeometry(w,h,d),typeof c==='string'?std(c):c,x,y,z,p);
const sph=(r,c,x,y,z,p,seg=16)=>mesh(new THREE.SphereGeometry(r,seg,Math.max(8,seg*.7|0)),typeof c==='string'?std(c):c,x,y,z,p);
const cyl=(r1,r2,h,c,x,y,z,p,seg=16)=>mesh(new THREE.CylinderGeometry(r1,r2,h,seg),typeof c==='string'?std(c):c,x,y,z,p);

/* ================= THE UNLUCKY FRIEND ================= */
const faceCache={};
function faceTex(style,mood){const k=style+mood;if(faceCache[k])return faceCache[k];
  const t=canvasTex(256,160,(g)=>{const ink='#33284d';g.lineCap='round';g.lineJoin='round';const ex=[86,170],ey=72;
    for(const x of ex){
      if(mood==='happy'){g.strokeStyle=ink;g.lineWidth=8;g.beginPath();g.arc(x,ey+8,15,Math.PI*1.12,Math.PI*1.88);g.stroke();}
      else if(mood==='ouch'){g.strokeStyle=ink;g.lineWidth=7;g.beginPath();g.moveTo(x-13,ey-13);g.lineTo(x+13,ey+13);g.moveTo(x+13,ey-13);g.lineTo(x-13,ey+13);g.stroke();}
      else if(style==='nemu'){g.strokeStyle=ink;g.lineWidth=7;g.beginPath();g.arc(x,ey-2,14,Math.PI*.15,Math.PI*.85);g.stroke();}
      else{g.fillStyle=ink;g.beginPath();g.ellipse(x,ey,style==='kiri'?11:12,style==='kiri'?13:17,0,0,TAU);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(x+4,ey-6,4.5,0,TAU);g.fill();}
    }
    // eyebrows
    g.strokeStyle=ink;g.lineWidth=6;
    if(mood==='worry'){g.beginPath();g.moveTo(66,42);g.lineTo(98,34);g.moveTo(190,42);g.lineTo(158,34);g.stroke();}
    else if(style==='kiri'&&mood!=='happy'){g.beginPath();g.moveTo(68,36);g.lineTo(100,46);g.moveTo(188,36);g.lineTo(156,46);g.stroke();}
    g.fillStyle='rgba(255,110,140,.42)';g.beginPath();g.ellipse(52,106,17,10,0,0,TAU);g.ellipse(204,106,17,10,0,0,TAU);g.fill();
    g.strokeStyle=ink;g.fillStyle='#ff6b8a';g.lineWidth=6;g.beginPath();

function planStage(st){
  H=[];LUCK=[];let x=13,last='';const types=st.types;
  while(x<st.L-7){let t;do{t=pick(types);}while(t===last&&types.length>1);last=t;
    H.push({type:t,x,state:'wait',t:0,f:0});
    if(rnd()<D.dbl&&x+2.6<st.L-7){let t2;do{t2=pick(types);}while(t2===t);H.push({type:t2,x:x+2.6,state:'wait',t:0,f:0});x+=2.6;last=t2;}
    x+=rr(D.gap[0],D.gap[1]);}
  for(const h of H){HZ[h.type].make(h);h.mark=markSprite();if(D.arrow)h.arrow=arrowSprite();}
  for(let i=0;i<D.lucky;i++){let lx,k=0;do{lx=rr(8,st.L-4);k++;}while(k<40&&H.some(h=>Math.abs(h.x-lx)<2.2));
    const trap=i<D.trap,clover=!trap&&rnd()<.35;const g=new THREE.Group();
    if(trap){const c=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.07,22),[std('#6a4c93',{metalness:.5,roughness:.3}),std('#fff',{map:skullTex}),std('#fff',{map:skullTex})]);c.rotation.x=Math.PI/2;g.add(c);}else
    if(clover){const cm=std('#3cc35c',{roughness:.5});for(let q=0;q<4;q++){const l=sph(.17,cm,Math.cos(q*Math.PI/2)*.16,Math.sin(q*Math.PI/2)*.16,0,g,10);l.scale.z=.35;}cyl(.025,.025,.3,cm,0,-.28,0,g,6);}
    else{const c=cyl(.3,.3,.07,std('#ffd23f',{metalness:.7,roughness:.25,emissive:'#7a5a00',emissiveIntensity:.3}),0,0,0,g,22);c.rotation.x=Math.PI/2;}
    g.position.set(lx,rr(2.1,2.9),.4);world.add(g);LUCK.push({x:lx,g,clover,trap,got:false,t:rr(0,6)});}
}

function solve(h,early,p){h.state='ok';h.t=0;G.saved++;setCombo(G.combo+1);const bonus=G.combo%3===0?2:0;setHap(G.hap+(early?6:4)+bonus);h.mark.visible=false;if(h.arrow)h.arrow.visible=false;
  p=p||HZ[h.type].pts(h)[0]||new THREE.Vector3(P.x,2,0);burst(p.x,p.y,p.z,14,'#ffe37a',{tex:starTex,size:.35,spd:2.5,up:3});sfx('save');
  popAt((early?'はやわざ！ +6':'セーフ！ +4')+(bonus?`  ${G.combo}れんぞく +2`:''),p);say(pick(YAY),1.5);setMood('happy',1.1);}
function miss(h){h.state='miss';h.t=0;G.oops++;setCombo(0);setHap(G.hap-15);h.mark.visible=false;if(h.arrow)h.arrow.visible=false;HZ[h.type].miss(h);sfx('oops');say(OOPS[h.type],1.8);
  if(navigator.vibrate)try{navigator.vibrate(90);}catch(e){}}
function collectLuck(l){l.got=true;if(l.trap){setHap(G.hap-8);setCombo(0);burst(l.g.position.x,l.g.position.y,l.g.position.z,12,'#6a4c93',{size:.35});sfx('buzz');popAt('ワナの コイン！ -8',l.g.position);say('なんだか いやな よかん…',1.4);return;}G.luck++;setHap(G.hap+4);burst(l.g.position.x,l.g.position.y,l.g.position.z,12,l.clover?'#7dffb3':'#ffe37a',{tex:starTex,size:.3});sfx('coin');popAt(l.clover?'四つ葉！ +4':'コイン！ +4',l.g.position);}

/* ================= AUDIO ================= */
const AU={};
function initAudio(){if(AU.c){if(AU.c.state==='suspended')AU.c.resume();return;}try{const c=new (window.AudioContext||window.webkitAudioContext)();AU.c=c;AU.out=c.createGain();AU.out.gain.value=.55;AU.out.connect(c.destination);const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.nb=nb;}catch(e){AU.c=null;}}
function tone(type,f1,dur,vol,delay=0,f2){const c=AU.c;if(!c)return;const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AU.out);o.start(t);o.stop(t+dur+.05);}
function nz(dur,vol,type,freq,delay=0){const c=AU.c;if(!c)return;const t=c.currentTime+delay,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=AU.nb;f.type=type;f.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(AU.out);s.start(t,Math.random()*.5);s.stop(t+dur+.05);}
const SFX={
  save:()=>{[1047,1319,1568,2093].forEach((f,i)=>tone('sine',f,.18,.11,i*.05));nz(.25,.08,'highpass',6000);},
  oops:()=>{tone('triangle',520,.18,.18,0,260);tone('sine',200,.4,.2,.12,90);},
  coin:()=>[988,1319].forEach((f,i)=>tone('square',f,.1,.07,i*.07)),
  warn:()=>tone('triangle',880,.09,.08),
  clank:()=>{tone('square',1200,.06,.08);tone('square',1800,.05,.05,.03);},
  pop:()=>tone('sine',900,.08,.1,0,1800),
  bell:()=>{for(let i=0;i<2;i++){tone('sine',2600,.25,.07,i*.18);tone('sine',3900,.2,.03,i*.18);}},
  buzz:()=>tone('sawtooth',140,.25,.12,0,90),
  tap:()=>tone('sine',1600,.06,.05,0,2400),
  start:()=>[523,659,784].forEach((f,i)=>tone('triangle',f,.16,.13,i*.09)),
  goal:()=>[523,659,784,1047,784,1047,1319,1568].forEach((f,i)=>tone('triangle',f,.28,.14,i*.11)),
  sad:()=>[392,370,349,294].forEach((f,i)=>tone('sawtooth',f,i===3?.6:.25,.07,i*.28,i===3?200:null)),
  step:()=>tone('sine',150,.05,.03),
};
function sfx(n){if(AU.c&&AU.c.state==='running')try{SFX[n]();}catch(e){}}

/* ================= HUD HELPERS ================= */
let bubT=0;function say(t,sec=1.6){const b=$('#bubble');b.innerHTML=`<b>${esc(nm())}</b>「${t}」`;b.classList.add('on');bubT=sec;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toScreen(p){v3.copy(p).project(cam);return [(v3.x+1)/2*VW,(1-v3.y)/2*VH,v3.z];}
function popAt(txt,p){const [x,y]=toScreen(p);const e=document.createElement('div');e.className='pop';e.textContent=txt;e.style.left=x+'px';e.style.top=(y-20)+'px';$('#fx').appendChild(e);setTimeout(()=>e.remove(),1000);}
function ring(x,y){const e=document.createElement('div');e.className='ring';e.style.left=x+'px';e.style.top=y+'px';$('#fx').appendChild(e);setTimeout(()=>e.remove(),450);}
function banner(html,cls=''){const b=$('#banner');b.className='banner';void b.offsetWidth;b.innerHTML=html;b.className='banner on '+cls;}

/* ================= FLOW ================= */
function startStage(i){initAudio();D=DIFF[dk];stageIdx=i;const st=STAGES[i];
  buildWorld(st);buildPerson(look);planStage(st);
  Object.assign(P,{x:0,stun:0,anim:null,animT:0,runT:0,wetT:0,splatT:0,phase:0});
  Object.assign(G,{state:'intro',introT:2.6,saved:0,oops:0,luck:0,total:H.length,maxCombo:0,wrongs:0});setHap(50);setCombo(0);
  $('#hapGoal').style.left=D.pass+'%';$('#trackLbl').textContent=`ゴール：${st.goal}`;$('#trackMe').style.background=look.shirt;
  $('#title').hidden=$('#result').hidden=$('#maker').hidden=true;$('#hud').hidden=false;$('#hint').style.display=(dk==='easy'&&i===0)||dk==='oni'?'':'none';$('#hint').textContent=dk==='oni'?'鬼モード：「！」は 出ないよ。あやしい ものを 見ぬけ！':'「！」が出たら タップして たすけよう！';
  banner(`ステージ${i+1} ${st.name}<small>${esc(nm())}を ${st.intro}</small>`);sfx('start');
  setTimeout(()=>{if(G.state==='intro'||G.state==='play')say('きょうも なにか おこりそう…',2);},700);}
function finishStage(){G.state='goal';const st=STAGES[stageIdx];const ok=G.hap>=D.pass;
  const stars=ok?(G.oops===0||G.hap>=95?3:G.hap>=D.pass+15?2:1):0;
  const key=`lm-best-${dk}`;const rec=store.get(key,{});if(stars>(rec[stageIdx]||0)){rec[stageIdx]=stars;store.set(key,rec);}
  if(ok){banner(`${st.goal}に とうちゃく！`,'good');say('まにあった！ きょうは いい日だ！',2.5);setMood('happy',9);sfx('goal');for(let k=0;k<5;k++)setTimeout(()=>burst(P.x+rr(-1,3),rr(3,5),rr(-1,1),30,pick(['#ff5c8a','#ffcf3f','#3fa9ff','#2ec4a0']),{spd:3,up:4,size:.25,life:1.4,grav:-4}),k*250);}
  else{banner('とうちゃく… でも ボロボロ');say('ついたけど… きょうも ツイてなかった…',2.5);setMood('worry',9);sfx('sad');}
  setTimeout(()=>{if(G.state!=='goal')return;$('#hud').hidden=true;$('#bubble').classList.remove('on');$('#result').hidden=false;
    const last=stageIdx===STAGES.length-1;
    $('#resTitle').textContent=ok?(last?'ぜんぶ クリア！ さいこうの まもりがみ！':`${nm()} ハッピーに とうちゃく！`):`${nm()}、ちょっと ざんねん…`;
    $('#resN').textContent=Math.round(G.hap);$('#rsSave').textContent=`${G.saved}/${G.total}`;$('#rsLuck').textContent=G.luck;$('#rsOops').textContent=G.oops;
    $('#resStars').innerHTML=[0,1,2].map(i=>i<stars?`<b style="animation-delay:${.3+i*.25}s">★</b>`:'★').join('');
    $('#resNote').textContent=ok?`クリアライン ${D.pass}%・さいだい ${G.maxCombo}れんぞく${G.wrongs?`・おてつき ${G.wrongs}回`:''}`:`クリアには ハッピーど ${D.pass}% が ひつよう。「！」を はやめに タップしよう`;
    const nb=$('#btnNext');nb.textContent=ok?(last?'タイトルへ':'つぎの ステージへ'):'もういちど チャレンジ';nb.dataset.k=ok?(last?'home':'next'):'retry';$('#btnRetry').hidden=!ok;
  },3200);}
function toTitle(){G.state='title';$('#hud').hidden=true;$('#result').hidden=true;$('#maker').hidden=true;$('#title').hidden=false;$('#bubble').classList.remove('on');
  buildWorld(STAGES[stageIdx]);H=[];LUCK=[];buildPerson(look);P.x=2;renderTitle();}

/* ================= UPDATE ================= */
let clock=0;
function update(dt){clock+=dt;const st=STAGES[stageIdx];
  if(G.state==='intro'){G.introT-=dt;if(G.introT<=0)G.state='play';}
  const playing=G.state==='play';
  // ---- the friend ----
  let moving=false;
  if(playing){
    if(P.stun>0){P.stun-=dt;}
    else{const sp=P.runT>0?D.speed*3:D.speed;P.x+=sp*dt;moving=true;if(P.runT>0)P.runT-=dt;}
    if(P.x>=st.L){P.x=st.L;finishStage();}
  }else if(G.state==='goal'){moving=false;}
  if(P.anim){P.animT+=dt;if(P.animT>2.2&&P.runT<=0)P.anim=null;}
  animatePerson(dt,moving);
  // ---- hazards ----
  if(playing||G.state==='goal'){
    for(const h of H){const d=h.x-P.x,def=HZ[h.type],warn=D.warn*D.speed*(def.wm||1);h.t+=dt;
      if(h.state==='wait'&&playing&&d<warn){h.state='act';h.t=0;if(def.act)def.act(h);sfx('warn');}
      if(h.state==='act'){h.f=clamp(1-d/warn,0,1);def.upd(h,h.f,dt,clock);
        const p=def.pts(h)[0]||new THREE.Vector3(h.x,1,0);const showMark=D.mark==='always'||(D.mark==='late'&&h.f>.2);h.mark.visible=showMark;h.mark.position.set(p.x,p.y+.9+Math.sin(clock*8)*.08,p.z);const s=.8+Math.sin(clock*10)*.08;h.mark.scale.set(s,s,s);
        if(h.arrow){h.arrow.visible=true;h.arrow.position.set(p.x,p.y+2+Math.abs(Math.sin(clock*5))*.35,p.z);}
        if(d<=.15&&playing)miss(h);}
      else if(h.mark.visible){h.mark.visible=false;if(h.arrow)h.arrow.visible=false;}
      else if(h.state==='ok')def.ok(h,h.t,dt);
      else if(h.state==='miss'&&def.after)def.after(h,h.t,dt);}
  }
  for(const l of LUCK){if(l.got){if(l.g.visible){l.g.position.y+=dt*3;l.g.scale.multiplyScalar(.95);if(l.g.scale.x<.05)l.g.visible=false;}continue;}l.t+=dt;l.g.rotation.y=l.t*2.5;l.g.position.y+=Math.sin(l.t*3)*.004;}
  // mood
  if(P.moodT>0){P.moodT-=dt;if(P.moodT<=0)P.mood='normal';}
  let mood=P.mood;if(mood==='normal'&&playing&&H.some(h=>h.state==='act'&&h.f>.35))mood='worry';
  if(P.wetT>0||P.splatT>0)if(mood==='normal')mood='worry';
  const ft=faceTex(P.parts.style,mood);if(P.parts.faceMat.map!==ft){P.parts.faceMat.map=ft;P.parts.faceMat.needsUpdate=true;}
  if(P.wetT>0){P.wetT-=dt;if(rnd()<.25)burst(P.x+rr(-.4,.4),rr(1,2.6),rr(-.3,.3),1,'#7ab8ff',{spd:.2,up:0,grav:-8,size:.13,life:.5});}
  if(P.splatT>0)P.splatT-=dt;P.parts.splat.visible=P.splatT>0;
  updParts(dt);
  if(bubT>0){bubT-=dt;if(bubT<=0)$('#bubble').classList.remove('on');}
  // hud progress
  if(G.state!=='title'){const pr=clamp(P.x/st.L,0,1)*100;$('#trackFill').style.width=pr+'%';$('#trackMe').style.left=pr+'%';}
}
function animatePerson(dt,moving){const q=P.parts,root=P.root;root.position.set(P.x,0,0);
  const b=q.bodyG;b.position.set(0,0,0);b.rotation.set(0,0,0);q.stars.visible=false;q.head.rotation.set(0,G.state==='title'||G.state==='maker'?0:-.8,0);
  const sp=P.runT>0?3:1;
  if(moving){P.phase+=dt*D.speed*3.2*sp;const s=Math.sin(P.phase);q.legs[0].rotation.x=s*.7;q.legs[1].rotation.x=-s*.7;q.arms[0].rotation.x=-s*.6;q.arms[1].rotation.x=s*.6;b.position.y=Math.abs(Math.cos(P.phase))*.08;}
  else{for(const l of q.legs)l.rotation.x*=.8;for(const a of q.arms){a.rotation.x*=.8;}}
  for(const a of q.arms)a.rotation.z=0;
  const k=P.animT;
  switch(P.stun>0||P.runT>0?P.anim:null){
    case 'slip':{const r=k<.3?lerp(0,-1.45,k/.3):k<1.2?-1.45:lerp(-1.45,0,Math.min(1,(k-1.2)/.45));b.rotation.x=r;b.position.y=k<.3?Math.sin(k/.3*Math.PI)*.6:0;b.position.z=r*.6;break;}
    case 'drop':{b.position.y=k<.25?-2.6*(k/.25):k<1.15?-2.6:lerp(-2.6,0,Math.min(1,(k-1.15)/.55))+Math.sin(Math.min(1,(k-1.15)/.55)*Math.PI)*.6;break;}
    case 'dizzy':{q.stars.visible=true;q.stars.rotation.y=k*8;b.rotation.z=Math.sin(k*7)*.12;break;}
    case 'wet':case 'poop':{b.position.x=Math.sin(k*60)*.03;for(const a of q.arms)a.rotation.x=-.9;break;}
    case 'run':{q.arms[0].rotation.z=-2.6;q.arms[1].rotation.z=2.6;b.rotation.x=.25;break;}
  }
  if(P.stun>0&&P.anim==='dizzy')q.stars.visible=true;
}

/* ================= CAMERA / LOOP ================= */
let VW=1,VH=1;
function resize(){const r=$('#wrap').getBoundingClientRect();VW=Math.max(1,r.width);VH=Math.max(1,r.height);renderer.setSize(VW,VH,false);cam.aspect=VW/VH;cam.fov=cam.aspect<.8?60:48;cam.updateProjectionMatrix();}
new ResizeObserver(resize).observe($('#wrap'));resize();
const camPos=new THREE.Vector3(0,5,14),camLook=new THREE.Vector3();
function placeCam(dt){const port=cam.aspect<.8;let tp,tl;
  if(G.state==='title'){const t=clock*.25;tp=new THREE.Vector3(P.x+Math.sin(t)*5,3.2,Math.cos(t)*5+6);tl=new THREE.Vector3(P.x+1.5,1.8,-1);}
  else if(G.state==='maker'){tp=port?new THREE.Vector3(P.x,1.4,7.2):new THREE.Vector3(P.x+1.7,2.1,6.2);tl=port?new THREE.Vector3(P.x,-.4,0):new THREE.Vector3(P.x+1.7,1.6,0);}
  else{tp=port?new THREE.Vector3(P.x+4.2,8.2,22):new THREE.Vector3(P.x+3.6,4.4,11.5);tl=port?new THREE.Vector3(P.x+4.6,1.6,-1):new THREE.Vector3(P.x+4.6,1.6,-1);}
  const k=G.state==='play'||G.state==='goal'?Math.min(1,dt*4):Math.min(1,dt*3);camPos.lerp(tp,k);camLook.lerp(tl,k);cam.position.copy(camPos);cam.lookAt(camLook);
  sun.position.set(P.x+8,16,12);sun.target.position.set(P.x+3,0,-2);}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!window.__lm.manual)update(dt);
  if(G.state==='maker'||G.state==='title'){P.root.rotation.y=G.state==='maker'?Math.PI/2+Math.sin(clock*.7)*.9-1.2:Math.PI/2;}
  placeCam(dt);renderer.render(scene,cam);
  if(bubT>0){v3.set(P.x,3.55+(P.parts?P.parts.bodyG.position.y:0),0);const [x,y]=toScreen(v3);const b=$('#bubble');const hw=b.offsetWidth/2+8;b.style.left=clamp(x,hw,VW-hw)+'px';b.style.top=Math.max(70,y)+'px';}
  requestAnimationFrame(loop);}

/* ================= INPUT: tap to protect ================= */
function handleTap(cx,cy){if(G.state!=='play'&&G.state!=='intro')return false;initAudio();ring(cx,cy);sfx('tap');
  let best=null,bd=1e9;const R=D.R;
  for(const h of H){const def=HZ[h.type],d=h.x-P.x,warn=D.warn*D.speed*(def.wm||1);const can=h.state==='act'||(h.state==='wait'&&def.earlyOK!==false&&d<warn*1.5&&d>0);if(!can)continue;
    def.pts(h).forEach((p,i)=>{const [x,y,z]=toScreen(p);if(z>1)return;const dd=Math.hypot(x-cx,y-cy);if(dd<R&&dd<bd){bd=dd;best={h,i,p};}});}
  for(const l of LUCK){if(l.got)continue;const [x,y,z]=toScreen(l.g.position);if(z>1)continue;const dd=Math.hypot(x-cx,y-cy);if(dd<R*.85&&dd<bd){bd=dd;best={l};}}
  if(!best){if(D.wrong&&G.state==='play'){G.wrongs++;setHap(G.hap-D.wrong);setCombo(0);const e=document.createElement('div');e.className='pop';e.textContent=`おてつき -${D.wrong}`;e.style.left=cx+'px';e.style.top=(cy-24)+'px';e.style.color='#ffb3b3';$('#fx').appendChild(e);setTimeout(()=>e.remove(),1000);sfx('buzz');}return false;}
  if(best.l)collectLuck(best.l);else{const h=best.h,def=HZ[h.type];const early=h.state==='wait';if(early){h.state='act';h.t=0;if(def.act)def.act(h);}
    if(def.tap&&!def.tap(h,best.i))return true;solve(h,early,best.p);}
  return true;}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();handleTap(e.clientX-r.left,e.clientY-r.top);});

/* ================= MENUS ================= */
function renderTitle(){$('#whoName').textContent=nm();
  $('#diffs').innerHTML=Object.entries(DIFF).map(([k,d])=>`<button class="opt" data-d="${k}" aria-pressed="${k===dk}"><b>${d.name}</b><span>${d.desc}<br>クリア ${d.pass}%</span></button>`).join('');
  const rec=store.get(`lm-best-${dk}`,{});
  $('#stages').innerHTML=STAGES.map((s,i)=>`<button class="opt" data-s="${i}" aria-pressed="${i===stageIdx}"><b>${i+1}. ${s.short}</b><span>${s.name}</span><i>${'★'.repeat(rec[i]||0)}${'☆'.repeat(3-(rec[i]||0))}</i></button>`).join('');}
$('#diffs').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(!b)return;dk=b.dataset.d;D=DIFF[dk];store.set('lm-diff',dk);renderTitle();});
$('#stages').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;const i=+b.dataset.s;if(i!==stageIdx){stageIdx=i;buildWorld(STAGES[i]);}renderTitle();});
$('#btnPlay').addEventListener('click',()=>startStage(stageIdx));
$('#btnQuit').addEventListener('click',toTitle);
$('#btnHome').addEventListener('click',toTitle);
$('#btnRetry').addEventListener('click',()=>startStage(stageIdx));
$('#btnNext').addEventListener('click',()=>{const k=$('#btnNext').dataset.k;if(k==='next')startStage(stageIdx+1);else if(k==='retry')startStage(stageIdx);else toTitle();});
// look editor
function renderMaker(){$('#lkName').value=look.name;
  $('#lkOpts').innerHTML=Object.entries(LOOK_OPTS).map(([k,o])=>`<div class="lbl">${o.label}</div><div class="row">${o.type==='chip'?o.vals.map(([v,l])=>`<button class="chip" data-k="${k}" data-v="${v}" aria-pressed="${look[k]===v}">${l}</button>`).join(''):o.vals.map(v=>`<button class="sw" data-k="${k}" data-v="${v}" style="background:${v}" aria-pressed="${look[k]===v}" aria-label="${o.label}"></button>`).join('')}</div>`).join('');}
function openMaker(){G.state='maker';$('#title').hidden=true;$('#maker').hidden=false;renderMaker();buildPerson(look);}
$('#btnLook').addEventListener('click',openMaker);
$('#lkOpts').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;look[b.dataset.k]=b.dataset.v;renderMaker();buildPerson(look);sfx('tap');});
$('#lkName').addEventListener('input',e=>{look.name=e.target.value.trim()||'';});
$('#btnRandom').addEventListener('click',()=>{for(const [k,o] of Object.entries(LOOK_OPTS)){const v=pick(o.vals);look[k]=o.type==='chip'?v[0]:v;}renderMaker();buildPerson(look);initAudio();sfx('save');});
$('#btnLookOK').addEventListener('click',()=>{if(!look.name)look.name='ポンタ';store.set('lm-look',look);$('#maker').hidden=true;$('#title').hidden=false;G.state='title';renderTitle();});
$('#lkName').addEventListener('keydown',e=>e.stopPropagation());

buildWorld(STAGES[0]);buildPerson(look);P.x=2;renderTitle();
if(!store.get('lm-look',null))openMaker();
requestAnimationFrame(loop);
window.__lm={G,P,get H(){return H;},get LUCK(){return LUCK;},get dk(){return dk;},set dk(v){dk=v;D=DIFF[v];},startStage,update,handleTap,snapCam(){placeCam(1);},toScreen,HZ,get look(){return look;},buildPerson,manual:false,seed(s){let a=s>>>0;rnd=()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}};
})();
</script>
