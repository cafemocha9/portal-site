<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8fd46a">
<title>ぽかぽか島ぐらし</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fffaf0; --cream2:#f6edd9; --ink:#5b4636; --ink2:#8a7560; --leaf:#6fbf57; --leafd:#4f9a3c; --sun:#ffc94a; --sky:#7ccaf0; --berry:#f0757a;
  --disp:"Kiwi Maru","Zen Maru Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --cream:#fff8ec; --cream2:#f3e8d2; } }
:root[data-theme="dark"]{ --cream:#fff8ec; --cream2:#f3e8d2; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:#8fd46a;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;color:var(--ink);background:#8fd46a;
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-size:15px;line-height:1.6;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#wrap{position:relative;width:100%;height:100%;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.ui{position:absolute;inset:0;pointer-events:none}
.ui>*{pointer-events:auto}

/* top bar */
.clock{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;padding:6px 16px 7px;border-radius:20px;background:var(--cream);box-shadow:0 3px 0 rgba(91,70,54,.25);line-height:1.15}
.clock b{display:block;font-family:var(--disp);font-size:24px;font-weight:500;letter-spacing:.02em}
.clock span{font-size:12px;font-weight:700;color:var(--ink2)}
.topr{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;display:flex;gap:8px;align-items:center}
.money{display:flex;align-items:center;gap:6px;height:42px;padding:0 14px 0 8px;border-radius:21px;background:var(--cream);box-shadow:0 3px 0 rgba(91,70,54,.25);font-family:var(--disp);font-size:18px}
.money svg{width:26px;height:26px}
.round{width:44px;height:44px;border-radius:50%;background:var(--cream);box-shadow:0 3px 0 rgba(91,70,54,.25);display:grid;place-items:center}
.round svg{width:22px;height:22px}

/* controls */
#joy{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;
  background:rgba(255,250,240,.35);border:3px solid rgba(255,250,240,.75);touch-action:none}
#stick{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--cream);box-shadow:0 4px 0 rgba(91,70,54,.3)}
.acts{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:190px;height:170px}
#btnA{position:absolute;right:0;bottom:8px;width:92px;height:92px;border-radius:50%;background:var(--leaf);color:#fff;box-shadow:0 5px 0 var(--leafd);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none}
#btnA b{font-family:var(--disp);font-size:28px;font-weight:500;line-height:1}
#btnA span{font-size:12px;font-weight:900;line-height:1.2;margin-top:2px;white-space:nowrap}
#btnA.on{transform:translateY(3px);box-shadow:0 2px 0 var(--leafd)}
#btnA.dim{background:#a9c99c;box-shadow:0 5px 0 #86a77a}
#btnTool{position:absolute;right:104px;bottom:0;width:70px;height:70px;border-radius:50%;background:var(--cream);box-shadow:0 4px 0 rgba(91,70,54,.3);display:flex;flex-direction:column;align-items:center;justify-content:center}
#btnTool img{width:36px;height:36px}
#btnTool span{font-size:10px;font-weight:900;line-height:1}
#btnBag{position:absolute;right:62px;bottom:108px;width:58px;height:58px;border-radius:50%;background:var(--cream);box-shadow:0 4px 0 rgba(91,70,54,.3);display:grid;place-items:center}
#btnBag svg{width:30px;height:30px}

/* toasts & dialog */
#toasts{position:absolute;left:50%;top:70px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 6px;border-radius:18px;background:var(--cream);box-shadow:0 3px 0 rgba(91,70,54,.25);font-weight:700;font-size:14px;white-space:nowrap;animation:tin .25s ease-out}
.toast img{width:28px;height:28px}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#catch{position:absolute;inset:0;display:none;place-items:center;background:rgba(40,30,20,.25);pointer-events:auto}
#catch.on{display:grid}
.cc{background:var(--cream);border-radius:28px;padding:18px 26px 20px;text-align:center;box-shadow:0 6px 0 rgba(91,70,54,.3);max-width:84vw;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.cc img{width:120px;height:120px;display:block;margin:0 auto}
.cc h3{margin:4px 0 2px;font-family:var(--disp);font-weight:500;font-size:22px}
.cc p{margin:0;font-size:14px;color:var(--ink2)}
.cc small{display:block;margin-top:10px;font-size:12px;color:var(--ink2)}
#dlg{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(94vw,640px);display:none;pointer-events:auto}
#dlg.on{display:block}
.bubble{position:relative;background:var(--cream);border-radius:30px;padding:26px 26px 22px;min-height:118px;box-shadow:0 6px 0 rgba(91,70,54,.25);font-size:17px;font-weight:700;line-height:1.7}
.nametag{position:absolute;left:22px;top:-18px;padding:3px 16px;border-radius:14px;color:#fff;font-weight:900;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.15);transform:rotate(-3deg)}
.nametag i{font-style:normal;font-size:12px;margin-left:6px;letter-spacing:1px}
.more{position:absolute;right:24px;bottom:12px;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:12px solid var(--berry);animation:bob .6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(4px)}}
#choices{position:absolute;right:10px;bottom:calc(100% + 12px);display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#choices button{padding:8px 20px;border-radius:20px;background:var(--cream);box-shadow:0 3px 0 rgba(91,70,54,.25);font-weight:900;font-size:15px;text-align:right}
#choices button:hover,#choices button:focus-visible{background:#fff3c4}

/* sheets */
.sheet{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;background:rgba(40,30,20,.28);pointer-events:auto;padding:12px}
.sheet.on{display:flex}
.card{width:min(100%,560px);max-height:88%;overflow:auto;background:var(--cream);border-radius:28px;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 6px 0 rgba(91,70,54,.25)}
@media (min-height:700px){.sheet{align-items:center}}
.card h2{margin:0 0 10px;font-family:var(--disp);font-weight:500;font-size:22px;display:flex;align-items:center;gap:10px}
.card h2 .x{margin-left:auto;width:38px;height:38px;border-radius:50%;background:var(--cream2);display:grid;place-items:center;font-size:20px}
.hint{font-size:13px;color:var(--ink2);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.slot{position:relative;aspect-ratio:1;border-radius:18px;background:var(--cream2);display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(91,70,54,.1)}
.slot img{width:76%;height:76%}
.slot b{position:absolute;right:5px;bottom:2px;font-size:12px;font-weight:900;background:var(--cream);border-radius:8px;padding:0 5px;line-height:1.4}
.slot.sel{outline:3px solid var(--leaf);background:#eaf6df}
.slot:empty{cursor:default}
.detail{margin-top:12px;display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 12px;border-radius:18px;background:var(--cream2)}
.detail img{width:48px;height:48px}
.detail .t{flex:1;min-width:0}
.detail .t b{display:block;font-size:16px}
.detail .t span{font-size:12px;color:var(--ink2)}
.pill{height:40px;padding:0 16px;border-radius:20px;background:var(--leaf);color:#fff;font-weight:900;box-shadow:0 3px 0 var(--leafd);white-space:nowrap}
.pill.sub{background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(91,70,54,.2)}
.pill:disabled{opacity:.45}
.row{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;height:38px;border-radius:19px;background:var(--cream2);font-weight:900}
.tabs button[aria-selected="true"]{background:var(--leaf);color:#fff}
.shoplist{display:grid;gap:8px}
.shopitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:18px;background:var(--cream2);text-align:left;width:100%}
.shopitem img{width:44px;height:44px}
.shopitem .t{flex:1}
.shopitem .t b{display:block}
.shopitem .p{font-family:var(--disp);font-size:16px;display:flex;align-items:center;gap:4px}
.shopitem .p svg{width:20px;height:20px}
.shopitem:disabled{opacity:.5}
.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dx{border-radius:16px;background:var(--cream2);padding:6px 4px;text-align:center;font-size:11px;font-weight:700;line-height:1.3}
.dx img{width:52px;height:52px;display:block;margin:0 auto}
.dx.no img{filter:brightness(0) opacity(.18)}
.dx span{display:block;color:var(--ink2);font-size:10px}
#mapc{width:100%;aspect-ratio:1;border-radius:20px;background:#5cc6e8;display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;font-weight:700;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.menu button{padding:16px 10px;border-radius:20px;background:var(--cream2);font-weight:900;display:flex;flex-direction:column;align-items:center;gap:6px}
.menu svg{width:34px;height:34px}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-weight:900;font-size:13px}
.field input{height:44px;border-radius:14px;border:2px solid var(--cream2);background:#fff;padding:0 14px;font:inherit;font-weight:700;color:var(--ink)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.sw button[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px dashed rgba(91,70,54,.2);font-weight:700}

/* title */
#title{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:10vh 20px calc(8vh + env(safe-area-inset-bottom,0px));pointer-events:auto;background:linear-gradient(180deg,rgba(124,202,240,.35),rgba(124,202,240,0) 45%)}
#title.on{display:flex}
.logo{text-align:center;color:#fff}
.logo h1{margin:0;font-family:var(--disp);font-weight:500;font-size:clamp(40px,11vw,76px);line-height:1.15;letter-spacing:.04em;
  text-shadow:0 4px 0 var(--leafd),0 0 0 #000,3px 3px 0 var(--leafd),-3px 3px 0 var(--leafd),3px -2px 0 var(--leafd),-3px -2px 0 var(--leafd)}
.logo p{margin:6px 0 0;font-weight:900;font-size:15px;color:var(--ink);background:var(--cream);display:inline-block;padding:3px 16px;border-radius:14px}
.tbtns{display:flex;flex-direction:column;gap:10px;align-items:center}
.big{min-width:220px;height:54px;border-radius:27px;background:var(--leaf);color:#fff;font-family:var(--disp);font-size:20px;box-shadow:0 5px 0 var(--leafd)}
.big.sub{background:var(--cream);color:var(--ink);box-shadow:0 5px 0 rgba(91,70,54,.3)}
.keys{font-size:12px;font-weight:700;background:rgba(255,250,240,.9);padding:6px 14px;border-radius:14px;text-align:center;line-height:1.8}
.keys kbd{font-family:inherit;background:var(--cream2);border-radius:6px;padding:0 6px;font-weight:900}
.hidden{display:none!important}
#hud.talk #joy,#hud.talk .acts{visibility:hidden}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <div class="ui" id="hud">
    <div class="clock"><b id="cTime">12:00</b><span id="cDate"></span></div>
    <div class="topr">
      <div class="money"><svg viewBox="0 0 32 32"><path d="M16 3C9 7 5 13 6 20c1 5 5 8 10 9 5-1 9-4 10-9 1-7-3-13-10-17z" fill="#6fbf57" stroke="#4f9a3c" stroke-width="2"/><path d="M16 8v20M16 15l-5-3M16 20l5-3" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg><span id="money">0</span></div>
      <button class="round" id="btnMenu" aria-label="メニュー"><svg viewBox="0 0 24 24" fill="none" stroke="#5b4636" stroke-width="2.6" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
    </div>
    <div id="joy"><div id="stick"></div></div>
    <div class="acts">
      <button id="btnBag" aria-label="ポケット"><svg viewBox="0 0 32 32"><path d="M8 11h16l2 15a2 2 0 01-2 2H8a2 2 0 01-2-2z" fill="#e8a25a" stroke="#5b4636" stroke-width="2"/><path d="M11 11a5 5 0 0110 0" fill="none" stroke="#5b4636" stroke-width="2.2"/><circle cx="16" cy="18" r="3" fill="#6fbf57"/></svg></button>
      <button id="btnTool" aria-label="道具をかえる"><img id="toolImg" alt=""><span id="toolName">て</span></button>
      <button id="btnA"><b>A</b><span id="aLabel">―</span></button>
    </div>
    <div id="toasts"></div>
  </div>

  <div id="dlg"><div id="choices"></div><div class="bubble"><div class="nametag" id="dName"></div><div id="dText"></div><div class="more" id="dMore"></div></div></div>
  <div id="catch"><div class="cc" id="catchCard"></div></div>

  <div class="sheet" id="shInv"><div class="card"><h2>ポケット<button class="x" data-close>×</button></h2><p class="hint" id="invHint"></p><div class="grid" id="invGrid"></div><div class="detail" id="invDetail"></div></div></div>
  <div class="sheet" id="shShop"><div class="card"><h2 id="shopTitle">よろず屋メエコ<button class="x" data-close>×</button></h2><div class="tabs"><button data-tab="buy">かう</button><button data-tab="sell">うる</button></div><div id="shopBody"></div></div></div>
  <div class="sheet" id="shStore"><div class="card"><h2>おうちの収納<button class="x" data-close>×</button></h2><p class="hint">タップすると、ポケットと収納のあいだで移動します</p><b>ポケット</b><div class="grid" id="stInv" style="margin:6px 0 14px"></div><b>収納</b><div class="grid" id="stBox" style="margin-top:6px"></div></div></div>
  <div class="sheet" id="shDex"><div class="card"><h2>いきもの図鑑<button class="x" data-close>×</button></h2><div class="tabs"><button data-dex="fish">さかな</button><button data-dex="bug">むし</button><button data-dex="fossil">化石</button></div><p class="hint" id="dexHint"></p><div class="dex" id="dexGrid"></div></div></div>
  <div class="sheet" id="shMap"><div class="card"><h2>島マップ<button class="x" data-close>×</button></h2><canvas id="mapc" width="440" height="440"></canvas><div class="legend"><span><i style="background:#ff5a6e"></i>あなた</span><span><i style="background:#f2a93b"></i>住民</span><span><i style="background:#8b5cf6"></i>よろず屋</span><span><i style="background:#fff"></i>おうち</span></div></div></div>
  <div class="sheet" id="shMenu"><div class="card"><h2>メニュー<button class="x" data-close>×</button></h2><div class="menu">
    <button data-open="dex"><svg viewBox="0 0 32 32"><rect x="6" y="4" width="20" height="24" rx="3" fill="#7ccaf0" stroke="#5b4636" stroke-width="2"/><path d="M11 11h10M11 16h10M11 21h6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>図鑑</button>
    <button data-open="map"><svg viewBox="0 0 32 32"><path d="M4 8l8-3 8 3 8-3v19l-8 3-8-3-8 3z" fill="#8fd46a" stroke="#5b4636" stroke-width="2" stroke-linejoin="round"/><circle cx="18" cy="14" r="3" fill="#ff5a6e"/></svg>マップ</button>
    <button data-open="help"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="#ffc94a" stroke="#5b4636" stroke-width="2"/><path d="M12.5 12.5a3.5 3.5 0 117 0c0 2.5-3.5 2.5-3.5 5.5" fill="none" stroke="#5b4636" stroke-width="2.4" stroke-linecap="round"/><circle cx="16" cy="22.5" r="1.6" fill="#5b4636"/></svg>あそびかた</button>
    <button data-open="settings"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="6" fill="#f0757a" stroke="#5b4636" stroke-width="2"/><path d="M16 3v5M16 24v5M3 16h5M24 16h5M7 7l3.5 3.5M21.5 21.5L25 25M7 25l3.5-3.5M21.5 10.5L25 7" stroke="#5b4636" stroke-width="2.4" stroke-linecap="round"/></svg>せってい</button>
  </div></div></div>
  <div class="sheet" id="shHelp"><div class="card"><h2>あそびかた<button class="x" data-close>×</button></h2><div id="helpBody"></div></div></div>
  <div class="sheet" id="shSet"><div class="card"><h2>せってい<button class="x" data-close>×</button></h2>
    <div class="toggle">効果音<button class="pill sub" id="tgSfx"></button></div>
    <div class="toggle">BGM<button class="pill sub" id="tgBgm"></button></div>
    <div class="toggle">データを消して最初から<button class="pill sub" id="btnReset">消す</button></div>
  </div></div>
  <div class="sheet" id="shCreate"><div class="card"><h2>あなたについて</h2>
    <div class="field"><label for="inName">なまえ</label><input id="inName" maxlength="8" placeholder="8文字まで" autocomplete="off"></div>
    <div class="field"><label>かみの色</label><div class="sw" id="swHair"></div></div>
    <div class="field"><label>ふくの色</label><div class="sw" id="swShirt"></div></div>
    <div class="field"><label>はだの色</label><div class="sw" id="swSkin"></div></div>
    <button class="pill" id="btnCreate" style="width:100%;height:48px;font-size:17px">この姿で島へ</button>
  </div></div>

  <section id="title">
    <div class="logo"><h1>ぽかぽか島ぐらし</h1><p>のんびり無人島スローライフ</p></div>
    <div class="tbtns">
      <button class="big" id="btnContinue">つづきから</button>
      <button class="big sub" id="btnNew">はじめから</button>
      <div class="keys" id="keysHelp"><kbd>WASD</kbd>/<kbd>矢印</kbd> あるく（<kbd>Shift</kbd>でそっと）　<kbd>Space</kbd> A<br><kbd>Q</kbd> 道具　<kbd>I</kbd> ポケット　<kbd>M</kbd> マップ</div>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const TAU=Math.PI*2, clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R0=Math.random;
const pick=(arr,r=R0)=>arr[Math.floor(r()*arr.length)];
function wpick(list,r=R0){let t=0;for(const x of list)t+=x.w;let v=r()*t;for(const x of list){v-=x.w;if(v<=0)return x;}return list[0];}
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};

/* ======================= ITEMS ======================= */
const IT={};

const W=44,H=44,SEA=0,SAND=1,GRASS=2,RIVER=3,POND=4,PLAZA=5;

const isWater=t=>t===SEA||t===RIVER||t===POND;
const inB=(x,z)=>x>=0&&z>=0&&x<W&&z<H;

function genTerrain(seed){
  const r=rng(seed),cx=W/2,cz=H/2;T=new Uint8Array(W*H);BR=new Map();
  const a1=r()*TAU,a2=r()*TAU,a3=r()*TAU;

  const rp=[[cx+3+r()*2,-2],[cx+2+r()*2,9],[cx+1+r()*2,15],[cx+4,cz+1],[cx+9,cz+4+r()*2],[cx+15,cz+5],[W+2,cz+6+r()*2]];
  for(let i=0;i<rp.length-1;i++){const [x1,z1]=rp[i],[x2,z2]=rp[i+1];for(let t=0;t<=1;t+=.05){const px=x1+(x2-x1)*t,pz=z1+(z2-z1)*t;for(let z=Math.floor(pz-2);z<=pz+2;z++)for(let x=Math.floor(px-2);x<=px+2;x++){if(!inB(x,z))continue;if(Math.hypot(x+.5-px,z+.5-pz)<1.1&&T[z*W+x]!==SEA)T[z*W+x]=RIVER;}}}
  const px=Math.round(cx-10+r()*2),pz=Math.round(cz-7+r()*2);

  for(let z=cz+3;z<=cz+6;z++)for(let x=cx-4;x<=cx;x++)if(T[z*W+x]===GRASS)T[z*W+x]=PLAZA;
  const land=t=>t===GRASS||t===SAND;
  for(const zb of [10,9,11,8,12,7,13,6,14]){const xs=[];for(let x=0;x<W;x++)if(T[zb*W+x]===RIVER)xs.push(x);if(!xs.length)continue;const a=xs[0],b=xs[xs.length-1];if(b-a+1!==xs.length||b-a>3)continue;if(land(T[zb*W+a-1])&&land(T[zb*W+b+1])){for(let x=a;x<=b;x++)BR.set(zb*W+x,'h');break;}}
  for(const xb of [cx+12,cx+11,cx+13,cx+10,cx+14,cx+9,cx+15]){const zs=[];for(let z=0;z<H;z++)if(T[z*W+xb]===RIVER)zs.push(z);if(!zs.length)continue;const a=zs[0],b=zs[zs.length-1];if(b-a+1!==zs.length||b-a>3)continue;if(land(T[(a-1)*W+xb])&&land(T[(b+1)*W+xb])){for(let z=a;z<=b;z++)BR.set(z*W+xb,'v');break;}}

function computeReach(sx,sz){
  REACH=new Uint8Array(W*H);const walk=i=>{const t=T[i];return BR.has(i)||t===GRASS||t===SAND||t===PLAZA;};

}

  tryPlace('dig',4,GRASS,(x,z)=>({t:'dig',x,z}));
  const shells=['makigai','hotate','hitode','sakuragai','sango'];
  tryPlace('shell',6,SAND,(x,z)=>({t:'shell',x,z,id:wpick([{w:6,id:'makigai'},{w:5,id:'hotate'},{w:3,id:'hitode'},{w:6,id:'sakuragai'},{w:1,id:'sango'}]).id}));
  const weeds=S.objs.filter(o=>o.t==='weed').length; if(weeds<22) tryPlace('weed',Math.min(4,22-weeds),GRASS,(x,z)=>({t:'weed',x,z}));
  const pool=FURN_IDS.slice(); S.stock=[]; for(let i=0;i<5;i++){ S.stock.push(pool.splice(Math.floor(r()*pool.length),1)[0]); }
  const fl=['fl_r','fl_y','fl_w','fl_p','fl_b']; S.stock.push(pick(fl));

}

class PSys{constructor(max){this.max=max;this.n=0;this.p=new Float32Array(max*3);this.c=new Float32Array(max*3);this.s=new Float32Array(max);this.a=new Float32Array(max);this.v=new Float32Array(max*3);this.l=new Float32Array(max);this.ml=new Float32Array(max);this.s0=new Float32Array(max);this.gv=new Float32Array(max);
  const g=new THREE.BufferGeometry();this.ap=new THREE.BufferAttribute(this.p,3).setUsage(THREE.DynamicDrawUsage);this.ac=new THREE.BufferAttribute(this.c,3).setUsage(THREE.DynamicDrawUsage);this.as=new THREE.BufferAttribute(this.s,1).setUsage(THREE.DynamicDrawUsage);this.aa=new THREE.BufferAttribute(this.a,1).setUsage(THREE.DynamicDrawUsage);
  g.setAttribute('position',this.ap);g.setAttribute('pc',this.ac);g.setAttribute('ps',this.as);g.setAttribute('pa',this.aa);
  this.mat=new THREE.ShaderMaterial({uniforms:{scale:{value:500},uCurve:CURVE,uFocus:FOCUS},transparent:true,depthWrite:false,
    vertexShader:'attribute vec3 pc;attribute float ps;attribute float pa;varying vec3 vC;varying float vA;uniform float scale,uCurve,uFocus;void main(){vC=pc;vA=pa;vec4 mv=modelViewMatrix*vec4(position,1.);float bz=max(0.,-mv.z-uFocus);mv.y-=bz*bz*uCurve;gl_PointSize=ps*scale/max(.1,-mv.z);gl_Position=projectionMatrix*mv;}',
    fragmentShader:'varying vec3 vC;varying float vA;void main(){vec2 c=gl_PointCoord-.5;float d=length(c);if(d>.5)discard;gl_FragColor=vec4(vC,smoothstep(.5,.2,d)*vA);}'});
  this.pts=new THREE.Points(g,this.mat);this.pts.frustumCulled=false;this.pts.renderOrder=6;this.g=g;g.setDrawRange(0,0);}
  add(x,y,z,vx,vy,vz,life,size,col,grav=6){if(this.n>=this.max)return;const i=this.n++,i3=i*3;this.p[i3]=x;this.p[i3+1]=y;this.p[i3+2]=z;this.v[i3]=vx;this.v[i3+1]=vy;this.v[i3+2]=vz;const c=_c.set(col);this.c[i3]=c.r;this.c[i3+1]=c.g;this.c[i3+2]=c.b;this.l[i]=this.ml[i]=life;this.s0[i]=size;this.gv[i]=grav;}
  update(dt){let i=0;while(i<this.n){this.l[i]-=dt;if(this.l[i]<=0){const j=--this.n;if(j!==i){for(let k=0;k<3;k++){this.p[i*3+k]=this.p[j*3+k];this.v[i*3+k]=this.v[j*3+k];this.c[i*3+k]=this.c[j*3+k];}this.l[i]=this.l[j];this.ml[i]=this.ml[j];this.s0[i]=this.s0[j];this.gv[i]=this.gv[j];}continue;}
    const i3=i*3;this.v[i3+1]-=this.gv[i]*dt;this.p[i3]+=this.v[i3]*dt;this.p[i3+1]+=this.v[i3+1]*dt;this.p[i3+2]+=this.v[i3+2]*dt;const f=this.l[i]/this.ml[i];this.a[i]=Math.min(1,f*2);this.s[i]=this.s0[i]*(.6+.4*f);i++;}
    this.g.setDrawRange(0,this.n);this.ap.needsUpdate=this.ac.needsUpdate=this.as.needsUpdate=this.aa.needsUpdate=true;}}

function invAdd(id,n=1){
  const st=stackOf(id); let left=n;
  for(let i=0;i<S.inv.length&&left>0;i++){const s=S.inv[i];if(s&&s.id===id&&s.n<st){const k=Math.min(st-s.n,left);s.n+=k;left-=k;}}
  for(let i=0;i<S.inv.length&&left>0;i++){if(!S.inv[i]){const k=Math.min(st,left);S.inv[i]={id,n:k};left-=k;}}
  markSave(); return left===0;
}
const invCount=id=>S.inv.reduce((a,s)=>a+(s&&s.id===id?s.n:0),0);
function invRemove(id,n=1){for(let i=S.inv.length-1;i>=0&&n>0;i--){const s=S.inv[i];if(s&&s.id===id){const k=Math.min(s.n,n);s.n-=k;n-=k;if(!s.n)S.inv[i]=null;}}markSave();}
const invFree=id=>S.inv.some(s=>!s||(s.id===id&&s.n<stackOf(id)));

function swingNet(){

function reelRod(){
  const F=P.fish; if(!F) return;

    const f=F.fish, id=Math.random()<.04?(Math.random()<.5?'boot':'can'):f.it.id;

    return;
  }
  if(F.fish&&(F.state==='nibble'||F.state==='approach')){F.fish.state='flee';F.fish.yaw+=Math.PI;toast('にげられた…');sfx('fail');}
  endFishing(); playAct('reel',.3);
}
function updateFishing(dt){
  const F=P.fish; if(!F) return;
  F.t+=dt;
  const tip=new THREE.Vector3(); if(P.toolMesh&&P.toolMesh.userData.tip){P.toolMesh.userData.tip.getWorldPosition(tip);}else tip.set(P.x,1.5,P.z);
  let by=-.42;
  if(F.state==='fly'){const f=clamp(F.t/.45,0,1);bobber.position.set(lerp(P.x,F.x,f),lerp(1.4,-.42,f)+Math.sin(f*Math.PI)*1.2,lerp(P.z,F.z,f));if(f>=1){F.state='wait';F.t=0;sfx('plop');puff(F.x,-.4,F.z,'#ffffff',6,1,.12,5);}}
  else{
    if(F.state==='wait'){
      if(!F.fish){let best=null,bd=4.5;for(const f of FISH_L){if(f.state!=='swim'||f.loc!==F.loc)continue;const d=Math.hypot(f.x-F.x,f.z-F.z);if(d<bd){bd=d;best=f;}}
        if(best&&F.t>.6){F.fish=best;best.state='approach';F.state='approach';}}
      if(F.t>14&&!F.fish){toast('なにもかからなかった…');endFishing();return;}
    }
    if(F.state==='approach'){const f=F.fish;const a=Math.atan2(F.x-f.x,F.z-f.z);f.tx=F.x-Math.sin(a)*(.35+f.sz*.4);f.tz=F.z-Math.cos(a)*(.35+f.sz*.4);if(Math.hypot(f.tx-f.x,f.tz-f.z)<.08){F.state='nibble';F.nib=1+Math.floor(Math.random()*4);F.nibT=.8+Math.random()*.8;}}
    if(F.state==='nibble'){F.nibT-=dt;if(F.nibT<=0){if(F.nib>0){F.nib--;F.nibT=.7+Math.random()*1;F.dip=.12;sfx('pok');puff(F.x,-.42,F.z,'#ffffff',3,.6,.08,3);}else{F.state='bite';F.t=0;F.dip=.35;sfx('bite');puff(F.x,-.42,F.z,'#ffffff',12,1.8,.14,5);}}}
    if(F.state==='bite'){F.dip=Math.max(.25,F.dip);if(F.t>.9){F.fish.state='flee';F.fish.yaw+=Math.PI;toast('にげられた…');sfx('fail');endFishing();return;}}
    F.dip=Math.max(0,(F.dip||0)-dt*(F.state==='bite'?0:1.2));
    by=-.42-F.dip+Math.sin(F.t*3)*.015;
    bobber.position.set(F.x,by,F.z);
  }
  const pa=line.geometry.attributes.position;pa.setXYZ(0,tip.x,tip.y,tip.z);pa.setXYZ(1,bobber.position.x,bobber.position.y+.05,bobber.position.z);pa.needsUpdate=true;
}

/* ======================= INPUT ======================= */
const KEY={}; const JOY={x:0,y:0,active:false};
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  KEY[e.code]=true; initAudio();
  if(mode!=='play') return;
  if(['Space','Enter','KeyE'].includes(e.code)){e.preventDefault();if(e.repeat)return;pressA();}
  if(e.code==='KeyQ'||e.code==='Tab'){e.preventDefault();if(!DLG.on&&!anySheet()&&!P.fish)cycleTool();}
  if(e.code==='KeyI'){if(anySheet())closeSheet();else if(!DLG.on)openInv();}
  if(e.code==='KeyM'){if(anySheet())closeSheet();else if(!DLG.on){renderMap();openSheet('shMap');}}
  if(e.code==='Escape'){if(catchOpen){$('#catch').classList.remove('on');catchOpen=false;}else if(anySheet())closeSheet();}
  if(/Digit[1-4]/.test(e.code)&&!DLG.on&&!anySheet()&&!P.fish) equipTool(TOOLS[+e.code.slice(5)-1].id);
});
addEventListener('keyup',e=>{KEY[e.code]=false;});
addEventListener('blur',()=>{for(const k in KEY)KEY[k]=false;});
{
  const joy=$('#joy'),stick=$('#stick');let id=null;
  const mv=e=>{const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=(e.clientX-cx)/(r.width/2),dy=(e.clientY-cy)/(r.height/2);const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m;}JOY.x=dx;JOY.y=dy;stick.style.transform=`translate(${dx*38}px,${dy*38}px)`;};
  joy.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();id=e.pointerId;joy.setPointerCapture(id);JOY.active=true;mv(e);});
  joy.addEventListener('pointermove',e=>{if(e.pointerId===id)mv(e);});
  const end=e=>{if(e.pointerId!==id)return;id=null;JOY.active=false;JOY.x=JOY.y=0;stick.style.transform='';};
  joy.addEventListener('pointerup',end);joy.addEventListener('pointercancel',end);
  const a=$('#btnA');a.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();a.classList.add('on');pressA();});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>a.addEventListener(t,()=>a.classList.remove('on')));
}
function pressA(){
  if(catchOpen){$('#catch').classList.remove('on');catchOpen=false;return;}
  if(DLG.on){advanceDlg();return;}
  if(anySheet()) return;
  const c=context(); if(c.fn) c.fn();
}
function moveInput(){
  let x=JOY.x,y=JOY.y;
  if(!JOY.active){x=(KEY.KeyD||KEY.ArrowRight?1:0)-(KEY.KeyA||KEY.ArrowLeft?1:0);y=(KEY.KeyS||KEY.ArrowDown?1:0)-(KEY.KeyW||KEY.ArrowUp?1:0);const m=Math.hypot(x,y);if(m>0){x/=m;y/=m;}if(KEY.ShiftLeft||KEY.ShiftRight){x*=.4;y*=.4;}}
  return {x,y};
}

/* ======================= TIME / LIGHT ======================= */
const KF=[
  [0,0x223060,0x5566aa,0x202040,.55,0x8899ff,.2],[4.5,0x2a3570,0x6070b0,0x302a50,.6,0x99aaff,.25],[6,0xf6c2a8,0xffd8c0,0x806a60,.55,0xffc090,.45],
  [8,0xa8e2ff,0xffffff,0x7a8a60,.62,0xfff0d0,.55],[15.5,0x9fdcff,0xffffff,0x7a8a60,.62,0xfff0d0,.55],[17.5,0xffc49a,0xffe2c0,0x8a6a50,.6,0xffb070,.5],
  [19,0x8a78c0,0xb0a0e0,0x403050,.55,0xc0a0ff,.3],[20.5,0x283468,0x5a6ab0,0x202040,.58,0x8899ff,.22],[24,0x223060,0x5566aa,0x202040,.55,0x8899ff,.2]];
const _c1=new THREE.Color(),_c2=new THREE.Color();
let nightF=0;
function applyTime(){
  const h=hourNow();let a=KF[0],b=KF[1];for(let i=0;i<KF.length-1;i++){if(h>=KF[i][0]&&h<KF[i+1][0]){a=KF[i];b=KF[i+1];break;}}
  const f=(h-a[0])/(b[0]-a[0]);
  const mix=(i)=>_c1.set(a[i]).lerp(_c2.set(b[i]),f);
  const sky=mix(1).clone();scene.background=sky;scene.fog.color.copy(sky);
  hemi.color.copy(mix(2));hemi.groundColor.copy(mix(3));hemi.intensity=lerp(a[4],b[4],f);sun.color.copy(mix(5));sun.intensity=lerp(a[6],b[6],f);
  for(let i=glowSprites.length-1;i>=0;i--){let o=glowSprites[i];while(o.parent)o=o.parent;if(o!==scene)glowSprites.splice(i,1);}
  nightF=clamp(h<6?(6-h)/1.5:h>18.5?(h-18.5)/1.5:0,0,1);
  windowMats.forEach(m=>m.emissiveIntensity=nightF*.9);
  glowSprites.forEach(g=>{g.material.opacity=g.userData.bug?g.material.opacity:g.userData.always?.55+.1*Math.sin(performance.now()/120):nightF*.85;});
  const d=new Date();$('#cTime').textContent=`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;$('#cDate').textContent=`${d.getMonth()+1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`;
  const open=shopOpen();if(shopSign){shopSign.material.map=open?signOpenTex:signClosedTex;}
}

/* ======================= UPDATE ======================= */
const SPEED=3.2;
function collide(nx,nz){const r=.28;for(const [ox,oz] of [[-r,-r],[r,-r],[-r,r],[r,r]]){if(blocked(Math.floor(nx+ox),Math.floor(nz+oz)))return true;}return false;}
function animBody(m,phase,amp,dt){m.legs[0].rotation.x=Math.sin(phase)*.7*amp;m.legs[1].rotation.x=-Math.sin(phase)*.7*amp;m.arms[0].rotation.x=-Math.sin(phase)*.6*amp;if(!m.lockArm)m.arms[1].rotation.x=Math.sin(phase)*.6*amp;m.body.position.y=Math.abs(Math.sin(phase))*.05*amp;}
function updatePlayer(dt){
  const busy=DLG.on||anySheet()||catchOpen||mode!=='play';
  const inp=busy?{x:0,y:0}:moveInput();
  let mag=Math.hypot(inp.x,inp.y);
  if(P.fish&&mag>.2){reelRod();}
  if(P.act) mag=0;
  if(mag>.08){
    const tgt=Math.atan2(inp.x,inp.y);P.yaw+=angDiff(P.yaw,tgt)*Math.min(1,dt*14);
    const sp=SPEED*Math.min(1,mag);P.speed=sp;
    const nx=P.x+inp.x/Math.max(mag,1e-3)*Math.min(1,mag)*SPEED*dt,nz=P.z+inp.y/Math.max(mag,1e-3)*Math.min(1,mag)*SPEED*dt;
    if(!collide(nx,P.z))P.x=nx;if(!collide(P.x,nz))P.z=nz;
    P.phase+=dt*sp*3.4;
    P.stepT-=dt*sp;if(P.stepT<=0){P.stepT=.95;const t=tAt(Math.floor(P.x),Math.floor(P.z));sfx(t===SAND?'sand':'step');if(Math.random()<.5)puff(P.x,surfY(Math.floor(P.x),Math.floor(P.z))+.05,P.z,t===SAND?'#f4e4b4':'#d8f0c0',2,.4,.12,1);}
  }else{P.speed=0;P.phase=lerp(P.phase,Math.round(P.phase/Math.PI)*Math.PI,Math.min(1,dt*10));}
  for(const n of NPCS){if(!n.m.root.visible)continue;const dx=P.x-n.x,dz=P.z-n.z,d=Math.hypot(dx,dz);if(d<.6&&d>1e-4){const px=P.x+dx/d*(.6-d),pz=P.z+dz/d*(.6-d);if(!collide(px,P.z))P.x=px;if(!collide(P.x,pz))P.z=pz;}}
  const ty=surfY(clamp(Math.floor(P.x),0,W-1),clamp(Math.floor(P.z),0,H-1));P.y=lerp(P.y,ty,Math.min(1,dt*14));
  const m=P.model;m.root.position.set(P.x,P.y,P.z);m.root.rotation.y=P.yaw;
  m.lockArm=!!(P.act||P.fish);
  animBody(m,P.phase,P.speed>0?1:0,dt);
  if(P.act){P.actT+=dt;const f=clamp(P.actT/P.actDur,0,1),arm=m.arms[1];
    if(P.act==='net'){arm.rotation.x=lerp(-2.6,-.5,Math.sin(f*Math.PI/2));}
    else if(P.act==='shovel'){arm.rotation.x=-1.8+Math.sin(f*Math.PI)*1.3;m.body.rotation.x=Math.sin(f*Math.PI)*.25;}
    else if(P.act==='cast'){arm.rotation.x=lerp(-2.8,-1.2,f);}
    else if(P.act==='shake'){arm.rotation.x=-1.4;m.arms[0].rotation.x=-1.4;m.body.position.x=Math.sin(P.actT*40)*.03;}
    else if(P.act==='pick'){m.body.rotation.x=Math.sin(f*Math.PI)*.5;arm.rotation.x=-Math.sin(f*Math.PI)*1.2;}
    else if(P.act==='reel'){arm.rotation.x=lerp(-1.2,-2.4,f);}
    if(P.actT>=P.actDur){P.act=null;m.body.rotation.x=0;m.body.position.x=0;m.arms[0].rotation.x=0;}}
  else if(P.fish){m.arms[1].rotation.x=-1.2;}
  else if(S.tool!=='hand'){m.arms[1].rotation.x=-.35+m.arms[1].rotation.x*.2;}
}
function updateNPCs(dt){
  const h=hourNow(),awake=h>=7&&h<22;
  for(const n of NPCS){
    const m=n.m;
    if(n.shop){m.root.visible=shopOpen();m.root.position.set(n.x,surfY(Math.floor(n.x),Math.floor(n.z)),n.z);if(!n.talking)n.yaw+=angDiff(n.yaw,0)*Math.min(1,dt*3);m.root.rotation.y=n.yaw;animBody(m,0,0,dt);m.head.rotation.z=Math.sin(performance.now()/900)*.06;continue;}
    m.root.visible=awake;
    if(!awake){n.x=n.home.x+1;n.z=n.home.z+2.6;continue;}
    let moving=false;
    if(n.talking){ n.yaw+=angDiff(n.yaw,Math.atan2(P.x-n.x,P.z-n.z))*Math.min(1,dt*8); }
    else if(n.tx!=null){
      const dx=n.tx-n.x,dz=n.tz-n.z,d=Math.hypot(dx,dz);
      if(d<.1){n.tx=null;n.wait=2+Math.random()*5;}
      else{n.yaw+=angDiff(n.yaw,Math.atan2(dx,dz))*Math.min(1,dt*6);const sp=1.3,nx=n.x+dx/d*sp*dt,nz=n.z+dz/d*sp*dt;
        const pd=Math.hypot(nx-P.x,nz-P.z);
        if(!collide(nx,nz)&&pd>.7){n.x=nx;n.z=nz;moving=true;n.stuck=0;}else{n.stuck+=dt;if(n.stuck>1.2){n.tx=null;n.wait=1;}}}
    }else{ n.wait-=dt; if(n.wait<=0){ for(let k=0;k<10;k++){const tx=Math.floor(n.home.x+1+(Math.random()-.5)*14),tz=Math.floor(n.home.z+3+(Math.random()-.5)*14);if(inB(tx,tz)&&!blocked(tx,tz)&&REACH[tz*W+tx]){n.tx=tx+.5;n.tz=tz+.5;break;}} if(n.tx==null)n.wait=1; }
      const d=Math.hypot(P.x-n.x,P.z-n.z);if(d<3.5)n.yaw+=angDiff(n.yaw,Math.atan2(P.x-n.x,P.z-n.z))*Math.min(1,dt*2);}
    n.phase+=moving?dt*1.3*3.4:0;
    const ty=surfY(clamp(Math.floor(n.x),0,W-1),clamp(Math.floor(n.z),0,H-1));
    m.root.position.set(n.x,ty,n.z);m.root.rotation.y=n.yaw;animBody(m,n.phase,moving?1:0,dt);
    m.head.rotation.z=n.talking?Math.sin(performance.now()/160)*.08:0;
  }
}
function updateWorldAnim(dt,t){
  for(const o of S.objs){
    if(o.shakeT>0){o.shakeT-=dt;const w=Math.sin(o.shakeT*40)*o.shakeT;if(o.t==='tree')setTreeMatrix(o,o.shakeT>0?w:0);}
    if(o.bounce>0){o.bounce-=dt;setRock(o,Math.max(0,o.bounce)/.3);}
  }
  flames.forEach((f,i)=>{f.scale.set(1+Math.sin(t*14+i)*.12,1+Math.sin(t*11+i*2)*.2,1+Math.cos(t*13+i)*.12);});
  furnGroup.traverse(o=>{if(o.userData.spin)o.rotation.z=t*1.5;if(o.userData.swing)o.rotation.x=Math.sin(t*1.4)*.25;});
  dropGroup.children.forEach((m,i)=>{m.quaternion.copy(camera.quaternion);m.position.y=surfY(m.userData.o.x,m.userData.o.z)+.36+Math.sin(t*2+i)*.04;});
  glowSprites.forEach(g=>{if(g.parent)g.quaternion.copy(camera.quaternion).premultiply(new THREE.Quaternion().copy(g.parent.getWorldQuaternion(new THREE.Quaternion())).invert());});
  if(Math.random()<dt*4){const a=Math.random()*TAU,d=4+Math.random()*10,x=P.x+Math.cos(a)*d,z=P.z+Math.sin(a)*d;if(waterLoc(x,z)==='sea'||waterLoc(x,z)==='river')PS.add(x,-.42,z,0,.05,0,.6,.14,'#ffffff',0);}
}
function rebuildDirty(){
  if(dirty.trees){buildTrees();dirty.trees=false;}
  if(dirty.palms){buildPalms();buildTrees();dirty.palms=false;}
  if(dirty.rocks){buildRocks();dirty.rocks=false;}
  if(dirty.flowers){buildFlowers();dirty.flowers=false;}
  if(dirty.weeds){buildWeeds();dirty.weeds=false;}
  if(dirty.digs){buildDigs();dirty.digs=false;}
  if(dirty.shells){buildShells();dirty.shells=false;}
  if(dirty.drops){buildDrops();dirty.drops=false;}
  if(dirty.furn){buildFurn();dirty.furn=false;}
}
const camTarget=new THREE.Vector3();
function updateCamera(dt,instant){
  const asp=VW/VH, far=asp<1?1+(1-asp)*.9:1;
  camTarget.lerp(new THREE.Vector3(P.x,P.y,P.z),instant?1:1-Math.exp(-dt*6));
  camera.position.set(camTarget.x,camTarget.y+12.5*far,camTarget.z+11.5*far);
  camera.lookAt(camTarget.x,camTarget.y+.4,camTarget.z-.6);
  FOCUS.value=16*far;
}

let mode='title', VW=1, VH=1;
function resize(){const r=$('#wrap').getBoundingClientRect();VW=Math.max(1,r.width);VH=Math.max(1,r.height);renderer.setSize(VW,VH,false);camera.aspect=VW/VH;camera.updateProjectionMatrix();PS.mat.uniforms.scale.value=renderer.domElement.height/(2*Math.tan(camera.fov*Math.PI/360));}
new ResizeObserver(resize).observe($('#wrap'));
function setHud(on){$('#hud').style.display=on?'block':'none';}
function buildAll(){
  rebuildGrid(); buildTerrain(); buildBuildings(); for(const k in dirty)dirty[k]=true; rebuildDirty(); setupEntities(); updateMoney(); applyTime();
  BUGS_L.slice().forEach(removeBug); FISH_L.slice().forEach(removeFish);
  updateCamera(0,true);
}
function startPlay(){
  mode='play'; $('#title').classList.remove('on'); setHud(true); closeSheet();
  if(newDay(false)){ rebuildGrid(); for(const k in dirty)dirty[k]=true; }
  if(!S.introDone){ const mk=NPCS.find(n=>n.shop); P.yaw=Math.PI; setTimeout(()=>{ if(mk){mk.talking=true;}
    say(mk||null,['はじめましてメェ。この島でよろず屋をしている、メエコですメェ','あなたが新しい住人の{n}さんですね。ようこそ、ぽかぽか島へメェ','魚や虫をつかまえたり、くだものをひろったりしたら、わたしのお店に売ってくださいメェ','リーフがたまったら家具を買って、島をかざるのもすてきですメェ','右下の道具ボタンで、あみ・つりざお・スコップを持ちかえられますメェ。Aボタンは、その場でできることをしてくれますメェ','島の時間は、あなたの時計と同じですメェ。それでは、のんびり島ぐらしを楽しんでくださいメェ'],{done:()=>{S.introDone=true;markSave();}}); },500); }
}
function showTitle(){
  mode='title'; setHud(false); $('#title').classList.add('on');
  const has=!!store.get(SAVE_KEY,null); $('#btnContinue').classList.toggle('hidden',!has);
  if(matchMedia('(pointer: coarse)').matches) $('#keysHelp').classList.add('hidden');
}
// character creation
const LOOK={hair:HAIRS[0],shirt:SHIRTS[0],skin:SKINS[0]};
function swatches(el,list,key){el.innerHTML=list.map(c=>`<button style="background:${c}" data-c="${c}" aria-pressed="${LOOK[key]===c}" aria-label="${c}"></button>`).join('');el.onclick=e=>{const b=e.target.closest('button');if(!b)return;LOOK[key]=b.dataset.c;swatches(el,list,key);sfx('open');previewLook();};}
function previewLook(){ if(!S) return; S.look={...LOOK}; if(P.model)scene.remove(P.model.root); P.model=makeHuman(S.look); scene.add(P.model.root); P.yaw=0; equipTool(S.tool||'hand'); }
$('#btnNew').addEventListener('click',()=>{initAudio();
  newGame('',{...LOOK}); buildAll(); P.yaw=0;
  swatches($('#swHair'),HAIRS,'hair');swatches($('#swShirt'),SHIRTS,'shirt');swatches($('#swSkin'),SKINS,'skin');
  $('#title').classList.remove('on'); mode='create'; openSheet('shCreate'); setTimeout(()=>$('#inName').focus(),50);});
$('#btnCreate').addEventListener('click',()=>{const n=$('#inName').value.trim();if(!n){$('#inName').focus();$('#inName').placeholder='なまえを入れてね';sfx('error');return;}S.name=n.slice(0,8);S.look={...LOOK};saveNow();closeSheet();startPlay();});
$('#btnContinue').addEventListener('click',()=>{initAudio();if(!loadGame()){showTitle();return;}buildAll();startPlay();});

let last=performance.now(), saveT=0, dayT=0;
let simT=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  logic(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
function logic(dt){
  simT+=dt; const t=simT; TIME.value=t;
  if(S&&OBJ){
    rebuildDirty();
    updatePlayer(dt); updateNPCs(dt);
    if(mode==='play'){ updateBugs(dt); updateFish(dt); updateFishing(dt); updateDlg(dt);
      const c=context(); $('#aLabel').textContent=DLG.on?'つぎへ':c.label; $('#btnA').classList.toggle('dim',!DLG.on&&!c.fn);
      saveT+=dt; if(saveT>5&&saveDirty){saveT=0;saveNow();}
      dayT+=dt; if(dayT>20){dayT=0;if(newDay(false)){rebuildGrid();toast('あたらしい一日がはじまった');}}
    }
    updateWorldAnim(dt,t); PS.update(dt);
    if(Math.floor(t*2)!==Math.floor((t-dt)*2)) applyTime();
    updateCamera(dt);
  }
  music();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&mode==='play')saveNow();});
// title background: show a generated demo island
(function boot(){
  resize();
  if(loadGame()){ buildAll(); }
  else newGameDemo();
  showTitle();
  requestAnimationFrame(frame);
})();
function newGameDemo(){ newGame('',{...LOOK}); store.del(SAVE_KEY); buildAll(); }
window.__isl={L,scene,camera,renderer,lam,curve,step:(n,dt=.05)=>{for(let i=0;i<n;i++)logic(dt);},walk:(x,z)=>!blocked(x,z),get S(){return S;},get P(){return P;},context,pressA,equipTool,NPCS,BUGS_L,FISH_L,get OBJ(){return OBJ;}};
})();
